<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; font-size: 13px; color: #222; margin: 0; padding: 4px 8px; }
    label { display: block; font-weight: bold; margin: 12px 0 4px; }
    select, input, textarea { width: 100%; box-sizing: border-box; padding: 7px; font-size: 13px; border: 1px solid #bbb; border-radius: 4px; }
    textarea { height: 90px; resize: vertical; }
    .hint { color: #666; font-size: 12px; margin-top: 4px; min-height: 16px; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    .actions { margin-top: 18px; display: flex; gap: 8px; justify-content: flex-end; }
    button { padding: 8px 18px; font-size: 13px; border-radius: 4px; border: 1px solid #bbb; background: #fff; cursor: pointer; }
    button.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
    button:disabled { opacity: .5; cursor: default; }
    #msg { margin-top: 12px; padding: 8px; border-radius: 4px; display: none; }
    #msg.err { display: block; background: #fde2e2; color: #a11; }
    #msg.ok { display: block; background: #e3f4e1; color: #1b5e20; }
    h4 { margin: 16px 0 0; font-size: 13px; color: #1a73e8; border-top: 1px solid #eee; padding-top: 10px; }
    .hint { margin-top: 6px; }
  </style>
</head>
<body>
  <form id="f" onsubmit="submitForm(event)">
    <div class="row">
      <div>
        <label>신청자</label>
        <select name="requester" id="requester" required></select>
      </div>
      <div>
        <label>적용월</label>
        <select name="month" id="month" required></select>
      </div>
    </div>

    <h4>변경전 (감액)</h4>
    <div class="row">
      <div>
        <label>변경전 코스트</label>
        <select name="fromCost" id="fromCost" onchange="fillAccounts('from')"></select>
      </div>
      <div>
        <label>변경전 계정과목</label>
        <select name="from" id="from" required onchange="showAvailable()"></select>
      </div>
    </div>
    <div class="hint" id="fromHint"></div>

    <h4>변경후 (증액)</h4>
    <div class="row">
      <div>
        <label>변경후 코스트</label>
        <select name="toCost" id="toCost" onchange="fillAccounts('to')"></select>
      </div>
      <div>
        <label>변경후 계정과목</label>
        <select name="to" id="to" required></select>
      </div>
    </div>

    <label>금액 (원)</label>
    <input name="amount" id="amount" inputmode="numeric" placeholder="예) 500,000" required oninput="formatAmount(this)">

    <label>사유</label>
    <textarea name="reason" required placeholder="전용이 필요한 사유를 적어주세요"></textarea>

    <div id="msg"></div>

    <div class="actions">
      <button type="button" onclick="google.script.host.close()">닫기</button>
      <button type="submit" class="primary" id="submitBtn">신청</button>
    </div>
  </form>

  <script>
    let accounts = [];
    const $ = id => document.getElementById(id);

    function option(value, text) {
      const o = document.createElement('option');
      o.value = value;
      o.textContent = text;
      return o;
    }

    google.script.run.withSuccessHandler(data => {
      accounts = data.accounts;
      const req = $('requester');
      req.appendChild(option('', '선택'));
      data.members.forEach(n => req.appendChild(option(n, n)));
      if (data.me) req.value = data.me;
      (data.months || []).forEach(m => { $('month').appendChild(option(m.value, m.label)); if (m.current) $('month').value = m.value; });

      // 코스트 목록 (빈 코스트는 "(코스트 없음)")
      const costs = accounts.map(a => a.cost).filter((c, i, all) => all.indexOf(c) === i);
      ['fromCost', 'toCost'].forEach(id => costs.forEach(c => $(id).appendChild(option(c, c || '(코스트 없음)'))));
      fillAccounts('from');
      fillAccounts('to');
    }).withFailureHandler(showError).getBudgetFormData();

    /** 고른 코스트의 계정과목만 보여준다 */
    function fillAccounts(side) {
      const cost = $(side + 'Cost').value;
      const sel = $(side);
      sel.innerHTML = '';
      sel.appendChild(option('', '선택'));
      accounts.filter(a => a.cost === cost).forEach(a => sel.appendChild(option(a.name, a.name)));
      if (side === 'from') showAvailable();
    }

    function showAvailable() {
      const a = accounts.find(x => x.cost === $('fromCost').value && x.name === $('from').value);
      $('fromHint').textContent = a ? `현재예산 ${a.current.toLocaleString()}원` : '';
    }

    function formatAmount(el) {
      const n = el.value.replace(/[^0-9]/g, '');
      el.value = n ? Number(n).toLocaleString() : '';
    }

    function showError(err) {
      const m = $('msg');
      m.className = 'err';
      m.textContent = err.message || err;
      $('submitBtn').disabled = false;
    }

    function submitForm(e) {
      e.preventDefault();
      $('submitBtn').disabled = true;
      $('msg').className = '';
      google.script.run
        .withSuccessHandler(id => {
          const m = $('msg');
          m.className = 'ok';
          m.textContent = `신청되었습니다. (신청번호 ${id}) 예산에 바로 반영됩니다.`;
          $('f').querySelectorAll('input, textarea, select').forEach(el => el.disabled = true);
        })
        .withFailureHandler(showError)
        .submitBudgetTransfer(e.target);
    }
  </script>
</body>
</html>
