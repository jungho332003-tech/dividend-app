    // 팀 캘린더가 없으면 모두 각자 캘린더로 들어간다
    let target = eventTarget === 'recruit' && rec ? 'recruit' : both ? (eventTarget === 'recruit' ? 'team' : eventTarget) : 'mine';

    const tempId = 'tmp-' + Date.now();

      if (page !== 'calendar') render();

      const s0 = at(ev.startTime || '09:00');

  /* ================= 회사 기준 ================= */
  function hl(text) {
    const t = esc(text);
    if (!ruleQuery) return t;
    const q = esc(ruleQuery).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return t.replace(new RegExp(q, 'gi'), m => `<mark>${m}</mark>`);
  }
  function filteredRules() {
    const q = ruleQuery.trim().toLowerCase();
    return D.rules
      .filter(r => ruleCat === 'all' || r.category === ruleCat)
      .filter(r => !q || (r.title + ' ' + r.body + ' ' + r.category).toLowerCase().includes(q))
      .sort((a, b) => D.ruleCategories.indexOf(a.category) - D.ruleCategories.indexOf(b.category) || a.title.localeCompare(b.title, 'ko'));
  }
  function ruleListHtml() {
    const canEdit = D.me.isLeader || D.me.isAdmin;

        <button class="rule-head" onclick="toggleRule('${esc(r.id)}')" aria-expanded="${open}">

  /* ================= 관리 (관리자 전용) ================= */
  let A = null;          // 서버에서 받은 관리 데이터
  let aDraft = null;     // 편집 중인 팀원 목록
  let aDirty = false;

  let adminTab = 'members';

  /** force=true면 공유 상태를 새로 확인, 아니면 서버의 5분 캐시를 써서 빠르게 연다 */

     마지막으로 본 관리 정보는 이 기기에 저장해 두었다가 먼저 보여준다. */
  const adminKey = () => `admin:${D.me.email}`;
  function loadAdmin(force) {
    if (adminLoading) return;
    adminLoading = true;
    if (!A) { try { const st = JSON.parse(localStorage.getItem(adminKey()) || 'null'); if (st) setAdmin(st, true); } catch (e) { /* 저장소 없음 */ } }
    call('apiAdminData', false)
      .then(d => { adminLoading = false; const keep = A && A.status; setAdmin(d); if (!d.status || force) { if (keep && !force) A.status = keep; loadStatus(force); } })
      .catch(e => { adminLoading = false; fail(e); });
  }
  function loadStatus(force) {
    statusLoading = true;
    if (page === 'admin') render();
    call('apiAdminStatus', !!force)
      .then(st => { statusLoading = false; if (A) { A.status = st; saveAdminLocal(); } if (page === 'admin') render(); })
      .catch(e => { statusLoading = false; if (page === 'admin') render(); fail(e); });
  }
  let statusLoading = false;
  function saveAdminLocal() { try { localStorage.setItem(adminKey(), JSON.stringify(A)); } catch (e) { /* 저장소 없음 */ } }
  /** 상태 새로고침 버튼 */
  function refreshAdmin() { loadStatus(true); }
  function setAdmin(data, fromLocal) {
    if (A && A.status && !data.status) data.status = A.status; // 상태를 아직 못 받았으면 이전 것 유지
    A = data;
    if (!fromLocal) saveAdminLocal();
    aDraft = A.members.map(m => Object.assign({}, m));
    menuDraft = JSON.parse(JSON.stringify(A.menuAccess));
    aDirty = false;
    if (page === 'admin') render();
  }

  const ACCESS = {
    sheet: { owner: ['ok', '소유자'], editor: ['ok', '편집'], viewer: ['pend', '보기만'], none: ['no', '없음'] },

    folder: { owner: ['ok', '소유자'], editor: ['ok', '편집'], viewer: ['pend', '보기만'], none: ['no', '없음'], 'n/a': ['plain', '설정 필요'] },
    calendar: { owner: ['ok', '소유자'], writer: ['ok', '일정 변경'], reader: ['pend', '보기만'], freeBusyReader: ['pend', '바쁨만'], none: ['no', '없음'], 'n/a': ['plain', '설정 필요'] },
  };
  function accessChip(kind, v) {

    const rows = aDraft.map((m, i) => {

        <td data-label="순서" class="ord-cell"><div class="ord">
          <input class="field-in ord-in" type="number" min="1" max="${aDraft.length}" value="${i + 1}" onchange="aMoveTo(${i}, this.value)" aria-label="${esc(m.name || '새 팀원')} 표시 순서">
          <span class="ord-btns"><button class="icon-btn" onclick="aMove(${i},-1)" ${i === 0 ? 'disabled' : ''} title="위로" aria-label="위로">↑</button><button class="icon-btn" onclick="aMove(${i},1)" ${i === aDraft.length - 1 ? 'disabled' : ''} title="아래로" aria-label="아래로">↓</button></span>
        </div></td>
        <td data-label="이름"><input class="field-in" style="padding:5px 8px;min-width:80px" value="${esc(m.name)}" oninput="aEdit(${i},'name',this.value)" aria-label="이름"></td>
        <td data-label="이메일 (구글 계정)" class="c-wide"><input class="field-in" style="padding:5px 8px;min-width:190px" value="${esc(m.email)}" placeholder="구글 계정 이메일" oninput="aEdit(${i},'email',this.value)" aria-label="이메일 (구글 계정)"></td>
        <td data-label="알림메일 (회사)" class="c-wide"><input class="field-in" style="padding:5px 8px;min-width:190px" value="${esc(m.notify || '')}" placeholder="비우면 구글 계정으로" oninput="aEdit(${i},'notify',this.value)" aria-label="알림메일 (회사 메일)"></td>
        <td data-label="역할">${sel(i, m.role)}</td>
        <td data-label="주간보고 작성">${chk(i, 'write', m.write, '주간보고 작성')}</td>
        <td data-label="관리자">${chk(i, 'admin', m.admin, '관리자')}</td>
        <td data-label="예산담당">${chk(i, 'budget', m.budget, '예산담당')}</td>
        <td data-label="채용담당">${chk(i, 'recruit', m.recruit, '채용담당')}</td>
        ${st && saved ? `<td data-label="스프레드시트">${accessChip('sheet', st.sheet)}</td><td data-label="입력시트">${accessChip('input', st.input)}</td><td data-label="첨부 폴더">${accessChip('folder', st.folder)}</td><td data-label="팀 캘린더">${accessChip('calendar', st.calendar)}</td>`
          : `<td colspan="4" class="c-wide"><span style="color:var(--muted);font-size:12px">${!A.status && saved ? '확인 중…' : m.email ? '저장 후 "권한 한 번에 적용"을 누르세요' : '이메일을 입력하세요'}</span></td>`}
        <td class="c-x"><button class="icon-btn" onclick="aRemove(${i})" aria-label="${esc(m.name)} 삭제">${ic('x', 'sm')}</button></td>
      </tr>`;
    }).join('');
    return `
      <div class="head">
        <div><h1>팀원·권한</h1><p>등록 후 [권한 한 번에 적용] → 시트·폴더·캘린더 공유와 잠금 자동 처리 · <b>순서</b>대로 주간업무보고에 나옵니다</p></div>
        <div class="head-actions">
          <button class="btn" onclick="refreshAdmin()" ${statusLoading ? 'disabled' : ''}>${ic('refresh', 'sm')}${statusLoading ? '확인 중…' : '상태 새로고침'}</button>
          <button class="btn primary" onclick="applyAll()">${ic('shield', 'sm')}권한 한 번에 적용</button>
        </div>
      </div>
      <section class="panel">
        ${res ? `<div style="display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px">${resLine('스프레드시트', res.sheet)}${resLine('첨부 폴더', res.folder)}${resLine('팀 캘린더', res.calendar)}</div>
        <p style="margin:10px 0 0;font-size:13px;color:${issues || noEmail ? 'var(--warn-ink)' : 'var(--ok-ink)'}">
          ${issues || noEmail ? `확인이 필요한 사람 ${issues}명${noEmail ? ` · 이메일 없는 사람 ${noEmail}명` : ''}. "권한 한 번에 적용"을 누르면 대부분 해결됩니다.` : '✓ 모든 팀원의 권한이 정상입니다.'}
        </p>` : '<p style="margin:0;font-size:13px;color:var(--muted)">시트·폴더·캘린더 공유 상태를 확인하는 중… (팀원 목록은 바로 고칠 수 있습니다)</p>'}
      </section>
      <section class="panel">
        <div class="table-wrap">
          <table class="t cards admin-cards">
            <thead><tr><th title="주간업무보고·팀 주간보고·회의 모드에 나오는 순서">순서</th><th>이름</th><th>이메일 (구글 계정)</th><th>알림메일 (회사)</th><th>역할</th><th style="text-align:center">주간보고<br>작성</th><th style="text-align:center">관리자</th><th style="text-align:center">예산<br>담당</th><th style="text-align:center" title="입사 70일 수습평가·인터뷰 전날 안내 메일을 받습니다">채용<br>담당</th><th>스프레드시트</th><th>입력시트</th><th>첨부 폴더</th><th>팀 캘린더</th><th></th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <button class="btn small add" onclick="aAdd()">${ic('plus', 'sm')}팀원 추가</button>
      </section>
      <div class="save-bar" id="aBar" ${aDirty ? '' : 'hidden'}><div class="left">변경사항이 있습니다. 저장해야 반영됩니다.</div>
        <div style="display:flex;gap:8px"><button class="btn" onclick="setAdmin(A)">되돌리기</button><button class="btn primary" id="aSave" onclick="saveMembers()">변경사항 저장</button></div></div>`;
  }

  function aEdit(i, k, v) {
    aDraft[i][k] = v;
    aDirty = true;
    const bar = $('#aBar');
    if (bar) bar.hidden = false;
  }
  /** 표시 순서: 팀 주간보고·회의 모드·주간보고 시트에 이 순서대로 나온다 (저장해야 반영) */
  function aMove(i, dir) {
    const j = i + dir;
    if (j < 0 || j >= aDraft.length) return;
    const t = aDraft[i]; aDraft[i] = aDraft[j]; aDraft[j] = t;
    aDirty = true; render();
  }
  function aMoveTo(i, n) {
    const j = Math.max(1, Math.min(aDraft.length, Math.round(Number(n)) || i + 1)) - 1;
    if (j === i) { render(); return; }
    const [m] = aDraft.splice(i, 1);
    aDraft.splice(j, 0, m);
    aDirty = true; render();
  }
  function aAdd() {
    aDraft.push({ order: aDraft.length + 1, name: '', email: '', role: A.roles[0], write: true, admin: false, budget: false, recruit: false, notify: '' });
    aDirty = true;
    render();
    const inputs = document.querySelectorAll('#main tbody input[aria-label="이름"]');
    inputs[inputs.length - 1].focus();
  }
  function saveMembers(after) {
    const list = aDraft.filter(m => m.name.trim()).map((m, i) => Object.assign({}, m, { order: i + 1 }));
    const btn = $('#aSave');
    if (btn) { btn.disabled = true; btn.textContent = '저장 중…'; }
    return call('apiSaveMembers', list)
      .then(data => { setAdmin(data); load(); toast('팀원 목록을 저장했습니다.'); if (after) after(); })
      .catch(e => { if (btn) { btn.disabled = false; btn.textContent = '변경사항 저장'; } fail(e); });
  }
  function aRemove(i) {
    const m = aDraft[i];
    const saved = A.members.some(x => x.name === m.name);
    if (!saved) { aDraft.splice(i, 1); render(); return; }
    openModal(`<h3>${esc(m.name)}님을 팀원에서 뺄까요?</h3>
      <p class="sub">팀원 목록에서 지우고 저장합니다. 입력시트와 지난 기록은 시트에 남습니다.</p>
      ${m.email ? `<label style="display:flex;gap:8px;align-items:center;margin-bottom:14px"><input type="checkbox" class="check" id="rvk" checked> 스프레드시트·첨부 폴더·팀 캘린더 접근도 해제 (${esc(m.email)})</label>` : ''}
      <div class="modal-actions"><button class="btn" onclick="closeModal()">취소</button><button class="btn primary" id="rmOk">빼기</button></div>`);
    $('#rmOk').onclick = () => {
      const revoke = $('#rvk') && $('#rvk').checked;
      $('#rmOk').disabled = true;
      aDraft.splice(i, 1);
      saveMembers(() => {
        if (!revoke) { closeModal(); return; }
        call('apiRevokeAccess', m.email).then(res => { setAdmin(res.data); showLog(`${m.name}님 접근 해제`, res.log); }).catch(e => { closeModal(); fail(e); });
      });
    };
  }
  function applyAll() {
    const run = () => {
      openModal(`<h3>권한을 적용하는 중…</h3><p class="sub">시트·첨부 폴더·캘린더 공유와 시트 잠금을 처리하고 있습니다. 인원에 따라 10~30초 걸릴 수 있습니다.</p>`);
      call('apiApplyPermissions').then(res => { setAdmin(res.data); showLog('권한 적용 결과', res.log); }).catch(e => { closeModal(); fail(e); });
    };
    if (aDirty) saveMembers(run); else run();
  }
  function showLog(title, log) {
    openModal(`<h3>${esc(title)}</h3>
      <div class="list" style="margin:10px 0 16px">${log.map(l => `<div class="list-row" style="grid-template-columns:24px minmax(0,1fr)"><span style="color:${l.ok ? 'var(--ok-ink)' : 'var(--warn-ink)'}">${ic(l.ok ? 'check' : 'alert', 'sm')}</span><span class="meta" style="color:${l.ok ? 'var(--ink)' : 'var(--warn-ink)'}">${esc(l.text)}</span></div>`).join('')}</div>
      <div class="modal-actions"><button class="btn primary" onclick="closeModal()">확인</button></div>`);
  }

  function adminMenus() {
    const rows = A.menus.map(m => `<tr><td class="strong">${esc(m.label)}</td>
      ${A.roles.map(r => `<td style="text-align:center"><input type="checkbox" class="check" ${menuDraft[r][m.key] !== false ? 'checked' : ''} onchange="menuDraft['${r}']['${m.key}']=this.checked;$('#mSave').disabled=false" aria-label="${r} ${esc(m.label)}"></td>`).join('')}
      <td style="text-align:center"><input type="checkbox" class="check" checked disabled aria-label="관리자 ${esc(m.label)}"></td></tr>`).join('');
    return `
      <div class="head"><div><h1>메뉴 권한</h1><p>끈 메뉴는 화면과 서버 모두에서 막힙니다.</p></div></div>
      <section class="panel">
        <div class="table-wrap"><table class="t" style="max-width:560px">
          <thead><tr><th>메뉴</th>${A.roles.map(r => `<th style="text-align:center">${r}</th>`).join('')}<th style="text-align:center">관리자</th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>
        <p style="color:var(--muted);font-size:13px;margin:12px 0">· 관리자는 항상 모든 메뉴와 [관리] 메뉴를 봅니다.<br>· 대시보드에는 볼 수 있는 메뉴의 요약만 나옵니다. 예) 예산전용을 끄면 대시보드의 예산 칸도 숨겨집니다.</p>
        <button class="btn primary" id="mSave" disabled onclick="saveMenus()">저장</button>
      </section>`;
  }
  function saveMenus() {
    $('#mSave').disabled = true;
    call('apiSaveMenuAccess', menuDraft).then(data => { A.menuAccess = data.menuAccess; menuDraft = JSON.parse(JSON.stringify(data.menuAccess)); load(); toast('메뉴 권한을 저장했습니다. (팀원은 새로고침 후 반영)'); })
      .catch(e => { $('#mSave').disabled = false; fail(e); });
  }

  function adminSettings() {
    const st = A.settings, res = A.status ? A.status.resources : { calendar: null, folder: null };
    const status = x => !x ? '<div class="hint">연결 상태 확인 중…</div>' : `<div class="hint" style="color:${x.ok ? 'var(--ok-ink)' : 'var(--warn-ink)'}">${x.ok ? `✓ 연결됨: ${esc(x.name)}` : esc(x.error)}</div>`;
    return `
      <div class="head"><div><h1>설정</h1></div></div>
      <section class="panel" style="max-width:640px">
        <form class="form" id="sForm" novalidate>
          <div class="fld"><label for="sTeam">팀명</label><input class="field-in" id="sTeam" value="${esc(st.team)}"></div>
          <div class="two">
            <div class="fld"><label for="sHour">주간보고 마감 시각 (매주 목요일)</label><select class="field-in" id="sHour">${Array.from({ length: 13 }, (_, i) => i + 8).map(h => `<option value="${h}" ${h === st.deadlineHour ? 'selected' : ''}>${h < 12 ? '오전' : '오후'} ${h > 12 ? h - 12 : h}시</option>`).join('')}</select></div>
            <div class="fld"><label for="sRemind">미작성 알림</label><select class="field-in" id="sRemind">${[0, 1, 2, 3, 4, 6, 24].map(h => `<option value="${h}" ${h === st.remindHours ? 'selected' : ''}>${h ? `마감 ${h}시간 전` : '보내지 않음'}</option>`).join('')}</select></div>
          </div>
          <div class="fld"><label for="sCal">팀 캘린더 ID</label><input class="field-in" id="sCal" value="${esc(st.calendarId)}" placeholder="예) abcd1234@group.calendar.google.com">${status(res.calendar)}</div>
          <div class="fld"><label for="sXcal">함께 볼 캘린더 ID <span class="hint" style="display:inline">(보기 전용 · 한 줄에 하나 · 최대 6개)</span></label>
            <textarea class="field-in" id="sXcal" rows="3" placeholder="회사 공용 캘린더, 다른 팀 캘린더 등의 캘린더 ID&#10;예) company-all@group.calendar.google.com">${esc(st.extraCalendars || '')}</textarea>
            ${!res.extra ? (st.extraCalendars ? status(null) : '') : res.extra.map(x => `<div class="hint" style="color:${x.ok ? 'var(--ok-ink)' : 'var(--warn-ink)'}">${x.ok ? `✓ ${esc(x.name)}` : `${esc(x.id)} — ${esc(x.error)}`}</div>`).join('')}
            <div class="hint">[일정]에 팀 캘린더와 같이 색을 달리해서 보입니다. 팀원도 그 캘린더를 볼 수 있게 공유되어 있어야 각자 화면에 보입니다.</div></div>
          <div class="fld"><label for="sRcal">채용 캘린더 ID <span class="hint" style="display:inline">(채용담당·팀장이 보고 등록)</span></label>
            <input class="field-in" id="sRcal" value="${esc(st.recruitCalendarId || '')}" placeholder="예) recruit@group.calendar.google.com">
            ${st.recruitCalendarId ? status(res.recruit) : ''}
            <div class="hint">[팀원 관리]에서 채용담당으로 표시한 사람(${esc((A.members || []).filter(m => m.recruit).map(m => m.name).join(', ') || '없음')})과 팀장이 [일정]에서 보고 일정을 넣을 수 있습니다. 채용 안내 메일은 채용담당에게만 갑니다. 채용담당에게 "일정 변경" 권한으로 공유해 주세요. 인사현황의 인터뷰·입사도 이 캘린더에 같이 들어갑니다.</div></div>
          <div class="fld"><label for="sFolder">첨부 폴더 (폴더 주소 또는 ID)</label><input class="field-in" id="sFolder" value="${esc(st.folderId)}" placeholder="https://drive.google.com/drive/folders/... 를 그대로 붙여넣어도 됩니다">${status(res.folder)}</div>
          <div class="msg err" id="sErr" hidden></div>
          <div><button class="btn primary" id="sOk">저장</button></div>
        </form>
      </section>`;
  }
  document.addEventListener('submit', e => {
    if (e.target.id !== 'sForm') return;
    e.preventDefault();
    const s2 = { team: $('#sTeam').value, deadlineHour: $('#sHour').value, remindHours: $('#sRemind').value, calendarId: $('#sCal').value, extraCalendars: $('#sXcal').value, recruitCalendarId: $('#sRcal').value, folderId: $('#sFolder').value };
    $('#sOk').disabled = true;
    call('apiSaveSettings', s2).then(data => { setAdmin(data); load(); toast('설정을 저장했습니다.'); })
      .catch(err => { $('#sOk').disabled = false; $('#sErr').textContent = err.message || String(err); $('#sErr').hidden = false; });
  });

  /** 팀원별 알림 메일 설정 보기 (각자 오른쪽 위 이름 → 내 알림 메일에서 바꾼 것) */
  function adminMail() {
    const list = A.mailPrefs || [];
    const cell = (p, k) => p.kinds.indexOf(k) < 0 ? '<td class="c muted" data-label="">–</td>'
      : p.off.indexOf(k) >= 0 ? `<td class="c" data-label=""><span class="chip no">${ic('x')}끔</span></td>` : `<td class="c" data-label=""><span class="chip ok">${ic('check')}받음</span></td>`;
    const offCount = list.filter(p => p.off.some(k => p.kinds.indexOf(k) >= 0)).length;
    return `
      <div class="head"><div><h1>알림 메일</h1><p>팀원이 각자 설정한 알림 메일 (오른쪽 위 이름 → 내 알림 메일). 관리자는 보기만 합니다.</p></div></div>
      <section class="panel">
        <p class="report-note">${list.length}명${offCount ? ` · 일부를 끈 사람 ${offCount}명` : ' · 모두 받는 중'} · – 는 해당 없는 알림</p>
        <div class="table-wrap"><table class="report mail-table">
          <thead><tr><th>이름</th><th>받는 주소</th><th>주간업무 미작성 알림</th><th>취합 완료 (팀장)</th><th>채용 안내</th></tr></thead>
          <tbody>${list.map(p => `<tr>
            <td class="nm" data-label="이름">${esc(p.name)}</td>
            <td data-label="받는 주소" class="mail-to">${p.to ? esc(p.to).split(',').join('<br>') : '<span class="muted">(없음)</span>'}${p.custom ? '<small>직접 설정</small>' : ''}</td>
            ${cell(p, 'remind')}${cell(p, 'close')}${cell(p, 'recruit')}</tr>`).join('')}</tbody>
        </table></div>
      </section>`;
  }
  function adminGuide() {
    const url = A.webAppUrl || '(아직 웹앱으로 배포되지 않았습니다)';
    const msg = `[${D.team} 업무관리 안내]\n아래 주소로 접속해 주세요. (회사 구글 계정으로 로그인)\n${url}\n\n· 처음 접속하면 "권한 검토" 화면이 한 번 나옵니다. "허용"을 눌러주세요.\n· "Google에서 확인하지 않은 앱" 경고가 나오면 "고급 → 이동"을 누르면 됩니다.\n· 주간업무는 매주 목요일 오후 ${A.settings.deadlineHour > 12 ? A.settings.deadlineHour - 12 : A.settings.deadlineHour}시까지 작성해 주세요.`;
    return `
      <div class="head"><div><h1>접속 안내</h1><p>팀원에게 보낼 주소와 안내 문구입니다.</p></div></div>
      <section class="panel" style="max-width:720px;display:flex;flex-direction:column;gap:12px">
        <div class="fld"><label for="gUrl">웹앱 주소</label><div style="display:flex;gap:6px"><input class="field-in" id="gUrl" value="${esc(url)}" readonly><button class="btn" onclick="copyText('gUrl')">복사</button></div></div>
        <div class="fld"><label for="gMsg">안내 문구 (메신저·메일에 붙여넣기)</label><textarea class="field-in" id="gMsg" style="min-height:190px">${esc(msg)}</textarea></div>
        <div><button class="btn primary" onclick="copyText('gMsg')">${ic('copy', 'sm')}안내 문구 복사</button></div>
      </section>`;
  }
  function copyText(id) {
    const el = $('#' + id);
    const done = () => toast('복사했습니다.');
    try {
      navigator.clipboard.writeText(el.value).then(done, () => { el.select(); toast('선택했습니다. Ctrl+C로 복사하세요.'); });
    } catch (e) { el.select(); toast('선택했습니다. Ctrl+C로 복사하세요.'); }
  }

  /* ================= 첨부 파일 ================= */
  const MAX_FILE = 10 * 1024 * 1024;
  const UP = {};
  function fileSize(n) { return n >= 1048576 ? `${(n / 1048576).toFixed(1)}MB` : `${Math.max(1, Math.round(n / 1024))}KB`; }
  function extOf(name) { const m = /\.([a-z0-9]+)$/i.exec(name || ''); return m ? m[1].toUpperCase().slice(0, 4) : 'FILE'; }
  function extClass(ext) {
    ext = ext.toLowerCase();
    if (ext === 'pdf') return 'pdf';
    if (['xls', 'xlsx', 'csv'].includes(ext)) return 'xls';
    if (['doc', 'docx', 'hwp', 'hwpx', 'txt'].includes(ext)) return 'doc';
    if (['ppt', 'pptx'].includes(ext)) return 'ppt';
    if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'heic'].includes(ext)) return 'img';
    return '';
  }
  function fileRow(f, opts) {
    opts = opts || {};
    const ext = extOf(f.name);
    const inner = `<span class="ext ${extClass(ext)}">${esc(ext)}</span>
      <span class="fn">${esc(f.name)}${opts.inline ? '' : `<span class="fs">${opts.msg ? esc(opts.msg) : fileSize(f.size || 0)}</span>`}</span>${opts.tail || ''}`;
    return opts.link
      ? `<a class="file" href="${esc(f.url)}" target="_blank" rel="noopener" title="${esc(f.name)} (${fileSize(f.size || 0)})">${inner}</a>`
      : `<div class="file ${opts.status || ''}">${inner}</div>`;
  }
  function filesView(files, inline) {
    return files && files.length ? `<div class="files ${inline ? 'inline' : ''}">${files.map(f => fileRow(f, { link: true, inline })).join('')}</div>` : '';
  }

  function uploaderHtml(key, label) {
    return `<div class="fld"><label for="drop-${key}">${label}</label>
      <div class="drop" id="drop-${key}" tabindex="0" role="button">${ic('upload', 'sm')}<span class="desk-only">파일을 끌어다 놓거나 </span><u>눌러서 파일 선택</u> · 한 파일 10MB 이하</div>
      <input type="file" id="file-${key}" multiple hidden>
      <div class="files" id="up-${key}"></div></div>`;
  }
  function initUploader(key, area, existing) {
    UP[key] = { area, items: (existing || []).map(f => ({ status: 'done', f })) };
    const drop = $('#drop-' + key), input = $('#file-' + key);
    drop.onclick = () => input.click();
    drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } };
    drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = () => drop.classList.remove('over');
    drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); addFiles(key, e.dataTransfer.files); };
    input.onchange = () => { addFiles(key, input.files); input.value = ''; };
    drawUploader(key);
  }
  function addFiles(key, list) {
    Array.from(list).forEach(file => {
      const it = { status: 'up', f: { name: file.name, size: file.size } };
      UP[key].items.push(it);
      if (file.size > MAX_FILE) { it.status = 'err'; it.msg = '10MB를 넘어 올릴 수 없습니다'; return; }
      const reader = new FileReader();
      reader.onload = () => {
        call('apiUploadFile', { name: file.name, mimeType: file.type, data: String(reader.result).split(',')[1], area: UP[key].area })
          .then(f => { it.status = 'done'; it.f = f; })
          .catch(e => { it.status = 'err'; it.msg = e.message || String(e); })
          .then(() => drawUploader(key));
      };
      reader.onerror = () => { it.status = 'err'; it.msg = '파일을 읽지 못했습니다'; drawUploader(key); };
      reader.readAsDataURL(file);
    });
    drawUploader(key);
  }
  function drawUploader(key) {
    const el = $('#up-' + key);
    if (!el) return;
    el.innerHTML = UP[key].items.map((it, i) => fileRow(it.f, {
      status: it.status === 'done' ? '' : it.status,
      msg: it.status === 'err' ? it.msg : '',
      tail: `<button type="button" class="icon-btn" onclick="removeUpload('${key}', ${i})" aria-label="${esc(it.f.name)} 첨부 빼기">${ic('x', 'sm')}</button>`,
    })).join('');
  }
  function removeUpload(key, i) { UP[key].items.splice(i, 1); drawUploader(key); }
  function uploadsBusy(key) { return !!UP[key] && UP[key].items.some(it => it.status === 'up'); }
  function uploadedFiles(key) { return UP[key] ? UP[key].items.filter(it => it.status === 'done').map(it => it.f) : []; }
  const BUSY_MSG = '파일을 올리는 중입니다. 업로드가 끝난 뒤 다시 눌러주세요.';

  document.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a.file[href^="#demo"]');
    if (a) { e.preventDefault(); toast('예시 화면이라 파일을 열 수 없습니다. 실제로는 구글 드라이브에서 열립니다.'); }
  });

  /** 월 고르기 (◀ 2026년 10월 ▶) — 신청 내역·월별 정리 공용 */
  function budgetMonthBar(bm) {
    // 고를 수 있는 달 = 신청 가능한 달 + 신청 내역이 있는 달
    const monthSet = budgetMonths().map(m => m.value);
    D.budget.requests.forEach(r => { if (monthSet.indexOf(reqMonth(r)) < 0) monthSet.push(reqMonth(r)); });
    if (bm !== 'all' && monthSet.indexOf(bm) < 0) monthSet.push(bm);
    monthSet.sort().reverse();
    const cnt = ym => D.budget.requests.filter(r => reqMonth(r) === ym).length;
    return `<div class="month-bar">
        <button class="icon-btn" onclick="moveBudgetMonth(-1)" aria-label="이전 달">${ic('chevL')}</button>
        <select class="field-in month-sel" onchange="setBudgetMonth(this.value)" aria-label="적용월">
          <option value="all" ${bm === 'all' ? 'selected' : ''}>전체 기간 (${D.budget.requests.length}건)</option>
          ${monthSet.map(v => `<option value="${v}" ${v === bm ? 'selected' : ''}>${monthName(v, true)}${v === ymNow() ? ' (이번 달)' : ''} · ${cnt(v)}건</option>`).join('')}
        </select>
        <button class="icon-btn" onclick="moveBudgetMonth(1)" aria-label="다음 달">${ic('chev')}</button>
      </div>`;
  }

  /* ----- 복사 (월별 정리) ----- */
  // 어떤 칸을 복사했는지/완료했는지는 이 브라우저에만 기억한다 (담당자 작업 표시용)
  const COPY_KEY = 'budgetCopied';
  let copiedSet = null;
  function copiedStore() {
    if (!copiedSet) {
      copiedSet = new Set();
      try { JSON.parse(localStorage.getItem(COPY_KEY) || '[]').forEach(k => copiedSet.add(k)); } catch (e) { /* 저장소 없음 */ }
    }
    return copiedSet;
  }
  function copied(k) { return copiedStore().has(k); }
  function setCopied(k, on) {
    const s = copiedStore();
    if (on) s.add(k); else s.delete(k);
    try { localStorage.setItem(COPY_KEY, JSON.stringify(Array.from(s).slice(-2000))); } catch (e) { /* 저장소 없음 */ }
  }

  /** 클립보드 복사: 새 방식이 막혀 있으면(웹앱 iframe) 예전 방식으로 */
  function toClipboard(text) {
    const legacy = () => {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      return ok ? Promise.resolve() : Promise.reject(new Error('copy'));
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).catch(legacy);
    } catch (e) { /* 아래로 */ }
    return legacy();
  }

  function copyCell(btn, id, field) {
    const v = btn.dataset.v;
    toClipboard(v).then(() => {
      setCopied(id + ':' + field, true);
      btn.classList.add('done');
      toast(`복사: ${v}`);
    }, () => toast('복사하지 못했습니다. 칸을 길게 눌러 직접 복사하세요.'));
  }

  function markDone(id, on) { setCopied(id + ':done', on); render(); }

  /** 이 달 내역을 탭으로 구분해 복사 → 엑셀·구글시트에 그대로 붙여넣기 */
  function copyMonth() {
    const bm = curBudgetMonth();
    const list = D.budget.requests.filter(r => bm === 'all' || reqMonth(r) === bm).slice().reverse();
    const clean = v => String(v == null ? '' : v).replace(/[\t\r\n]+/g, ' ');
    const lines = [['적용월', '신청일시', '신청자', '변경전 코스트센터', '변경전 계정코드', '변경전 계정과목', '변경후 코스트센터', '변경후 계정코드', '변경후 계정과목', '금액', '사유']]
      .concat(list.map(r => [reqMonth(r), r.date, r.req, r.fromCost, r.fromCode, r.from, r.toCost, r.toCode, r.to, r.amount, r.reason]));
    toClipboard(lines.map(l => l.map(clean).join('\t')).join('\n'))
      .then(() => toast(`${list.length}건을 복사했습니다. 엑셀에 붙여넣으세요.`), () => toast('복사하지 못했습니다.'));
  }

  /* ================= 내 주간업무 편집 ================= */
  function blank() { return { task: '', dueIso: '', cont: false, raw: '', imp: false }; }
  function convItems(list) {
    return (list || []).map(it => ({ task: it.task, dueIso: it.dueIso, cont: it.due === '지속', raw: it.dueIso || it.due === '지속' ? '' : it.due, imp: !!it.imp }));
  }
  const draftOut = list => list.filter(x => x.task.trim()).map(x => ({ task: x.task.trim(), due: x.cont ? '지속' : (x.dueIso || x.raw || ''), imp: !!x.imp }));
  const toItem = x => /^\d{4}-\d{2}-\d{2}$/.test(x.due) ? { task: x.task, due: fmtDue(x.due), dueIso: x.due, imp: x.imp } : { task: x.task, due: x.due, dueIso: '', imp: x.imp };

  function itemsHtml(key) {
    return draft[key].map((it, i) => `
      <div class="item">
        <button class="toggle imp-btn" data-k="${key}" data-i="${i}" data-f="imp" aria-pressed="${!!it.imp}" title="중요 업무 (팀 주간보고에 굵게 표시)" aria-label="중요 업무">${it.imp ? '★' : '☆'}</button>
        <textarea class="field-in task-in" rows="1" data-k="${key}" data-i="${i}" data-f="task" placeholder="업무 내용" aria-label="업무 내용">${esc(it.task)}</textarea>
        <input class="field-in date-in" type="text" data-date inputmode="numeric" maxlength="10" autocomplete="off" data-k="${key}" data-i="${i}" data-f="dueIso" value="${esc(it.dueIso)}" ${it.cont ? 'disabled' : ''} aria-label="기한">
        <button class="toggle" data-k="${key}" data-i="${i}" data-f="cont" aria-pressed="${it.cont}">지속</button>
        <button class="icon-btn" data-k="${key}" data-i="${i}" data-f="del" aria-label="삭제">${ic('x', 'sm')}</button>
      </div>`).join('');
  }

  /** 업무 칸 높이를 내용(줄 수)에 맞춘다 */
  function fitTask(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 2 + 'px'; }
  function fitTasks(k) { document.querySelectorAll(`${k ? '#list-' + k : '#main'} textarea.task-in`).forEach(fitTask); }

  function bindMine() {
    const main = $('#main');
    fitTasks();
    main.oninput = e => {
      const t = e.target;
      if (t.classList && t.classList.contains('task-in')) fitTask(t);
      if (t.dataset.k) draft[t.dataset.k][Number(t.dataset.i)][t.dataset.f] = t.value;
      if (t.id === 'noteIn') draft.note = t.value;
    };
    main.onchange = e => { if (e.target.id === 'doneIn') draft.done = e.target.checked; };
    // Enter: 그 칸 안에서 줄바꿈 (여러 줄로 쓰기)
    // Alt+Enter: 지금 줄 바로 아래에 새 업무 줄을 끼워 넣는다
    let lastAlt = 0;
    main.onkeydown = e => {
      const t = e.target;
      if (e.key !== 'Enter' || !e.altKey || !t.dataset.k) return;
      e.preventDefault();
      // 한글 입력 중 Enter는 (입력 중 1번 + 확정 후 1번) 두 번 들어오기도 해서, 바로 뒤따르는 1번은 건너뛴다
      const now = Date.now();
      const composing = e.isComposing || e.keyCode === 229;
      if (!composing && now - lastAlt < 60) return;
      lastAlt = composing ? now : 0;
      const k = t.dataset.k, i = Number(t.dataset.i);
      const go = () => {
        if (t.dataset.f === 'task') draft[k][i].task = t.value;
        draft[k].splice(i + 1, 0, blank());
        $(`#list-${k}`).innerHTML = itemsHtml(k);
        fitTasks(k);
        const el = document.querySelector(`#list-${k} [data-f="task"][data-i="${i + 1}"]`);
        if (el) el.focus();
      };
      if (composing) setTimeout(go, 0); else go();
    };
    main.onclick = e => {
      const t = e.target.closest('button');
      if (!t) return;
      if (t.dataset.add) {
        draft[t.dataset.add].push(blank());
        $(`#list-${t.dataset.add}`).innerHTML = itemsHtml(t.dataset.add);
        fitTasks(t.dataset.add);
        const inputs = document.querySelectorAll(`#list-${t.dataset.add} [data-f="task"]`);
        inputs[inputs.length - 1].focus();
      } else if (t.dataset.f === 'imp') {
        const it = draft[t.dataset.k][Number(t.dataset.i)];
        it.imp = !it.imp;
        t.setAttribute('aria-pressed', String(it.imp));
        t.textContent = it.imp ? '★' : '☆';
      } else if (t.dataset.f === 'cont') {
        const it = draft[t.dataset.k][Number(t.dataset.i)];
        it.cont = !it.cont;
        $(`#list-${t.dataset.k}`).innerHTML = itemsHtml(t.dataset.k);
        fitTasks(t.dataset.k);
      } else if (t.dataset.f === 'del') {
        draft[t.dataset.k].splice(Number(t.dataset.i), 1);
        if (!draft[t.dataset.k].length) draft[t.dataset.k].push(blank());
        $(`#list-${t.dataset.k}`).innerHTML = itemsHtml(t.dataset.k);
        fitTasks(t.dataset.k);
      } else if (t.id === 'saveMine') {
        saveMine();
      } else if (t.id === 'savePre') {
        savePre(false);
      } else if (t.id === 'clearPre') {
        savePre(true);
      }
    };
  }

  /** 누르자마자 화면에 반영하고, 서버 저장은 뒤에서 한다. 실패하면 되돌리고 작성 내용을 살려둔다. */
  function saveMine() {
    const out = draftOut;
    const payload = { thisWeek: out(draft.thisWeek), nextWeek: out(draft.nextWeek), note: draft.note.trim(), done: draft.done };
    const i = D.members.findIndex(m => m.name === D.me.name);
    const before = D.members[i];
    const keepDraft = draft;
    D.members[i] = Object.assign({}, before, { done: payload.done, note: payload.note, thisWeek: payload.thisWeek.map(toItem), nextWeek: payload.nextWeek.map(toItem) });
    draft = draftMine = null;
    render();
    toast(payload.done ? '저장했습니다. (작성완료)' : '저장했습니다. 다 쓰면 작성완료에 체크하세요.');

    call('apiSaveMyWeek', payload)
      .then(data => { applyData(data); if (page !== 'weekly' || weeklyTab !== 'mine') render(); })
      .catch(e => {
        D.members[i] = before;
        draft = draftMine = keepDraft;
        render();
        toast(`저장하지 못했습니다. 작성 내용은 그대로 있으니 다시 저장해 주세요. (${e.message || e})`);
      });
  }

  /** 다음 주 미리 쓰기 저장(clear=true면 지우기). 화면은 바로 바꾸고 저장은 뒤에서 한다. */
  function savePre(clear) {
    const payload = clear ? { clear: true } : { thisWeek: draftOut(draft.thisWeek), nextWeek: draftOut(draft.nextWeek), note: draft.note.trim() };
    const i = D.members.findIndex(m => m.name === D.me.name);
    const before = D.members[i];
    const keepDraft = draft;
    D.members[i] = Object.assign({}, before, {
      pre: clear ? { exists: false, note: '', thisWeek: [], nextWeek: [] }
        : { exists: true, note: payload.note, thisWeek: payload.thisWeek.map(toItem), nextWeek: payload.nextWeek.map(toItem) },
    });
    draft = draftPre = null;
    render();
    toast(clear ? '미리 쓴 내용을 지웠습니다.' : '미리 저장했습니다. 월요일에 자동 반영됩니다.');
    call('apiSavePreWeek', payload)
      .then(data => applyData(data))
      .catch(e => {
        D.members[i] = before;
        draft = draftPre = keepDraft;
        render();
        toast(`저장하지 못했습니다. 작성 내용은 그대로 있으니 다시 저장해 주세요. (${e.message || e})`);
      });
  }

  /* ================= 팀장 코멘트 (지금은 숨김: SHOW_COMMENT) ================= */
  document.addEventListener('click', e => {
    const cell = e.target.closest('.cm.editable');
    if (!cell || cell.querySelector('textarea')) return;
    openComment(cell);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.matches && e.target.matches('.cm.editable') && !e.target.querySelector('textarea')) {
      e.preventDefault();
      openComment(e.target);
    }
    if (e.key === 'Escape' && !$('#scrim').hidden) closeModal();
  });
  /* ================= 팀 주간보고: 기한 표시 / 회의 모드 ================= */
  /** 기한: 지났으면 빨강(금주만), 지속은 회색 칩 */
  function dueHtml(it, isThis) {
    if (!it || !it.task) return '';
    if (it.due === '지속') return '<span class="due-cont">지속</span>';
    if (!it.dueIso) return esc(it.due || '');
    const days = Math.round((parseD(it.dueIso) - parseD(dkey(now()))) / 864e5);
    const cls = isThis && days < 0 ? 'due-late' : '';
    return `<span class="${cls}" ${cls === 'due-late' ? 'title="기한 지남"' : ''}>${esc(it.due)}</span>`;
  }

  /* ----- 팀장 강조(굵게) ----- */
  /** 굵게: 담당자가 중요(★)로 표시했거나 팀장이 표시한 업무 */
  function isImp(m, w, task) {
    const items = m ? (w === 'next' ? m.nextWeek : m.thisWeek) || [] : [];
    return !!task && items.some(x => x.task === task && x.imp);
  }
  function isMarked(m, w, task) {
    if (isImp(m, w, task)) return true;
    const list = m && m.marks ? m.marks[w === 'next' ? 'nextWeek' : 'thisWeek'] : null;
    return !!(list && task && list.indexOf(task) >= 0);
  }
  /** 팀 주간보고 표의 업무 칸: 팀장은 눌러서 굵게 켜고 끈다 */
  function taskCell(m, w, i, it, cls) {
    const imp = !!(it && it.imp);
    const can = D.me.isLeader && it && it.task && !imp; // 담당자가 중요로 표시한 업무는 그대로 굵게
    return `<td class="task ${cls} ${isMarked(m, w, it && it.task) ? 'mk' : ''} ${can ? 'markable' : ''}" ${can ? `data-mk="${esc(m.name)}|${w}|${i}" tabindex="0" title="눌러서 굵게 표시"` : imp ? 'title="담당자가 중요 업무로 표시"' : ''}>${esc(it && it.task)}</td>`;
  }
  function toggleMark(key) {
    const [name, w, i] = key.split('|');
    const m = D.members.find(x => x.name === name);
    const it = m && (w === 'next' ? m.nextWeek : m.thisWeek)[Number(i)];
    if (!it) return;
    m.marks = m.marks || { thisWeek: [], nextWeek: [] };
    const list = m.marks[w === 'next' ? 'nextWeek' : 'thisWeek'];
    const before = list.slice();
    const at = list.indexOf(it.task);
    if (at >= 0) list.splice(at, 1); else list.push(it.task);
    const redraw = () => { if (!$('#meet').hidden) drawMeeting(); else render(); };
    redraw();
    call('apiToggleMark', name, w, it.task).then(data => { applyData(data); redraw(); })
      .catch(err => { m.marks[w === 'next' ? 'nextWeek' : 'thisWeek'] = before; redraw(); fail(err); });
  }
  document.addEventListener('click', e => {
    const el = e.target.closest && e.target.closest('.markable[data-mk]');
    if (el) toggleMark(el.dataset.mk);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.matches && e.target.matches('td.markable[data-mk]')) { e.preventDefault(); toggleMark(e.target.dataset.mk); }
  });

  // 회의 모드: 한 사람씩 크게 (← → 로 넘기기). 마지막 장은 인사현황
  let meetIdx = 0;
  let meetScale = 1;
  try { meetScale = Number(localStorage.getItem('meetScale')) || 1; } catch (e) { /* 저장소 없음 */ }

  function openMeeting(i) {
    meetIdx = Math.max(0, Math.min(i || 0, D.members.length + 1));
    meetMin = null;
    $('#meet').hidden = false;
    document.body.classList.add('meeting');
    try { if (document.documentElement.requestFullscreen && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); } catch (e) { /* 전체화면 불가 */ }
    drawMeeting();
  }
  function closeMeeting() {
    meetMinFlush();
    $('#meet').hidden = true;
    document.body.classList.remove('meeting');
    try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) { /* 무시 */ }
    render();
  }
  function meetGo(i) { meetMinFlush(); meetIdx = Math.max(0, Math.min(i, D.members.length + 1)); drawMeeting(); }
  function meetZoom(d) {
    meetScale = Math.max(0.8, Math.min(1.6, Math.round((meetScale + d) * 10) / 10));
    try { localStorage.setItem('meetScale', String(meetScale)); } catch (e) { /* 저장소 없음 */ }
    drawMeeting();
  }

  function drawMeeting() {
    ownClose();
    const total = D.members.length;
    const onHr = meetIdx === total, onMin = meetIdx > total;
    const pills = D.members.map((m, i) => `<button class="mp ${i === meetIdx ? 'on' : ''} ${m.done ? '' : 'pending'}" onclick="meetGo(${i})">${esc(m.name)}</button>`).join('')
      + `<button class="mp hr ${onHr ? 'on' : ''}" onclick="meetGo(${total})">인사현황</button>`
      + `<button class="mp hr ${onMin ? 'on' : ''}" onclick="meetGo(${total + 1})">회의록</button>`;
    const mm = D.members[meetIdx];
    const list = (items, isThis) => items.length
      ? `<ol>${items.map((it, i) => `<li class="${isMarked(mm, isThis ? 'this' : 'next', it.task) ? 'mk' : ''} ${D.me.isLeader ? 'markable' : ''}" ${D.me.isLeader ? `data-mk="${esc(mm.name)}|${isThis ? 'this' : 'next'}|${i}" title="눌러서 굵게 표시"` : ''}><span class="t">${esc(it.task)}</span><span class="d">${dueHtml(it, isThis)}</span></li>`).join('')}</ol>`
      : '<p class="none">작성한 업무가 없습니다.</p>';
    let body;
    if (onMin) {
      body = meetMinHtml();
    } else if (onHr) {
      body = `<div class="meet-hr"><h2>■ 인사 현황</h2><div class="table-wrap">${hrTableHtml(false)}</div></div>`;
    } else {
      const m = D.members[meetIdx];
      const note = noteOf(m);
      body = `
        <div class="meet-who">
          <h2>${esc(m.name)}</h2>
          ${m.done ? '<span class="chip ok">작성완료</span>' : '<span class="chip no">미작성</span>'}
          ${note ? `<span class="meet-note">${ic('leave', 'sm')}${esc(note)}</span>` : ''}
        </div>
        <div class="meet-cols">
          <section class="msec wk-this"><h4><span class="wk this">금주</span>${esc(D.week.thisLabel)}</h4>${list(m.thisWeek, true)}</section>
          <section class="msec wk-next"><h4><span class="wk next">차주</span>${esc(D.week.nextLabel)}</h4>${list(m.nextWeek, false)}</section>
        </div>
        ${SHOW_COMMENT ? `<div class="meet-cm">
          <div class="lbl">팀장 코멘트 ${D.me.isLeader ? `<button class="btn small" onclick="meetComment()">${ic('pencil', 'sm')}${m.comment ? '수정' : '작성'}</button>` : ''}</div>
          <div class="txt">${m.comment ? esc(m.comment) : '<span class="ph">코멘트 없음</span>'}</div>
        </div>` : ''}`;
    }
    $('#meet').innerHTML = `
      <div class="meet-top">
        <div class="meet-title"><b>${esc(D.team)} 주간업무</b><span>${esc(D.week.thisLabel)}</span></div>
        <div class="meet-tools">
          <button class="btn small ${meetSplit ? 'primary' : ''}" onclick="meetToggleSplit()" aria-pressed="${meetSplit}">${ic('file', 'sm')}회의록 옆에 띄우기</button>
          <button class="icon-btn" onclick="meetZoom(-0.1)" aria-label="글자 작게">A−</button>
          <button class="icon-btn" onclick="meetZoom(0.1)" aria-label="글자 크게">A+</button>
          <button class="btn small" onclick="closeMeeting()">${ic('x', 'sm')}닫기 (Esc)</button>
        </div>
      </div>
      <div class="meet-pills">${pills}</div>
      <div class="meet-body ${meetSplit && !onMin ? 'split' : ''}" style="font-size:${Math.round(meetScale * 18)}px">${meetSplit && !onMin
        ? `<div class="meet-left">${body}</div><div class="meet-right">${meetMinHtml(true)}</div>` : body}</div>
      <div class="meet-nav">
        <button class="btn" onclick="meetGo(${meetIdx - 1})" ${meetIdx === 0 ? 'disabled' : ''}>${ic('chevL', 'sm')}이전</button>
        <span>${onMin ? '회의록' : onHr ? '인사현황' : `${meetIdx + 1} / ${total}`} · ← → 이동</span>
        <button class="btn primary" onclick="meetGo(${meetIdx + 1})" ${onMin ? 'disabled' : ''}>다음${ic('chev', 'sm')}</button>
      </div>`;    fitAreas();
  }

  /* ---------- 회의 모드: 회의록 바로 고치기 (자동 저장) ---------- */
  let meetMin = null, meetMinTimer = null, meetMinBusy = false, meetMinAgain = false;
  let meetSplit = true; // 회의 모드: 주간업무 옆에 회의록을 같이 띄운다
  try { meetSplit = localStorage.getItem('meetSplit') !== '0'; } catch (e) { /* 저장소 없음 */ }
  function meetToggleSplit() { meetMinFlush(); meetSplit = !meetSplit; try { localStorage.setItem('meetSplit', meetSplit ? '1' : '0'); } catch (e) { /* 저장소 없음 */ } drawMeeting(); }
  function meetMinHtml(side) {
    if (!meetMin) { const cur = minCur(); meetMin = cur ? minNormDue(JSON.parse(JSON.stringify(cur))) : null; }
    const m = meetMin;
    if (!m) return `<div class="meet-hr"><h2>■ 회의록</h2><p class="none">아직 회의록이 없습니다.</p>
      <button class="btn primary" onclick="meetMinNew()">${ic('plus', 'sm')}새 회의록 시작</button></div>`;
    const inp = (i, f, v, ph) => `<input class="field-in mm-in" data-i="${i}" data-f="${f}" value="${esc(v)}" placeholder="${ph}" aria-label="${ph}">`;
    const rows = m.items.map((x, i) => `<tr class="${x.status === '완료' ? 'm-done' : ''}">
        <td>${inp(i, 'cat', x.cat, '구분')}</td><td>${inp(i, 'sub', x.sub, '세부')}</td>
        <td><textarea class="field-in mm-in" data-i="${i}" data-f="content" rows="1" placeholder="내용" aria-label="내용">${esc(x.content)}</textarea></td>
        <td>${minOwnerCell('mm', i, x)}</td><td>${minDueCell('mm', i, x)}</td>
        <td><select class="field-in mm-in st-${minStatusCls(x.status)}" data-i="${i}" data-f="status" aria-label="진행상태">${MIN_STATUS.map(s2 => `<option ${s2 === x.status ? 'selected' : ''}>${s2}</option>`).join('')}</select></td>
        <td class="m-act"><button class="icon-btn" onclick="meetMinRow(${i},-1)" aria-label="위로">↑</button><button class="icon-btn" onclick="meetMinRow(${i},1)" aria-label="아래로">↓</button><button class="icon-btn" onclick="meetMinRow(${i},0)" aria-label="지우기">${ic('x', 'sm')}</button></td>
      </tr>`).join('');
    const others = minList().length > 1 ? `<select class="field-in" style="width:auto" onchange="meetMinFlush();minSel=this.value;meetMin=null;drawMeeting()" aria-label="회의 고르기">${minList().map(x => `<option value="${esc(x.id)}" ${x.id === m.id ? 'selected' : ''}>${esc(minDateText(x.date, ''))}</option>`).join('')}</select>` : '';
    return `<div class="meet-min ${side ? 'mm-side' : ''}">
      <div class="meet-min-head"><h2>■ 회의록</h2>${others}
        <span class="memo-st" id="mmSt">${String(m.id).startsWith('tmp-') ? '' : ''}</span>
        <button class="btn small" onclick="meetMinNew()">${ic('plus', 'sm')}새 회의록</button></div>
      <div class="mm-top">
        <label>일시 <input class="field-in mm-top" type="text" data-date inputmode="numeric" maxlength="10" autocomplete="off" data-f="date" value="${esc(m.date)}"><input class="field-in mm-top" data-f="time" value="${esc(m.time)}" placeholder="13:30~" style="width:110px"></label>
        <label>장소 <input class="field-in mm-top" data-f="place" value="${esc(m.place)}" placeholder="장소"></label>
        <label class="wide">참석자 <input class="field-in mm-top" data-f="attendees" value="${esc(m.attendees)}" placeholder="참석자"></label>
      </div>
      <div class="table-wrap"><table class="t m-edit mm-table">
        <colgroup><col style="width:13%"><col style="width:11%"><col><col style="width:12%"><col style="width:14%"><col style="width:12%"><col style="width:96px"></colgroup>
        <thead><tr><th>구분</th><th>세부</th><th>내용</th><th>담당</th><th>기한</th><th>진행상태</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      <button class="btn small add" onclick="meetMinAdd()" style="margin-top:10px">${ic('plus', 'sm')}항목 추가</button>
      <p class="min-meta">고치면 자동으로 저장됩니다.</p>
    </div>`;
  }
  function meetMinQueue() {
    const st = $('#mmSt'); if (st) st.textContent = '';
    clearTimeout(meetMinTimer);
    meetMinTimer = setTimeout(meetMinSave, 1200); // 쓰다가 잠깐 쉬면 저장
  }
  function meetMinFlush() { if (meetMinTimer) meetMinSave(); }
  function meetMinSave() {
    clearTimeout(meetMinTimer); meetMinTimer = null;
    if (!meetMin) return;
    // 저장이 끝나기 전에 또 고치면, 끝난 뒤 한 번 더 저장한다 (새 회의록이 두 개 생기지 않도록)
    if (meetMinBusy) { meetMinAgain = true; return; }
    meetMinBusy = true;
    const draft = JSON.parse(JSON.stringify(meetMin));
    if (String(draft.id).startsWith('tmp-')) draft.id = '';
    const st = $('#mmSt'); if (st) st.textContent = '저장 중…';
    // 화면 목록에도 바로 반영
    const local = Object.assign({}, meetMin, { editor: D.me.name, items: meetMin.items.filter(x => x.cat || x.sub || x.content) });
    D.minutes = [local].concat((D.minutes || []).filter(x => x.id !== local.id)).sort((a, b) => b.date.localeCompare(a.date));
    minSel = local.id;
    call('apiSaveMinutes', draft).then(data => {
      applyData(data);
      if (meetMin && meetMin.id === local.id) { meetMin.id = data.savedId; minSel = data.savedId; }
      meetMinBusy = false;
      if (meetMinAgain) { meetMinAgain = false; meetMinSave(); return; }
      const s2 = $('#mmSt'); if (s2) s2.textContent = '저장됨';
    }).catch(e => { meetMinBusy = false; meetMinAgain = false; const s2 = $('#mmSt'); if (s2) s2.textContent = ''; fail(e); });
  }
  function meetMinNew() {
    meetMinFlush();
    const base = minCur();
    meetMin = base
      ? { id: 'tmp-' + Date.now(), date: dkey(now()), time: base.time, place: base.place, attendees: base.attendees, vision: base.vision, items: JSON.parse(JSON.stringify(base.items)).filter(x => x.status !== '완료') }
      : { id: 'tmp-' + Date.now(), date: dkey(now()), time: '', place: '', attendees: '', vision: '', items: [{ cat: '', sub: '', content: '', owner: '', due: '', status: '진행중' }] };
    minNormDue(meetMin); drawMeeting(); meetMinSave();
  }
  function meetMinAdd() {
    const last = meetMin.items[meetMin.items.length - 1];
    meetMin.items.push({ cat: last ? last.cat : '', sub: last ? last.sub : '', content: '', owner: '', due: '', status: '진행중' });
    drawMeeting();
    const t = document.querySelectorAll(`#meet textarea.mm-in[data-i="${meetMin.items.length - 1}"]`); if (t[0]) t[0].focus();
  }
  function meetMinRow(i, dir) {
    const it = meetMin.items;
    if (dir === 0) it.splice(i, 1); else if (it[i + dir]) { const t = it[i]; it[i] = it[i + dir]; it[i + dir] = t; }
    drawMeeting(); meetMinQueue();
  }
  document.addEventListener('input', e => {
    const el = e.target;
    if (!meetMin || !el.classList || $('#meet').hidden) return;
    if (el.classList.contains('mm-top')) { meetMin[el.dataset.f] = el.value; meetMinQueue(); }
    else if (el.classList.contains('mm-in') && el.tagName !== 'SELECT') {
      meetMin.items[Number(el.dataset.i)][el.dataset.f] = el.value;
      if (el.tagName === 'TEXTAREA') { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
      meetMinQueue();
    }
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (!meetMin || !el.classList || !el.classList.contains('mm-in') || el.tagName !== 'SELECT') return;
    meetMin.items[Number(el.dataset.i)].status = el.value;
    el.className = `field-in mm-in st-${minStatusCls(el.value)}`;
    el.closest('tr').classList.toggle('m-done', el.value === '완료');
    meetMinQueue();
  });

  function meetComment() {
    const m = D.members[meetIdx];
    openModal(`<h3>${esc(m.name)} · 팀장 코멘트</h3>
      <form class="form" id="mcForm"><textarea class="field-in" id="mcText" style="min-height:140px">${esc(m.comment)}</textarea>
      <div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">취소</button><button type="submit" class="btn primary">저장</button></div></form>`);
    $('#mcForm').onsubmit = e => {
      e.preventDefault();
      const before = m.comment;
      m.comment = $('#mcText').value.trim();
      closeModal(); drawMeeting(); toast(`${m.name}님 코멘트를 저장했습니다.`);
      call('apiSaveComment', m.name, m.comment).then(data => applyData(data))
        .catch(err => { m.comment = before; drawMeeting(); toast(`코멘트를 저장하지 못했습니다. (${err.message || err})`); });
    };
  }

  document.addEventListener('keydown', e => {
    if ($('#meet').hidden || !$('#scrim').hidden) return;
    if (e.target.closest && e.target.closest('input, textarea, select')) { if (e.key === 'Escape') e.target.blur(); return; } // 회의록을 쓰는 중에는 화살표로 넘기지 않는다
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); meetGo(meetIdx + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); meetGo(meetIdx - 1); }
    else if (e.key === 'Escape') closeMeeting();
  });

  /* ================= 대시보드: 눌러서 자세히 ================= */
  /** 누를 수 있는 카드/줄 (키보드 Enter로도) */
  /** "김민지, 박서연, 이하준 외 2명" — 12명이 다 들어가도 카드가 넘치지 않게 */
  function nameShort(names, max) {
    max = max || 3;
    return names.length > max ? `${names.slice(0, max).join(', ')} 외 ${names.length - max}명` : names.join(', ');
  }
  function tapAttr(js) { return `role="button" tabindex="0" onclick="${js}" onkeydown="if(event.key==='Enter'){${js}}"`; }

  function nameList(list, empty) {
    return list.length ? `<div class="dd-list">${list.map(m => `<button type="button" class="dd-row" onclick="showMember('${esc(m.name)}')">
      <b>${esc(m.name)}</b><span>금주 ${m.thisWeek.length}건 · 차주 ${m.nextWeek.length}건</span>${ic('chev', 'sm')}</button>`).join('')}</div>`
      : `<p class="dd-empty">${empty}</p>`;
  }

  function showDash(kind) {
    const s = stats();
    const done = D.members.filter(m => m.done), pend = D.members.filter(m => !m.done);
    const canRemind = (D.me.isLeader || D.me.isAdmin) && pend.length;
    const close = '<div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">닫기</button>';
    if (kind === 'done') {
      const mineOpen = D.me.writer && mineMember() && !mineMember().done;
      openModal(`
        <h3>작성 현황</h3>
        <p class="sub">${esc(D.week.deadlineText)} 마감 · ${esc(s.left.big)} · 작성완료 ${s.done}/${s.total}명</p>
        <h4 class="dd-h">미작성 <span>${pend.length}명</span></h4>
        ${nameList(pend, '모두 작성했습니다.')}
        <h4 class="dd-h">작성완료 <span>${done.length}명</span></h4>
        ${nameList(done, '아직 작성완료한 사람이 없습니다.')}
        ${close}
          ${canRemind ? `<button type="button" class="btn" onclick="closeModal();remind()">${ic('bell', 'sm')}미작성자 알림</button>` : ''}
          ${mineOpen ? `<button type="button" class="btn primary" onclick="closeModal();setTab('weekly','mine',true)">내 주간업무 작성</button>` : `<button type="button" class="btn primary" onclick="closeModal();setTab('weekly','team',true)">팀 주간보고 보기</button>`}
        </div>`);
    } else if (kind === 'off') {
      // 휴가는 날짜순, 그 밖의 특이사항은 뒤에
      const rows = s.off.map(m => {
        const leaves = m.leaves || [];
        return { m, first: leaves.length ? leaves[0].start : '9999', leaves, note: String(m.note || '').trim() };
      }).sort((a, b) => a.first.localeCompare(b.first) || a.m.name.localeCompare(b.m.name, 'ko'));
      openModal(`
        <h3>휴무·특이사항 <span class="dd-count">${rows.length}명</span></h3>
        <p class="sub">${esc(D.week.thisLabel)} ~ ${esc(D.week.nextLabel)}</p>
        ${rows.length ? `<table class="t dd-table"><thead><tr><th>이름</th><th>날짜</th><th>내용</th></tr></thead><tbody>
          ${rows.map(r => {
            // "10/1(목)~6(화) 정기휴가" → 날짜 / 내용
            const lines = r.leaves.map(l => { const i = l.text.indexOf(' '); return { when: i > 0 ? l.text.slice(0, i) : '', what: i > 0 ? l.text.slice(i + 1) : l.text }; });
            if (r.note) lines.push({ when: '', what: r.note });
            return lines.map((x, i) => `<tr>${i === 0 ? `<td rowspan="${lines.length}" class="nm"><button type="button" class="linkish" onclick="showMember('${esc(r.m.name)}')">${esc(r.m.name)}</button></td>` : ''}<td class="nowrap">${esc(x.when) || '<span class="ph">-</span>'}</td><td>${esc(x.what)}</td></tr>`).join('');
          }).join('')}
        </tbody></table>` : '<p class="dd-empty">이번 주·다음 주 휴무나 특이사항이 없습니다.</p>'}
        ${close}<button type="button" class="btn primary" onclick="closeModal();go('calendar')">일정에서 보기</button></div>`);
    } else if (kind === 'budget') {
      const list = s.monthReq.slice().reverse();
      const total = list.reduce((a, r) => a + r.amount, 0);
      openModal(`
        <h3>이번 달 예산전용 <span class="dd-count">${list.length}건</span></h3>
        <p class="sub">${monthName(ymNow(), true)}분 · 합계 <b>${won(total)}원</b></p>
        ${list.length ? `<div class="dd-list">${list.map(r => `<button type="button" class="dd-row" onclick="showBudgetReq('${esc(r.id)}')">
          <b>${esc(r.req)}</b><span>${esc(bLabel(r.fromCost, r.fromCode, r.from))} → ${esc(bLabel(r.toCost, r.toCode, r.to))}</span><em>${won(r.amount)}원</em>${ic('chev', 'sm')}</button>`).join('')}</div>`
          : '<p class="dd-empty">이번 달 신청이 없습니다.</p>'}
        ${close}<button type="button" class="btn primary" onclick="closeModal();budgetMonth=null;setTab('budget','list',true)">신청 내역 보기</button></div>`);
    }
  }

  /** 한 사람의 이번 주 보고 */
  function showMember(name) {
    const m = D.members.find(x => x.name === name);
    if (!m) return;
    const list = (items, isThis) => items.length
      ? `<ul class="dd-items">${items.map(it => `<li class="${isMarked(m, isThis ? 'this' : 'next', it.task) ? 'mk' : ''}"><span>${esc(it.task)}</span><em>${dueHtml(it, isThis)}</em></li>`).join('')}</ul>`
      : '<p class="dd-empty">작성한 업무가 없습니다.</p>';
    const note = noteOf(m);
    openModal(`
      <h3>${esc(m.name)} ${m.done ? '<span class="chip ok">작성완료</span>' : '<span class="chip no">미작성</span>'}</h3>
      ${note ? `<p class="mnote">${ic('leave', 'sm')}<span><b>휴무·특이사항</b> ${esc(note)}</span></p>` : ''}
      <div class="msec wk-this" style="margin-top:12px"><h4><span class="wk this">금주</span>${esc(D.week.thisLabel)}</h4>${list(m.thisWeek, true)}</div>
      <div class="msec wk-next" style="margin-top:10px"><h4><span class="wk next">차주</span>${esc(D.week.nextLabel)}</h4>${list(m.nextWeek, false)}</div>
      ${SHOW_COMMENT && m.comment ? `<div class="dd-cm"><b>팀장 코멘트</b>${esc(m.comment)}</div>` : ''}
      <div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">닫기</button>
        <button type="button" class="btn primary" onclick="closeModal();openMeeting(${D.members.indexOf(m)})">크게 보기</button></div>`);
  }

  function showBudgetReq(id) {
    const r = D.budget.requests.find(x => x.id === id);
    if (!r) return;
    openModal(`
      <h3>예산전용 신청 <span class="chip month">${monthName(reqMonth(r))}분</span></h3>
      <p class="sub">${esc(r.req)} · 신청 ${esc(r.date)}</p>
      <dl class="dd-dl">
        <dt>변경전</dt><dd>${esc(bLabel(r.fromCost, r.fromCode, r.from))}</dd>
        <dt>변경후</dt><dd>${esc(bLabel(r.toCost, r.toCode, r.to))}</dd>
        <dt>금액</dt><dd><b>${won(r.amount)}원</b></dd>
        <dt>사유</dt><dd>${esc(r.reason)}</dd>
      </dl>
      <div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">닫기</button>
        <button type="button" class="btn primary" onclick="closeModal();budgetMonth='${esc(reqMonth(r))}';setTab('budget','list',true)">신청 내역에서 보기</button></div>`);
  }

  /* ================= 인사현황 ================= */
  function hrData() { return D.hr || { thisWeek: [], nextWeek: [] }; }
  function hrCount() { const h = hrData(); return h.thisWeek.length + h.nextWeek.length; }
  function hrCats() { return D.hrCategories || ['입사', '휴직', '복직', '퇴사', '인터뷰', '기타']; }
  function hrCanEdit(x) { return !!D.me.name && (x.author === D.me.name || D.me.isLeader || D.me.isAdmin || ((x.imported || x.author === '채용캘린더') && D.me.recruiter)); }
  function hrFind(id) { const h = hrData(); return h.thisWeek.concat(h.nextWeek, h.later || [], hrHist ? hrHist.items : []).find(x => x.id === id); }

  /* ---------- 인사현황 지난 내역 (누를 때만 불러온다) ---------- */
  let hrHist = null, hrHistOpen = false, hrHistYm = '', hrHistCat = '', hrHistQ = '', hrHistBusy = false;
  const ymOf = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
  function loadHrHist(ym) {
    hrHistYm = ym; hrHistBusy = true;
    const draw = () => { const el = $('#hrHist'); if (el) el.outerHTML = hrHistHtml(); };
    draw();
    return call('apiHrHistory', ym).then(r => { if (r.ym === hrHistYm) hrHist = r; })
      .catch(fail).finally(() => { hrHistBusy = false; draw(); });
  }
  function hrHistToggle() {
    hrHistOpen = !hrHistOpen;
    if (hrHistOpen && !hrHist) return loadHrHist(ymOf(now())); // 이번 달부터 (‹ 로 지난 달)
    const el = $('#hrHist'); if (el) el.outerHTML = hrHistHtml();
  }
  function hrHistMove(n) { const d = parseD(hrHistYm + '-01'); loadHrHist(ymOf(new Date(d.getFullYear(), d.getMonth() + n, 1))); }
  function hrHistList() {
    if (!hrHist || hrHist.ym !== hrHistYm) return '';
    const q = hrHistQ.trim().toLowerCase();
    const list = hrHist.items.filter(x => (!hrHistCat || x.category === hrHistCat)
      && (!q || [x.category, x.target, x.memo, x.author].join(' ').toLowerCase().indexOf(q) >= 0));
    if (!list.length) return `<p class="dd-empty">${hrHist.items.length ? '찾는 내역이 없습니다.' : '이 달에는 인사현황이 없습니다.'}</p>`;
    return `<div class="dd-list">${list.map(x => `<button type="button" class="dd-row later-row" ${hrCanEdit(x) ? `onclick="openHrForm('${esc(x.id)}')"` : 'disabled'}>
      <b>${esc(x.category)}</b><span>${esc(x.target)}${x.memo ? ` · ${esc(x.memo)}` : ''}</span><em>${esc(x.when)}<small>${esc(x.author)}</small></em>${hrCanEdit(x) ? ic('chev', 'sm') : ''}</button>`).join('')}</div>`;
  }
  function hrHistHtml() {
    if (!hrHistOpen) return `<section class="panel" id="hrHist"><div class="panel-head"><h2>지난 내역</h2>
      <button class="btn small" onclick="hrHistToggle()">${ic('calendar', 'sm')}지난 내역 보기</button></div></section>`;
    const d = parseD((hrHistYm || ymOf(now())) + '-01');
    const months = hrHist ? hrHist.months : [];
    const opts = months.some(m => m.ym === hrHistYm) ? months : months.concat([{ ym: hrHistYm, n: 0 }]).sort((a, b) => b.ym.localeCompare(a.ym));
    return `<section class="panel" id="hrHist">
      <div class="panel-head"><h2>지난 내역</h2><button class="btn small ghost" onclick="hrHistToggle()">접기</button></div>
      <div class="hist-bar">
        <div class="hist-month">
          <button class="icon-btn" onclick="hrHistMove(-1)" title="이전 달" aria-label="이전 달">‹</button>
          <select class="field-in" onchange="loadHrHist(this.value)" aria-label="조회할 달">${opts.map(m => `<option value="${m.ym}" ${m.ym === hrHistYm ? 'selected' : ''}>${+m.ym.slice(0, 4)}년 ${+m.ym.slice(5, 7)}월${m.n ? ` (${m.n})` : ''}</option>`).join('')}</select>
          <button class="icon-btn" onclick="hrHistMove(1)" title="다음 달" aria-label="다음 달">›</button>
        </div>
        <select class="field-in" onchange="hrHistCat = this.value; $('#hrHistList').innerHTML = hrHistList()" aria-label="구분">
          <option value="">구분 전체</option>${hrCats().map(c => `<option ${c === hrHistCat ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
        <input class="field-in" type="search" placeholder="대상·내용 검색" value="${esc(hrHistQ)}" oninput="hrHistQ = this.value; $('#hrHistList').innerHTML = hrHistList()">
      </div>
      <p class="report-note">${d.getFullYear()}년 ${d.getMonth() + 1}월 · 눌러서 수정·삭제 (본인 등록분, 팀장·관리자는 전체)</p>
      <div id="hrHistList">${hrHistBusy ? '<div class="loading">불러오는 중…</div>' : hrHistList()}</div>
    </section>`;
  }

  /** 시트와 같은 모양: 구분별로 금주·차주를 나란히 (빈 줄 없이) */
  function hrTableHtml(editable) {
    const h = hrData();
    const cell = (x, cls) => {
      if (!x) return `<td class="${cls}"></td>`;
      const ed = editable && hrCanEdit(x);
      return `<td class="${cls} hr-in ${ed ? 'editable' : ''}" ${ed ? `onclick="openHrForm('${esc(x.id)}')" tabindex="0" title="눌러서 수정"` : ''}>${esc(x.target)}${editable ? `<small>${esc(x.author)}</small>` : ''}</td>`;
    };
    let body = '';
    hrCats().forEach(cat => {
      const a = h.thisWeek.filter(x => x.category === cat);
      const b = h.nextWeek.filter(x => x.category === cat);
      if (!a.length && !b.length) return; // 등록한 항목이 없는 구분은 숨긴다
      const n = Math.max(a.length, b.length);
      for (let i = 0; i < n; i++) {
        const x = a[i], y = b[i];
        body += `<tr class="${i === 0 ? 'top' : ''}">`;
        if (i === 0) body += `<td class="cat" rowspan="${n}">${esc(cat)}</td>`;
        body += cell(x, '') + `<td class="c">${x ? esc(x.when) : ''}</td>` + cell(y, '') + `<td class="c">${y ? esc(y.when) : ''}</td>`;
        body += `<td>${esc([x && x.memo, y && y.memo].filter(Boolean).join(' / '))}</td></tr>`;
      }
    });
    return `<table class="report hr">
      <thead>
        <tr><th rowspan="2">구 분</th><th colspan="2">${esc(D.week.thisLabel)}</th><th colspan="2">${esc(D.week.nextLabel)}</th><th rowspan="2">비고</th></tr>
        <tr><th>대상 및 내용</th><th>일자/기간</th><th>대상 및 내용</th><th>발령일</th></tr>
      </thead>
      <tbody>${body || '<tr><td colspan="6" class="empty">이번 주·다음 주에 등록된 인사현황이 없습니다.</td></tr>'}</tbody>
    </table>`;
  }

  /** 휴대폰: 항목이 있는 구분만 카드로 */
  function hrCards(editable) {
    const h = hrData();
    const li = x => {
      const ed = editable && hrCanEdit(x);
      return `<li class="${ed ? 'hr-li' : ''}" ${ed ? `onclick="openHrForm('${esc(x.id)}')"` : ''}><span>${esc(x.target)}${x.memo ? `<small>${esc(x.memo)}</small>` : ''}</span><em>${esc(x.when)}</em></li>`;
    };
    const cards = hrCats().map(cat => {
      const a = h.thisWeek.filter(x => x.category === cat);
      const b = h.nextWeek.filter(x => x.category === cat);
      if (!a.length && !b.length) return '';
      return `<article class="mcard">
        <div class="mcard-head"><b>${esc(cat)}</b><span class="chip plain">${a.length + b.length}</span></div>
        ${a.length ? `<div class="msec"><h4>금주 · ${esc(D.week.thisLabel)}</h4><ul>${a.map(li).join('')}</ul></div>` : ''}
        ${b.length ? `<div class="msec"><h4>차주 · ${esc(D.week.nextLabel)}</h4><ul>${b.map(li).join('')}</ul></div>` : ''}
      </article>`;
    }).join('');
    return cards || '<div class="notice">이번 주·다음 주에 등록된 인사현황이 없습니다.</div>';
  }

  /** 이번 주부터 그 뒤로 내가 등록한 항목 (날짜순) — 눌러서 바로 수정 */
  function hrLaterHtml() {
    const h = hrData();
    const tag = (list, lbl) => list.map(x => Object.assign({ _wk: lbl || x.weekLabel || '' }, x));
    const all = tag(h.thisWeek, '금주').concat(tag(h.nextWeek, '차주'), tag(h.later || []))
      .filter(x => x.author === D.me.name)
      .sort((a, b) => (a.start || '9').localeCompare(b.start || '9') || Number(a.id) - Number(b.id));
    if (!all.length) return '';
    return `<section class="panel">
      <div class="panel-head"><h2>내가 등록한 예정</h2><span>이번 주부터 ${all.length}건 · 눌러서 수정</span></div>
      <div class="dd-list">${all.map(x => `<button type="button" class="dd-row later-row" ${hrCanEdit(x) ? `onclick="openHrForm('${esc(x.id)}')"` : 'disabled'}>
        <b>${esc(x.category)}</b><span>${esc(x.target)}${x.memo ? ` · ${esc(x.memo)}` : ''}</span><em>${esc(x.when)}<small>${esc(x._wk.replace(/ \(.*\)$/, ''))}</small></em>${hrCanEdit(x) ? ic('chev', 'sm') : ''}</button>`).join('')}</div>
    </section>`;
  }
  function hrNextMonday() { const d = parseD(D.week.key); d.setDate(d.getDate() + 7); return d; }
  /** 날짜 → 어느 주에 들어가는지 안내 ("→ 금주 칸" / "10월 2주 · 그 주가 되면 표시") */
  function hrWeekHint(iso) {
    if (!iso) return '일자에 맞는 주에 들어갑니다.';
    const d = parseD(iso);
    const mon = new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 6) % 7));
    const thisMon = parseD(D.week.key), nextMon = hrNextMonday();
    const label = `${mon.getMonth() + 1}월 ${Math.ceil(mon.getDate() / 7)}주`;
    if (mon < thisMon) return `${label} · 지난 주차 (표에 안 나옴)`;
    if (+mon === +thisMon) return `→ 금주 칸 (${D.week.thisLabel})`;
    if (+mon === +nextMon) return `→ 차주 칸 (${D.week.nextLabel})`;
    return `${label} · 그 주가 되면 표시`;
  }

  /**
   * 인사현황 저장·삭제를 화면에 먼저 반영한다. old: 고치거나 지울 항목, entry: 새 내용 (null 이면 삭제).
   * 표(금주·차주·이후 예정)와 일정(팀 캘린더 "구분] 대상")을 함께 고치고, 되돌리는 함수를 돌려준다.
   */
  function hrLocal(old, entry) {
    const before = JSON.stringify(D.hr), calBefore = JSON.stringify(calCache), pendBefore = calPending.slice();
    const h = D.hr = D.hr || { thisWeek: [], nextWeek: [], later: [] };
    const lists = ['thisWeek', 'nextWeek', 'later'];
    if (old) lists.forEach(k => { h[k] = (h[k] || []).filter(y => y.id !== old.id); });
    const evOf = y => ({ title: `${y.category}] ${y.target}`, start: y.start });
    if (old) Object.values(calCache).forEach(c => { if (c && c.events) c.events = c.events.filter(e => !sameEv(e, evOf(old))); });
    if (entry) {
      const s0 = parseD(entry.start);
      const mon = new Date(s0.getFullYear(), s0.getMonth(), s0.getDate() - ((s0.getDay() + 6) % 7));
      const key = dkey(mon), nextKey = dkey(hrNextMonday());
      const item = { id: old ? old.id : 'tmp-' + Date.now(), author: old ? old.author : D.me.name, category: entry.category, target: entry.target,
        start: entry.start, end: entry.end || '', when: periodText(entry.start, entry.end), memo: entry.memo, week: key,
        weekLabel: key > nextKey ? `${mon.getMonth() + 1}월 ${Math.ceil(mon.getDate() / 7)}주` : '' };
      const k = key === D.week.key ? 'thisWeek' : key === nextKey ? 'nextWeek' : key > nextKey ? 'later' : null;
      if (k) { h[k] = (h[k] || []).concat(item).sort((a, b) => (a.start || '9').localeCompare(b.start || '9')); }
      // 일정에도 바로 (서버에서 진짜 일정이 오면 sameEv 로 바뀐다)
      // 인터뷰는 팀 캘린더에 안 들어가고 채용 캘린더에만 → 채용담당 화면에만 채용 일정으로
      const recOnly = entry.category === '인터뷰';
      if (!recOnly || D.recruitCalendar) {
        const ev = { id: 'tmp-hr-' + item.id, title: `${entry.category}] ${entry.target}`, start: entry.start,
          end: dkey(addD(parseD(entry.end || entry.start), 1)), allDay: true, location: '', desc: entry.memo, kind: recOnly ? 'recruit' : 'event' };
        calPending.push(ev);
        Object.values(calCache).forEach(c => { if (c && c.events) c.events.push(ev); });
      }
    }
    calForget(); upcoming = null;
    return () => { D.hr = JSON.parse(before); calCache = JSON.parse(calBefore); calPending = pendBefore; };
  }
  /** "9/28(월)" · "10/1(목)~14(수)" — 서버 hrPeriod_ 와 같은 모양 */
  function periodText(start, end) {
    if (!start) return '';
    const md = d => `${d.getMonth() + 1}/${d.getDate()}(${DAY[d.getDay()]})`;
    const s = parseD(start), e = parseD(end || start);
    return +e === +s ? md(s) : `${md(s)}~${e.getMonth() === s.getMonth() && e.getFullYear() === s.getFullYear() ? `${e.getDate()}(${DAY[e.getDay()]})` : md(e)}`;
  }

  function openHrForm(id) {
    if (String(id || '').indexOf('tmp-') === 0) return toast('방금 등록한 항목을 저장하는 중입니다. 잠시 후 다시 눌러 주세요.');
    const x = id ? hrFind(id) : null;
    if (id && !x) return;
    const cat = x ? x.category : hrCats()[0];
    openModal(`
      <h3>인사현황 ${x ? '수정' : '등록'}</h3>
      <form class="form" id="hForm" novalidate>
        <div class="fld"><label for="hCat">구분</label><select class="field-in" id="hCat">${hrCats().map(c => `<option ${c === cat ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
        <div class="fld"><label for="hTarget">대상 및 내용</label><input class="field-in" id="hTarget" value="${x ? esc(x.target) : ''}" placeholder="예) 홍길동(인사팀) 신규 입사"></div>
        <div class="two">
          <div class="fld"><label for="hStart">일자 (발령일)</label><input class="field-in" type="text" data-date inputmode="numeric" maxlength="10" autocomplete="off" id="hStart" value="${x ? esc(x.start) : ''}"></div>
          <div class="fld"><label for="hEnd">종료일 (기간일 때)</label><input class="field-in" type="text" data-date inputmode="numeric" maxlength="10" autocomplete="off" id="hEnd" value="${x ? esc(x.end) : ''}"></div>
        </div>
        <div class="fld"><label for="hMemo">비고 (선택)</label><input class="field-in" id="hMemo" value="${x ? esc(x.memo) : ''}" placeholder="예) 10/7(수) 입사자 간략 OJT 진행"></div>
        <p class="sub" id="hWeekHint"></p>
        <div class="msg err" id="hErr" hidden></div>
        <div class="modal-actions">
          ${x ? '<button type="button" class="btn danger" id="hDel" style="margin-right:auto">삭제</button>' : ''}
          <button type="button" class="btn" onclick="closeModal()">취소</button><button type="submit" class="btn primary" id="hOk">${x ? '저장' : '등록'}</button>
        </div>
      </form>`);
    // 날짜를 고르면 어느 주에 들어가는지 바로 보여준다
    const hint = () => { $('#hWeekHint').textContent = hrWeekHint($('#hStart').value); };
    hint();
    $('#hStart').oninput = $('#hStart').onchange = hint;
    const err = m => { $('#hErr').textContent = m; $('#hErr').hidden = false; };
    $('#hForm').onsubmit = e => {
      e.preventDefault();
      const entry = { id: x ? x.id : '', category: $('#hCat').value, target: $('#hTarget').value.trim(), start: $('#hStart').value, end: $('#hEnd').value, memo: $('#hMemo').value.trim() };
      if (!entry.target) return err('대상 및 내용을 입력해 주세요.');
      if (!entry.start) return err('일자를 골라 주세요. 날짜에 맞는 주에 들어갑니다.');
      if (entry.end && entry.start && entry.end < entry.start) return err('종료일이 시작일보다 빠릅니다.');
      // 서버를 기다리지 않고 표·일정에 바로 반영한다 (실패하면 되돌린다)
      const undo = hrLocal(x, entry);
      closeModal(); render();
      call('apiSaveHr', entry)
        .then(data => { applyData(data); if (page !== 'calendar') render(); if (hrHist) loadHrHist(hrHistYm); toast(data && data.warning ? data.warning : entry.category === '인터뷰' ? (x ? '수정했습니다. (채용 캘린더에 반영)' : '등록했습니다. (채용 캘린더에만 등록)') : x ? '수정했습니다. (일정에도 반영)' : '등록했습니다. (일정에도 등록)'); })
        .catch(e2 => { undo(); render(); fail(e2); });
    };
    if (x) $('#hDel').onclick = () => {
      const undo = hrLocal(x, null);
      closeModal(); render();
      call('apiDeleteHr', x.id)
        .then(data => { applyData(data); if (page !== 'calendar') render(); if (hrHist) loadHrHist(hrHistYm); toast('삭제했습니다.'); })
        .catch(e2 => { undo(); render(); fail(e2); });
    };
  }

  /* ================= 휴가 (캘린더 → 주간보고 휴무 자동 반영) ================= */
  const LEAVE_TYPES = ['연차', '오전반차', '오후반차', '오전반반차', '오후반반차', '정기휴가', '경조휴가', '대체휴무', '출장', '교육', '기타'];
  function canLeave() { return !!D.me.name && can('weekly'); }

  function leaveStrip(list, range) {
    list = list || [];
    const chips = list.map(l => `<span class="leave-chip">${esc(l.text)}${l.source === '캘린더' ? ' <small>캘린더</small>' : l.source === '채용캘린더' ? ' <small>채용캘린더</small>' : ''}
      <button class="icon-btn" onclick="deleteLeave('${esc(l.id)}')" aria-label="${esc(l.text)} 지우기" title="지우기">${ic('x', 'sm')}</button></span>`).join('');
    return `<section class="panel leave-strip">
      <div class="panel-head"><h2>휴무 일정<span>${range}</span></h2>
        <button class="btn small" onclick="openLeaveForm()">${ic('plus', 'sm')}휴가 등록</button></div>
      ${chips ? `<div class="leave-chips">${chips}</div>` : `<p class="leave-empty">등록된 휴가 없음 · 팀 캘린더에 "${esc(D.me.name)} 연차"로 넣어도 자동 반영</p>`}
    </section>`;
  }

  /** 일정 화면에서 휴가 지우기: 화면에서 먼저 빼고, 서버에서 [휴가]·캘린더를 지운다 (실패하면 되돌린다) */
  /** 방금 등록한 일정의 진짜 ID를 받아 오도록 그 달을 조용히 다시 불러온다 (그래야 눌러서 고칠 수 있다) */
  function calReloadSoon(day) {
    upcoming = null;
    setTimeout(() => { const m = parseD(day); if (calCache[day.slice(0, 7)]) calCache[day.slice(0, 7)].stale = true; loadMonth(true, new Date(m.getFullYear(), m.getMonth(), 1)); }, 300);
  }
  /** 캘린더의 인사현황 일정("입사] 홍길동") → 인사현황 항목 (일정 ID로, 없으면 제목·날짜로) */
  function hrOfEvent(ev) {
    if (!D.hr || !/^\s*\[?\s*[가-힣*\s]+\]/.test(String(ev.title).replace(/^[^\s)]+\)\s*/, ''))) return null;
    const all = D.hr.thisWeek.concat(D.hr.nextWeek, D.hr.later || []);
    const raw = String(ev.title).replace(/^[^\s)]+\)\s*/, '').trim();
    return all.find(x => (x.ev && x.ev === ev.id) || (x.rec && x.rec === ev.id))
      || all.find(x => raw === `${x.category}] ${x.target}` && x.start === evDay(ev)) || null;
  }
  function findCalEv(id) {
    return Object.values(calCache).concat(upcoming ? [upcoming] : []).map(c => (c && c.events || []).find(e => e.id === id)).find(Boolean);
  }
  const evWhere = ev => ev.kind === 'mine' ? 'mine' : ev.kind === 'recruit' ? 'recruit' : 'team';
  const evEndDay = ev => { const e = evDay({ start: ev.end }); return ev.allDay ? dkey(addD(parseD(e), -1)) : e; };
  /** 고친 뒤: 캘린더를 다시 불러온다 */
  function calChanged() {
    Object.values(calCache).forEach(c => { if (c) c.stale = true; });
    calForget(); upcoming = null;
    if (page === 'calendar') loadMonth(true); else render();
  }
  function openEvEdit(id) {
    const ev = findCalEv(id);
    if (!canEditEv(ev)) return;
    if (ev.kind === 'leave') return openLeaveEdit(ev);
    const hrx = hrOfEvent(ev);
    if (hrx) return openHrForm(hrx.id);
    if (/^\s*\[?\s*[가-힣*\s]+\]/.test(String(ev.title).replace(/^[^\s)]+\)\s*/, ''))) { // 지난 인사현황 일정
      toast('인사현황을 찾는 중…');
      return call('apiHrHistory', evDay(ev).slice(0, 7)).then(r => {
        hrHist = r; hrHistYm = r.ym;
        const raw = String(ev.title).trim();
        const x = r.items.find(y => (y.ev && y.ev === ev.id) || (y.rec && y.rec === ev.id)) || r.items.find(y => raw === `${y.category}] ${y.target}` && y.start === evDay(ev));
        if (!x) return toast('인사현황에서 이 일정을 찾지 못했습니다. (캘린더에만 있는 일정)');
        if (!hrCanEdit(x)) return toast('본인이 등록한 인사현황만 고칠 수 있습니다.');
        openHrForm(x.id);
      }).catch(fail);
    }
    const where = evWhere(ev);
    const s = parseD(ev.start), e = parseD(ev.end);
    openModal(`<h3>일정 수정</h3>
      <p class="sub">${where === 'mine' ? '내 캘린더 (나만 보기)' : where === 'recruit' ? '채용 캘린더' : '팀 캘린더'}${where === 'team' && D.recruitCalendar ? ' · 채용 캘린더에 같이 넣은 일정도 함께 바뀝니다' : ''}</p>
      <form class="form" id="xForm" novalidate>
        <div class="fld"><label for="xTitle">제목</label><input class="field-in" id="xTitle" value="${esc(String(ev.title).replace(/^[^\s)]+\)\s*/, ''))}"></div>
        <div class="two">
          <div class="fld"><label for="xDate">날짜</label><input class="field-in" type="text" data-date inputmode="numeric" maxlength="10" autocomplete="off" id="xDate" value="${esc(evDay(ev))}"></div>
          <div class="fld"><label>&nbsp;</label><label style="display:flex;gap:6px;align-items:center;font-weight:400"><input type="checkbox" class="check" id="xAll" ${ev.allDay ? 'checked' : ''}> 종일</label></div>
        </div>
        <div class="two" id="xTimes" ${ev.allDay ? 'hidden' : ''}>
          <div class="fld"><label for="xStart">시작</label><input class="field-in" type="time" id="xStart" value="${ev.allDay ? '10:00' : hm(s)}"></div>
          <div class="fld"><label for="xEnd">종료</label><input class="field-in" type="time" id="xEnd" value="${ev.allDay ? '11:00' : hm(e)}"></div>
        </div>
        <div class="fld"><label for="xLoc">장소</label><input class="field-in" id="xLoc" value="${esc(ev.location || '')}"></div>
        <div class="fld"><label for="xDesc">메모</label><textarea class="field-in" id="xDesc">${esc(String(ev.desc || '').split('\n').filter(l => l.indexOf('등록: ') !== 0).join('\n'))}</textarea></div>
        <div class="msg err" id="xErr" hidden></div>
        <div class="modal-actions"><button type="button" class="btn danger" id="xDel" style="margin-right:auto">${ic('x', 'sm')}삭제</button><button type="button" class="btn" onclick="closeModal()">취소</button><button type="submit" class="btn primary">저장</button></div>
      </form>`);
    $('#xAll').onchange = x => { $('#xTimes').hidden = x.target.checked; };
    $('#xDel').onclick = () => {
      openModal(`<h3>이 일정을 지울까요?</h3><p class="sub">${esc(ev.title)} · 구글 캘린더에서도 지워집니다.</p>
        <div class="modal-actions"><button class="btn" onclick="closeModal()">취소</button><button class="btn danger" id="xDelOk">지우기</button></div>`);
      $('#xDelOk').onclick = () => {
        const before = JSON.stringify(calCache);
        Object.values(calCache).forEach(c => { if (c && c.events) c.events = c.events.filter(x => x.id !== ev.id); });
        upcoming = null; closeModal(); render();
        call('apiDeleteEvent', ev.id, where).then(() => { calChanged(); toast('일정을 지웠습니다.'); })
          .catch(err => { calCache = JSON.parse(before); render(); fail(err); });
      };
    };
    $('#xForm').onsubmit = x => {
      x.preventDefault();
      const v = { id: ev.id, where, title: $('#xTitle').value.trim(), date: $('#xDate').value.trim(), allDay: $('#xAll').checked,
        startTime: $('#xStart').value, endTime: $('#xEnd').value, location: $('#xLoc').value.trim(), desc: $('#xDesc').value.trim() };
      if (!v.title || !DATE_RE.test(v.date)) { $('#xErr').textContent = '제목과 날짜를 확인해 주세요.'; $('#xErr').hidden = false; return; }
      closeModal(); toast('저장하는 중…');
      call('apiUpdateEvent', v).then(r => { calChanged(); toast(r && r.warning ? r.warning : '일정을 고쳤습니다.'); }).catch(fail);
    };
  }
  /** 휴가 고치기: 종류·기간·메모 (여러 명이 함께 적힌 일정은 지우기만) */
  function openLeaveEdit(ev) {
    const people = leavePeople(ev);
    const many = people.length > 1;
    const boss = !!D.me.isAdmin; // 다른 사람 휴가는 관리자만
    const meShort = D.me.name ? shortName(D.me.name) : '';
    const t = (String(ev.title).match(/^(\S+)\] /) || [])[1] || '';
    const type = LEAVE_TYPES.indexOf(t) >= 0 ? t : '기타';
    const paren = type === '기타' ? (String(ev.title).match(/\(([^)]*)\)$/) || [])[1] : '';
    const memo = paren || String(ev.desc || '').split('\n').filter(l => l && l.indexOf('등록: ') !== 0)[0] || '';
    const start = evDay(ev), end = evEndDay(ev);
    openModal(`<h3>휴가 수정</h3>
      <p class="sub">팀 캘린더와 주간보고 휴무계획이 같이 바뀝니다.</p>
      <form class="form" id="yForm" novalidate>
        ${many ? `<div class="fld"><label>바꿀 사람 <span class="key-sub">${boss ? '일부만 고르면 그 사람만 따로 바뀌고, 나머지는 그대로 남습니다' : '본인 것만 바꿀 수 있습니다'}</span></label>
          <div class="who-pick" id="yWho">${people.map(n => { const on = boss || n === meShort || n === D.me.name;
            return `<label class="chip-check"><input type="checkbox" class="check" value="${esc(n)}" ${boss ? 'checked' : on ? 'checked disabled' : 'disabled'}> ${esc(n)}</label>`; }).join('')}</div></div>` : ''}
        <div class="fld"><label for="yType">종류</label><select class="field-in" id="yType">${LEAVE_TYPES.map(x => `<option ${x === type ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
        <div class="two">
          <div class="fld"><label for="yStart">시작일</label><input class="field-in" type="text" data-date inputmode="numeric" maxlength="10" autocomplete="off" id="yStart" value="${esc(start)}"></div>
