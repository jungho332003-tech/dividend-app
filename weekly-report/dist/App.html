          <div class="fld"><label for="yEnd">종료일 (하루면 비워두기)</label><input class="field-in" type="text" data-date inputmode="numeric" maxlength="10" autocomplete="off" id="yEnd" value="${end > start ? esc(end) : ''}"></div>
        </div>
        <div class="fld"><label for="yMemo">${type === '기타' ? '사유 (캘린더에 함께 표시)' : '메모 (선택)'}</label><input class="field-in" id="yMemo" value="${esc(memo)}"></div>
        <div class="msg err" id="yErr" hidden></div>
        <div class="modal-actions"><span class="sub" style="margin-right:auto">지우기는 목록 오른쪽 ✕</span><button type="button" class="btn" onclick="closeModal()">취소</button><button type="submit" class="btn primary">저장</button></div>
      </form>`);
    $('#yType').onchange = x => { $('label[for="yMemo"]').textContent = x.target.value === '기타' ? '사유 (캘린더에 함께 표시)' : '메모 (선택)'; };
    $('#yForm').onsubmit = x => {
      x.preventDefault();
      const lv = { type: $('#yType').value, start: $('#yStart').value.trim(), end: $('#yEnd').value.trim(), memo: $('#yMemo').value.trim() };
      const err = m => { $('#yErr').textContent = m; $('#yErr').hidden = false; };
      if (many) {
        lv.who = [...document.querySelectorAll('#yWho input:checked')].map(c => c.value);
        if (!lv.who.length) return err('바꿀 사람을 골라 주세요.');
      }
      if (!DATE_RE.test(lv.start)) return err('시작일을 확인해 주세요.');
      if (lv.end && (!DATE_RE.test(lv.end) || lv.end < lv.start)) return err('종료일을 확인해 주세요.');
      closeModal(); toast('저장하는 중…');
      call('apiUpdateLeaveEvent', ev.id, lv).then(data => { applyData(data); calChanged(); toast('휴가를 고쳤습니다.'); }).catch(fail);
    };
  }
  /** 휴가 일정에 적힌 사람들 ("연차] 지애, 소영 (사유)" → ['지애', '소영']) */
  function leavePeople(ev) {
    return String(ev.title).replace(/^\S+\]\s*/, '').replace(/ \([^)]*\)$/, '').split(/\s*,\s*/).filter(Boolean);
  }
  function deleteLeaveEvent(eventId) {
    const ev = Object.values(calCache).concat(upcoming ? [upcoming] : []).map(c => (c && c.events || []).find(e => e.id === eventId)).find(Boolean);
    if (!ev) return;
    openModal(`<h3>휴가를 지울까요?</h3><p class="sub">${esc(ev.title)} · 캘린더 일정과 주간보고 휴무계획에서 함께 빠집니다.</p>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">취소</button><button class="btn primary" id="lvDel">지우기</button></div>`);
    $('#lvDel').onclick = () => {
      const calBefore = JSON.stringify(calCache);
      Object.values(calCache).forEach(c => { if (c && c.events) c.events = c.events.filter(e => e.id !== eventId); });
      calForget(); upcoming = null;
      closeModal(); render();
      call('apiDeleteLeaveEvent', eventId)
        .then(data => { applyData(data); if (page !== 'calendar') render(); toast('휴가를 지웠습니다.'); })
        .catch(e => { calCache = JSON.parse(calBefore); render(); fail(e); });
    };
  }

  /** "10/2(금) 연차" · "9/30(수)~10/7(수) 정기휴가(메모)" — 서버 leaveText_ 와 같은 모양 */
  /** 캘린더 휴가 제목: "연차] 정호", 기타는 사유까지 "기타] 정호 (UFO 대체)" */
  function leaveCalTitle(type, name, memo) {
    const r = type === '기타' ? String(memo || '').split('\n')[0].replace(/[()]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 30) : '';
    return `${type}] ${shortName(name)}${r ? ` (${r})` : ''}`;
  }
  function leaveTextOf(l) {
    return `${periodText(l.start, l.end)} ${l.type}${l.memo ? `(${l.memo})` : ''}`;
  }

  /** 휴가 등록 = 일정 추가 창의 [휴가] 탭 */
  function openLeaveForm(dateKey) { openEventForm(dateKey, 'leave'); }

  function deleteLeave(id) {
    const m = mineMember();
    const l = m && (m.leaves || []).concat(m.preLeaves || []).find(x => x.id === id);
    openModal(`<h3>휴가를 지울까요?</h3><p class="sub">${l ? esc(l.text) + ' · ' : ''}팀 캘린더의 일정도 함께 지워집니다.</p>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">취소</button><button class="btn primary" id="lDel">지우기</button></div>`);
    $('#lDel').onclick = () => {
      if (String(id).indexOf('tmp-') === 0) { closeModal(); toast('방금 등록한 휴가를 저장하는 중입니다. 잠시 후 지워 주세요.'); return; }
      // 서버를 기다리지 않고 화면에서 먼저 지운다 (실패하면 되돌린다)
      const before = { leaves: m.leaves, preLeaves: m.preLeaves };
      const cal = JSON.stringify(calCache);
      m.leaves = (m.leaves || []).filter(x => x.id !== id);
      m.preLeaves = (m.preLeaves || []).filter(x => x.id !== id);
      if (l) {
        const title = `${l.type}] ${shortName(D.me.name)}`;
        Object.values(calCache).forEach(c => { if (c && c.events) c.events = c.events.filter(e => !(e.kind === 'leave' && (e.title === title || e.title.indexOf(title + ' (') === 0) && String(e.start).slice(0, 10) === l.start)); });
      }
      calForget(); upcoming = null;
      closeModal(); render();
      call('apiDeleteLeave', id)
        .then(data => { applyData(data); if (page !== 'calendar') render(); toast('지웠습니다.'); })
        .catch(e => { m.leaves = before.leaves; m.preLeaves = before.preLeaves; calCache = JSON.parse(cal); render(); fail(e); });
    };
  }

  function openComment(cell) {
    const name = cell.dataset.name;
    const m = D.members.find(x => x.name === name);
    cell.innerHTML = `<textarea aria-label="${esc(name)} 팀장 코멘트">${esc(m.comment)}</textarea>
      <div class="cm-actions"><button class="btn small" data-x="cancel">취소</button><button class="btn small primary" data-x="save">저장</button></div>`;
    const ta = cell.querySelector('textarea');
    ta.focus();
    cell.querySelector('[data-x="cancel"]').onclick = ev => { ev.stopPropagation(); cell.textContent = m.comment; };
    cell.querySelector('[data-x="save"]').onclick = ev => {
      ev.stopPropagation();
      const before = m.comment;
      m.comment = ta.value.trim();
      render();
      toast(`${name}님 코멘트를 저장했습니다.`);
      call('apiSaveComment', name, m.comment)
        .then(data => applyData(data))
        .catch(err => { m.comment = before; render(); toast(`코멘트를 저장하지 못했습니다. (${err.message || err})`); });
    };
  }

  /* ================= 모달 ================= */
  function openModal(html) {
    $('#modal').classList.remove('wide');
    $('#modal').innerHTML = `<button type="button" class="icon-btn modal-x" onclick="closeModal()" aria-label="닫기">${ic('x')}</button>` + html;
    $('#scrim').hidden = false;
    const first = $('#modal').querySelector('select, input, textarea, .modal-actions button, form button');
    if (first) first.focus();
  }
  function closeModal() {
    const big = $('#memoBig'); if (big && big.onblur) big.onblur(); // 크게 보기 메모: 닫을 때 저장
    $('#modal').classList.remove('wide');
    $('#scrim').hidden = true; setTimeout(liveRender, 300);
  }
  $('#scrim').addEventListener('click', e => { if (e.target.id === 'scrim') closeModal(); });

  /** "1100 / 52500 교육훈련비" (비어 있는 부분은 뺀다) */
  const bLabel = (cost, code, name) => { const acc = [code, name].filter(Boolean).join(' '); return cost ? `${cost} / ${acc}` : acc; };
  const findAcc = (cost, name) => D.budget.accounts.find(x => (x.cost || '') === cost && x.name === name);
  function budgetCosts() { return D.budget.accounts.map(a => a.cost || '').filter((c, i, all) => all.indexOf(c) === i); }

  function openBudgetForm() {
    const costOpts = budgetCosts().map(c => `<option value="${esc(c)}">${esc(c ? costText((D.budget.costs || []).find(x => x.code === c) || { code: c }) : '(코스트 없음)')}</option>`).join('');
    const reqField = D.me.name
      ? `<div class="fld"><label>신청자</label><input class="field-in" value="${esc(D.me.name)}" disabled></div>`
      : `<div class="fld"><label for="bReq">신청자</label><select class="field-in" id="bReq"><option value="">선택</option>${D.members.map(m => `<option>${esc(m.name)}</option>`).join('')}</select></div>`;
    const pick = budgetMonth && budgetMonth !== 'all' ? budgetMonth : ymNow();
    const months = budgetMonths();
    const monField = `<div class="fld"><label for="bMonth">적용월</label><select class="field-in" id="bMonth">${months.map(m => `<option value="${m.value}" ${m.value === pick ? 'selected' : ''}>${esc(m.label)}${m.current ? ' (이번 달)' : ''}</option>`).join('')}</select></div>`;
    const side = (key, title, cls) => `

          </div>
          ${key === 'From' ? '<div class="hint" id="bHint"></div>' : ''}
        </fieldset>`;
    openModal(`
      <h3>예산전용 신청</h3>
      <form class="form" id="bForm" novalidate>
        <div class="two">${reqField}${monField}</div>
        ${side('From', '변경전', 'from')}
        ${side('To', '변경후', 'to')}
        <div class="fld"><label for="bAmt">금액 (원)</label><input class="field-in" id="bAmt" inputmode="numeric" placeholder="예) 500,000"></div>
        <div class="fld"><label for="bReason">사유</label><textarea class="field-in" id="bReason" placeholder="전용이 필요한 사유"></textarea></div>
        <div class="msg err" id="bErr" hidden></div>
        <div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">취소</button><button type="submit" class="btn primary" id="bSubmit">신청</button></div>
      </form>`);
    const hint = () => {
      const a = findAcc($('#bFromCost').value, $('#bFrom').value);
      $('#bHint').textContent = a ? `${a.code ? `계정코드 ${a.code} · ` : ''}현재예산 ${won(a.current)}원` : '';
    };
    // 고른 코스트의 계정과목만 보여준다
    const fill = key => {
      const cost = $(`#b${key}Cost`).value;
      $(`#b${key}`).innerHTML = '<option value="">선택</option>' + D.budget.accounts.filter(a => (a.cost || '') === cost)
        .map(a => `<option value="${esc(a.name)}">${esc([a.code, a.name].filter(Boolean).join(' '))}</option>`).join('');
      if (key === 'From') hint();
    };
    fill('From'); fill('To');
    $('#bFromCost').onchange = () => fill('From');
    $('#bToCost').onchange = () => fill('To');
    $('#bFrom').onchange = hint;
    $('#bAmt').oninput = e => { const n = e.target.value.replace(/[^0-9]/g, ''); e.target.value = n ? Number(n).toLocaleString('ko-KR') : ''; };
    $('#bForm').onsubmit = e => {
      e.preventDefault();
      const form = {
        requester: D.me.name || ($('#bReq') && $('#bReq').value) || '',
        month: $('#bMonth').value,
        fromCost: $('#bFromCost').value, from: $('#bFrom').value,
        toCost: $('#bToCost').value, to: $('#bTo').value,
        amount: $('#bAmt').value.replace(/,/g, ''), reason: $('#bReason').value.trim(),
      };
      const err = $('#bErr');
      const a = findAcc(form.fromCost, form.from);
      let msg = '';
      if (!form.requester || !form.from || !form.to || !form.amount || !form.reason) msg = '모든 항목을 입력해 주세요.';
      else if (form.fromCost === form.toCost && form.from === form.to) msg = '변경전과 변경후가 같습니다.';
      else if (a && Number(form.amount) > a.current) msg = `현재예산을 초과합니다. (${bLabel(form.fromCost, a.code, form.from)} 현재예산 ${won(a.current)}원)`;
      if (msg) { err.textContent = msg; err.hidden = false; return; }
      // 서버를 기다리지 않고 신청 내역·현재예산에 바로 반영한다 (실패하면 되돌린다)
      const undo = budgetLocal(form);
      closeModal(); page = 'budget'; budgetTab = 'list'; budgetFilter = 'all'; budgetMonth = form.month; render();
      call('apiSubmitBudget', form)
        .then(data => { applyData(data); render(); toast(`${monthName(form.month)}분 신청 완료`); })
        .catch(e2 => { undo(); render(); fail(e2); });
    };
  }

  function cancelBudget(row, id) {
    const r = D.budget.requests.find(x => x.row === row);
    if (!r || r.pending) return toast('신청을 저장하는 중입니다. 잠시 후 다시 눌러 주세요.');
    openModal(`<h3>이 신청을 취소할까요?</h3>
      <p class="sub">${esc(r.req)} · ${esc(bLabel(r.fromCost, r.fromCode, r.from))} → ${esc(bLabel(r.toCost, r.toCode, r.to))} · <b>${won(r.amount)}원</b><br>취소하면 예산에서 빠지고, 시트에는 취소 표시로 남습니다.</p>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">닫기</button><button class="btn primary" id="cxOk">신청 취소</button></div>`);
    $('#cxOk').onclick = () => {
      const undo = budgetLocal(r, true);
      closeModal(); render();
      call('apiCancelBudget', row, id).then(data => { applyData(data); render(); toast('신청을 취소했습니다.'); }).catch(e => { undo(); render(); fail(e); });
    };
  }

  /**
   * 예산전용 신청(cancel=false)·취소(cancel=true)를 화면에 먼저 반영한다: 신청 내역 + 변경전/변경후 현재예산.
   * 되돌리는 함수를 돌려준다.
   */
  function budgetLocal(f, cancel) {
    const before = JSON.stringify(D.budget);
    const amt = Number(f.amount) || 0, sign = cancel ? -1 : 1;
    const acc = (cost, name) => D.budget.accounts.find(a => a.cost === cost && a.name === name);
    const from = acc(f.fromCost, f.from), to = acc(f.toCost, f.to);
    if (from) { from.outAmt += sign * amt; from.current -= sign * amt; }
    if (to) { to.inAmt += sign * amt; to.current += sign * amt; }
    if (cancel) D.budget.requests = D.budget.requests.filter(x => x !== f);
    else {
      const n = new Date();
      D.budget.requests.unshift({ row: -1, id: '접수 중', pending: true, req: f.requester, month: f.month,
        date: `${dkey(n)} ${pad2(n.getHours())}:${pad2(n.getMinutes())}`,
        fromCost: f.fromCost, fromCode: from ? from.code : '', from: f.from, toCost: f.toCost, toCode: to ? to.code : '', to: f.to,
        amount: amt, reason: f.reason });
    }
    return () => { D.budget = JSON.parse(before); };
  }

  /* ================= 기타 동작 ================= */
  function go(p) { page = p; render(); window.scrollTo(0, 0); }
  /* ---------- 예산 설정 ---------- */
  // acctDraft = { costs: [{_id, code, name}], accts: [{_id, code, name}], rows: [{cost, acct: 계정 _id, budget}] }
  let acctDraft = null, acctSeq = 0;
  function canBudgetSetup() { return !!(D.me.isAdmin || D.me.budgetManager); }
  function acctDraftFrom(b) {
    const nid = () => 'a' + (++acctSeq);
    const costs = (b.costs || []).map(c => ({ _id: nid(), code: c.code, name: c.name }));
    const accts = (b.acctList || []).map(a => ({ _id: nid(), code: a.code, name: a.name }));
    const rows = (b.accounts || []).map(x => {
      if (x.cost && !costs.some(c => c.code === x.cost)) costs.push({ _id: nid(), code: x.cost, name: '' });
      let a = accts.find(y => y.code === x.code && y.name === x.name) || accts.find(y => y.name === x.name);
      if (!a) { a = { _id: nid(), code: x.code, name: x.name }; accts.push(a); }
      return { cost: x.cost, acct: a._id, budget: x.budget };
    });
    return { costs, accts, rows };
  }
  const costText = c => [c.code, c.name].filter(Boolean).join(' ');
  const acctText = a => [a.code, a.name].filter(Boolean).join(' ');
  function acctRowsHtml() {
    const d = acctDraft;
    const live = (r) => { const a = d.accts.find(x => x._id === r.acct); return a && D.budget.accounts.find(x => x.cost === r.cost && x.name === a.name); };
    return d.rows.map((r, i) => {
      const x = live(r);
      const costSel = `<select class="field-in acct-in" data-l="rows" data-i="${i}" data-f="cost" aria-label="코스트센터"><option value="">선택</option>${d.costs.filter(c => c.code).map(c => `<option value="${esc(c.code)}" ${c.code === r.cost ? 'selected' : ''}>${esc(costText(c))}</option>`).join('')}</select>`;
      const acctSel = `<select class="field-in acct-in" data-l="rows" data-i="${i}" data-f="acct" aria-label="계정과목"><option value="">선택</option>${d.accts.filter(a => a.name).map(a => `<option value="${a._id}" ${a._id === r.acct ? 'selected' : ''}>${esc(acctText(a))}</option>`).join('')}</select>`;
      return `<tr><td>${costSel}</td><td>${acctSel}</td>
        <td><input class="field-in acct-in" data-l="rows" data-i="${i}" data-f="budget" value="${r.budget ? won(r.budget) : ''}" placeholder="편성액" inputmode="numeric" style="text-align:right" aria-label="편성액"></td>
        <td class="num ph">${x ? won(x.inAmt) : '-'}</td><td class="num ph">${x ? won(x.outAmt) : '-'}</td><td class="num strong">${x ? won(x.current) : '-'}</td>
        <td class="c"><button class="icon-btn" onclick="acctDel('rows', ${i})" aria-label="편성 예산 지우기" title="지우기">${ic('x', 'sm')}</button></td></tr>`;
    }).join('') || '<tr><td colspan="7" class="empty">편성 예산이 없습니다. [편성 예산 추가]를 누르세요.</td></tr>';
  }
  function acctEdit(el) {
    if (!el.classList || !el.classList.contains('acct-in') || !acctDraft) return;
    const item = acctDraft[el.dataset.l][Number(el.dataset.i)];
    if (!item) return;
    if (el.dataset.f === 'budget') {
      const n = Number(el.value.replace(/[^\d]/g, '')) || 0;
      item.budget = n;
      el.value = n ? won(n) : '';
      const t = $('#acctSum'); if (t) t.textContent = won(acctDraft.rows.reduce((s2, r) => s2 + (Number(r.budget) || 0), 0));
      return;
    }
    // 코스트 코드를 바꾸면 그 코스트를 쓰던 편성 예산도 같이 바꾼다
    if (el.dataset.l === 'costs' && el.dataset.f === 'code') acctDraft.rows.forEach(r => { if (r.cost === item.code) r.cost = el.value.trim(); });
    item[el.dataset.f] = el.dataset.l === 'rows' ? el.value : el.value;
  }
  document.addEventListener('input', e => { if (e.target.tagName === 'INPUT') acctEdit(e.target); });
  document.addEventListener('change', e => {
    const el = e.target;
    if (!el.classList || !el.classList.contains('acct-in')) return;
    if (el.tagName === 'SELECT') acctEdit(el);
    // 목록을 고치면 편성 예산의 선택지를 다시 그린다 (입력 중인 칸은 그대로)
    if (el.dataset.l !== 'rows') { const tb = $('#acctRows'); if (tb) tb.innerHTML = acctRowsHtml(); }
  });
  function acctAdd(l) {
    const d = acctDraft;
    if (l === 'rows') {
      const last = d.rows[d.rows.length - 1];
      d.rows.push({ cost: last ? last.cost : '', acct: '', budget: 0 }); // 코스트는 윗줄과 같게 시작
    } else d[l].push({ _id: 'a' + (++acctSeq), code: '', name: '' });
    render();
    const ins = document.querySelectorAll(`.acct-in[data-l="${l}"][data-i="${d[l].length - 1}"]`);
    if (ins[l === 'rows' ? 1 : 0]) ins[l === 'rows' ? 1 : 0].focus();
  }
  function acctDel(l, i) {
    const d = acctDraft, item = d[l][i];
    if (l === 'costs' && item.code && d.rows.some(r => r.cost === item.code)) return toast(`편성 예산에서 ${item.code} 코스트를 먼저 지우거나 바꿔 주세요.`);
    if (l === 'accts' && d.rows.some(r => r.acct === item._id)) return toast(`편성 예산에서 ${acctText(item)}을(를) 먼저 지우거나 바꿔 주세요.`);
    d[l].splice(i, 1);
    render();
  }
  function acctReset() { acctDraft = null; render(); }
  function acctSave(force) {
    const d = acctDraft;
    const payload = {
      costs: d.costs.map(c => ({ code: c.code, name: c.name })),
      accts: d.accts.map(a => ({ code: a.code, name: a.name })),
      rows: d.rows.map(r => { const a = d.accts.find(x => x._id === r.acct) || {}; return { cost: r.cost, code: a.code || '', name: a.name || '', budget: r.budget }; }),
    };
    const btn = $('#acctSave'); if (btn) btn.disabled = true;
    call('apiSaveAccounts', payload, !!force).then(res => {
      if (res && res.needConfirm) {
        if (btn) btn.disabled = false;
        openModal(`<h3>신청 내역이 있는 예산이 빠집니다</h3>
          <p class="sub">아래 코스트·계정과목에 신청 내역이 있습니다. 빼거나 이름을 바꾸면 그 신청은 예산 계산에 잡히지 않습니다.</p>
          <ul style="margin:8px 0 0;padding-left:18px">${res.lost.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
          <div class="modal-actions"><button class="btn" onclick="closeModal()">취소</button><button class="btn primary" onclick="closeModal();acctSave(true)">그래도 저장</button></div>`);
        return;
      }
      applyData(res); acctDraft = null; render(); toast('예산 설정을 저장했습니다.');
    }).catch(e => { if (btn) btn.disabled = false; fail(e); });
  }

  function setTab(p, tab, nav) {
    if (p === 'weekly') weeklyTab = tab;
    if (p === 'budget') { budgetTab = tab; if (tab === 'setup') acctDraft = null; }
    if (nav) go(p); else render();
  }
  function setFilter(f) { budgetFilter = f; render(); }
  function remind() {
    call('apiRemind').then(names => toast(names.length ? `${names.join(', ')}님께 작성 요청 메일을 보냈습니다.` : '미작성자가 없습니다.')).catch(fail);
  }

  $('#nav').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) go(b.dataset.page);
  });

  // 예시 화면 전용: 보는 사람 전환
  function renderDemoBar() {
    const bar = $('#demoBar');
    if (!window.MockApi || !MockApi.users) return;
    bar.hidden = false;
    bar.innerHTML = `<b>예시 화면</b><span>모든 이름·금액은 예시 데이터입니다.</span>
      <label>보는 사람 <select id="demoUser">${MockApi.users().map(u => `<option value="${esc(u.email)}" ${u.email === D.me.email ? 'selected' : ''}>${esc(u.name)} (${esc(u.role)})</option>`).join('')}</select></label>`;
    $('#demoUser').onchange = e => { MockApi.setUser(e.target.value); draft = draftMine = draftPre = null; upcoming = null; calCache = {}; A = null; load(); };
  }

  load();
</script>
