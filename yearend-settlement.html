<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연말정산 검토 관리</title>
<style>
:root{--bg:#f4f5f7;--sur:#fff;--sur2:#f8f9fa;--bdr:#e2e5e9;--bdr2:#cdd1d7;--pri:#1a56db;--prl:#ebf0fd;--prd:#1341b0;--txt:#1c2331;--tx2:#5a6478;--tx3:#9099aa;--red:#d63031;--rdl:#fff0f0;--grn:#00a651;--grl:#e8f7ee;--org:#e67e22;--orl:#fdf3e7;--pur:#7048e8;--pul:#f1edfd;--nav:220px;--r:8px;--rl:12px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif;font-size:14px;color:var(--txt);background:var(--bg);}
button,input,select,textarea{font-family:inherit;font-size:13px;}
.app{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:var(--nav);flex-shrink:0;background:#111827;display:flex;flex-direction:column;}
.sl{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;}
.li{width:32px;height:32px;border-radius:8px;background:var(--pri);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;}
.lt{color:#fff;font-size:14px;font-weight:600;}
.ls{color:rgba(255,255,255,.35);font-size:10px;margin-top:1px;}
.sy{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.06);}
.sy label{display:block;color:rgba(255,255,255,.35);font-size:10px;margin-bottom:4px;}
.sy input{width:100%;padding:6px 10px;border-radius:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;}
.sn{padding:10px 8px;flex:1;overflow-y:auto;}
.ni{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:7px;cursor:pointer;color:rgba(255,255,255,.55);font-size:13px;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;}
.ni:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.9);}
.ni.active{background:var(--pri);color:#fff;}
.nicon{font-size:16px;width:20px;text-align:center;}
.nbadge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:1px 6px;}
.nbadge:empty{display:none;}
.sf{padding:10px 14px;border-top:1px solid rgba(255,255,255,.06);display:flex;gap:6px;}
.sf button{flex:1;padding:6px;border-radius:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.7);font-size:11px;cursor:pointer;}
.main{flex:1;overflow-y:auto;}
.top{background:var(--sur);border-bottom:1px solid var(--bdr);padding:14px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;}
.top h1{font-size:17px;font-weight:700;}
.top .sub{color:var(--tx3);font-size:12px;}
.top .act{margin-left:auto;display:flex;gap:8px;}
.page{display:none;padding:20px 24px 40px;max-width:1200px;}
.page.active{display:block;}
.card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rl);padding:16px 18px;margin-bottom:16px;}
.ct{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.ct .more{margin-left:auto;font-size:12px;font-weight:400;color:var(--pri);cursor:pointer;}
.grid{display:grid;gap:12px;}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
.g2{grid-template-columns:1fr 1fr;}
.grid>*{min-width:0;}
.stat{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rl);padding:14px 16px;cursor:pointer;}
.stat .l{font-size:12px;color:var(--tx2);}
.stat .v{font-size:24px;font-weight:700;margin-top:4px;}
.btn{padding:7px 14px;border-radius:var(--r);border:1px solid var(--bdr2);background:var(--sur);color:var(--txt);cursor:pointer;font-weight:600;white-space:nowrap;}
.btn:hover{background:var(--sur2);}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;}
.btn.pri:hover{background:var(--prd);}
.btn.red{color:var(--red);border-color:#f2c4c4;}
.btn.sm{padding:4px 10px;font-size:12px;}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap;}
.t-urgent{background:var(--rdl);color:var(--red);}
.t-important{background:var(--orl);color:var(--org);}
.t-normal{background:var(--sur2);color:var(--tx2);border:1px solid var(--bdr);}
.t-cat{background:var(--prl);color:var(--pri);}
.t-open{background:var(--rdl);color:var(--red);}
.t-doing{background:var(--orl);color:var(--org);}
.t-done{background:var(--grl);color:var(--grn);}
.t-share{background:var(--pul);color:var(--pur);}
.banner{border-radius:var(--rl);padding:12px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;border:1px solid;}
.banner.urgent{background:var(--rdl);border-color:#f5c2c2;}
.banner.important{background:var(--orl);border-color:#f5d9b8;}
.banner.pinned{background:var(--prl);border-color:#c9d6f8;}
.banner .bi{font-size:18px;}
.banner .bt{font-weight:700;}
.banner .bb{color:var(--tx2);font-size:12px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
.toolbar input,.toolbar select{padding:7px 10px;border:1px solid var(--bdr2);border-radius:var(--r);background:var(--sur);}
.toolbar input[type=search]{min-width:220px;flex:1;max-width:320px;}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{padding:5px 12px;border-radius:16px;border:1px solid var(--bdr2);background:var(--sur);cursor:pointer;font-size:12px;}
.chip.on{background:var(--txt);border-color:var(--txt);color:#fff;}
.list .item{padding:12px 4px;border-bottom:1px solid var(--bdr);cursor:pointer;display:flex;gap:10px;align-items:flex-start;}
.list .item:last-child{border-bottom:none;}
.list .item:hover{background:var(--sur2);}
.item .dot{width:8px;height:8px;border-radius:50%;background:var(--pri);margin-top:6px;flex-shrink:0;}
.item .dot.read{background:transparent;}
.item .body{flex:1;min-width:0;}
.item .title{font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.item .meta{color:var(--tx3);font-size:12px;margin-top:4px;}
.item .prev{color:var(--tx2);font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.empty{text-align:center;color:var(--tx3);padding:30px 0;font-size:13px;}
table{width:100%;border-collapse:collapse;}
th,td{padding:9px 10px;border-bottom:1px solid var(--bdr);text-align:left;font-size:13px;}
th{background:var(--sur2);color:var(--tx2);font-weight:600;font-size:12px;white-space:nowrap;}
tbody tr{cursor:pointer;}
tbody tr:hover{background:var(--sur2);}
.tw{overflow-x:auto;}
.prog{height:6px;background:var(--bdr);border-radius:3px;overflow:hidden;min-width:60px;}
.prog i{display:block;height:100%;background:var(--pri);}
.modal-bg{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal-bg.open{display:flex;}
.modal{background:var(--sur);border-radius:var(--rl);width:100%;max-width:680px;max-height:90vh;display:flex;flex-direction:column;}
.mh{padding:14px 18px;border-bottom:1px solid var(--bdr);font-weight:700;display:flex;align-items:center;}
.mh .x{margin-left:auto;background:none;border:none;font-size:20px;cursor:pointer;color:var(--tx3);}
.mb{padding:16px 18px;overflow-y:auto;}
.mf{padding:12px 18px;border-top:1px solid var(--bdr);display:flex;gap:8px;justify-content:flex-end;}
.mf .l{margin-right:auto;}
.fg{margin-bottom:12px;}
.fg label{display:block;font-size:12px;color:var(--tx2);font-weight:600;margin-bottom:5px;}
.fg input[type=text],.fg input[type=date],.fg select,.fg textarea{width:100%;padding:8px 10px;border:1px solid var(--bdr2);border-radius:var(--r);background:var(--sur);}
.fg textarea{min-height:120px;resize:vertical;line-height:1.5;}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ck{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;}
.sec{font-size:12px;font-weight:700;color:var(--pri);margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--bdr);}
.sec:first-child{margin-top:0;}
.fr3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.bools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.bools .ck{border:1px solid var(--bdr);border-radius:6px;padding:7px 9px;}
.mini{display:inline-flex;gap:3px;}
.mini span{font-size:10px;padding:1px 5px;border-radius:4px;background:var(--sur2);color:var(--tx3);border:1px solid var(--bdr);}
.mini span.on{background:var(--grl);color:var(--grn);border-color:#bfe6cd;}
.detail{white-space:pre-wrap;line-height:1.6;font-size:13px;}
.dmeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center;color:var(--tx3);font-size:12px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:200;}
.toast.show{opacity:1;}
.hint{color:var(--tx3);font-size:12px;}
@media (max-width:820px){
  .app{flex-direction:column;}
  .sidebar{width:100%;order:2;flex-direction:row;}
  .sl,.sy,.sf{display:none;}
  .sn{display:flex;padding:4px;overflow-x:auto;}
  .ni{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;align-items:center;min-width:64px;position:relative;}
  .nbadge{position:absolute;top:2px;right:6px;margin:0;}
  .main{order:1;}
  .top{padding:12px 16px;}
  .top .sub{display:none;}
  .page{padding:16px;}
  .g4{grid-template-columns:1fr 1fr;}
  .g2,.fr,.fr3{grid-template-columns:1fr;}
  .bools{grid-template-columns:1fr 1fr;}
  .toolbar input[type=search]{max-width:none;min-width:0;width:100%;}
  .hide-m{display:none;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sl"><div class="li">연</div><div><div class="lt">연말정산 검토 관리</div><div class="ls">담당자용 업무 보드</div></div></div>
    <div class="sy"><label>귀속연도</label><input id="yearInput" type="text" inputmode="numeric"></div>
    <div class="sy"><label>내 이름 (작성자 표시)</label><input id="meInput" type="text" placeholder="담당자 이름"></div>
    <nav class="sn">
      <button class="ni" data-page="dash"><span class="nicon">🏠</span>대시보드</button>
      <button class="ni" data-page="notice"><span class="nicon">📢</span>공지사항<span class="nbadge" id="bNotice"></span></button>
      <button class="ni" data-page="issue"><span class="nicon">📌</span>특이사항<span class="nbadge" id="bIssue"></span></button>
      <button class="ni" data-page="people"><span class="nicon">🗂️</span>서류 검토</button>
    </nav>
    <div class="sf"><button onclick="exportJSON()">백업</button><button onclick="document.getElementById('fileIn').click()">복원</button></div>
  </aside>

  <main class="main">
    <div class="top"><h1 id="pageTitle">대시보드</h1><span class="sub" id="pageSub"></span><div class="act" id="topAct"></div></div>

    <!-- 대시보드 -->
    <section class="page" id="p-dash">
      <div id="dashBanners"></div>
      <div class="grid g4" style="margin-bottom:16px" id="dashStats"></div>
      <div class="grid g2">
        <div class="card"><div class="ct">📢 최근 공지<span class="more" onclick="go('notice')">전체 보기 ›</span></div><div class="list" id="dashNotices"></div></div>
        <div class="card"><div class="ct">📌 담당자 공유 특이사항<span class="more" onclick="go('issue')">전체 보기 ›</span></div><div class="list" id="dashIssues"></div></div>
      </div>
    </section>

    <!-- 공지사항 -->
    <section class="page" id="p-notice">
      <div class="toolbar">
        <input type="search" id="nQ" placeholder="제목·내용 검색">
        <div class="chips" id="nCats"></div>
        <label class="ck" style="margin-left:auto"><input type="checkbox" id="nExpired"> 지난 공지 포함</label>
      </div>
      <div class="card"><div class="list" id="noticeList"></div></div>
    </section>

    <!-- 특이사항 -->
    <section class="page" id="p-issue">
      <div class="toolbar">
        <input type="search" id="iQ" placeholder="대상자·제목·내용 검색">
        <select id="iType"></select>
        <div class="chips" id="iStatus"></div>
        <label class="ck"><input type="checkbox" id="iShared"> 공유된 건만</label>
      </div>
      <div class="card"><div class="list" id="issueList"></div></div>
      <div class="card"><div class="ct">🗂️ 직원별 특이사항·수정사항 <span class="hint" style="font-weight:400">(서류 검토 시트의 특이사항 열)</span></div><div class="list" id="sheetNotes"></div></div>
    </section>

    <!-- 서류 검토 -->
    <section class="page" id="p-people">
      <div class="toolbar">
        <input type="search" id="pQ" placeholder="사번·이름·부서 검색">
        <select id="pOwner"></select>
        <label class="ck"><input type="checkbox" id="pMine"> 내 담당만</label>
        <label class="ck"><input type="checkbox" id="pLeave"> 휴직자 제외</label>
      </div>
      <div class="chips" id="pStatus" style="margin-bottom:12px"></div>
      <div class="card tw" style="padding:0"><table>
        <thead><tr><th class="hide-m">No.</th><th class="hide-m">부서</th><th>사원번호</th><th>성명</th><th class="hide-m">담당 / 2차</th><th>상태</th><th class="hide-m">진행</th><th class="hide-m">주택자금 등</th><th>미비서류 / 특이사항</th></tr></thead>
        <tbody id="peopleBody"></tbody>
      </table></div>
      <p class="hint">구글 시트에서 제목 행까지 함께 복사해 「시트 붙여넣기」에 넣으면 열 이름을 맞춰 한 번에 가져옵니다. 「시트용 내보내기」는 같은 열 순서의 CSV로 내려받습니다.</p>
    </section>
  </main>
</div>

<div class="modal-bg" id="modalBg"><div class="modal">
  <div class="mh"><span id="mTitle"></span><button class="x" onclick="closeModal()">×</button></div>
  <div class="mb" id="mBody"></div>
  <div class="mf" id="mFoot"></div>
</div></div>
<input type="file" id="fileIn" accept=".json" style="display:none">
<div class="toast" id="toast"></div>

<script>
// ───────── 기준 데이터 ─────────
const NOTICE_CATS = ['일정','세법개정','제출서류','응대지침','시스템','기타'];
const LEVELS = {urgent:'긴급', important:'중요', normal:'일반'};
const ISSUE_TYPES = ['서류 누락·보완','부양가족 중복공제','의료비','교육비','기부금','주택자금·월세','신용카드 등','중도입사·퇴사','외국인 근로자','문의 응대','기타'];
const ISSUE_STATUS = {open:'미처리', doing:'처리중', done:'완료'};
// 기존 구글 시트 열 순서 그대로 (가져오기/내보내기 기준)
// t: text(기본) | bool(O/X) | long(여러 줄) · re: 열 이름이 해마다 바뀌는 경우 매칭용
const COLS = [
  {k:'no', l:'No.', g:'기본 정보'}, {k:'dept', l:'부서', g:'기본 정보'}, {k:'empNo', l:'사원번호', g:'기본 정보'}, {k:'name', l:'성명', g:'기본 정보'},
  {k:'subgroup', l:'사원하위그룹명', g:'기본 정보'}, {k:'payArea', l:'급여영역', g:'기본 정보'}, {k:'rank', l:'직급', g:'기본 정보'},
  {k:'phone', l:'전화번호', g:'기본 정보'}, {k:'email', l:'이메일주소', g:'기본 정보'}, {k:'leave', l:'휴직여부', t:'bool', g:'기본 정보'},
  {k:'owner', l:'담당자', g:'담당'}, {k:'owner2', l:'2차검토 담당자', g:'담당'},
  {k:'review2', l:'2차 서류검토 여부', t:'bool', g:'진행'}, {k:'ehr', l:'E-HR 등록', t:'bool', g:'진행'},
  {k:'arrived', l:'서류 도착여부', t:'bool', g:'진행'}, {k:'manual', l:'수기서류 제출', t:'bool', g:'진행'},
  {k:'verified', l:'서류확인 및 검증', t:'bool', g:'진행'},
  {k:'prevWork', l:'종전근무지', g:'종전근무지'}, {k:'prevCount', l:'종전근무지 개수', g:'종전근무지'},
  {k:'rentLoanApply', l:'주택임차차입금(신청여부)', t:'bool', g:'주택자금 · 월세'}, {k:'rentLoan', l:'주택임차차입금', g:'주택자금 · 월세'},
  {k:'mortApply', l:'장기주택저당차입금(신청여부)', t:'bool', g:'주택자금 · 월세'}, {k:'mort', l:'장기주택저당차입금', g:'주택자금 · 월세'},
  {k:'mortNts', l:'장기주택 국세청자료 여부', t:'bool', g:'주택자금 · 월세'},
  {k:'mortPrev', l:'전년도 장기주택 공제여부(차입일)', re:/^\d{2,4}년도?장기주택공제여부/, g:'주택자금 · 월세'},
  {k:'savingApply', l:'주택마련저축(신청여부)', t:'bool', g:'주택자금 · 월세'}, {k:'saving', l:'주택마련저축', g:'주택자금 · 월세'},
  {k:'savingNts', l:'주택마련저축 국세청자료 여부', t:'bool', g:'주택자금 · 월세'},
  {k:'rentApply', l:'월세액(신청여부)', t:'bool', g:'주택자금 · 월세'}, {k:'rent', l:'월세액', g:'주택자금 · 월세'},
  {k:'note1', l:'특이사항', t:'long', g:'특이·수정사항'}, {k:'fix1', l:'수정사항', t:'long', g:'특이·수정사항'},
  {k:'note2', l:'특이사항(2차)', t:'long', g:'특이·수정사항'}, {k:'fix2', l:'수정사항(2차)', t:'long', g:'특이·수정사항'},
  {k:'missing', l:'미비서류', t:'long', g:'특이·수정사항'}
];
const NOTE_COLS = ['note1','fix1','note2','fix2'];
const blankPerson = () => Object.fromEntries(COLS.map(c=>[c.k, c.t==='bool'?false:'']));
// 시트의 O, Y, ○, 완료 같은 표기를 체크로 인식
const toBool = v => /^(o|y|yes|true|1|○|●|◯|v|✓|✔|완료|등록|제출|도착|신청|있음|해당|유|휴직)$/i.test(String(v).trim());
// 상태는 시트 체크 항목으로 자동 판정
const PERSON_STATUS = {none:'서류 미도착', review:'1차 검토중', supp:'미비서류', wait2:'2차 검토 대기', done:'검토완료'};
const pStatus = p => p.missing.trim() ? 'supp' : !(p.arrived||p.manual||p.ehr) ? 'none' : !p.verified ? 'review' : !p.review2 ? 'wait2' : 'done';
const KEY = 'ye1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const today = () => new Date().toISOString().slice(0,10);
const nowStr = () => new Date().toLocaleString('sv-SE').slice(0,16);

let S = load();
function seed(){
  const y = new Date().getFullYear();
  return {
    year: String(y), me: '',
    notices: [
      {id:uid(), title:'[예시] 연말정산 업무 일정 안내', cat:'일정', level:'important', pinned:true, start:'', end:'', author:'관리자',
       body:'※ 회사 일정에 맞게 수정해서 사용하세요.\n\n· 1월 중순: 국세청 간소화 자료 조회 개시 → 직원 안내\n· 1월 말: 공제신고서·증빙 제출 마감\n· 2월 초: 서류 검토 및 보완 요청\n· 2월 급여: 연말정산 결과 반영 (환급/추가납부)\n· 3월 10일: 근로소득 지급명세서 제출 기한', created:nowStr(), updated:nowStr()},
      {id:uid(), title:'[예시] 부양가족 중복공제 확인 철저', cat:'응대지침', level:'urgent', pinned:false, start:'', end:'', author:'관리자',
       body:'맞벌이 부부·형제가 같은 부모님을 중복으로 공제받는 사례가 많습니다.\n검토 시 가족관계 증빙과 다른 가족의 공제 여부를 꼭 확인하고, 의심되면 특이사항으로 등록해 주세요.', created:nowStr(), updated:nowStr()},
      {id:uid(), title:'[예시] 응대 시 개인정보 취급 주의', cat:'응대지침', level:'normal', pinned:false, start:'', end:'', author:'관리자',
       body:'· 증빙 서류는 지정된 경로로만 받습니다 (메신저·개인메일 금지)\n· 전화 응대 시 본인 확인 후 안내\n· 검토가 끝난 출력물은 즉시 파쇄', created:nowStr(), updated:nowStr()}
    ],
    reads: {}, issues: [], people: []
  };
}
function load(){ try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && d.notices){ d.people = d.people.map(p=>({...blankPerson(), ...p})); return d; } }catch(e){} return seed(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('저장 실패: 브라우저 저장공간을 확인하세요'); } renderAll(); }

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }
const me = () => S.me || '담당자';

// ───────── 상태 / 필터 ─────────
const F = {nCat:'전체', iStatus:'active', pStatus:'all'};
const isActiveNotice = n => { const t=today(); return (!n.start || n.start<=t) && (!n.end || n.end>=t); };
const lvRank = {urgent:0, important:1, normal:2};
const sortNotices = a => a.slice().sort((x,y)=> (y.pinned-x.pinned) || (lvRank[x.level]-lvRank[y.level]) || y.created.localeCompare(x.created));
const personName = id => { const p=S.people.find(p=>p.id===id); return p ? `${p.name}(${p.empNo})` : ''; };

// ───────── 네비게이션 ─────────
const PAGES = {
  dash:{t:'대시보드', act:''},
  notice:{t:'공지사항', act:'<button class="btn pri" onclick="editNotice()">+ 공지 등록</button>'},
  issue:{t:'특이사항', act:'<button class="btn pri" onclick="editIssue()">+ 특이사항 등록</button>'},
  people:{t:'서류 검토', act:'<button class="btn" onclick="bulkPeople()">시트 붙여넣기</button><button class="btn hide-m" onclick="exportCSV()">시트용 내보내기</button><button class="btn pri" onclick="editPerson()">+ 대상자</button>'}
};
let cur = 'dash';
function go(p){
  cur = p;
  document.querySelectorAll('.ni').forEach(b=>b.classList.toggle('active', b.dataset.page===p));
  document.querySelectorAll('.page').forEach(s=>s.classList.toggle('active', s.id==='p-'+p));
  $('pageTitle').textContent = PAGES[p].t;
  $('topAct').innerHTML = PAGES[p].act;
  try{ localStorage.setItem(KEY+'_page', p); }catch(e){}
}
document.querySelectorAll('.ni').forEach(b=>b.onclick=()=>go(b.dataset.page));

// ───────── 렌더 ─────────
function renderAll(){
  $('pageSub').textContent = `${S.year}년 귀속 연말정산`;
  const unread = S.notices.filter(n=>isActiveNotice(n) && !S.reads[n.id]).length;
  $('bNotice').textContent = unread || '';
  $('bIssue').textContent = S.issues.filter(i=>i.status!=='done').length || '';
  renderDash(); renderNotices(); renderIssues(); renderPeople();
}

function noticeItem(n){
  const read = S.reads[n.id];
  return `<div class="item" onclick="viewNotice('${n.id}')"><span class="dot ${read?'read':''}"></span><div class="body">
    <div class="title">${n.pinned?'📌 ':''}${n.level!=='normal'?`<span class="tag t-${n.level}">${LEVELS[n.level]}</span>`:''}<span class="tag t-cat">${esc(n.cat)}</span>${esc(n.title)}</div>
    <div class="prev">${esc(n.body.split('\n').find(l=>l.trim())||'')}</div>
    <div class="meta">${esc(n.author)} · ${n.updated.slice(0,10)}${n.end?` · ~${n.end}까지`:''}${!isActiveNotice(n)?' · <b>게시기간 아님</b>':''}</div></div></div>`;
}
function issueItem(i){
  return `<div class="item" onclick="viewIssue('${i.id}')"><div class="body">
    <div class="title"><span class="tag t-${i.status}">${ISSUE_STATUS[i.status]}</span>${i.shared?'<span class="tag t-share">공유</span>':''}<span class="tag t-normal">${esc(i.type)}</span>${esc(i.title)}</div>
    <div class="prev">${esc(i.body.split('\n').find(l=>l.trim())||'')}</div>
    <div class="meta">${i.personId?esc(personName(i.personId))+' · ':''}${esc(i.owner)} · ${i.updated.slice(0,10)}${i.due&&i.status!=='done'?` · 후속조치 ${i.due}${i.due<today()?' <b style="color:var(--red)">(기한 경과)</b>':''}`:''}</div></div></div>`;
}

function renderDash(){
  const act = sortNotices(S.notices.filter(isActiveNotice));
  const top = act.filter(n=>n.pinned || n.level==='urgent');
  $('dashBanners').innerHTML = top.map(n=>{
    const cls = n.level==='urgent'?'urgent':n.level==='important'?'important':'pinned';
    const ico = n.level==='urgent'?'🚨':n.level==='important'?'⚠️':'📌';
    return `<div class="banner ${cls}" onclick="viewNotice('${n.id}')"><span class="bi">${ico}</span><div><div class="bt">${esc(n.title)}</div><div class="bb">${esc(n.body)}</div></div></div>`;
  }).join('');
  const c = k => S.people.filter(p=>pStatus(p)===k).length;
  const overdue = S.issues.filter(i=>i.status!=='done' && i.due && i.due<today()).length;
  const mine = S.me ? S.people.filter(p=>(p.owner===S.me||p.owner2===S.me) && pStatus(p)!=='done').length : null;
  $('dashStats').innerHTML = [
    ['검토 대상', S.people.length, 'var(--txt)', "F.pStatus='all';go('people');renderPeople()"],
    ...(mine!==null?[['내 담당 미완료', mine, 'var(--pri)', "F.pStatus='all';$('pMine').checked=true;go('people');renderPeople()"]]:[]),
    ['미비서류', c('supp'), 'var(--org)', "F.pStatus='supp';go('people');renderPeople()"],
    ['2차 검토 대기', c('wait2'), 'var(--pur)', "F.pStatus='wait2';go('people');renderPeople()"],
    ['검토완료', c('done'), 'var(--grn)', "F.pStatus='done';go('people');renderPeople()"],
    ['미처리 특이사항', S.issues.filter(i=>i.status!=='done').length + (overdue?` <span style="font-size:12px;color:var(--red)">기한경과 ${overdue}</span>`:''), 'var(--red)', "go('issue')"]
  ].map(([l,v,col,on])=>`<div class="stat" onclick="${on}"><div class="l">${l}</div><div class="v" style="color:${col}">${v}</div></div>`).join('');
  $('dashNotices').innerHTML = act.slice(0,5).map(noticeItem).join('') || '<div class="empty">게시 중인 공지가 없습니다</div>';
  const sh = S.issues.filter(i=>i.shared).sort((a,b)=>b.updated.localeCompare(a.updated)).slice(0,5);
  $('dashIssues').innerHTML = sh.map(issueItem).join('') || '<div class="empty">공유된 특이사항이 없습니다<br><span class="hint">특이사항 등록 시 「담당자 전체 공유」를 체크하면 여기에 표시됩니다</span></div>';
}

function renderNotices(){
  $('nCats').innerHTML = ['전체',...NOTICE_CATS].map(c=>`<span class="chip ${F.nCat===c?'on':''}" onclick="F.nCat='${c}';renderNotices()">${c}</span>`).join('');
  const q = $('nQ').value.trim().toLowerCase();
  const list = sortNotices(S.notices).filter(n =>
    ($('nExpired').checked || isActiveNotice(n)) &&
    (F.nCat==='전체' || n.cat===F.nCat) &&
    (!q || (n.title+n.body).toLowerCase().includes(q)));
  $('noticeList').innerHTML = list.map(noticeItem).join('') || '<div class="empty">공지가 없습니다</div>';
}

function renderIssues(){
  if(!$('iType').options.length) $('iType').innerHTML = '<option value="">전체 유형</option>' + ISSUE_TYPES.map(t=>`<option>${t}</option>`).join('');
  $('iStatus').innerHTML = [['active','진행중'],['open','미처리'],['doing','처리중'],['done','완료'],['all','전체']]
    .map(([k,l])=>`<span class="chip ${F.iStatus===k?'on':''}" onclick="F.iStatus='${k}';renderIssues()">${l}</span>`).join('');
  const q = $('iQ').value.trim().toLowerCase(), t = $('iType').value;
  const list = S.issues.filter(i =>
    (F.iStatus==='all' || (F.iStatus==='active' ? i.status!=='done' : i.status===F.iStatus)) &&
    (!t || i.type===t) && (!$('iShared').checked || i.shared) &&
    (!q || (i.title+i.body+personName(i.personId)).toLowerCase().includes(q))
  ).sort((a,b)=> (a.status==='done')-(b.status==='done') || (a.due||'9999').localeCompare(b.due||'9999') || b.updated.localeCompare(a.updated));
  $('issueList').innerHTML = list.map(issueItem).join('') || '<div class="empty">특이사항이 없습니다</div>';
  const sn = S.people.filter(p => NOTE_COLS.some(k=>p[k].trim()) && (!q || (p.name+p.empNo+NOTE_COLS.map(k=>p[k]).join(' ')).toLowerCase().includes(q)));
  $('sheetNotes').innerHTML = sn.map(p=>`<div class="item" onclick="editPerson('${p.id}')"><div class="body">
    <div class="title">${esc(p.name)} <span class="hint" style="font-weight:400">${esc(p.empNo)} · ${esc(p.dept)}</span><span class="tag t-normal">${PERSON_STATUS[pStatus(p)]}</span></div>
    ${NOTE_COLS.filter(k=>p[k].trim()).map(k=>`<div class="prev"><b>${COLS.find(c=>c.k===k).l}</b> ${esc(p[k])}</div>`).join('')}
    <div class="meta">담당 ${esc(p.owner)||'-'}${p.owner2?' / 2차 '+esc(p.owner2):''}</div></div></div>`).join('') || '<div class="empty">시트 특이사항이 입력된 직원이 없습니다</div>';
}

function peopleFiltered(){
  const q = $('pQ').value.trim().toLowerCase(), o = $('pOwner').value;
  return S.people.filter(p =>
    (!o || p.owner===o || p.owner2===o) &&
    (!$('pMine').checked || (S.me && (p.owner===S.me || p.owner2===S.me))) &&
    (!$('pLeave').checked || !p.leave) &&
    (!q || [p.empNo,p.name,p.dept,p.phone,p.email].join(' ').toLowerCase().includes(q)));
}
function renderPeople(){
  const owners = [...new Set(S.people.flatMap(p=>[p.owner,p.owner2]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));
  const ov = $('pOwner').value;
  $('pOwner').innerHTML = '<option value="">전체 담당자</option>' + owners.map(o=>`<option ${o===ov?'selected':''}>${esc(o)}</option>`).join('');
  const base = peopleFiltered();
  $('pStatus').innerHTML = [['all','전체'],...Object.entries(PERSON_STATUS)]
    .map(([k,l])=>`<span class="chip ${F.pStatus===k?'on':''}" onclick="F.pStatus='${k}';renderPeople()">${l} ${k==='all'?base.length:base.filter(p=>pStatus(p)===k).length}</span>`).join('');
  const list = base.filter(p => F.pStatus==='all' || pStatus(p)===F.pStatus)
    .sort((a,b)=> String(a.no).localeCompare(String(b.no),'ko',{numeric:true}) || a.empNo.localeCompare(b.empNo,'ko',{numeric:true}));
  const stTag = {none:'t-normal', review:'t-cat', supp:'t-doing', wait2:'t-share', done:'t-done'};
  const mini = (p, items) => `<span class="mini">${items.map(([k,l])=>`<span class="${p[k]?'on':''}" title="${COLS.find(c=>c.k===k).l}">${l}</span>`).join('')}</span>`;
  $('peopleBody').innerHTML = list.map(p=>{
    const iss = S.issues.filter(i=>i.personId===p.id && i.status!=='done').length;
    const hasNote = NOTE_COLS.some(k=>p[k].trim());
    const st = pStatus(p);
    return `<tr onclick="editPerson('${p.id}')"><td class="hide-m hint">${esc(p.no)}</td><td class="hide-m">${esc(p.dept)}</td><td>${esc(p.empNo)}</td>
      <td><b>${esc(p.name)}</b>${p.leave?' <span class="tag t-normal">휴직</span>':''}</td>
      <td class="hide-m">${esc(p.owner)||'-'}<span class="hint"> / ${esc(p.owner2)||'-'}</span></td>
      <td><span class="tag ${stTag[st]}">${PERSON_STATUS[st]}</span></td>
      <td class="hide-m">${mini(p,[['ehr','E-HR'],['arrived','도착'],['manual','수기'],['verified','검증'],['review2','2차']])}</td>
      <td class="hide-m">${mini(p,[['rentLoanApply','임차'],['mortApply','장기'],['savingApply','저축'],['rentApply','월세']])}${p.prevWork||p.prevCount?' <span class="tag t-normal">종전</span>':''}</td>
      <td style="max-width:260px">${p.missing.trim()?`<div style="color:var(--org);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">⚠ ${esc(p.missing)}</div>`:''}
        ${hasNote?'<span class="tag t-cat">특이사항</span> ':''}${iss?`<span class="tag t-open">응대 ${iss}건</span>`:''}</td></tr>`;
  }).join('') || `<tr><td colspan="9"><div class="empty">등록된 대상자가 없습니다<br><span class="hint">상단 「시트 붙여넣기」로 구글 시트 내용을 가져오세요</span></div></td></tr>`;
}

['nQ','nExpired'].forEach(id=>$(id).addEventListener('input',renderNotices));
['iQ','iType','iShared'].forEach(id=>$(id).addEventListener('input',renderIssues));
['pQ','pOwner','pMine','pLeave'].forEach(id=>$(id).addEventListener('input',renderPeople));

// ───────── 모달 ─────────
function openModal(title, body, foot){ $('mTitle').textContent=title; $('mBody').innerHTML=body; $('mFoot').innerHTML=foot; $('modalBg').classList.add('open'); }
function closeModal(){ $('modalBg').classList.remove('open'); }
$('modalBg').addEventListener('mousedown', e=>{ if(e.target.id==='modalBg') closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
const opts = (arr, sel) => arr.map(([v,l])=>`<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(l)}</option>`).join('');

// 공지
function viewNotice(id){
  const n = S.notices.find(x=>x.id===id); if(!n) return;
  if(!S.reads[id]){ S.reads[id]=true; save(); }
  openModal(n.title,
    `<div class="dmeta">${n.pinned?'<span class="tag t-cat">📌 상단고정</span>':''}<span class="tag t-${n.level}">${LEVELS[n.level]}</span><span class="tag t-cat">${esc(n.cat)}</span>
     ${esc(n.author)} · 등록 ${n.created} ${n.updated!==n.created?`· 수정 ${n.updated}`:''}${n.start||n.end?` · 게시 ${n.start||'∞'} ~ ${n.end||'∞'}`:''}</div>
     <div class="detail">${esc(n.body)}</div>`,
    `<button class="btn red l" onclick="delNotice('${id}')">삭제</button><button class="btn" onclick="S.reads['${id}']=false;save();closeModal()">안읽음 표시</button><button class="btn" onclick="copyText('${id}')">복사</button><button class="btn pri" onclick="editNotice('${id}')">수정</button>`);
}
function editNotice(id, preset){
  const n = S.notices.find(x=>x.id===id) || Object.assign({title:'',body:'',cat:'응대지침',level:'normal',pinned:false,start:'',end:''}, preset);
  openModal(id?'공지 수정':'공지 등록',
    `<div class="fg"><label>제목</label><input type="text" id="fTitle" value="${esc(n.title)}"></div>
     <div class="fr"><div class="fg"><label>분류</label><select id="fCat">${opts(NOTICE_CATS.map(c=>[c,c]),n.cat)}</select></div>
       <div class="fg"><label>중요도</label><select id="fLevel">${opts(Object.entries(LEVELS),n.level)}</select></div></div>
     <div class="fr"><div class="fg"><label>게시 시작일 (비우면 즉시)</label><input type="date" id="fStart" value="${n.start}"></div>
       <div class="fg"><label>게시 종료일 (비우면 계속)</label><input type="date" id="fEnd" value="${n.end}"></div></div>
     <div class="fg"><label class="ck"><input type="checkbox" id="fPin" ${n.pinned?'checked':''}> 대시보드 상단에 고정</label></div>
     <div class="fg"><label>내용</label><textarea id="fBody" style="min-height:200px">${esc(n.body)}</textarea></div>
     <p class="hint">긴급·상단고정 공지는 대시보드 맨 위 배너로 표시됩니다.</p>`,
    `<button class="btn" onclick="closeModal()">취소</button><button class="btn pri" onclick="saveNotice('${id||''}')">저장</button>`);
  $('fTitle').focus();
}
function saveNotice(id){
  const title = $('fTitle').value.trim(); if(!title) return toast('제목을 입력하세요');
  if($('fStart').value && $('fEnd').value && $('fStart').value > $('fEnd').value) return toast('게시 종료일이 시작일보다 빠릅니다');
  const d = {title, body:$('fBody').value, cat:$('fCat').value, level:$('fLevel').value, pinned:$('fPin').checked, start:$('fStart').value, end:$('fEnd').value, updated:nowStr()};
  if(id){ Object.assign(S.notices.find(x=>x.id===id), d); S.reads[id]=true; }
  else { const nid=uid(); S.notices.push({id:nid, author:me(), created:d.updated, ...d}); S.reads[nid]=true; }
  save(); closeModal(); toast('공지를 저장했습니다');
}
function delNotice(id){ if(!confirm('이 공지를 삭제할까요?')) return; S.notices=S.notices.filter(x=>x.id!==id); delete S.reads[id]; save(); closeModal(); }
function copyText(id){
  const n=S.notices.find(x=>x.id===id);
  navigator.clipboard?.writeText(`[${n.cat}] ${n.title}\n\n${n.body}`).then(()=>toast('메신저·메일에 붙여넣을 수 있게 복사했습니다'), ()=>toast('복사 실패'));
}

// 특이사항
function viewIssue(id){
  const i = S.issues.find(x=>x.id===id); if(!i) return;
  const hist = (i.log||[]).slice().reverse().map(l=>`<div class="item" style="cursor:default"><div class="body"><div class="meta" style="margin:0">${l.at} · ${esc(l.by)}</div><div class="detail">${esc(l.text)}</div></div></div>`).join('');
  openModal(i.title,
    `<div class="dmeta"><span class="tag t-${i.status}">${ISSUE_STATUS[i.status]}</span>${i.shared?'<span class="tag t-share">담당자 공유</span>':''}<span class="tag t-normal">${esc(i.type)}</span>
      ${i.personId?`대상자 <b style="color:var(--txt)">${esc(personName(i.personId))}</b> ·`:''} 담당 ${esc(i.owner)} · ${i.created}${i.due?` · 후속조치 ${i.due}`:''}</div>
     <div class="detail">${esc(i.body)||'<span class="hint">내용 없음</span>'}</div>
     <div class="card" style="margin:14px 0 0;padding:12px 14px"><div class="ct" style="margin-bottom:6px">응대·처리 이력</div>
       <div class="list">${hist||'<div class="hint">아직 이력이 없습니다</div>'}</div>
       <div style="display:flex;gap:6px;margin-top:8px"><input type="text" id="logIn" placeholder="예) 2/3 전화 안내, 의료비 영수증 재제출 요청" style="flex:1;padding:7px 10px;border:1px solid var(--bdr2);border-radius:var(--r)" onkeydown="if(event.key==='Enter')addLog('${id}')"><button class="btn sm" onclick="addLog('${id}')">추가</button></div></div>`,
    `<button class="btn red l" onclick="delIssue('${id}')">삭제</button>
     <button class="btn" onclick="issueToNotice('${id}')">공지로 등록</button>
     ${i.status!=='done'?`<button class="btn" onclick="setIssue('${id}','done')">완료 처리</button>`:`<button class="btn" onclick="setIssue('${id}','open')">다시 열기</button>`}
     <button class="btn pri" onclick="editIssue('${id}')">수정</button>`);
}
function editIssue(id, personId){
  const i = S.issues.find(x=>x.id===id) || {type:ISSUE_TYPES[0], title:'', body:'', status:'open', owner:me(), due:'', shared:false, personId:personId||''};
  const ppl = [['','(대상자 없음 · 일반 사항)'], ...S.people.slice().sort((a,b)=>a.name.localeCompare(b.name,'ko')).map(p=>[p.id,`${p.name} (${p.empNo}${p.dept?' · '+p.dept:''})`])];
  openModal(id?'특이사항 수정':'특이사항 등록',
    `<div class="fr"><div class="fg"><label>대상자</label><select id="fPerson">${opts(ppl,i.personId)}</select></div>
       <div class="fg"><label>유형</label><select id="fType">${opts(ISSUE_TYPES.map(t=>[t,t]),i.type)}</select></div></div>
     <div class="fg"><label>제목</label><input type="text" id="fTitle" value="${esc(i.title)}" placeholder="예) 부친 인적공제 형제와 중복 의심"></div>
     <div class="fg"><label>내용 (확인 사항, 직원 요청, 안내한 내용 등)</label><textarea id="fBody">${esc(i.body)}</textarea></div>
     <div class="fr"><div class="fg"><label>상태</label><select id="fStatus">${opts(Object.entries(ISSUE_STATUS),i.status)}</select></div>
       <div class="fg"><label>후속조치 기한</label><input type="date" id="fDue" value="${i.due}"></div></div>
     <div class="fr"><div class="fg"><label>담당자</label><input type="text" id="fOwner" value="${esc(i.owner)}"></div>
       <div class="fg" style="display:flex;align-items:flex-end"><label class="ck" style="margin-bottom:9px"><input type="checkbox" id="fShared" ${i.shared?'checked':''}> 담당자 전체 공유 (대시보드 표시)</label></div></div>`,
    `<button class="btn" onclick="closeModal()">취소</button><button class="btn pri" onclick="saveIssue('${id||''}')">저장</button>`);
  $('fTitle').focus();
}
function saveIssue(id){
  const title = $('fTitle').value.trim(); if(!title) return toast('제목을 입력하세요');
  const d = {personId:$('fPerson').value, type:$('fType').value, title, body:$('fBody').value, status:$('fStatus').value, due:$('fDue').value, owner:$('fOwner').value.trim()||me(), shared:$('fShared').checked, updated:nowStr()};
  if(id) Object.assign(S.issues.find(x=>x.id===id), d);
  else S.issues.push({id:uid(), created:d.updated, log:[], ...d});
  save(); closeModal(); toast('특이사항을 저장했습니다');
}
function setIssue(id, st){ const i=S.issues.find(x=>x.id===id); i.status=st; i.updated=nowStr(); (i.log=i.log||[]).push({at:i.updated, by:me(), text:`상태 변경 → ${ISSUE_STATUS[st]}`}); save(); viewIssue(id); }
function addLog(id){ const v=$('logIn').value.trim(); if(!v) return; const i=S.issues.find(x=>x.id===id); i.updated=nowStr(); (i.log=i.log||[]).push({at:i.updated, by:me(), text:v}); if(i.status==='open') i.status='doing'; save(); viewIssue(id); }
function delIssue(id){ if(!confirm('이 특이사항을 삭제할까요?')) return; S.issues=S.issues.filter(x=>x.id!==id); save(); closeModal(); }
function issueToNotice(id){
  const i=S.issues.find(x=>x.id===id);
  // 개인 정보가 공지에 섞이지 않도록 대상자 이름은 넣지 않음
  editNotice(null, {title:i.title, body:i.body, cat:'응대지침', level:'important'});
  toast('공지 내용에 개인정보가 없는지 확인 후 저장하세요');
}

// 대상자 / 서류 검토
function fieldHTML(c, v){
  const id = 'pf_'+c.k;
  if(c.t==='bool') return `<label class="ck"><input type="checkbox" id="${id}" ${v?'checked':''}> ${c.l}</label>`;
  if(c.t==='long') return `<div class="fg"><label>${c.l}</label><textarea id="${id}" style="min-height:70px">${esc(v)}</textarea></div>`;
  return `<div class="fg"><label>${c.l}</label><input type="text" id="${id}" value="${esc(v)}"></div>`;
}
function editPerson(id){
  const p = S.people.find(x=>x.id===id) || blankPerson();
  const iss = id ? S.issues.filter(i=>i.personId===id) : [];
  const groups = [...new Set(COLS.map(c=>c.g))];
  const body = groups.map(g=>{
    const cs = COLS.filter(c=>c.g===g), bools = cs.filter(c=>c.t==='bool'), rest = cs.filter(c=>c.t!=='bool');
    const long = rest.filter(c=>c.t==='long'), short = rest.filter(c=>c.t!=='long');
    return `<div class="sec">${g}</div>
      ${short.length?`<div class="fr3">${short.map(c=>fieldHTML(c,p[c.k])).join('')}</div>`:''}
      ${bools.length?`<div class="bools" style="margin-bottom:12px">${bools.map(c=>fieldHTML(c,p[c.k])).join('')}</div>`:''}
      ${long.map(c=>fieldHTML(c,p[c.k])).join('')}`;
  }).join('');
  openModal(id?`${p.name} (${p.empNo}) 서류 검토`:'대상자 등록',
    `${id?`<div class="dmeta">현재 상태 <span class="tag t-cat">${PERSON_STATUS[pStatus(p)]}</span>· 최종 수정 ${p.updated||'-'}</div>`:''}
     ${body}
     ${id?`<div class="sec">📌 응대 특이사항 <span class="more" style="float:right;cursor:pointer;font-weight:400" onclick="editIssue(null,'${id}')">+ 등록</span></div>
       <div class="list">${iss.map(issueItem).join('')||'<div class="hint">없음</div>'}</div>`:''}`,
    `${id?`<button class="btn red l" onclick="delPerson('${id}')">삭제</button>`:''}<button class="btn" onclick="closeModal()">취소</button><button class="btn pri" onclick="savePerson('${id||''}')">저장</button>`);
}
function savePerson(id){
  const d = {};
  COLS.forEach(c=>{ const el=$('pf_'+c.k); d[c.k] = c.t==='bool' ? el.checked : el.value.trim(); });
  if(!d.name) return toast('성명을 입력하세요');
  if(d.empNo && S.people.some(p=>p.empNo===d.empNo && p.id!==id)) return toast('같은 사원번호가 이미 있습니다');
  d.updated = nowStr();
  if(id) Object.assign(S.people.find(x=>x.id===id), d); else S.people.push({id:uid(), ...d});
  save(); closeModal(); toast('저장했습니다');
}
function delPerson(id){
  const n=S.issues.filter(i=>i.personId===id).length;
  if(!confirm(`대상자를 삭제할까요?${n?`\n연결된 특이사항 ${n}건은 '대상자 없음'으로 남습니다.`:''}`)) return;
  S.people=S.people.filter(x=>x.id!==id); S.issues.forEach(i=>{ if(i.personId===id) i.personId=''; }); save(); closeModal();
}

// 구글 시트 복사본(TSV) 파싱: 줄바꿈이 들어간 셀은 "..."로 감싸져 옴
function parseTSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=ch; }
    else if(ch==='"' && cell==='') q=true;
    else if(ch==='\t'){ row.push(cell); cell=''; }
    else if(ch==='\n' || ch==='\r'){ if(ch==='\r' && text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=ch;
  }
  if(cell!=='' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()));
}
const norm = s => String(s).replace(/\s/g,'').toLowerCase();
function matchCol(h){ const n=norm(h); return COLS.find(c => norm(c.l)===n || (c.re && c.re.test(n))); }
function bulkPeople(){
  openModal('구글 시트 붙여넣기',
    `<p class="hint" style="margin-bottom:8px">시트에서 <b>제목 행(No., 부서, 사원번호…)부터</b> 범위를 선택해 복사(Ctrl+C) 후 아래에 붙여넣으세요.<br>
     · 열 이름으로 자동 매칭합니다 (제목 행이 없으면 기존 시트 열 순서로 인식)<br>
     · 이미 있는 사원번호는 <b>시트 내용으로 갱신</b>, 없으면 새로 추가합니다<br>
     · O, Y, ○, 완료, 등록 같은 표기는 체크로 인식합니다</p>
     <div class="fg"><textarea id="fBulk" style="min-height:220px"></textarea></div><div id="bulkPrev" class="hint"></div>`,
    `<button class="btn" onclick="closeModal()">취소</button><button class="btn pri" onclick="saveBulk()">가져오기</button>`);
  $('fBulk').oninput = ()=>{ const r=readBulk(); $('bulkPrev').innerHTML = r.err ? `<span style="color:var(--red)">${r.err}</span>` :
    `인식된 열 ${r.map.filter(Boolean).length}개 / 데이터 ${r.rows.length}행${r.unknown.length?` · 무시되는 열: ${r.unknown.map(esc).join(', ')}`:''}`; };
}
function readBulk(){
  const rows = parseTSV($('fBulk').value);
  if(!rows.length) return {err:'붙여넣은 내용이 없습니다', rows:[], map:[], unknown:[]};
  const hdr = rows[0].map(matchCol), hasHdr = hdr.filter(Boolean).length >= 2;
  const map = hasHdr ? hdr : COLS.slice(0, rows[0].length);
  const unknown = hasHdr ? rows[0].filter((h,i)=>h.trim() && !hdr[i]) : [];
  if(!map.some(c=>c&&c.k==='name')) return {err:'「성명」 열을 찾지 못했습니다', rows:[], map, unknown};
  return {rows: hasHdr ? rows.slice(1) : rows, map, unknown};
}
function saveBulk(){
  const r = readBulk(); if(r.err) return toast(r.err);
  let add=0, upd=0;
  r.rows.forEach(row=>{
    const d={}; r.map.forEach((c,i)=>{ if(c) d[c.k] = c.t==='bool' ? toBool(row[i]??'') : (row[i]??'').trim(); });
    if(!d.name) return;
    d.updated = nowStr();
    const ex = d.empNo && S.people.find(p=>p.empNo===d.empNo);
    if(ex){ Object.assign(ex, d); upd++; } else { S.people.push({id:uid(), ...blankPerson(), ...d}); add++; }
  });
  save(); closeModal(); toast(`${add}명 추가 · ${upd}명 갱신`);
}

// ───────── 백업 / 내보내기 ─────────
function download(name, text, type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function exportJSON(){ download(`연말정산_${S.year}_백업_${today()}.json`, JSON.stringify(S,null,2), 'application/json'); }
function exportCSV(){
  const q = v => `"${String(v??'').replace(/"/g,'""')}"`;
  const rows = [[...COLS.map(c=>c.l), '상태(앱)', '응대 특이사항(앱)']];
  peopleFiltered().forEach(p=>rows.push([...COLS.map(c=>c.t==='bool' ? (p[c.k]?'O':'') : p[c.k]), PERSON_STATUS[pStatus(p)],
    S.issues.filter(i=>i.personId===p.id).map(i=>`[${ISSUE_STATUS[i.status]}] ${i.title}`).join(' / ')]));
  download(`연말정산_${S.year}_서류검토_${today()}.csv`, '﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n'), 'text/csv');
}
$('fileIn').onchange = e=>{
  const f=e.target.files[0]; if(!f) return;
  f.text().then(t=>{ const d=JSON.parse(t); if(!d.notices||!d.issues||!d.people) throw 0;
    if(!confirm('현재 데이터를 백업 파일 내용으로 바꿀까요?')) return; S=d; save(); toast('복원했습니다'); })
   .catch(()=>toast('올바른 백업 파일이 아닙니다')).finally(()=>e.target.value='');
};

// ───────── 초기화 ─────────
$('yearInput').value=S.year; $('meInput').value=S.me;
$('yearInput').onchange=e=>{ S.year=e.target.value.trim()||S.year; save(); };
$('meInput').onchange=e=>{ S.me=e.target.value.trim(); save(); };
renderAll();
let startPage='dash'; try{ startPage=localStorage.getItem(KEY+'_page')||'dash'; }catch(e){}
go(PAGES[startPage]?startPage:'dash');
</script>
