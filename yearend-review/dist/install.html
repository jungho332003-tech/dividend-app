o\">⚙\u003c/i>\u003cspan class=\"full\">권한 관리\u003c/span>\u003cspan class=\"short\">권한\u003c/span>\u003c/span>\u003cspan id=\"cAdmin\">\u003c/span>\u003c/button>\n    \u003c/nav>\n    \u003cdiv class=\"me\" id=\"meBox\">\u003c/div>\n  \u003c/aside>\n\n  \u003cmain class=\"main\" id=\"main\">\u003cdiv class=\"loading\">불러오는 중…\u003c/div>\u003c/main>\n\u003c/div>\n\n\u003cdiv class=\"scrim\" id=\"scrim\" hidden>\u003cdiv class=\"modal\" id=\"modal\" role=\"dialog\" aria-modal=\"true\">\u003c/div>\u003c/div>\n\u003cdiv class=\"toast\" id=\"toast\" hidden>\u003c/div>\n\n\u003c!-- MOCK -->\n\n\u003cscript>\n  /* ================= 서버 호출 ================= */\n  function call(fn, ...args) {\n    return new Promise((resolve, reject) => {\n      if (window.google && google.script && google.script.run) {\n        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);\n      } else if (window.MockApi) {\n        setTimeout(() => {\n          try { resolve(JSON.parse(JSON.stringify(window.MockApi[fn](...args)))); } catch (e) { reject(e); }\n        }, (MockApi.delay && MockApi.delay[fn]) || 120);\n      } else {\n        reject(new Error('서버에 연결할 수 없습니다.'));\n      }\n    });\n  }\n\n  /* ================= 상태 ================= */\n  let D = null;\n  let page = 'dash';\n  let reviewTab = 'mine';      // mine | all | logs\n  let reviewStatus = 'all';\n  let reviewOwner = '';\n  let reviewQuery = '';\n  let logQuery = '';\n  let noticeFilter = 'all';\n  let showOld = false;\n  let openNotice = null;\n  let ruleCat = 'all';\n  let ruleQuery = '';\n  let openRule = null;\n  let fileArea = 'all';\n  let fileQuery = '';\n\n  const $ = s => document.querySelector(s);\n  const esc = s => String(s == null ? '' : s).replace(/[&\u003c>\"']/g, c => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\n  const now = () => (window.MockApi && MockApi.now) ? MockApi.now() : new Date();\n  const pad2 = n => String(n).padStart(2, '0');\n  const todayKey = () => { const d = now(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };\n\n  function toast(text) {\n    const t = $('#toast');\n    t.textContent = text;\n    t.hidden = false;\n    clearTimeout(toast.t);\n    toast.t = setTimeout(() => { t.hidden = true; }, 3200);\n  }\n  function fail(e) { toast(e && e.message ? e.message : String(e)); }\n\n  /** 서버가 돌려준 조각(바뀐 부분만)을 화면 데이터에 합친다 */\n  function applyData(data) {\n    if (!data) return;\n    if (data.personPatch) {\n      const key = data.oldId || data.personPatch.id;\n      const i = D.people.findIndex(p => p.id === key);\n      if (i >= 0) D.people[i] = data.personPatch; else D.people.push(data.personPatch);\n    }\n    ['people', 'logs', 'notices', 'reads', 'rules', 'files', 'me'].forEach(k => { if (data[k]) D[k] = data[k]; });\n  }\n\n  function load() {\n    return call('apiBootstrap').then(data => { D = data; render(); }).catch(fail);\n  }\n\n  /* ================= 공통 계산 ================= */\n  const STATUS = {\n    none: ['서류 미도착', 'plain'],\n    review: ['1차 검토중', 'info'],\n    supp: ['미비서류', 'no'],\n    wait2: ['2차 검토 대기', 'pend'],\n    done: ['검토완료', 'ok'],\n  };\n  /** 상태는 시트 체크 항목으로 자동 판정 (시트에 상태 열을 따로 두지 않는다) */\n  function pStatus(p) {\n    if (String(p.missing || '').trim()) return 'supp';\n    if (!(p.arrived || p.manual || p.ehr)) return 'none';\n    if (!p.verified) return 'review';\n    if (!p.review2) return 'wait2';\n    return 'done';\n  }\n  const statusChip = p => { const [l, c] = STATUS[pStatus(p)]; return `\u003cspan class=\"chip ${c}\">${l}\u003c/span>`; };\n  const isMine = p => !!D.me.name && (p.owner === D.me.name || p.owner2 === D.me.name);\n  /** 내가 지금 손대야 하는 대상자: 1차 담당인데 아직 검증 전/미비서류, 또는 2차 담당인데 2차 대기 */\n  const myTodo = p => (p.owner === D.me.name && ['none', 'review', 'supp'].includes(pStatus(p))) || (p.owner2 === D.me.name && pStatus(p) === 'wait2');\n  const col = k => D.cols.find(c => c.k === k);\n  const hasNote = p => ['note1', 'fix1', 'note2', 'fix2'].some(k => String(p[k] || '').trim());\n  const isLead = () => D.me.isLeader || D.me.isAdmin;\n\n  /** 서버의 canEdit_와 같은 규칙 (화면에서 막고, 서버에서도 다시 막는다) */\n  function canEdit(p, c, draftOwner) {\n    if (isLead()) return true;\n    if (!D.me.name) return false;\n    const takes = !p.owner && draftOwner === D.me.name;\n    if (c.who === 'assign') return c.k === 'owner' && !p.owner;\n    if (c.who === 'second') return p.owner2 === D.me.name;\n    return p.owner === D.me.name || takes;\n  }\n\n  const activeNotice = n => { const t = todayKey(); return (!n.start || n.start \u003c= t) && (!n.end || n.end >= t); };\n  const isRead = n => D.reads.indexOf(n.id) >= 0;\n  function daysAgo(s) { const d = new Date(String(s).slice(0, 10) + 'T00:00:00'); return (now() - d) / 864e5; }\n\n  function can(k) { return !!(D && D.me.menus && D.me.menus.indexOf(k) >= 0); }\n\n  /* ================= 렌더링 ================= */\n  function render() {\n    document.title = D.team;\n    $('#brandTeam').textContent = D.team;\n    $('#brandYear').textContent = `${D.year}년 귀속`;\n    const role = (D.me.role || (D.me.isAdmin ? '' : '조회')) + (D.me.isAdmin ? (D.me.role ? ' · 관리자' : '관리자') : '');\n    $('#mtop').innerHTML = `\u003cdiv>\u003cb>${esc(D.team)}\u003c/b>\u003cspan>${esc(D.year)}년 귀속 연말정산\u003c/span>\u003c/div>\n      \u003cspan class=\"avatar\" title=\"${esc(D.me.email || '')}\">${esc(D.me.name ? D.me.name.slice(-2) : '?')}\u003c/span>`;\n    $('#meBox').innerHTML = D.me.name\n      ? `\u003cb>${esc(D.me.name)} · ${esc(role)}\u003c/b>\u003cspan>${esc(D.me.email)}\u003c/span>`\n      : `\u003cb>등록되지 않은 사용자\u003c/b>\u003cspan>${esc(D.me.email || '')}\u003c/span>`;\n\n    const todo = D.me.name ? D.people.filter(myTodo).length : 0;\n    $('#cReview').outerHTML = `\u003cspan id=\"cReview\">${todo ? `\u003cspan class=\"count\" title=\"내가 처리할 대상자\">${todo}\u003c/span>` : ''}\u003c/span>`;\n    const unread = D.notices.filter(n => activeNotice(n) && !isRead(n)).length;\n    $('#cNotice').outerHTML = `\u003cspan id=\"cNotice\">${unread ? `\u003cspan class=\"count soft\" title=\"안 읽은 글\">N ${unread}\u003c/span>` : ''}\u003c/span>`;\n    const issues = A ? A.members.filter(m => m.email && needsAttention(m.name)).length : 0;\n    $('#cAdmin').outerHTML = `\u003cspan id=\"cAdmin\">${issues ? `\u003cspan class=\"count\" title=\"권한 확인 필요\">${issues}\u003c/span>` : ''}\u003c/span>`;\n\n    const allowed = ['dash', 'review', 'notice', 'rules', 'files', 'admin'].filter(can);\n    if (!can(page)) page = allowed[0] || 'none';\n    document.querySelectorAll('#nav button').forEach(b => {\n      b.hidden = !can(b.dataset.page);\n      if (b.dataset.page === page) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');\n    });\n\n    $('#main').innerHTML = PAGES[page]();\n    if (page === 'admin' && !A) loadAdmin(false);\n    renderDemoBar();\n  }\n\n  const PAGES = {\n    none() {\n      return `\u003cdiv class=\"head\">\u003cdiv>\u003ch1>접근 권한이 없습니다\u003c/h1>\u003c/div>\u003c/div>\n        \u003cdiv class=\"notice\">${D.me.name ? '볼 수 있는 메뉴가 없습니다.' : `${esc(D.me.email || '이 계정')}은(는) [담당자] 시트에 등록되어 있지 않습니다.`} 관리자에게 등록과 권한을 요청하세요.\u003c/div>`;\n    },\n    dash: () => VIEWS.dash(),\n    review: () => VIEWS.review(),\n    notice: () => VIEWS.notice(),\n    rules: () => VIEWS.rules(),\n    files: () => VIEWS.files(),\n    admin: () => VIEWS.admin(),\n  };\n  const VIEWS = {};\n\n  /* ================= 대시보드 ================= */\n  function noticeBanners() {\n    const top = D.notices.filter(n => activeNotice(n) && (n.pinned || n.level === '긴급'));\n    if (!top.length) return '';\n    return `\u003cdiv class=\"banners\">${top.map(n => `\n      \u003cbutton class=\"banner lv-${esc(n.level)}\" onclick=\"openNotice='${esc(n.id)}';go('notice')\">\n        \u003cspan>${n.level === '긴급' ? '🚨' : n.level === '중요' ? '⚠️' : '📌'}\u003c/span>\n        \u003cspan>\u003cb>${isRead(n) ? '' : '\u003cspan class=\"unread\">\u003c/span>'}${esc(n.title)}\u003c/b>\u003cspan class=\"txt\">${esc(n.body)}\u003c/span>\u003c/span>\n      \u003c/button>`).join('')}\u003c/div>`;\n  }\n\n  VIEWS.dash = function () {\n    const P = D.people;\n    const cnt = k => P.filter(p => pStatus(p) === k).length;\n    const done = cnt('done');\n    const pct = P.length ? Math.round(done / P.length * 100) : 0;\n    const leave = P.filter(p => p.leave).length;\n    const mine = D.me.name ? P.filter(myTodo) : [];\n\n    const kpis = can('review') || can('dash') ? `\n      \u003cdiv class=\"kpis\">\n        \u003cdiv class=\"kpi click\" onclick=\"reviewTab='all';reviewStatus='all';go('review')\">\u003cspan class=\"label\">검토 대상\u003c/span>\u003cspan class=\"value\">${P.length}\u003csmall>명\u003c/small>\u003c/span>\u003cspan class=\"sub\">${leave ? `휴직 ${leave}명 포함` : '&nbsp;'}\u003c/span>\u003c/div>\n        ${D.me.name ? `\u003cdiv class=\"kpi click ${mine.length ? 'alert' : ''}\" onclick=\"reviewTab='mine';reviewStatus='all';go('review')\">\u003cspan class=\"label\">내가 처리할 대상자\u003c/span>\u003cspan class=\"value\">${mine.length}\u003csmall>명\u003c/small>\u003c/span>\u003cspan class=\"sub\">1차 검토·미비서류·2차 대기\u003c/span>\u003c/div>` : ''}\n        \u003cdiv class=\"kpi click ${cnt('supp') ? 'alert' : ''}\" onclick=\"reviewTab='all';reviewStatus='supp';go('review')\">\u003cspan class=\"label\">미비서류\u003c/span>\u003cspan class=\"value\">${cnt('supp')}\u003csmall>명\u003c/small>\u003c/span>\u003cspan class=\"sub\">보완 요청 필요\u003c/span>\u003c/div>\n        \u003cdiv class=\"kpi click\" onclick=\"reviewTab='all';reviewStatus='wait2';go('review')\">\u003cspan class=\"label\">2차 검토 대기\u003c/span>\u003cspan class=\"value\">${cnt('wait2')}\u003csmall>명\u003c/small>\u003c/span>\u003cspan class=\"sub\">1차 검증 완료\u003c/span>\u003c/div>\n        \u003cdiv class=\"kpi click\" onclick=\"reviewTab='all';reviewStatus='done';go('review')\">\u003cspan class=\"label\">검토완료\u003c/span>\u003cspan class=\"value\">${pct}\u003csmall>%\u003c/small>\u003c/span>\u003cspan class=\"sub\">${done} / ${P.length}명\u003c/span>\u003cdiv class=\"meter\">\u003ci style=\"width:${pct}%\">\u003c/i>\u003c/div>\u003c/div>\n      \u003c/div>` : '';\n\n    // 담당자별 진행\n    const owners = [...new Set(P.map(p => p.owner || '(미배정)'))].sort((a, b) => (a === '(미배정)') - (b === '(미배정)') || a.localeCompare(b, 'ko'));\n    const progRows = owners.map(o => {\n      const list = P.filter(p => (p.owner || '(미배정)') === o);\n      const c = k => list.filter(p => pStatus(p) === k).length;\n      const d = c('done'), pc = list.length ? Math.round(d / list.length * 100) : 0;\n      return `\u003cdiv class=\"prog-row\">\u003cb>${esc(o)}\u003c/b>\u003cspan class=\"n\">${list.length}\u003c/span>\u003cspan class=\"n\">${c('none')}\u003c/span>\u003cspan class=\"n\">${c('review')}\u003c/span>\u003cspan class=\"n ${c('supp') ? 'warn' : ''}\">${c('supp')}\u003c/span>\u003cspan class=\"n\">${c('wait2')}\u003c/span>\n        \u003cdiv class=\"meter\" title=\"검토완료 ${d}명 (${pc}%)\">\u003ci style=\"width:${pc}%\">\u003c/i>\u003c/div>\u003c/div>`;\n    }).join('');\n\n    const todoRows = mine.slice(0, 8).map(p => `\n      \u003cdiv class=\"list-row\" style=\"cursor:pointer\" onclick=\"openPerson('${esc(p.id)}')\">\n        \u003cspan class=\"who\">${esc(p.name)}\u003c/span>${statusChip(p)}\n        \u003cspan class=\"meta\">${esc(p.dept)}${p.owner2 === D.me.name && pStatus(p) === 'wait2' ? ' · 2차 검토 차례' : ''}${p.missing ? ` · ⚠ ${esc(p.missing)}` : ''}\u003c/span>\n      \u003c/div>`).join('') || '\u003cdiv class=\"empty\">지금 처리할 대상자가 없습니다.\u003c/div>';\n\n    const recentNotices = D.notices.filter(activeNotice).slice(0, 5).map(n => `\n      \u003cdiv class=\"list-row\" style=\"cursor:pointer;grid-template-columns:auto minmax(0,1fr) auto\" onclick=\"openNotice='${esc(n.id)}';go('notice')\">\n        \u003cspan class=\"chip cat-${esc(n.category)}\">${esc(n.category)}\u003c/span>\n        \u003cspan class=\"who\" style=\"overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">${isRead(n) ? '' : '\u003cspan class=\"unread\">\u003c/span>'}${n.pinned ? '📌 ' : ''}${esc(n.title)}\u003c/span>\n        \u003cspan class=\"meta\">${esc(n.date.slice(5, 10))}\u003c/span>\n      \u003c/div>`).join('') || '\u003cdiv class=\"empty\">게시 중인 공지가 없습니다.\u003c/div>';\n\n    const recentLogs = D.logs.slice(0, 5).map(logRow).join('') || '\u003cdiv class=\"empty\">응대기록이 없습니다.\u003c/div>';\n\n    return `\n      \u003cdiv class=\"head\">\n        \u003cdiv>\u003ch1>${esc(D.year)}년 귀속 연말정산\u003c/h1>\u003cp>${esc(D.team)} · ${D.me.name ? `${esc(D.me.name)}님` : ''} 오늘 ${esc(todayKey())}\u003c/p>\u003c/div>\n      \u003c/div>\n      ${can('notice') ? noticeBanners() : ''}\n      ${kpis}\n      \u003cdiv class=\"grid-2\">\n        \u003csection class=\"panel\">\n          \u003cdiv class=\"panel-head\">\u003ch2>담당자별 진행\u003c/h2>\u003cspan>대상 · 미도착 · 1차중 · 미비 · 2차대기 · 완료율\u003c/span>\u003c/div>\n          \u003cdiv class=\"prog-row h\">\u003cspan>담당자\u003c/span>\u003cspan class=\"n\">대상\u003c/span>\u003cspan class=\"n\">미도착\u003c/span>\u003cspan class=\"n\">1차중\u003c/span>\u003cspan class=\"n\">미비\u003c/span>\u003cspan class=\"n\">2차대기\u003c/span>\u003cspan>완료율\u003c/span>\u003c/div>\n          ${progRows || '\u003cdiv class=\"empty\">대상자가 없습니다. [대상자] 시트에 붙여넣으세요.\u003c/div>'}\n        \u003c/section>\n        \u003cdiv style=\"display:flex;flex-direction:column;gap:16px;min-width:0\">\n          ${D.me.name && can('review') ? `\u003csection class=\"panel\">\u003cdiv class=\"panel-head\">\u003ch2>내가 처리할 대상자\u003c/h2>\u003cspan>${mine.length}명\u003c/span>\u003c/div>\u003cdiv class=\"list\">${todoRows}\u003c/div>\u003c/section>` : ''}\n          ${can('notice') ? `\u003csection class=\"panel\">\u003cdiv class=\"panel-head\">\u003ch2>최근 공지\u003c/h2>\u003cbutton class=\"linkish\" onclick=\"go('notice')\">전체 보기\u003c/button>\u003c/div>\u003cdiv class=\"list\">${recentNotices}\u003c/div>\u003c/section>` : ''}\n        \u003c/div>\n      \u003c/div>\n      ${can('review') ? `\u003csection class=\"panel\">\u003cdiv class=\"panel-head\">\u003ch2>최근 응대기록\u003c/h2>\u003cbutton class=\"linkish\" onclick=\"reviewTab='logs';go('review')\">전체 보기\u003c/button>\u003c/div>\u003cdiv class=\"logs\">${recentLogs}\u003c/div>\u003c/section>` : ''}`;\n  };\n\n  function logRow(l, noName) {\n    const p = D.people.find(x => x.empNo === l.empNo);\n    return `\u003cdiv class=\"log\">\u003cspan class=\"d\">${esc(l.date.slice(2, 16))}\u003c/span>\u003cspan class=\"chip plain\" style=\"justify-self:start\">${esc(l.kind)}\u003c/span>\n      \u003cp>${noName ? '' : `${p ? `\u003cbutton class=\"linkish\" onclick=\"openPerson('${esc(p.id)}')\">\u003cb>${esc(l.name)}\u003c/b>\u003c/button>` : `\u003cb>${esc(l.name)}\u003c/b>`} · `}${esc(l.body)} \u003cspan class=\"who\">— ${esc(l.author)}\u003c/span>\u003c/p>\u003c/div>`;\n  }\n\n  /* ================= 서류 검토 ================= */\n  function reviewBase() {\n    if (reviewTab === 'mine') return D.people.filter(isMine);\n    return D.people.filter(p => !reviewOwner || p.owner === reviewOwner || p.owner2 === reviewOwner || (reviewOwner === '(미배정)' && !p.owner));\n  }\n  function reviewFiltered() {\n    const q = reviewQuery.trim().toLowerCase();\n    return reviewBase()\n      .filter(p => reviewStatus === 'all' || pStatus(p) === reviewStatus)\n      .filter(p => !q || [p.empNo, p.name, p.dept, p.phone, p.email, p.missing, p.note1, p.note2].join(' ').toLowerCase().includes(q))\n      .sort((a, b) => String(a.no).localeCompare(String(b.no), 'ko', { numeric: true }) || String(a.empNo).localeCompare(String(b.empNo), 'ko', { numeric: true }));\n  }\n  const mini = (p, items) => `\u003cspan class=\"mini\">${items.map(([k, l]) => `\u003cspan class=\"${p[k] ? 'on' : ''}\" title=\"${esc(col(k).l)}\">${l}\u003c/span>`).join('')}\u003c/span>`;\n\n  function reviewListHtml() {\n    const list = reviewFiltered();\n    const logCount = {};\n    D.logs.forEach(l => { logCount[l.empNo] = (logCount[l.empNo] || 0) + 1; });\n    // 명단: 기본 정보 열을 시트 순서대로 보여주고, 행을 누르면 수정 화면이 뜬다\n    const rows = list.map(p => `\n      \u003ctr class=\"click\" onclick=\"openPerson('${esc(p.id)}')\" title=\"눌러서 ${esc(p.name)}님 정보 수정\">\n        \u003ctd class=\"c-hide\" data-label=\"No.\">${esc(p.no)}\u003c/td>\n        \u003ctd data-label=\"부서\">${esc(p.dept)}\u003c/td>\n        \u003ctd data-label=\"사원번호\">${esc(p.empNo)}\u003c/td>\n        \u003ctd class=\"c-name\" data-label=\"성명\">${esc(p.name)}\u003c/td>\n        \u003ctd class=\"m-hide\" data-label=\"사원하위그룹\">${esc(p.subgroup)}\u003c/td>\n        \u003ctd class=\"m-hide\" data-label=\"급여영역\">${esc(p.payArea)}\u003c/td>\n        \u003ctd data-label=\"직급\">${esc(p.rank)}\u003c/td>\n        \u003ctd data-label=\"전화번호\">${esc(p.phone)}\u003c/td>\n        \u003ctd class=\"m-hide\" data-label=\"이메일\">${esc(p.email)}\u003c/td>\n        \u003ctd class=\"${p.leave ? '' : 'm-hide'}\" data-label=\"휴직\">${p.leave ? '\u003cspan class=\"chip plain\">휴직\u003c/span>' : ''}\u003c/td>\n        \u003ctd data-label=\"담당 / 2차\">${esc(p.owner || '-')}\u003cspan style=\"color:var(--muted)\"> / ${esc(p.owner2 || '-')}\u003c/span>\u003c/td>\n        \u003ctd data-label=\"상태\">${statusChip(p)}\u003c/td>\n        \u003ctd data-label=\"미비 · 특이\">${p.missing ? '\u003cspan class=\"chip no\" title=\"' + esc(p.missing) + '\">미비\u003c/span> ' : ''}${hasNote(p) ? '\u003cspan class=\"chip info\">특이\u003c/span> ' : ''}${logCount[p.empNo] ? `\u003cspan class=\"chip plain\">응대 ${logCount[p.empNo]}\u003c/span>` : ''}\u003c/td>\n        \u003ctd class=\"c-hide edit-cell\">\u003cspan class=\"edit-hint\">수정 ›\u003c/span>\u003c/td>\n      \u003c/tr>`).join('');\n    return rows\n      ? `\u003cdiv class=\"table-wrap\">\u003ctable class=\"t cards people-cards\">\u003cthead>\u003ctr>\u003cth class=\"c-hide\">No.\u003c/th>\u003cth>부서\u003c/th>\u003cth>사원번호\u003c/th>\u003cth>성명\u003c/th>\u003cth>사원하위그룹\u003c/th>\u003cth>급여영역\u003c/th>\u003cth>직급\u003c/th>\u003cth>전화번호\u003c/th>\u003cth>이메일\u003c/th>\u003cth>휴직\u003c/th>\u003cth>담당 / 2차\u003c/th>\u003cth>상태\u003c/th>\u003cth>미비 · 특이\u003c/th>\u003cth class=\"c-hide\">\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${rows}\u003c/tbody>\u003c/table>\u003c/div>\n        \u003cp class=\"hint\" style=\"margin-top:8px\">이름을 누르면 기본 정보와 검토 내용을 수정하는 화면이 뜹니다.\u003c/p>`\n      : `\u003cdiv class=\"empty\">${reviewTab === 'mine' ? (D.me.name ? '[대상자] 시트의 담당자·2차검토 담당자 칸에 내 이름이 있는 사람이 없습니다.' : '[담당자] 시트에 등록되어야 내 담당을 볼 수 있습니다.') : '조건에 맞는 대상자가 없습니다.'}\u003c/div>`;\n  }\n\n  function logsListHtml() {\n    const q = logQuery.trim().toLowerCase();\n    const list = D.logs.filter(l => !q || [l.name, l.empNo, l.author, l.kind, l.body].join(' ').toLowerCase().includes(q));\n    return list.slice(0, 300).map(l => logRow(l)).join('') || '\u003cdiv class=\"empty\">응대기록이 없습니다.\u003c/div>';\n  }\n\n  VIEWS.review = function () {\n    const tab = (k, label) => `\u003cbutton role=\"tab\" aria-selected=\"${reviewTab === k}\" onclick=\"reviewTab='${k}';reviewStatus='all';render()\">${label}\u003c/button>`;\n    const head = `\n      \u003cdiv class=\"head\">\n        \u003cdiv>\u003ch1>서류 검토\u003c/h1>\u003cp>대상자를 눌러 진행 체크·특이사항·수정사항·미비서류를 입력하세요. [대상자] 시트에 바로 저장됩니다.\u003c/p>\u003c/div>\n        \u003cdiv class=\"head-actions\">\n          ${isLead() ? '\u003cbutton class=\"btn\" onclick=\"openImport()\">시트 붙여넣기\u003c/button>\u003cbutton class=\"btn\" onclick=\"openAddPerson()\">+ 대상자\u003c/button>' : ''}\n          \u003ca class=\"btn\" href=\"${esc(D.sheetUrl)}\" target=\"_blank\" rel=\"noopener\">시트 열기\u003c/a>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"subtabs\" role=\"tablist\">${tab('mine', `내 담당 ${D.people.filter(isMine).length}`)}${tab('all', `전체 ${D.people.length}`)}${tab('logs', `응대기록 ${D.logs.length}`)}\u003c/div>`;\n\n    if (reviewTab === 'logs') {\n      return head + `\u003csection class=\"panel\">\n        \u003cinput class=\"search\" id=\"logSearch\" type=\"search\" placeholder=\"대상자·담당자·내용 검색\" value=\"${esc(logQuery)}\" aria-label=\"응대기록 검색\">\n        \u003cdiv class=\"logs\" id=\"logList\">${logsListHtml()}\u003c/div>\n        \u003cp style=\"color:var(--muted);font-size:12px;margin:10px 0 0\">응대기록은 대상자를 눌러 남깁니다. 누가 응대했든 모든 담당자가 같은 기록을 봅니다.\u003c/p>\n      \u003c/section>`;\n    }\n    const base = reviewBase();\n    const owners = [...new Set(D.people.flatMap(p => [p.owner, p.owner2]).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ko'));\n    const chips = [['all', '전체']].concat(Object.keys(STATUS).map(k => [k, STATUS[k][0]]))\n      .map(([k, l]) => `\u003cbutton aria-pressed=\"${reviewStatus === k}\" onclick=\"reviewStatus='${k}';render()\">${l} ${k === 'all' ? base.length : base.filter(p => pStatus(p) === k).length}\u003c/button>`).join('');\n    return head + `\n      \u003csection class=\"panel\">\n        \u003cdiv class=\"search-row\">\n          \u003cinput class=\"search\" id=\"reviewSearch\" type=\"search\" placeholder=\"사원번호·이름·부서·미비서류·특이사항 검색\" value=\"${esc(reviewQuery)}\" aria-label=\"대상자 검색\">\n          ${reviewTab === 'all' ? `\u003cselect class=\"field-in\" onchange=\"reviewOwner=this.value;render()\" aria-label=\"담당자\">\u003coption value=\"\">전체 담당자\u003c/option>${owners.concat('(미배정)').map(o => `\u003coption ${o === reviewOwner ? 'selected' : ''}>${esc(o)}\u003c/option>`).join('')}\u003c/select>` : ''}\n        \u003c/div>\n        \u003cdiv class=\"filters\" style=\"margin-bottom:12px\">${chips}\u003c/div>\n        \u003cdiv id=\"reviewList\">${reviewListHtml()}\u003c/div>\n      \u003c/section>`;\n  };\n\n  document.addEventListener('input', e => {\n    if (e.target.id === 'reviewSearch') { reviewQuery = e.target.value; $('#reviewList').innerHTML = reviewListHtml(); }\n    if (e.target.id === 'logSearch') { logQuery = e.target.value; $('#logList').innerHTML = logsListHtml(); }\n    if (e.target.id === 'ruleSearch') { ruleQuery = e.target.value; $('#ruleList').innerHTML = ruleListHtml(); }\n    if (e.target.id === 'fileSearch') { fileQuery = e.target.value; $('#fileList').innerHTML = fileListHtml(); }\n  });\n\n  /* ---------- 대상자 상세 (입력) ---------- */\n  let curPerson = null;\n  let draftOwner = '';\n  const GROUP_ORDER = ['진행', '1차 특이·수정사항', '주택자금 · 월세', '종전근무지', '2차 검토', '담당'];\n\n  function fieldHtml(p, c) {\n    const id = 'pf_' + c.k;\n    const off = !canEdit(p, c, draftOwner);\n    if (c.t === 'bool') return `\u003clabel class=\"${off ? 'off' : ''}\">\u003cinput type=\"checkbox\" class=\"check\" id=\"${id}\" ${p[c.k] ? 'checked' : ''} ${off ? 'disabled' : ''}> ${esc(c.l)}\u003c/label>`;\n    if (c.t === 'long') return `\u003cdiv class=\"fld\">\u003clabel for=\"${id}\">${esc(c.l)}\u003c/label>\u003ctextarea class=\"field-in\" id=\"${id}\" ${off ? 'disabled' : ''} style=\"min-height:64px\">${esc(p[c.k])}\u003c/textarea>\u003c/div>`;\n    if (c.who === 'assign') {\n      const opts = [''].concat(D.staff.map(s => s.name));\n      if (p[c.k] && opts.indexOf(p[c.k]) \u003c 0) opts.push(p[c.k]);\n      const v = c.k === 'owner' && draftOwner ? draftOwner : p[c.k];\n      return `\u003cdiv class=\"fld\">\u003clabel for=\"${id}\">${esc(c.l)}\u003c/label>\u003cselect class=\"field-in\" id=\"${id}\" ${isLead() ? '' : 'disabled'}>${opts.map(o => `\u003coption value=\"${esc(o)}\" ${o === v ? 'selected' : ''}>${esc(o || '(없음)')}\u003c/option>`).join('')}\u003c/select>\u003c/div>`;\n    }\n    return `\u003cdiv class=\"fld\">\u003clabel for=\"${id}\">${esc(c.l)}\u003c/label>\u003cinput class=\"field-in\" id=\"${id}\" value=\"${esc(p[c.k])}\" ${off ? 'disabled' : ''}>\u003c/div>`;\n  }\n\n  function groupHtml(p, g) {\n    const cs = D.cols.filter(c => c.g === g);\n    const bools = cs.filter(c => c.t === 'bool'), longs = cs.filter(c => c.t === 'long'), shorts = cs.filter(c => !c.t);\n    const who = cs[0].who;\n    const note = who === 'second' ? `2차: ${p.owner2 || '미지정'}` : who === 'first' ? `1차: ${p.owner || draftOwner || '미지정'}` : '';\n    return `\u003cdiv class=\"sec\">${esc(g)}\u003cspan>${esc(note)}\u003c/span>\u003c/div>\n      ${shorts.length ? `\u003cdiv class=\"three\">${shorts.map(c => fieldHtml(p, c)).join('')}\u003c/div>` : ''}\n      ${bools.length ? `\u003cdiv class=\"bools\">${bools.map(c => fieldHtml(p, c)).join('')}\u003c/div>` : ''}\n      ${longs.map(c => fieldHtml(p, c)).join('')}`;\n  }\n\n  function personFiles(p) {\n    return D.files.filter(f => f.area === 'person' && f.ref === (p.empNo || p.id));\n  }\n\n  function openPerson(id) {\n    const p = D.people.find(x => x.id === id);\n    if (!p) return toast('대상자를 찾을 수 없습니다. 새로고침해 주세요.');\n    curPerson = p;\n    draftOwner = '';\n    drawPerson();\n  }\n\n  function drawPerson() {\n    const p = curPerson;\n    const editable = D.cols.some(c => canEdit(p, c, draftOwner) && c.who !== 'assign') || isLead();\n    const canTake = !p.owner && D.me.name && !isLead() && !draftOwner;\n    const groups = GROUP_ORDER.filter(g => D.cols.some(c => c.g === g));\n    const logs = D.logs.filter(l => l.empNo === p.empNo);\n    const files = personFiles(p);\n    $('#modal').classList.add('wide');\n    openModal(`\n      \u003ch3>${esc(p.name)} \u003cspan style=\"font-weight:400;color:var(--muted);font-size:14px\">${esc(p.empNo)} · ${esc(p.dept)} ${esc(p.rank)}\u003c/span> ${statusChip(p)}\u003c/h3>\n      \u003cp class=\"sub\">${p.phone ? `☎ ${esc(p.phone)} · ` : ''}${p.email ? `${esc(p.email)} · ` : ''}최종 수정 ${esc(p.updated || '-')}${p.editor ? ` (${esc(p.editor)})` : ''}\u003c/p>\n      \u003cform class=\"form\" id=\"personForm\" novalidate>\n        ${canTake ? `\u003cdiv class=\"notice take\">\u003cspan>아직 1차 담당자가 없습니다. 맡으면 검토 내용을 입력할 수 있습니다.\u003c/span>\u003cbutton type=\"button\" class=\"btn small primary\" onclick=\"draftOwner=D.me.name;drawPerson()\">내가 담당하기\u003c/button>\u003c/div>` : ''}\n        ${!editable && !canTake ? `\u003cdiv class=\"notice\">보기만 할 수 있습니다. 1차 담당자(${esc(p.owner || '미지정')})·2차 검토 담당자(${esc(p.owner2 || '미지정')})·총괄이 입력합니다. 응대기록은 누구나 남길 수 있습니다.\u003c/div>` : ''}\n        ${groupHtml(p, '기본 정보')}\n        ${groups.map(g => groupHtml(p, g)).join('')}\n\n        \u003cdiv class=\"sec\">증빙 첨부\u003cspan>${files.length}개\u003c/span>\u003c/div>\n        \u003cdiv id=\"pFiles\">${filesView(files) || '\u003cdiv class=\"hint\">올린 파일이 없습니다.\u003c/div>'}\u003c/div>\n        ${(editable || canTake || D.me.name) ? uploaderHtml('person', '파일 올리기 (올리는 즉시 저장됩니다)') : ''}\n\n        \u003cdiv class=\"msg err\" id=\"pErr\" hidden>\u003c/div>\n        \u003cdiv class=\"modal-actions\">\n          ${isLead() ? '\u003cbutton type=\"button\" class=\"btn danger\" style=\"margin-right:auto\" onclick=\"deletePerson()\">대상자 삭제\u003c/button>' : ''}\n          \u003cbutton type=\"button\" class=\"btn\" onclick=\"closeModal()\">닫기\u003c/button>\n          ${editable || draftOwner ? '\u003cbutton type=\"submit\" class=\"btn primary\" id=\"pOk\">저장\u003c/button>' : ''}\n        \u003c/div>\n      \u003c/form>\n      \u003cdiv class=\"sec\" style=\"margin-top:18px\">응대기록\u003cspan>${logs.length}건 · 누구나 작성\u003c/span>\u003c/div>\n      \u003cdiv class=\"logs\" id=\"pLogs\">${logs.map(l => logRow(l, true)).join('') || '\u003cdiv class=\"hint\" style=\"padding:6px 0\">아직 응대기록이 없습니다.\u003c/div>'}\u003c/div>\n      ${D.me.name || D.me.isAdmin ? `\u003cform class=\"log-form\" id=\"logForm\">\n        \u003cselect class=\"field-in\" id=\"logKind\" aria-label=\"응대 구분\">${D.logKinds.map(k => `\u003coption>${esc(k)}\u003c/option>`).join('')}\u003c/select>\n        \u003cinput class=\"field-in\" id=\"logBody\" placeholder=\"예) 의료비 영수증 재제출 요청, 2/5까지 받기로 함\" aria-label=\"응대 내용\">\n        \u003cbutton class=\"btn primary\">기록\u003c/button>\n      \u003c/form>` : ''}`, true);\n\n    if ($('#drop-person')) initUploader('person', 'person', [], { ref: p.empNo || p.id, refLabel: `${p.name}(${p.empNo})`, onDone: () => { $('#pFiles').innerHTML = filesView(personFiles(p)) || ''; } });\n    $('#personForm').onsubmit = e => { e.preventDefault(); savePerson(); };\n    if ($('#logForm')) $('#logForm').onsubmit = e => { e.preventDefault(); addLog(); };\n  }\n\n  function savePerson() {\n    const p = curPerson;\n    const patch = {};\n    D.cols.forEach(c => {\n      const el = $('#pf_' + c.k);\n      if (!el || el.disabled) return;\n      const v = c.t === 'bool' ? el.checked : el.value.trim();\n      if (v !== p[c.k]) patch[c.k] = v;\n    });\n    if (draftOwner && !p.owner) patch.owner = draftOwner;\n    if (!Object.keys(patch).length) { closeModal(); toast('바뀐 내용이 없습니다.'); return; }\n    if (uploadsBusy('person')) { $('#pErr').textContent = BUSY_MSG; $('#pErr').hidden = false; return; }\n    $('#pOk').disabled = true;\n    call('apiSavePerson', p.id, patch)\n      .then(data => { applyData(data); closeModal(); render(); toast(`${p.name}님 검토 내용을 저장했습니다.`); })\n      .catch(err => { $('#pOk').disabled = false; $('#pErr').textContent = err.message || String(err); $('#pErr').hidden = false; });\n  }\n\n  function addLog() {\n    const body = $('#logBody').value.trim();\n    if (!body) return;\n    const p = curPerson, kind = $('#logKind').value;\n    const btn = $('#logForm button');\n    btn.disabled = true;\n    call('apiAddLog', p.id, kind, body)\n      .then(data => {\n        applyData(data);\n        $('#pLogs').innerHTML = D.logs.filter(l => l.empNo === p.empNo).map(l => logRow(l, true)).join('');\n        $('#logBody').value = '';\n        btn.disabled = false;\n        toast('응대기록을 남겼습니다.');\n      })\n      .catch(e => { btn.disabled = false; fail(e); });\n  }\n\n  function deletePerson() {\n    const p = curPerson;\n    openModal(`\u003ch3>${esc(p.name)}(${esc(p.empNo)})님을 삭제할까요?\u003c/h3>\u003cp class=\"sub\">[대상자] 시트에서 이 행을 지웁니다. 응대기록과 첨부 파일 기록은 남습니다.\u003c/p>\n      \u003cdiv class=\"modal-actions\">\u003cbutton class=\"btn\" onclick=\"drawPerson()\">취소\u003c/button>\u003cbutton class=\"btn primary\" id=\"dpOk\">삭제\u003c/button>\u003c/div>`);\n    $('#dpOk').onclick = () => {\n      $('#dpOk').disabled = true;\n      call('apiDeletePerson', p.id).then(data => { applyData(data); closeModal(); render(); toast('삭제했습니다.'); }).catch(e => { closeModal(); fail(e); });\n    };\n  }\n\n  function openAddPerson() {\n    const staff = [''].concat(D.staff.map(s => s.name));\n    const sel = id => `\u003cselect class=\"field-in\" id=\"${id}\">${staff.map(s => `\u003coption value=\"${esc(s)}\">${esc(s || '(없음)')}\u003c/option>`).join('')}\u003c/select>`;\n    openModal(`\n      \u003ch3>대상자 추가\u003c/h3>\n      \u003cp class=\"sub\">한 명씩 추가합니다. 여러 명은 「시트 붙여넣기」나 [대상자] 시트에 직접 붙여넣으세요.\u003c/p>\n      \u003cform class=\"form\" id=\"apForm\" novalidate>\n        \u003cdiv class=\"two\">\u003cdiv class=\"fld\">\u003clabel for=\"apEmp\">사원번호\u003c/label>\u003cinput class=\"field-in\" id=\"apEmp\">\u003c/div>\u003cdiv class=\"fld\">\u003clabel for=\"apName\">성명\u003c/label>\u003cinput class=\"field-in\" id=\"apName\">\u003c/div>\u003c/div>\n        \u003cdiv class=\"two\">\u003cdiv class=\"fld\">\u003clabel for=\"apDept\">부서\u003c/label>\u003cinput class=\"field-in\" id=\"apDept\">\u003c/div>\u003cdiv class=\"fld\">\u003clabel for=\"apRank\">직급\u003c/label>\u003cinput class=\"field-in\" id=\"apRank\">\u003c/div>\u003c/div>\n        \u003cdiv class=\"two\">\u003cdiv class=\"fld\">\u003clabel for=\"apOwner\">담당자\u003c/label>${sel('apOwner')}\u003c/div>\u003cdiv class=\"fld\">\u003clabel for=\"apOwner2\">2차검토 담당자\u003c/label>${sel('apOwner2')}\u003c/div>\u003c/div>\n        \u003cdiv class=\"msg err\" id=\"apErr\" hidden>\u003c/div>\n        \u003cdiv class=\"modal-actions\">\u003cbutton type=\"button\" class=\"btn\" onclick=\"closeModal()\">취소\u003c/button>\u003cbutton type=\"submit\" class=\"btn primary\" id=\"apOk\">추가\u003c/button>\u003c/div>\n      \u003c/form>`);\n    $('#apForm').onsubmit = e => {\n      e.preventDefault();\n      const f = { empNo: $('#apEmp').value.trim(), name: $('#apName').value.trim(), dept: $('#apDept').value.trim(), rank: $('#apRank').value.trim(), owner: $('#apOwner').value, owner2: $('#apOwner2').value };\n      if (!f.name) { $('#apErr').textContent = '성명을 입력해 주세요.'; $('#apErr').hidden = false; return; }\n      if (f.empNo && D.people.some(p => p.empNo === f.empNo)) { $('#apErr').textContent = '같은 사원번호가 이미 있습니다.'; $('#apErr').hidden = false; return; }\n      $('#apOk').disabled = true;\n      call('apiAddPerson', f).then(data => { applyData(data); closeModal(); reviewTab = 'all'; render(); toast(`${f.name}님을 추가했습니다.`); })\n        .catch(err => { $('#apOk').disabled = false; $('#apErr').textContent = err.message || String(err); $('#apErr').hidden = false; });\n    };\n  }\n\n  /* ---------- 시트 붙여넣기 (총괄·관리자) ---------- */\n  // 구글 시트 복사본(TSV) 파싱: 줄바꿈이 들어간 셀은 \"...\"로 감싸져 온다\n  function parseTSV(text) {\n    const rows = []; let row = [], cell = '', q = false;\n    for (let i = 0; i \u003c text.length; i++) {\n      const ch = text[i];\n      if (q) { if (ch === '\"') { if (text[i + 1] === '\"') { cell += '\"'; i++; } else q = false; } else cell += ch; }\n      else if (ch === '\"' && cell === '') q = true;\n      else if (ch === '\\t') { row.push(cell); cell = ''; }\n      else if (ch === '\\n' || ch === '\\r') { if (ch === '\\r' && text[i + 1] === '\\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }\n      else cell += ch;\n    }\n    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }\n    return rows.filter(r => r.some(c => c.trim()));\n  }\n  const normH = s => String(s).replace(/\\s/g, '').toLowerCase();\n  const matchCol = h => { const n = normH(h); return D.cols.find(c => normH(c.l) === n || (c.re && new RegExp(c.re).test(n))); };\n  function readPaste() {\n    const rows = parseTSV($('#imText').value);\n    if (!rows.length) return { err: '붙여넣은 내용이 없습니다.' };\n    const hdr = rows[0].map(matchCol), hasHdr = hdr.filter(Boolean).length >= 2;\n    const map = hasHdr ? hdr : D.cols.slice(0, rows[0].length);\n    const unknown = hasHdr ? rows[0].filter((h, i) => h.trim() && !hdr[i]) : [];\n    if (!map.some(c => c && c.k === 'name')) return { err: '「성명」 열을 찾지 못했습니다. 제목 행까지 함께 복사해 주세요.' };\n    const data = (hasHdr ? rows.slice(1) : rows).map(r => { const o = {}; map.forEach((c, i) => { if (c) o[c.k] = r[i] == null ? '' : r[i]; }); return o; }).filter(o => String(o.name || '').trim());\n    return { data, cols: map.filter(Boolean).length, unknown, hasHdr };\n  }\n  function openImport() {\n    openModal(`\n      \u003ch3>시트 붙여넣기\u003c/h3>\n      \u003cp class=\"sub\">기존 검토 시트에서 \u003cb>제목 행(No., 부서, 사원번호…)부터\u003c/b> 복사해 붙여넣으세요.\u003cbr>\n      · 열 이름으로 자동 매칭 (제목 행이 없으면 기존 시트 열 순서로 인식)\u003cbr>\n      · 사원번호가 같으면 붙여넣은 칸만 갱신, 없으면 추가 · O, Y, ○, 완료 같은 표기는 체크로 인식\u003c/p>\n      \u003cform class=\"form\" id=\"imForm\" novalidate>\n        \u003ctextarea class=\"field-in\" id=\"imText\" style=\"min-height:200px\" aria-label=\"붙여넣을 내용\">\u003c/textarea>\n        \u003cdiv class=\"hint\" id=\"imHint\">\u003c/div>\n        \u003cdiv class=\"modal-actions\">\u003cbutton type=\"button\" class=\"btn\" onclick=\"closeModal()\">취소\u003c/button>\u003cbutton type=\"submit\" class=\"btn primary\" id=\"imOk\">가져오기\u003c/button>\u003c/div>\n      \u003c/form>`);\n    $('#imText').oninput = () => {\n      const r = readPaste();\n      $('#imHint').innerHTML = r.err ? `\u003cspan style=\"color:var(--warn-ink)\">${esc(r.err)}\u003c/span>`\n        : `인식된 열 ${r.cols}개 · 대상자 ${r.data.length}명 · 새로 추가 ${r.data.filter(o => !o.empNo || !D.people.some(p => p.empNo === String(o.empNo).trim())).length}명${r.unknown.length ? ` · 무시되는 열: ${r.unknown.map(esc).join(', ')}` : ''}`;\n    };\n    $('#imForm').onsubmit = e => {\n      e.preventDefault();\n      const r = readPaste();\n      if (r.err) { $('#imHint').innerHTML = `\u003cspan style=\"color:var(--warn-ink)\">${esc(r.err)}\u003c/span>`; return; }\n      $('#imOk').disabled = true;\n      call('apiImportPeople', r.data).then(data => { applyData(data); closeModal(); reviewTab = 'all'; render(); toast(`${data.added}명 추가 · ${data.updated}명 갱신했습니다.`); })\n        .catch(err => { $('#imOk').disabled = false; fail(err); });\n    };\n  }\n\n  /* ================= 공지사항 ================= */\n  VIEWS.notice = function () {\n    const cats = ['all', 'unread'].concat(D.noticeCategories);\n    const base = D.notices.filter(n => showOld || activeNotice(n));\n    const pick = c => c === 'all' ? base : c === 'unread' ? base.filter(n => !isRead(n)) : base.filter(n => n.category === c);\n    const list = pick(noticeFilter);\n    const rows = list.map(n => {\n      const open = openNotice === n.id;\n      const canEditN = n.author === D.me.name || isLead();\n      return `\u003carticle class=\"post\">\n        \u003cbutton class=\"post-head\" onclick=\"toggleNotice('${esc(n.id)}')\" aria-expanded=\"${open}\">\n          \u003cspan class=\"chip cat-${esc(n.category)}\">${esc(n.category)}\u003c/span>\n          \u003cspan class=\"post-title\">${isRead(n) ? '' : '\u003cspan class=\"unread\" title=\"안 읽음\">\u003c/span>'}${n.pinned ? '\u003cspan class=\"pin\">📌\u003c/span>' : ''}${n.level !== '일반' ? `\u003cspan class=\"chip lv-${esc(n.level)}\" style=\"margin-right:6px\">${esc(n.level)}\u003c/span>` : ''}${esc(n.title)}${n.files && n.files.length ? '\u003cspan class=\"clip\" title=\"첨부 파일\">📎\u003c/span>' : ''}${n.comments.length ? `\u003cspan class=\"cc\">[${n.comments.length}]\u003c/span>` : ''}\u003c/span>\n          \u003cspan class=\"post-meta\">${esc(n.author)} · ${esc(n.date.slice(0, 10))}\u003c/span>\n        \u003c/button>\n        ${open ? `\u003cdiv class=\"post-body\">\n          ${n.start || n.end ? `\u003cdiv class=\"hint\">게시 기간 ${esc(n.start || '처음')} ~ ${esc(n.end || '계속')}${activeNotice(n) ? '' : ' · 게시 기간이 아닙니다'}\u003c/div>` : ''}\n          \u003cdiv class=\"post-text\">${esc(n.body)}\u003c/div>\n          ${filesView(n.files)}\n          \u003cdiv class=\"comments\">\n            ${n.comments.map(c => `\u003cdiv class=\"cmt\">\u003cb>${esc(c.author)}\u003cspan>${esc(c.date)}\u003c/span>\u003c/b>\u003cp>${esc(c.body)}\u003c/p>\u003c/div>`).join('')}\n            \u003cform class=\"cmt-form\" onsubmit=\"addNoticeComment(event, '${esc(n.id)}')\">\n              \u003cinput class=\"field-in\" id=\"cmtIn\" placeholder=\"${n.category === '질문' ? '답변 달기' : '댓글·질문 달기'}\" aria-label=\"댓글\">\n              \u003cbutton class=\"btn small primary\">등록\u003c/button>\n            \u003c/form>\n          \u003c/div>\n          \u003cdiv style=\"display:flex;gap:6px;flex-wrap:wrap\">\n            \u003cbutton class=\"btn small\" onclick=\"markUnread('${esc(n.id)}')\">안 읽음으로\u003c/button>\n            \u003cbutton class=\"btn small\" onclick=\"copyNotice('${esc(n.id)}')\">메신저용 복사\u003c/button>\n            ${canEditN ? `\u003cbutton class=\"btn small\" onclick=\"openNoticeForm('${esc(n.id)}')\">수정\u003c/button>\u003cbutton class=\"btn small danger\" onclick=\"deleteNotice('${esc(n.id)}')\">삭제\u003c/button>` : ''}\n          \u003c/div>\n        \u003c/div>` : ''}\n      \u003c/article>`;\n    }).join('') || `\u003cdiv class=\"empty\">${noticeFilter === 'unread' ? '안 읽은 글이 없습니다.' : '글이 없습니다.'}\u003c/div>`;\n    return `\n      \u003cdiv class=\"head\">\n        \u003cdiv>\u003ch1>공지사항\u003c/h1>\u003cp>공지·응대지침은 총괄이 올리고, 자료·질문은 누구나 올릴 수 있습니다. 긴급·고정 공지는 대시보드 맨 위에 보입니다.\u003c/p>\u003c/div>\n        \u003cdiv class=\"head-actions\">\u003cbutton class=\"btn primary\" onclick=\"openNoticeForm()\">글쓰기\u003c/button>\u003c/div>\n      \u003c/div>\n      \u003csection class=\"panel\">\n        \u003cdiv class=\"panel-head\">\n          \u003cdiv class=\"filters\">${cats.map(c => `\u003cbutton aria-pressed=\"${noticeFilter === c}\" onclick=\"noticeFilter='${c}';render()\">${c === 'all' ? '전체' : c === 'unread' ? '안 읽음' : c} ${pick(c).length}\u003c/button>`).join('')}\u003c/div>\n          \u003clabel style=\"display:flex;gap:6px;align-items:center;font-size:13px\">\u003cinput type=\"checkbox\" class=\"check\" ${showOld ? 'checked' : ''} onchange=\"showOld=this.checked;render()\"> 지난 공지 포함\u003c/label>\n        \u003c/div>\n        \u003cdiv class=\"posts\">${rows}\u003c/div>\n      \u003c/section>`;\n  };\n\n  function toggleNotice(id) {\n    openNotice = openNotice === id ? null : id;\n    if (openNotice && D.reads.indexOf(id) \u003c 0) {\n      D.reads.push(id);\n      call('apiMarkRead', id).then(applyData).catch(() => { /* 읽음 표시는 실패해도 넘어간다 */ });\n    }\n    render();\n  }\n  function markUnread(id) {\n    D.reads = D.reads.filter(x => x !== id);\n    openNotice = null;\n    render();\n    call('apiMarkUnread', id).then(applyData).catch(fail);\n  }\n  function copyNotice(id) {\n    const n = D.notices.find(x => x.id === id);\n    const text = `[${n.category}] ${n.title}\\n\\n${n.body}`;\n    try { navigator.clipboard.writeText(text).then(() => toast('복사했습니다. 메신저·메일에 붙여넣으세요.'), () => toast('복사하지 못했습니다.')); }\n    catch (e) { toast('복사하지 못했습니다.'); }\n  }\n\n  function openNoticeForm(id) {\n    const lead = isLead();\n    const n = id ? D.notices.find(x => x.id === id) : { category: lead ? '공지' : '질문', level: '일반', title: '', body: '', start: '', end: '', pinned: false, files: [] };\n    const cats = D.noticeCategories.filter(c => lead || D.noticeLeaderOnly.indexOf(c) \u003c 0 || c === n.category);\n    $('#modal').classList.remove('wide');\n    openModal(`\n      \u003ch3>${id ? '글 수정' : '글쓰기'}\u003c/h3>\n      \u003cp class=\"sub\">${lead ? '공지·응대지침은 담당자 모두에게 안내됩니다.' : '자료나 질문을 올리면 다른 담당자·총괄이 댓글로 답합니다.'}\u003c/p>\n      \u003cform class=\"form\" id=\"nForm\" novalidate>\n        \u003cdiv class=\"two\">\n          \u003cdiv class=\"fld\">\u003clabel for=\"nCat\">분류\u003c/label>\u003cselect class=\"field-in\" id=\"nCat\">${cats.map(c => `\u003coption ${c === n.category ? 'selected' : ''}>${esc(c)}\u003c/option>`).join('')}\u003c/select>\u003c/div>\n          ${lead ? `\u003cdiv class=\"fld\">\u003clabel for=\"nLv\">중요도\u003c/label>\u003cselect class=\"field-in\" id=\"nLv\">${['일반', '중요', '긴급'].map(l => `\u003coption ${l === n.level ? 'selected' : ''}>${l}\u003c/option>`).join('')}\u ) : { category: ruleCat !== 'all' ? ruleCat : D.ruleCategories[0], title: '', body: '', year: D.year, owner: '', link: '', files: [] };\n    $('#modal').classList.remove('wide');\n    openModal(`\n      \u003ch3>${id ? '기준 수정' : '기준 등록'}\u003c/h3>\n      \u003cp class=\"sub\">담당자 모두가 응대할 때 보는 기준입니다. 국세청 안내 원문이 있으면 링크나 파일로 함께 올려주세요.\u003c/p>\n      \u003cform class=\"form\" id=\"rForm\" novalidate>\n        \u003cdiv class=\"two\">\n          \u003cdiv class=\"fld\">\u003clabel for=\"rCat\">분류\u003c/label>\u003cselect class=\"field-in\" id=\"rCat\">${D.ruleCategories.map(c => `\u003coption ${c === r.category ? 'selected' : ''}>${esc(c)}\u003c/option>`).join('')}\u003c/select>\u003c/div>\n          \u003cdiv class=\"fld\">\u003clabel for=\"rYear\">적용 귀속연도\u003c/label>\u003cinput class=\"field-in\" id=\"rYear\" inputmode=\"numeric\" value=\"${esc(r.year)}\">\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"fld\">\u003clabel for=\"rTitle\">제목\u003c/label>\u003cinput class=\"field-in\" id=\"rTitle\" value=\"${esc(r.title)}\">\u003c/div>\n        \u003cdiv class=\"fld\">\u003clabel for=\"rBody\">내용\u003c/label>\u003ctextarea class=\"field-in\" id=\"rBody\" style=\"min-height:200px\">${esc(r.body)}\u003c/textarea>\u003c/div>\n        \u003cdiv class=\"two\">\n          \u003cdiv class=\"fld\">\u003clabel for=\"rOwner\">담당\u003c/label>\u003cinput class=\"field-in\" id=\"rOwner\" value=\"${esc(r.owner)}\">\u003c/div>\n          \u003cdiv class=\"fld\">\u003clabel for=\"rLink\">원문 링크 (선택)\u003c/label>\u003cinput class=\"field-in\" id=\"rLink\" value=\"${esc(r.link)}\" placeholder=\"https://\">\u003c/div>\n        \u003c/div>\n        ${uploaderHtml('rule', '첨부 파일 (국세청 안내 PDF 등)')}\n        ${id ? '\u003cdiv class=\"fld\">\u003clabel for=\"rNote\">개정 내용 (이력에 남습니다)\u003c/label>\u003cinput class=\"field-in\" id=\"rNote\" placeholder=\"예) 월세 공제 한도 750만원 → 1,000만원\">\u003c/div>' : ''}\n        \u003cdiv class=\"msg err\" id=\"rErr\" hidden>\u003c/div>\n        \u003cdiv class=\"modal-actions\">\u003cbutton type=\"button\" class=\"btn\" onclick=\"closeModal()\">취소\u003c/button>\u003cbutton type=\"submit\" class=\"btn primary\" id=\"rOk\">${id ? '저장' : '등록'}\u003c/button>\u003c/div>\n      \u003c/form>`);\n    initUploader('rule', 'rules', r.files);\n    $('#rForm').onsubmit = e => {\n      e.preventDefault();\n      const rule = { id: id || '', category: $('#rCat').value, year: $('#rYear').value.trim(), title: $('#rTitle').value.trim(), body: $('#rBody').value.trim(), owner: $('#rOwner').value.trim(), link: $('#rLink').value.trim(), changeNote: $('#rNote') ? $('#rNote').value.trim() : '', files: uploadedFiles('rule') };\n      if (!rule.title || !rule.body) { $('#rErr').textContent = '제목과 내용을 입력해 주세요.'; $('#rErr').hidden = false; return; }\n      if (uploadsBusy('rule')) { $('#rErr').textContent = BUSY_MSG; $('#rErr').hidden = false; return; }\n      $('#rOk').disabled = true;\n      call('apiSaveRule', rule)\n        .then(data => { applyData(data); closeModal(); openRule = data.savedId; ruleCat = 'all'; ruleQuery = ''; page = 'rules'; render(); toast(id ? '기준을 수정했습니다. 개정 이력에 기록됩니다.' : '기준을 등록했습니다.'); })\n        .catch(err => { $('#rOk').disabled = false; $('#rErr').textContent = err.message || String(err); $('#rErr').hidden = false; });\n    };\n  }\n\n  function deleteRule(id) {\n    openModal(`\u003ch3>이 기준을 삭제할까요?\u003c/h3>\u003cp class=\"sub\">목록에서 사라지고, 시트와 개정 이력에는 기록이 남습니다.\u003c/p>\n      \u003cdiv class=\"modal-actions\">\u003cbutton class=\"btn\" onclick=\"closeModal()\">취소\u003c/button>\u003cbutton class=\"btn primary\" id=\"rdOk\">삭제\u003c/button>\u003c/div>`);\n    $('#rdOk').onclick = () => {\n      $('#rdOk').disabled = true;\n      call('apiDeleteRule', id).then(data => { applyData(data); openRule = null; closeModal(); render(); toast('삭제했습니다.'); }).catch(e => { closeModal(); fail(e); });\n    };\n  }\n\n  /* ================= 첨부파일 ================= */\n  function filesFiltered() {\n    const q = fileQuery.trim().toLowerCase();\n    return D.files\n      .filter(f => fileArea === 'all' || f.area === fileArea)\n      .filter(f => !q || [f.name, f.refLabel, f.uploader, f.memo].join(' ').toLowerCase().includes(q));\n  }\n  function refCell(f) {\n    if (f.area === 'person') {\n      const p = D.people.find(x => (x.empNo || x.id) === f.ref);\n      return p && can('review') ? `\u003cbutton class=\"linkish\" onclick=\"openPerson('${esc(p.id)}')\">${esc(f.refLabel)}\u003c/button>` : esc(f.refLabel);\n    }\n    if (f.area === 'notice' && can('notice')) return `\u003cbutton class=\"linkish\" onclick=\"openNotice='${esc(f.ref)}';showOld=true;go('notice')\">${esc(f.refLabel)}\u003c/button>`;\n    if (f.area === 'rules' && can('rules')) return `\u003cbutton class=\"linkish\" onclick=\"openRule='${esc(f.ref)}';ruleCat='all';ruleQuery='';go('rules')\">${esc(f.refLabel)}\u003c/button>`;\n    return esc(f.memo || f.refLabel || '-');\n  }\n  function fileListHtml() {\n    const list = filesFiltered();\n    const rows = list.map(f => `\n      \u003ctr>\n        \u003ctd data-label=\"파일\" class=\"c-wide\">${fileRow(f, { link: true })}\u003c/td>\n        \u003ctd data-label=\"구분\">\u003cspan class=\"chip ${f.area === 'person' ? 'info' : 'plain'}\">${esc(D.fileAreas[f.area] || f.area)}\u003c/span>\u003c/td>\n        \u003ctd data-label=\"대상 · 메모\">${refCell(f)}\u003c/td>\n        \u003ctd data-label=\"올린 사람\">${esc(f.uploader)}\u003c/td>\n        \u003ctd data-label=\"올린 일시\" class=\"nowrap\">${esc(f.date.slice(2, 16))}\u003c/td>\n        \u003ctd class=\"c-act\" data-label=\"\">${f.uploader === D.me.name || isLead() ? `\u003cbutton class=\"btn small danger\" onclick=\"deleteFile('${esc(f.id)}')\">삭제\u003c/button>` : ''}\u003c/td>\n      \u003c/tr>`).join('');\n    return rows ? `\u003cdiv class=\"table-wrap\">\u003ctable class=\"t cards\">\u003cthead>\u003ctr>\u003cth>파일\u003c/th>\u003cth>구분\u003c/th>\u003cth>대상 · 메모\u003c/th>\u003cth>올린 사람\u003c/th>\u003cth>올린 일시\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${rows}\u003c/tbody>\u003c/table>\u003c/div>`\n      : `\u003cdiv class=\"empty\">${fileQuery ? '검색 결과가 없습니다.' : '올린 파일이 없습니다.'}\u003c/div>`;\n  }\n  VIEWS.files = function () {\n    const areas = ['all'].concat(Object.keys(D.fileAreas).filter(a => D.files.some(f => f.area === a) || a === 'etc'));\n    const cnt = a => a === 'all' ? D.files.length : D.files.filter(f => f.area === a).length;\n    return `\n      \u003cdiv class=\"head\">\n        \u003cdiv>\u003ch1>첨부파일\u003c/h1>\u003cp>대상자 증빙, 공지·기준 첨부, 일반 자료를 한곳에서 찾아보세요. 파일은 구글 드라이브에서 열립니다.\u003c/p>\u003c/div>\n        \u003cdiv class=\"head-actions\">${D.me.name || D.me.isAdmin ? '\u003cbutton class=\"btn primary\" onclick=\"openEtcUpload()\">자료 올리기\u003c/button>' : ''}\u003c/div>\n      \u003c/div>\n      \u003csection class=\"panel\">\n        \u003cdiv class=\"filters\" style=\"margin-bottom:12px\">${areas.map(a => `\u003cbutton aria-pressed=\"${fileArea === a}\" onclick=\"fileArea='${a}';render()\">${a === 'all' ? '전체' : esc(D.fileAreas[a])} ${cnt(a)}\u003c/button>`).join('')}\u003c/div>\n        \u003cinput class=\"search\" id=\"fileSearch\" type=\"search\" placeholder=\"파일명·대상자·올린 사람 검색\" value=\"${esc(fileQuery)}\" aria-label=\"첨부파일 검색\">\n        \u003cdiv id=\"fileList\">${fileListHtml()}\u003c/div>\n        \u003cp style=\"color:var(--muted);font-size:12px;margin:10px 0 0\">증빙 서류에는 개인정보가 들어 있습니다. 첨부 폴더는 담당자에게만 공유되며, 삭제한 파일은 드라이브 휴지통으로 이동합니다(30일 안에 복구 가능).\u003c/p>\n      \u003c/section>`;\n  };\n  function openEtcUpload() {\n    $('#modal').classList.remove('wide');\n    openModal(`\n      \u003ch3>자료 올리기\u003c/h3>\n      \u003cp class=\"sub\">서식, 안내문처럼 특정 대상자와 상관없는 자료를 올립니다. 대상자 증빙은 서류 검토에서 대상자를 눌러 올리세요.\u003c/p>\n      \u003cdiv class=\"form\">\n        \u003cdiv class=\"fld\">\u003clabel for=\"etcMemo\">메모 (무슨 자료인지)\u003c/label>\u003cinput class=\"field-in\" id=\"etcMemo\" placeholder=\"예) 2026 귀속 소득·세액공제신고서 양식\">\u003c/div>\n        ${uploaderHtml('etc', '파일 (올리는 즉시 저장됩니다)')}\n        \u003cdiv class=\"modal-actions\">\u003cbutton type=\"button\" class=\"btn primary\" onclick=\"closeModal();render()\">완료\u003c/button>\u003c/div>\n      \u003c/div>`);\n    initUploader('etc', 'etc', [], { memo: () => $('#etcMemo').value.trim() });\n  }\n  function deleteFile(id) {\n    const f = D.files.find(x => x.id === id);\n    openModal(`\u003ch3>${esc(f.name)} 파일을 삭제할까요?\u003c/h3>\n      \u003cp class=\"sub\">목록에서 빼고 드라이브 휴지통으로 옮깁니다. ${f.area === 'notice' || f.area === 'rules' ? '이 파일이 붙은 글에서도 열 수 없게 됩니다.' : ''}\u003c/p>\n      \u003cdiv class=\"modal-actions\">\u003cbutton class=\"btn\" onclick=\"closeModal()\">취소\u003c/button>\u003cbutton class=\"btn primary\" id=\"dfOk\">삭제\u003c/button>\u003c/div>`);\n    $('#dfOk').onclick = () => {\n      $('#dfOk').disabled = true;\n      call('apiDeleteFile', id).then(data => { applyData(data); closeModal(); render(); toast('삭제했습니다.'); }).catch(e => { closeModal(); fail(e); });\n    };\n  }\n\n  /* ================= 권한 관리 (관리자 전용) ================= */\n  let A = null;          // 서버에서 받은 관리 데이터\n  let aDraft = null;     // 편집 중인 담당자 목록\n  let aDirty = false;\n  let menuDraft = null;\n  let adminTab = 'members';\n  let adminLoading = false;\n\n  function loadAdmin(force) {\n    if (adminLoading) return;\n    adminLoading = true;\n    call('apiAdminData', !!force)\n      .then(d => { adminLoading = false; setAdmin(d); })\n      .catch(e => { adminLoading = false; fail(e); });\n  }\n  function refreshAdmin() { A = null; render(); loadAdmin(true); }\n  function setAdmin(data) {\n    A = data;\n    aDraft = A.members.map(m => Object.assign({}, m));\n    menuDraft = JSON.parse(JSON.stringify(A.menuAccess));\n    aDirty = false;\n    if (page === 'admin') render();\n  }\n\n  const ACCESS = {\n    sheet: { owner: ['ok', '소유자'], editor: ['ok', '편집'], viewer: ['pend', '보기만'], none: ['no', '없음'] },\n    folder: { owner: ['ok', '소유자'], editor: ['ok', '편집'], viewer: ['pend', '보기만'], none: ['no', '없음'], 'n/a': ['plain', '설정 필요'] },\n  };\n  function accessChip(kind, v) {\n    const [cls, label] = (ACCESS[kind][v] || ['plain', '–']);\n    return `\u003cspan class=\"chip ${cls}\">${cls === 'ok' ? '✓ ' : cls === 'no' ? '✕ ' : ''}${label}\u003c/span>`;\n  }\n  function needsAttention(name) {\n    const st = A && A.status.people[name];\n    if (!st) return true;\n    return ['sheet', 'folder'].some(k => { const c = (ACCESS[k][st[k]] || ['plain'])[0]; return c === 'no' || c === 'pend'; });\n  }\n\n  VIEWS.admin = function () {\n    if (!A) return '\u003cdiv class=\"loading\">권한 정보를 불러오는 중… (시트·첨부 폴더 공유 상태를 확인합니다)\u003c/div>';\n    const tab = (k, label) => `\u003cbutton role=\"tab\" aria-selected=\"${adminTab === k}\" onclick=\"adminTab='${k}';render()\">${label}\u003c/button>`;\n    const body = { members: adminMembers, menus: adminMenus, settings: adminSettings, guide: adminGuide }[adminTab]();\n    return `\u003cdiv class=\"subtabs\" role=\"tablist\">${tab('members', '담당자·권한')}${tab('menus', '메뉴 권한')}${tab('settings', '설정')}${tab('guide', '접속 안내')}\u003c/div>${body}`;\n  };\n\n  function adminMembers() {\n    const res = A.status.resources;\n    const resLine = (label, x) => `\u003cspan>${x.ok ? '\u003cspan class=\"chip ok\">✓\u003c/span>' : '\u003cspan class=\"chip pend\">!\u003c/span>'} \u003cb>${label}\u003c/b> ${esc(x.ok ? x.name : x.error)}\u003c/span>`;\n    const issues = aDraft.filter(m => m.email && needsAttention(m.name)).length;\n    const noEmail = aDraft.filter(m => m.name && !m.email).length;\n    const sel = (i, v) => `\u003cselect class=\"field-in\" style=\"padding:5px 6px;min-width:90px\" onchange=\"aEdit(${i},'role',this.value)\">${A.roles.map(r => `\u003coption ${r === v ? 'selected' : ''}>${r}\u003c/option>`).join('')}\u003c/select>`;\n    const rows = aDraft.map((m, i) => {\n      const st = A.status.people[m.name];\n      const saved = A.members.some(x => x.name === m.name && x.email === m.email);\n      return `\u003ctr>\n        \u003ctd data-label=\"이름\">\u003cinput class=\"field-in\" style=\"padding:5px 8px;min-width:80px\" value=\"${esc(m.name)}\" oninput=\"aEdit(${i},'name',this.value)\" aria-label=\"이름\">\u003c/td>\n        \u003ctd data-label=\"이메일\" class=\"c-wide\">\u003cinput class=\"field-in\" style=\"padding:5px 8px;min-width:190px\" value=\"${esc(m.email)}\" placeholder=\"이메일\" oninput=\"aEdit(${i},'email',this.value)\" aria-label=\"이메일\">\u003c/td>\n        \u003ctd data-label=\"역할\">${sel(i, m.role)}\u003c/td>\n        \u003ctd data-label=\"관리자\">\u003clabel style=\"display:flex;justify-content:center\">\u003cinput type=\"checkbox\" class=\"check\" ${m.admin ? 'checked' : ''} onchange=\"aEdit(${i},'admin',this.checked)\" aria-label=\"관리자\">\u003c/label>\u003c/td>\n        ${st && saved ? `\u003ctd data-label=\"스프레드시트\">${accessChip('sheet', st.sheet)}\u003c/td>\u003ctd data-label=\"첨부 폴더\">${accessChip('folder', st.folder)}\u003c/td>`\n          : `\u003ctd colspan=\"2\" class=\"c-wide\">\u003cspan style=\"color:var(--muted);font-size:12px\">${m.email ? '저장 후 \"권한 한 번에 적용\"을 누르세요' : '이메일을 입력하세요'}\u003c/span>\u003c/td>`}\n        \u003ctd class=\"c-x\">\u003cbutton class=\"icon-btn\" onclick=\"aRemove(${i})\" aria-label=\"${esc(m.name)} 삭제\">×\u003c/button>\u003c/td>\n      \u003c/tr>`;\n    }).join('');\n    return `\n      \u003cdiv class=\"head\">\n        \u003cdiv>\u003ch1>담당자·권한\u003c/h1>\u003cp>담당자를 등록하고 \"권한 한 번에 적용\"을 누르면 시트·첨부 폴더 공유와 시트 보호를 자동으로 합니다.\u003c/p>\u003c/div>\n        \u003cdiv class=\"head-actions\">\n          \u003cbutton class=\"btn\" onclick=\"refreshAdmin()\">상태 새로고침\u003c/button>\n          \u003cbutton class=\"btn primary\" onclick=\"applyAll()\">권한 한 번에 적용\u003c/button>\n        \u003c/div>\n      \u003c/div>\n      \u003csection class=\"panel\">\n        \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px\">${resLine('스프레드시트', res.sheet)}${resLine('첨부 폴더', res.folder)}\u003c/div>\n        \u003cp style=\"margin:10px 0 0;font-size:13px;color:${issues || noEmail ? 'var(--warn-ink)' : 'var(--ok-ink)'}\">\n          ${issues || noEmail ? `확인이 필요한 사람 ${issues}명${noEmail ? ` · 이메일 없는 사람 ${noEmail}명` : ''}. \"권한 한 번에 적용\"을 누르면 대부분 해결됩니다.` : '✓ 모든 담당자의 권한이 정상입니다.'}\n        \u003c/p>\n      \u003c/section>\n      \u003csection class=\"panel\">\n        \u003cdiv class=\"table-wrap\">\n          \u003ctable class=\"t cards admin-cards\">\n            \u003cthead>\u003ctr>\u003cth>이름\u003c/th>\u003cth>이메일\u003c/th>\u003cth>역할\u003c/th>\u003cth style=\"text-align:center\">관리자\u003c/th>\u003cth>스프레드시트\u003c/th>\u003cth>첨부 폴더\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>${rows}\u003c/tbody>\n          \u003c/table>\n        \u003c/div>\n        \u003cbutton class=\"btn small add\" onclick=\"aAdd()\">+ 담당자 추가\u003c/button>\n        \u003cp style=\"color:var(--muted);font-size:12.5px;margin:12px 0 0;line-height:1.7\">\n          · \u003cb>응대담당\u003c/b>: [대상자] 시트 담당자 칸에 이름이 있는 사람의 1차 검토 입력\u003cbr>\n          · \u003cb>2차검토\u003c/b>: 2차검토 담당자 칸에 이름이 있는 사람의 2차 검토 입력\u003cbr>\n          · \u003cb>총괄\u003c/b>: 모든 대상자 입력·담당 배정, 공지·응대지침·기준 등록\u003cbr>\n          · \u003cb>관리자\u003c/b>: 이 권한 관리 메뉴 사용 (스프레드시트 소유자는 항상 관리자)\u003cbr>\n          · 이름은 [대상자] 시트의 담당자 칸과 똑같이 적어야 내 담당으로 연결됩니다.\n        \u003c/p>\n      \u003c/section>\n      \u003cdiv class=\"save-bar\" id=\"aBar\" ${aDirty ? '' : 'hidden'}>\u003cdiv class=\"left\">변경사항이 있습니다. 저장해야 반영됩니다.\u003c/div>\n        \u003cdiv style=\"display:flex;gap:8px\">\u003cbutton class=\"btn\" onclick=\"setAdmin(A)\">되돌리기\u003c/button>\u003cbutton class=\"btn primary\" id=\"aSave\" onclick=\"saveMembers()\">변경사항 저장\u003c/button>\u003c/div>\u003c/div>`;\n  }\n\n  function aEdit(i, k, v) {\n    aDraft[i][k] = v;\n    aDirty = true;\n    const bar = $('#aBar');\n    if (bar) bar.hidden = false;\n  }\n  function aAdd() {\n    aDraft.push({ order: aDraft.length + 1, name: '', email: '', role: A.roles[0], admin: false });\n    aDirty = true;\n    render();\n    const inputs = document.querySelectorAll('#main tbody input[aria-label=\"이름\"]');\n    inputs[inputs.length - 1].focus();\n  }\n  function saveMembers(after) {\n    const list = aDraft.filter(m => m.name.trim()).map((m, i) => Object.assign({}, m, { order: i + 1 }));\n    const btn = $('#aSave');\n    if (btn) { btn.disabled = true; btn.textContent = '저장 중…'; }\n    return call('apiSaveMembers', list)\n      .then(data => { setAdmin(data); load(); toast('담당자 목록을 저장했습니다.'); if (after) after(); })\n      .catch(e => { if (btn) { btn.disabled = false; btn.textContent = '변경사항 저장'; } fail(e); });\n  }\n  function aRemove(i) {\n    const m = aDraft[i];\n    const saved = A.members.some(x => x.name === m.name);\n    if (!saved) { aDraft.splice(i, 1); render(); return; }\n    openModal(`\u003ch3>${esc(m.name)}님을 담당자에서 뺄까요?\u003c/h3>\n      \u003cp class=\"sub\">담당자 목록에서 지우고 저장합니다. [대상자] 시트의 담당자 칸과 응대기록은 그대로 남습니다.\u003c/p>\n      ${m.email ? `\u003clabel style=\"display:flex;gap:8px;align-items:center;margin-bottom:14px\">\u003cinput type=\"checkbox\" class=\"check\" id=\"rvk\" checked> 스프레드시트·첨부 폴더 접근도 해제 (${esc(m.email)})\u003c/label>` : ''}\n      \u003cdiv class=\"modal-actions\">\u003cbutton class=\"btn\" onclick=\"closeModal()\">취소\u003c/button>\u003cbutton class=\"btn primary\" id=\"rmOk\">빼기\u003c/button>\u003c/div>`);\n    $('#rmOk').onclick = () => {\n      const revoke = $('#rvk') && $('#rvk').checked;\n      $('#rmOk').disabled = true;\n      aDraft.splice(i, 1);\n      saveMembers(() => {\n        if (!revoke) { closeModal(); return; }\n        call('apiRevokeAccess', m.email).then(res => { setAdmin(res.data); showLog(`${m.name}님 접근 해제`, res.log); }).catch(e => { closeModal(); fail(e); });\n      });\n    };\n  }\n  function applyAll() {\n    const run = () => {\n      openModal(`\u003ch3>권한을 적용하는 중…\u003c/h3>\u003cp class=\"sub\">시트·첨부 폴더 공유와 시트 보호를 처리하고 있습니다. 인원에 따라 10~30초 걸릴 수 있습니다.\u003c/p>`);\n      call('apiApplyPermissions').then(res => { setAdmin(res.data); showLog('권한 적용 결과', res.log); }).catch(e => { closeModal(); fail(e); });\n    };\n    if (aDirty) saveMembers(run); else run();\n  }\n  function showLog(title, log) {\n    openModal(`\u003ch3>${esc(title)}\u003c/h3>\n      \u003cdiv class=\"list\" style=\"margin:10px 0 16px\">${log.map(l => `\u003cdiv class=\"list-row\" style=\"grid-template-columns:24px minmax(0,1fr)\">\u003cspan>${l.ok ? '✓' : '⚠️'}\u003c/span>\u003cspan class=\"meta\" style=\"color:${l.ok ? 'var(--ink)' : 'var(--warn-ink)'}\">${esc(l.text)}\u003c/span>\u003c/div>`).join('')}\u003c/div>\n      \u003cdiv class=\"modal-actions\">\u003cbutton class=\"btn primary\" onclick=\"closeModal()\">확인\u003c/button>\u003c/div>`);\n  }\n\n  function adminMenus() {\n    const rows = A.menus.map(m => `\u003ctr>\u003ctd class=\"strong\">${esc(m.label)}\u003c/td>\n      ${A.roles.map(r => `\u003ctd style=\"text-align:center\">\u003cinput type=\"checkbox\" class=\"check\" ${menuDraft[r][m.key] !== false ? 'checked' : ''} onchange=\"menuDraft['${r}']['${m.key}']=this.checked;$('#mSave').disabled=false\" aria-label=\"${r} ${esc(m.label)}\">\u003c/td>`).join('')}\n      \u003ctd style=\"text-align:center\">\u003cinput type=\"checkbox\" class=\"check\" checked disabled aria-label=\"관리자 ${esc(m.label)}\">\u003c/td>\u003c/tr>`).join('');\n    return `\n      \u003cdiv class=\"head\">\u003cdiv>\u003ch1>메뉴 권한\u003c/h1>\u003cp>역할마다 볼 수 있는 메뉴를 정합니다. 끈 메뉴는 화면에서 숨겨지고, 서버에서도 해당 기능과 데이터가 막힙니다.\u003c/p>\u003c/div>\u003c/div>\n      \u003csection class=\"panel\">\n        \u003cdiv class=\"table-wrap\">\u003ctable class=\"t\" style=\"max-width:620px\">\n          \u003cthead>\u003ctr>\u003cth>메뉴\u003c/th>${A.roles.map(r => `\u003cth style=\"text-align:center\">${r}\u003c/th>`).join('')}\u003cth style=\"text-align:center\">관리자\u003c/th>\u003c/tr>\u003c/thead>\n          \u003ctbody>${rows}\u003c/tbody>\n        \u003c/table>\u003c/div>\n        \u003cp style=\"color:var(--muted);font-size:13px;margin:12px 0\">· 관리자는 항상 모든 메뉴와 [권한 관리] 메뉴를 봅니다.\u003cbr>· 서류 검토를 끄면 그 역할에게는 대상자 증빙 첨부도 보이지 않습니다.\u003c/p>\n        \u003cbutton class=\"btn primary\" id=\"mSave\" disabled onclick=\"saveMenus()\">저장\u003c/button>\n      \u003c/section>`;\n  }\n  function saveMenus() {\n    $('#mSave').disabled = true;\n    call('apiSaveMenuAccess', menuDraft).then(data => { A.menuAccess = data.menuAccess; menuDraft = JSON.parse(JSON.stringify(data.menuAccess)); load(); toast('메뉴 권한을 저장했습니다. 다른 담당자는 새로고침하면 반영됩니다.'); })\n      .catch(e => { $('#mSave').disabled = false; fail(e); });\n  }\n\n  function adminSettings() {\n    const st = A.settings, res = A.status.resources;\n    const status = x => `\u003cdiv class=\"hint\" style=\"color:${x.ok ? 'var(--ok-ink)' : 'var(--warn-ink)'}\">${x.ok ? `✓ 연결됨: ${esc(x.name)}` : esc(x.error)}\u003c/div>`;\n    return `\n      \u003cdiv class=\"head\">\u003cdiv>\u003ch1>설정\u003c/h1>\u003cp>[설정] 시트를 직접 고치지 않아도 여기서 바꿀 수 있습니다.\u003c/p>\u003c/div>\u003c/div>\n      \u003csection class=\"panel\" style=\"max-width:640px\">\n        \u003cform class=\"form\" id=\"sForm\" novalidate>\n          \u003cdiv class=\"two\">\n            \u003cdiv class=\"fld\">\u003clabel for=\"sTeam\">업무명 (화면 제목)\u003c/label>\u003cinput class=\"field-in\" id=\"sTeam\" value=\"${esc(st.team)}\">\u003c/div>\n            \u003cdiv class=\"fld\">\u003clabel for=\"sYear\">귀속연도\u003c/label>\u003cinput class=\"field-in\" id=\"sYear\" inputmode=\"numeric\" value=\"${esc(st.year)}\">\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"fld\">\u003clabel for=\"sFolder\">첨부 폴더 (폴더 주소 또는 ID)\u003c/label>\u003cinput class=\"field-in\" id=\"sFolder\" value=\"${esc(st.folderId)}\" placeholder=\"https://drive.google.com/drive/folders/... 를 그대로 붙여넣어도 됩니다\">${status(res.folder)}\u003c/div>\n          \u003cp class=\"hint\">증빙 서류가 올라가는 폴더입니다. 새 폴더를 만들어 담당자에게만 공유하세요. 새 귀속연도를 시작할 때는 스프레드시트를 복사해 새로 쓰는 것을 권장합니다.\u003c/p>\n          \u003cdiv class=\"msg err\" id=\"sErr\" hidden>\u003c/div>\n          \u003cdiv>\u003cbutton class=\"btn primary\" id=\"sOk\">저장\u003c/button>\u003c/div>\n        \u003c/form>\n      \u003c/section>`;\n  }\n  document.addEventListener('submit', e => {\n    if (e.target.id !== 'sForm') return;\n    e.preventDefault();\n    const s2 = { team: $('#sTeam').value, year: $('#sYear').value, folderId: $('#sFolder').value };\n    $('#sOk').disabled = true;\n    call('apiSaveSettings', s2).then(data => { setAdmin(data); load(); toast('설정을 저장했습니다.'); })\n      .catch(err => { $('#sOk').disabled = false; $('#sErr').textContent = err.message || String(err); $('#sErr').hidden = false; });\n  });\n\n  function adminGuide() {\n    const url = A.webAppUrl || '(아직 웹앱으로 배포되지 않았습니다)';\n    const msg = `[${D.team} 안내]\\n아래 주소로 접속해 주세요. (회사 구글 계정으로 로그인)\\n${url}\\n\\n· 처음 접속하면 \"권한 검토\" 화면이 한 번 나옵니다. \"허용\"을 눌러주세요.\\n· \"Google에서 확인하지 않은 앱\" 경고가 나오면 \"고급 → 이동\"을 누르면 됩니다.\\n· 서류 검토 > 내 담당에서 맡은 대상자를 확인하고, 응대한 내용은 응대기록에 남겨주세요.`;\n    return `\n      \u003cdiv class=\"head\">\u003cdiv>\u003ch1>접속 안내\u003c/h1>\u003cp>담당자에게 보낼 주소와 안내 문구입니다.\u003c/p>\u003c/div>\u003c/div>\n      \u003csection class=\"panel\" style=\"max-width:720px;display:flex;flex-direction:column;gap:12px\">\n        \u003cdiv class=\"fld\">\u003clabel for=\"gUrl\">웹앱 주소\u003c/label>\u003cdiv style=\"display:flex;gap:6px\">\u003cinput class=\"field-in\" id=\"gUrl\" value=\"${esc(url)}\" readonly>\u003cbutton class=\"btn\" onclick=\"copyText('gUrl')\">복사\u003c/button>\u003c/div>\u003c/div>\n        \u003cdiv class=\"fld\">\u003clabel for=\"gMsg\">안내 문구 (메신저·메일에 붙여넣기)\u003c/label>\u003ctextarea class=\"field-in\" id=\"gMsg\" style=\"min-height:190px\">${esc(msg)}\u003c/textarea>\u003c/div>\n        \u003cdiv>\u003cbutton class=\"btn primary\" onclick=\"copyText('gMsg')\">안내 문구 복사\u003c/button>\u003c/div>\n      \u003c/section>`;\n  }\n  function copyText(id) {\n    const el = $('#' + id);\n    const done = () => toast('복사했습니다.');\n    try {\n      navigator.clipboard.writeText(el.value).then(done, () => { el.select(); toast('선택했습니다. Ctrl+C로 복사하세요.'); });\n    } catch (e) { el.select(); toast('선택했습니다. Ctrl+C로 복사하세요.'); }\n  }\n\n  /* ================= 첨부 파일 올리기 ================= */\n  const MAX_FILE = 10 * 1024 * 1024;\n  const UP = {};\n  function fileSize(n) { return n >= 1048576 ? `${(n / 1048576).toFixed(1)}MB` : `${Math.max(1, Math.round(n / 1024))}KB`; }\n  function extOf(name) { const m = /\\.([a-z0-9]+)$/i.exec(name || ''); return m ? m[1].toUpperCase().slice(0, 4) : 'FILE'; }\n  function extClass(ext) {\n    ext = ext.toLowerCase();\n    if (ext === 'pdf') return 'pdf';\n    if (['xls', 'xlsx', 'csv'].includes(ext)) return 'xls';\n    if (['doc', 'docx', 'hwp', 'hwpx', 'txt'].includes(ext)) return 'doc';\n    if (['ppt', 'pptx'].includes(ext)) return 'ppt';\n    if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'heic'].includes(ext)) return 'img';\n    return '';\n  }\n  function fileRow(f, opts) {\n    opts = opts || {};\n    const ext = extOf(f.name);\n    const inner = `\u003cspan class=\"ext ${extClass(ext)}\">${esc(ext)}\u003c/span>\n      \u003cspan class=\"fn\">${esc(f.name)}${opts.inline ? '' : `\u003cspan class=\"fs\">${opts.msg ? esc(opts.msg) : fileSize(f.size || 0)}\u003c/span>`}\u003c/span>${opts.tail || ''}`;\n    return opts.link\n      ? `\u003ca class=\"file\" href=\"${esc(f.url)}\" target=\"_blank\" rel=\"noopener\" title=\"${esc(f.name)} (${fileSize(f.size || 0)})\">${inner}\u003c/a>`\n      : `\u003cdiv class=\"file ${opts.status || ''}\">${inner}\u003c/div>`;\n  }\n  function filesView(files, inline) {\n    return files && files.length ? `\u003cdiv class=\"files ${inline ? 'inline' : ''}\">${files.map(f => fileRow(f, { link: true, inline })).join('')}\u003c/div>` : '';\n  }\n\n  function uploaderHtml(key, label) {\n    return `\u003cdiv class=\"fld\">\u003clabel for=\"drop-${key}\">${label}\u003c/label>\n      \u003cdiv class=\"drop\" id=\"drop-${key}\" tabindex=\"0\" role=\"button\">\u003cspan class=\"desk-only\">파일을 끌어다 놓거나 \u003c/span>\u003cu>눌러서 파일 선택\u003c/u> · 한 파일 10MB 이하\u003c/div>\n      \u003cinput type=\"file\" id=\"file-${key}\" multiple hidden>\n      \u003cdiv class=\"files\" id=\"up-${key}\">\u003c/div>\u003c/div>`;\n  }\n  /** extra: { ref, refLabel, memo(함수), onDone } — 대상자 증빙·일반 자료는 올리자마자 [첨부]에 기록된다 */\n  function initUploader(key, area, existing, extra) {\n    UP[key] = { area, extra: extra || {}, items: (existing || []).map(f => ({ status: 'done', f })) };\n    const drop = $('#drop-' + key), input = $('#file-' + key);\n    drop.onclick = () => input.click();\n    drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } };\n    drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };\n    drop.ondragleave = () => drop.classList.remove('over');\n    drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); addFiles(key, e.dataTransfer.files); };\n    input.onchange = () => { addFiles(key, input.files); input.value = ''; };\n    drawUploader(key);\n  }\n  function addFiles(key, list) {\n    const ex = UP[key].extra;\n    Array.from(list).forEach(file => {\n      const it = { status: 'up', f: { name: file.name, size: file.size } };\n      UP[key].items.push(it);\n      if (file.size > MAX_FILE) { it.status = 'err'; it.msg = '10MB를 넘어 올릴 수 없습니다'; return; }\n      const reader = new FileReader();\n      reader.onload = () => {\n        call('apiUploadFile', { name: file.name, mimeType: file.type, data: String(reader.result).split(',')[1], area: UP[key].area, ref: ex.ref || '', refLabel: ex.refLabel || '', memo: typeof ex.memo === 'function' ? ex.memo() : '' })\n          .then(res => { it.status = 'done'; it.f = res.file; applyData(res); if (ex.onDone) ex.onDone(); })\n          .catch(e => { it.status = 'err'; it.msg = e.message || String(e); })\n          .then(() => drawUploader(key));\n      };\n      reader.onerror = () => { it.status = 'err'; it.msg = '파일을 읽지 못했습니다'; drawUploader(key); };\n      reader.readAsDataURL(file);\   /* ================= 기타 동작 ================= */\n  function go(p) { page = p; closeModal(); render(); window.scrollTo(0, 0); }\n\n  $('#nav').addEventListener('click', e => {\n    const b = e.target.closest('button');\n    if (b) go(b.dataset.page);\n  });\n\n  // 예시 화면 전용: 보는 사람 전환\n  function renderDemoBar() {\n    const bar = $('#demoBar');\n    if (!window.MockApi || !MockApi.users) return;\n    bar.hidden = false;\n    bar.innerHTML = `\u003cb>예시 화면\u003c/b>\u003cspan>모든 이름·사번·금액은 예시 데이터입니다.\u003c/span>\n      \u003clabel>보는 사람 \u003cselect id=\"demoUser\">${MockApi.users().map(u => `\u003coption value=\"${esc(u.email)}\" ${u.email === D.me.email ? 'selected' : ''}>${esc(u.name)} (${esc(u.role)})\u003c/option>`).join('')}\u003c/select>\u003c/label>`;\n    $('#demoUser').onchange = e => { MockApi.setUser(e.target.value); A = null; reviewTab = 'mine'; load(); };\n  }\n\n  load();\n\u003c/script>\n\n\u003c/body>\u003c/html>\n", "lines": 1730, "size": 113133}, {"name": "appsscript", "ext": ".json", "file": "appsscript.json", "kind": "json", "code": "{\n  \"timeZone\": \"Asia/Seoul\",\n  \"exceptionLogging\": \"STACKDRIVER\",\n  \"runtimeVersion\": \"V8\"\n}", "lines": 5, "size": 93}]</script>
<script>
  const FILES = JSON.parse(document.getElementById('files').textContent);
  const KEY = 'ye-install-copied-v1';
  let copied = {};
  try { copied = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { copied = {}; }
  let current = 0;

  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const kb = n => n >= 1024 ? `${Math.round(n / 1024)}KB` : `${n}B`;

  function save() { try { localStorage.setItem(KEY, JSON.stringify(copied)); } catch (e) { /* 저장 불가 */ } }

  function toast(text) {
    const t = $('#toast');
    t.textContent = text;
    t.hidden = false;
    clearTimeout(toast.t);
    toast.t = setTimeout(() => { t.hidden = true; }, 3500);
  }

  function howTo(f) {
    if (f.kind === 'json') {
      return `<ol>
        <li>Apps Script 왼쪽 <b>⚙ 프로젝트 설정</b> → <b>"편집기에 appsscript.json 매니페스트 파일 표시"</b> 체크</li>
        <li>편집기로 돌아와 <code>appsscript.json</code>을 열고 <b>전체 선택(Ctrl+A) → 붙여넣기</b></li>
      </ol>`;
    }
    if (f.name === 'Code') {
      return `<ol>
        <li>스프레드시트에서 <b>확장 프로그램 → Apps Script</b></li>
        <li>처음부터 있는 <code>Code.gs</code>를 열고 <b>전체 선택(Ctrl+A) → 지우기</b></li>
        <li>복사한 내용 붙여넣기 → 💾 저장(Ctrl+S)</li>
      </ol>`;
    }
    const menu = f.kind === 'html' ? 'HTML' : '스크립트';
    const first = '';
    return `<ol>
      <li>Apps Script 왼쪽 <b>파일</b> 옆 <b>+</b> → <b>${menu}</b></li>
      <li>이름에 <code>${esc(f.name)}</code> 입력 (확장자 없이) → Enter</li>
      <li>안에 있던 기본 내용을 <b>전부 지우고</b> 붙여넣기 → 💾 저장(Ctrl+S)</li>
      ${first}
    </ol>`;
  }

  function render() {
    const groups = [['script', '스크립트'], ['html', 'HTML'], ['json', '설정']];
    $('#list').innerHTML = groups.map(([k, label]) => {
      const items = FILES.map((f, i) => ({ f, i })).filter(x => x.f.kind === k);
      if (!items.length) return '';
      return `<div class="group">${label}</div>` + items.map(({ f, i }) => `
        <button class="file ${copied[f.file] ? 'done' : ''}" aria-current="${i === current}" data-i="${i}">
          <span class="tick" aria-hidden="true">✓</span>
          <span class="nm">${esc(f.name)}<span class="ext">${esc(f.ext)}</span></span>
          <span class="sz">${kb(f.size)}</span>
        </button>`).join('');
    }).join('');

    const f = FILES[current];
    const tagClass = f.kind === 'script' ? '' : f.kind;
    const tagText = f.kind === 'script' ? '스크립트' : f.kind === 'html' ? 'HTML' : '설정 파일';
    $('#pane').innerHTML = `
      <div class="pane-head">
        <h2>${esc(f.file)}<span class="tag ${tagClass}">${tagText}</span></h2>
        <div class="actions">
          <button class="btn primary" id="copyBtn">${copied[f.file] ? '다시 복사' : '복사'}</button>
          <button class="btn" id="nextBtn" ${current === FILES.length - 1 ? 'disabled' : ''}>다음 파일 →</button>
        </div>
      </div>
      <div class="how">${howTo(f)}</div>
      <p class="note">${f.lines.toLocaleString()}줄 · ${kb(f.size)} · 아래 상자는 내용 확인용입니다. 복사 버튼이 안 되면 상자를 눌러 Ctrl+A → Ctrl+C 하세요.</p>
      <textarea id="code" readonly spellcheck="false" aria-label="${esc(f.file)} 코드">${esc(f.code)}</textarea>`;

    const n = FILES.filter(x => copied[x.file]).length;
    $('#count').textContent = `${n} / ${FILES.length} 복사`;
    $('#bar').style.width = `${n / FILES.length * 100}%`;
  }

  function markCopied(f) {
    copied[f.file] = true;
    save();
    render();
  }

  function copyCurrent() {
    const f = FILES[current];
    const ta = $('#code');
    const fallback = () => {
      ta.focus();
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      if (ok) { markCopied(f); toast(`${f.file} 복사했습니다. Apps Script에 붙여넣으세요.`); }
      else toast('코드를 선택했습니다. Ctrl+C(맥은 ⌘+C)로 복사하세요.');
    };
    try {
      navigator.clipboard.writeText(f.code).then(() => {
        markCopied(f);
        toast(`${f.file} 복사했습니다. Apps Script에 붙여넣으세요.`);
      }, fallback);
    } catch (e) { fallback(); }
  }

  document.addEventListener('click', e => {
    const item = e.target.closest('.file');
    if (item) { current = Number(item.dataset.i); render(); window.scrollTo({ top: 0 }); return; }
    if (e.target.closest('#copyBtn')) { copyCurrent(); return; }
    if (e.target.closest('#nextBtn') && current < FILES.length - 1) { current += 1; render(); }
  });

  render();
</script>
