) + 1; });\n  return counts;\n}\n\nfunction freshStatus_(ctx) {\n  const status = accessStatus_(ctx);\n  putCache_('access', status, 300);\n  return status;\n}\n\n/**\n * 담당자별 접근 상태\n * sheet/folder: 'editor' | 'viewer' | 'none' | 'owner' ('n/a' = 폴더 설정 필요)\n */\nfunction accessStatus_(ctx) {\n  const lower = list => list.map(u => u.getEmail().toLowerCase());\n  const res = { sheet: { ok: true, name: ctx.ss.getName() }, folder: { ok: false } };\n\n  const file = DriveApp.getFileById(ctx.ss.getId());\n  const fileOwner = file.getOwner() ? file.getOwner().getEmail().toLowerCase() : '';\n  const fileEditors = lower(file.getEditors());\n  const fileViewers = lower(file.getViewers());\n\n  let folderEditors = [], folderViewers = [], folderOwner = '';\n  const folderId = String(ctx.cfg[CFG.DRIVE_FOLDER] || '').trim();\n  if (folderId) {\n    try {\n      const folder = DriveApp.getFolderById(folderId);\n      folderOwner = folder.getOwner() ? folder.getOwner().getEmail().toLowerCase() : '';\n      folderEditors = lower(folder.getEditors());\n      folderViewers = lower(folder.getViewers());\n      res.folder = { ok: true, name: folder.getName() };\n    } catch (e) {\n      res.folder = { ok: false, error: '폴더를 찾을 수 없거나 접근 권한이 없습니다.' };\n    }\n  } else {\n    res.folder = { ok: false, error: '첨부 폴더가 비어 있습니다.' };\n  }\n\n  const level = (email, owner, editors, viewers) =>\n    email === owner ? 'owner' : editors.indexOf(email) >= 0 ? 'editor' : viewers.indexOf(email) >= 0 ? 'viewer' : 'none';\n\n  const people = {};\n  ctx.members.filter(m => m.email).forEach(m => {\n    const e = m.email.toLowerCase();\n    people[m.name] = {\n      sheet: level(e, fileOwner, fileEditors, fileViewers),\n      folder: res.folder.ok ? level(e, folderOwner, folderEditors, folderViewers) : 'n/a',\n    };\n  });\n  return { resources: res, people: people };\n}\n\n/* ---------- 저장 ---------- */\n\n/** 담당자 목록 전체 저장. list: [{order, name, email, role, admin, scope}] */\nfunction apiSaveMembers(list) {\n  const ctx = getContext();\n  requireAdmin_(ctx);\n\n  const rows = (list || []).map((m, i) => ({\n    order: Number(m.order) || i + 1,\n    name: String(m.name || '').trim(),\n    email: String(m.email || '').trim().toLowerCase(),\n    role: ROLES.indexOf(m.role) >= 0 ? m.role : ROLES[0],\n    admin: !!m.admin,\n    scope: normScope_(m.scope),\n  })).filter(m => m.name);\n\n  const names = {};\n  rows.forEach(m => {\n    if (names[m.name]) throw new Error(`이름이 겹칩니다: ${m.name}. 동명이인은 \"김민지A\"처럼 구분해 주세요. ([대상자] 시트의 담당자 칸도 같은 이름으로 적어야 합니다)`);\n    names[m.name] = true;\n    if (m.email && !/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(m.email)) throw new Error(`이메일 형식을 확인해 주세요: ${m.name} (${m.email})`);\n  });\n\n  const sh = ctx.ss.getSheetByName(SHEET.MEMBERS);\n  ensureHeader_(sh, 6, '열람범위');\n  if (sh.getLastRow() >= 2) sh.getRange(2, 1, sh.getLastRow() - 1, 6).clearContent();\n  if (rows.length) {\n    sh.getRange(2, 1, rows.length, 6).setValues(rows.map(m => [m.order, m.name, m.email, m.role, m.admin ? 'Y' : 'N', m.scope]));\n  }\n  clearCaches_();\n  return adminData_(getContext(), true);\n}\n\nfunction apiSaveMenuAccess(access) {\n  const ctx = getContext();\n  requireAdmin_(ctx);\n  setupMenuSheet_(ctx.ss);\n  const sh = ctx.ss.getSheetByName(MENU_SHEET);\n  const v = sh.getRange(1, 1, sh.getLastRow(), sh.getLastColumn()).getValues();\n  const header = v[0].map(String);\n  const out = v.slice(1).map(row => ROLES.map(r => {\n    const allowed = access && access[r] ? access[r][String(row[1])] !== false : true;\n    return allowed ? 'Y' : 'N';\n  }));\n  const firstRoleCol = header.indexOf(ROLES[0]) + 1;\n  sh.getRange(2, firstRoleCol, out.length, ROLES.length).setValues(out);\n  dropCache_('menus');\n  return { menuAccess: getMenuAccess_() };\n}\n\nfunction apiSaveSettings(s) {\n  const ctx = getContext();\n  requireAdmin_(ctx);\n  const year = String(s.year || '').trim();\n  if (!/^\\d{4}$/.test(year)) throw new Error('기본 연도는 2026처럼 네 자리로 입력해 주세요.');\n  if (year !== ctx.baseYear) {\n    if (ctx.years.indexOf(year) \u003c 0) throw new Error(`${year}년 시트가 아직 없습니다. 「새 연도 시작」으로 만들어 주세요.`);\n    // 예전 이름의 시트가 남아 있으면 지금 기본 연도 이름으로 먼저 고정한다\n    migrateLegacySheets_(ctx.ss, ctx.baseYear);\n  }\n  setConfigValue(CFG.TEAM, String(s.team || '').trim());\n  setConfigValue(CFG.YEAR, Number(year));\n  setConfigValue(CFG.DRIVE_FOLDER, String(s.folderId || '').trim().replace(/^.*\\/folders\\//, '').replace(/[?#].*$/, ''));\n  clearCaches_();\n  return adminData_(getContext(), false);\n}\n\n/* ---------- 연도 마감 ---------- */\n\n/**\n * 마감(close=true) / 마감 풀기(false). 마감된 연도는 총괄·관리자 말고는 조회만 할 수 있고,\n * 그 연도의 대상자·응대기록·일정 시트도 총괄·관리자만 고칠 수 있게 잠근다.\n */\nfunction apiCloseYear(year, close) {\n  const ctx = getContext();\n  requireAdmin_(ctx);\n  year = String(year || '').trim();\n  if (ctx.years.indexOf(year) \u003c 0) throw new Error(`${year}년 자료가 없습니다.`);\n  const list = ctx.closed.filter(y => y !== year);\n  if (close) list.push(year);\n  list.sort();\n  setConfigValue(CFG.CLOSED, list.join(','));\n  dropCache_(CK.ctx);\n  const fresh = getContext();\n  let warn = '';\n  try { applyProtections_(fresh); } catch (e) { warn = '시트 잠금은 걸지 못했습니다. 「권한 한 번에 적용」을 눌러 다시 걸어 주세요.'; }\n  return { data: adminData_(fresh, false), warn: warn };\n}\n\n/* ---------- 새 연도 시작 ---------- */\n\n/**\n * opts: { year, carry: 이전 연도 대상자의 기본 정보·담당 가져오기, copyRules: 기준 복사, makeBase: 기본 연도로 지정 }\n * 대상자_YYYY·응대기록_YYYY·일정_YYYY 시트를 만든다. 이전 연도 시트는 그대로 남아 연도 선택으로 볼 수 있다.\n */\nfunction apiStartYear(opts) {\n  const ctx = getContext();\n  const me = requireAdmin_(ctx);\n  const year = String(opts && opts.year || '').trim();\n  if (!/^\\d{4}$/.test(year)) throw new Error('연도는 2027처럼 네 자리로 입력해 주세요.');\n  if (ctx.years.indexOf(year) >= 0 && ctx.ss.getSheetByName(`${SHEET.PEOPLE}_${year}`)) throw new Error(`${year}년은 이미 있습니다.`);\n  const from = String(opts.from || ctx.baseYear);\n\n  const lock = LockService.getDocumentLock();\n  if (!lock.tryLock(30000)) throw new Error(LOCK_BUSY_MSG);\n  let carried = 0, copied = 0;\n  try {\n    migrateLegacySheets_(ctx.ss, ctx.baseYear);\n    setupPeopleSheets_(ctx.ss, year);\n    setupEventSheet_(ctx.ss, year);\n\n    // 이전 연도 명단: 기본 정보와 담당 배정만 가져오고, 진행 체크·특이사항은 비운다\n    if (opts.carry) {\n      const src = ctx.ss.getSheetByName(`${SHEET.PEOPLE}_${from}`);\n      const dst = ctx.ss.getSheetByName(`${SHEET.PEOPLE}_${year}`);\n      if (src && src.getLastRow() >= 2) {\n        const smap = colMap_(src), dmap = colMap_(dst);\n        const keep = COLS.filter(c => c.who === 'info' || c.who === 'lead' || c.who === 'assign');\n        const rows = src.getRange(2, 1, src.getLastRow() - 1, src.getLastColumn()).getValues()\n          .filter(r => keep.some(c => smap[c.k] && String(r[smap[c.k] - 1]).trim()))\n          .map(r => {\n            const out = new Array(dst.getLastColumn()).fill('');\n            keep.forEach(c => { if (smap[c.k] && dmap[c.k]) out[dmap[c.k] - 1] = c.t === 'bool' ? (boolOf_(c, r[smap[c.k] - 1]) ? 'O' : '') : r[smap[c.k] - 1]; });\n            return out;\n          });\n        if (rows.length) dst.getRange(2, 1, rows.length, rows[0].length).setValues(rows);\n        carried = rows.length;\n      }\n    }\n\n    // 기준 복사: 이전 연도 기준을 새 연도로 한 벌 더 만든다 (개정 이력은 새로 시작)\n    if (opts.copyRules) {\n      const sh = ctx.ss.getSheetByName(RULES.SHEET);\n      const hsh = ctx.ss.getSheetByName(RULES.HISTORY);\n      if (sh && sh.getLastRow() >= 2) {\n        const all = sh.getRange(2, 1, sh.getLastRow() - 1, RCOL.FILES).getValues();\n        let next = Math.max.apply(null, all.map(r => Number(r[0]) || 0)) + 1;\n        const now = new Date();\n        const rows = all.filter(r => String(r[0]) && String(r[RCOL.DELETED - 1]).toUpperCase() !== 'Y' && cellText_(r[RCOL.YEAR - 1]) === from)\n          .map(r => { const x = r.slice(); x[0] = next++; x[RCOL.YEAR - 1] = year; x[RCOL.UPDATED - 1] = now; x[RCOL.EDITOR - 1] = me.name || me.email; return x; });\n        if (rows.length) {\n          sh.getRange(sh.getLastRow() + 1, 1, rows.length, RCOL.FILES).setValues(rows);\n          hsh.getRange(hsh.getLastRow() + 1, 1, rows.length, 4).setValues(rows.map(x => [String(x[0]), now, me.name || me.email, `${from}년 기준에서 복사`]));\n        }\n        copied = rows.length;\n      }\n    }\n\n    // 지난 연도(예: 진행 중 2026년에 2025년 추가)는 기본 연도로 바꾸지 않는다\n    if (opts.makeBase !== false && Number(year) > Number(ctx.baseYear)) setConfigValue(CFG.YEAR, Number(year));\n    try { applyProtections_(getContext()); } catch (e) { /* 보호는 권한 한 번에 적용에서 다시 걸 수 있다 */ }\n  } finally {\n    lock.releaseLock();\n  }\n  clearCaches_();\n  // 시작한 관리자는 바로 새 연도를 보게 한다\n  PropertiesService.getUserProperties().setProperty('VIEW_YEAR', year);\n  VIEW_MEMO_ = null;\n  return { carried: carried, copied: copied, data: adminData_(getContext(), true) };\n}\n\n/* ---------- 권한 한 번에 적용 ---------- */\n\n/** 결과: { log: [{ok, text}], data } */\nfunction apiApplyPermissions() {\n  const ctx = getContext();\n  requireAdmin_(ctx);\n  const log = [];\n  const ok = text => log.push({ ok: true, text: text });\n  const warn = text => log.push({ ok: false, text: text });\n  const people = ctx.members.filter(m => m.email);\n  ctx.members.filter(m => !m.email).forEach(m => warn(`${m.name}: 이메일이 없어 건너뛰었습니다.`));\n\n  // 1. 스프레드시트\n  const file = DriveApp.getFileById(ctx.ss.getId());\n  const fileOwner = file.getOwner() ? file.getOwner().getEmail().toLowerCase() : '';\n  const fileEditors = file.getEditors().map(u => u.getEmail().toLowerCase());\n  people.forEach(m => {\n    const e = m.email.toLowerCase();\n    if (e === fileOwner || fileEditors.indexOf(e) >= 0) return;\n    try { file.addEditor(e); ok(`${m.name}: 스프레드시트 편집 권한을 줬습니다.`); }\n    catch (err) { warn(`${m.name}: 스프레드시트 공유 실패 (${err.message})`); }\n  });\n\n  // 2. 첨부 폴더\n  const folderId = String(ctx.cfg[CFG.DRIVE_FOLDER] || '').trim();\n  if (!folderId) {\n    warn('첨부 폴더가 비어 있어 폴더 공유를 건너뛰었습니다. (관리 > 설정)');\n  } else {\n    try {\n      const folder = DriveApp.getFolderById(folderId);\n      const owner = folder.getOwner() ? folder.getOwner().getEmail().toLowerCase() : '';\n      const editors = folder.getEditors().map(u => u.getEmail().toLowerCase());\n      people.forEach(m => {\n        const e = m.email.toLowerCase();\n        if (e === owner || editors.indexOf(e) >= 0) return;\n        try { folder.addEditor(e); ok(`${m.name}: 첨부 폴더 편집 권한을 줬습니다.`); }\n        catch (err) { warn(`${m.name}: 첨부 폴더 공유 실패 (${err.message})`); }\n      });\n    } catch (err) {\n      warn('첨부 폴더에 접근할 수 없어 폴더 공유를 건너뛰었습니다.');\n    }\n  }\n\n  // 3. 시트 보호\n  try {\n    applyProtections_(ctx);\n    ok('시트 보호를 적용했습니다. (설정·담당자: 관리자만 / 기준: 총괄·관리자만)');\n  } catch (err) {\n    warn(`시트 보호 적용 실패 (${err.message})`);\n  }\n\n  clearCaches_();\n  if (!log.some(l => l.ok && /권한을 줬습니다/.test(l.text))) ok('새로 줄 공유 권한은 없었습니다. 모두 이미 공유되어 있습니다.');\n  return { log: log, data: adminData_(getContext(), false) };\n}\n\n/** 담당자를 뺄 때 시트·폴더 접근 해제 (소유자와 본인은 건드리지 않는다) */\nfunction apiRevokeAccess(email) {\n  const ctx = getContext();\n  const me = requireAdmin_(ctx);\n  const e = String(email || '').trim().toLowerCase();\n  if (!e) throw new Error('이메일이 없습니다.');\n  if (e === me.email) throw new Error('본인의 접근은 해제할 수 없습니다.');\n  const log = [];\n\n  const file = DriveApp.getFileById(ctx.ss.getId());\n  if (file.getOwner() && file.getOwner().getEmail().toLowerCase() === e) throw new Error('스프레드시트 소유자의 접근은 해제할 수 없습니다.');\n  try { file.removeEditor(e); } catch (err) { /* 편집자가 아님 */ }\n  try { file.removeViewer(e); } catch (err) { /* 뷰어가 아님 */ }\n  log.push({ ok: true, text: '스프레드시트 접근을 해제했습니다.' });\n\n  const folderId = String(ctx.cfg[CFG.DRIVE_FOLDER] || '').trim();\n  if (folderId) {\n    try {\n      const folder = DriveApp.getFolderById(folderId);\n      try { folder.removeEditor(e); } catch (err) { /* 편집자가 아님 */ }\n      try { folder.removeViewer(e); } catch (err) { /* 뷰어가 아님 */ }\n      log.push({ ok: true, text: '첨부 폴더 접근을 해제했습니다.' });\n    } catch (err) {\n      log.push({ ok: false, text: '첨부 폴더 접근 해제 실패' });\n    }\n  }\n  return { log: log, data: adminData_(getContext(), false) };\n}\n\n// ===================================================================\n// WebApp.gs\n// ===================================================================\n\n/**\n * 웹앱\n *\n * 배포: Apps Script 편집기 > 배포 > 새 배포 > 웹 앱\n *   - 다음 사용자 인증 정보로 실행: \"웹 앱에 액세스하는 사용자\"\n *   - 액세스 권한: 조직 내 모든 사용자 또는 \"Google 계정이 있는 모든 사용자\"\n * 접속한 사람의 이메일로 [담당자] 시트에서 이름/역할을 찾고, 시트 보호 권한도 그대로 적용된다.\n */\n\nfunction doGet() {\n  // 첫 화면 데이터를 페이지에 같이 넣어 보낸다: 페이지가 뜬 뒤 서버에 한 번 더 묻는 왕복(보통 1초 안팎)이 없어진다\n  const t = HtmlService.createTemplateFromFile('App');\n  let boot = null, team = '연말정산 검토';\n  try {\n    boot = apiBootstrap();\n    team = boot.team || team;\n  } catch (e) { /* 못 만들면 화면이 평소처럼 따로 불러온다 */ }\n  // \u003cscript type=\"application/json\"> 안에 넣으므로 '\u003c'는 \\u003c로 바꿔 태그가 끊기지 않게 한다\n  t.boot = boot ? JSON.stringify(boot).replace(/\u003c/g, '\\\\u003c') : 'null';\n  return t.evaluate()\n    .setTitle(team)\n    .addMetaTag('viewport', 'width=device-width, initial-scale=1, viewport-fit=cover')\n    // 휴대폰 홈 화면에 추가했을 때 앱처럼 보이게\n    .addMetaTag('mobile-web-app-capable', 'yes')\n    .addMetaTag('apple-mobile-web-app-capable', 'yes');\n}\n\n/* ---------- 캐시 ----------\n * 화면을 열 때마다 시트 전체를 다시 읽지 않도록 60초간 캐시한다 (담당자 전체가 공유).\n * 웹앱에서 저장하면 해당 부분 캐시를 바로 갱신하고, 시트를 직접 고친 내용은 최대 60초 뒤 반영된다.\n *\n * 여러 사람이 동시에 쓸 때 꼬이지 않게:\n *  - 저장할 때마다 그 부분의 \"버전\"을 바꾼다. 시트를 읽어 캐시를 만드는 동안 누가 저장했으면\n *    그 캐시는 버린다 (저장 전 내용으로 덮어쓰지 않게).\n *  - 캐시 한 칸은 100KB까지라 바이트 기준으로 나눠 저장한다 (한글은 한 글자가 3바이트).\n *  - 대상자 목록은 열 이름을 반복하지 않는 배열로 줄여 저장·전송한다 (2천 명 기준 절반 이하).\n */\n\nconst CACHE_TTL = 60;\nconst CHUNK_BYTES = 95000;\nconst MAX_CHUNKS = 100;\n// 연도별 데이터는 보고 있는 연도를 붙여 따로 캐시한다 (people:2026, people:2027 …)\nconst CK = {\n  get people() { return 'people:' + viewYear_(); },\n  get logs() { return 'logs:' + viewYear_(); },\n  get notices() { return 'notices:' + viewYear_(); },\n  get rules() { return 'rules:' + viewYear_(); },\n  get files() { return 'files:' + viewYear_(); },\n  get events() { return 'events:' + viewYear_(); },\n  owner: 'owner',\n  ctx: 'ctx',\n};\n\n/* 대상자 목록 압축: { k: [열 키…], r: [[행, 최종수정, 수정자, 값…]] } — 빈 칸·체크 안 됨은 0, 체크는 1 */\nfunction encodePeople_(list) {\n  const keys = COLS.map(c => c.k);\n  return {\n    k: keys,\n    r: list.map(p => {\n      const r = [p.row || 0, p.updated || 0, p.editor || 0];\n      COLS.forEach(c => { const v = p[c.k]; r.push(c.t === 'bool' ? (v ? 1 : 0) : (v === '' || v == null ? 0 : v)); });\n      while (r.length > 1 && r[r.length - 1] === 0) r.pop();\n      return r;\n    }),\n  };\n}\n\nfunction decodePeople_(obj) {\n  if (!obj || !obj.k || obj.k.join(',') !== COLS.map(c => c.k).join(',')) return null; // 열 구성이 바뀌었으면 새로 읽는다\n  return obj.r.map(r => {\n    const p = { row: r[0] || 0, updated: r[1] ? String(r[1]) : '', editor: r[2] ? String(r[2]) : '' };\n    COLS.forEach((c, i) => { const v = r[i + 3]; p[c.k] = c.t === 'bool' ? v === 1 : (v === 0 || v == null ? '' : String(v)); });\n    p.id = p.empNo || 'r' + p.row;\n    return p;\n  });\n}\n\nconst CODECS_ = { people: { enc: encodePeople_, dec: decodePeople_ } };\nconst codec_ = key => CODECS_[String(key).split(':')[0]];\n\n/** 문자열을 UTF-8 바이트 기준으로 자른다 */\nfunction splitBytes_(s, max) {\n  const parts = [];\n  let start = 0, bytes = 0;\n  for (let i = 0; i \u003c s.length; i++) {\n    const c = s.charCodeAt(i);\n    const b = c \u003c 0x80 ? 1 : c \u003c 0x800 ? 2 : c >= 0xD800 && c \u003c= 0xDBFF ? 4 : c >= 0xDC00 && c \u003c= 0xDFFF ? 0 : 3;\n    if (bytes + b > max) { parts.push(s.slice(start, i)); start = i; bytes = 0; }\n    bytes += b;\n  }\n  parts.push(s.slice(start));\n  return parts;\n}\n\n/** 캐시에 있으면 값, 없으면 null (새로 만들지 않는다) */\nfunction peekCache_(key) {\n  try {\n    const cache = CacheService.getDocumentCache();\n    const hit = cache.get(key);\n    let value = null;\n    if (hit && hit.indexOf('CHUNKS:') === 0) {\n      const n = Number(hit.slice(7));\n      const keys = Array.from({ length: n }, (_, i) => `${key}#${i}`);\n      const parts = cache.getAll(keys);\n      if (keys.every(k => parts[k] != null)) value = JSON.parse(keys.map(k => parts[k]).join(''));\n    } else if (hit) {\n      value = JSON.parse(hit);\n    }\n    const cd = codec_(key);\n    return value !== null && cd ? cd.dec(value) : value;\n  } catch (e) { /* 캐시 오류는 없는 것으로 본다 */ }\n  return null;\n}\n\n/** 저장(쓰기) 버전: 쓸 때마다 새 값. 캐시를 만드는 동안 바뀌었는지 확인하는 데 쓴다 */\nfunction verOf_(key) {\n  try { return CacheService.getDocumentCache().get('v:' + key) || ''; } catch (e) { return ''; }\n}\nfunction bumpVer_(key) {\n  try { CacheService.getDocumentCache().put('v:' + key, Utilities.getUuid(), 21600); } catch (e) { /* 캐시 없음 */ }\n}\n\nfunction cached_(key, build, ttl) {\n  const hit = peekCache_(key);\n  if (hit !== null) return hit;\n  const v0 = verOf_(key);\n  const value = build();\n  putCache_(key, value, ttl);\n  // 읽는 동안 누가 저장했으면 방금 넣은 (저장 전) 캐시는 버린다\n  if (verOf_(key) !== v0) removeCache_(key);\n  return value;\n}\n\nfunction putCache_(key, value, ttl) {\n  try {\n    const cache = CacheService.getDocumentCache();\n    const cd = codec_(key);\n    const s = JSON.stringify(cd ? cd.enc(value) : value);\n    const parts = splitBytes_(s, CHUNK_BYTES);\n    if (parts.length === 1) {\n      cache.put(key, s, ttl || CACHE_TTL);\n      return true;\n    }\n    if (parts.length > MAX_CHUNKS) return false; // 너무 크면 캐시하지 않는다\n    const map = {};\n    parts.forEach((x, i) => { map[`${key}#${i}`] = x; });\n    cache.putAll(map, ttl || CACHE_TTL);\n    cache.put(key, 'CHUNKS:' + parts.length, ttl || CACHE_TTL);\n    return true;\n  } catch (e) { return false; /* 캐시할 수 없으면 건너뛴다 */ }\n}\n\n/**\n * 저장한 뒤 캐시를 그 자리에서 고친다 (없으면 다음 조회 때 시트에서 새로 읽으므로 그냥 둔다).\n * 같은 캐시를 동시에 고치면 한쪽이 사라질 수 있으므로 문서 잠금 안에서 부른다.\n */\nfunction patchCache_(key, fn) {\n  bumpVer_(key);\n  const list = peekCache_(key);\n  if (list === null) return;\n  fn(list);\n  if (!putCache_(key, list)) removeCache_(key);\n}\n\nfunction removeCache_(key) {\n  try { CacheService.getDocumentCache().remove(key); } catch (e) { /* 캐시 없음 */ }\n}\n\nfunction dropCache_(key) {\n  bumpVer_(key);\n  removeCache_(key);\n}\n\nfunction clearCaches_() {\n  try {\n    const keys = [CK.ctx, 'menus', 'access'];\n    const years = yearsWith_(findYears_(), baseYear_());\n    years.forEach(y => ['people', 'logs', 'notices', 'rules', 'files', 'events'].forEach(k => keys.push(`${k}:${y}`)));\n    CacheService.getDocumentCache().removeAll(keys);\n  } catch (e) { /* 캐시 없음 */ }\n}\n\nconst READERS = { people: readPeople_, logs: readLogs_, notices: readNotices_, rules: readRules_, files: readFiles_, events: readEvents_ };\n\n/** 저장 후 바뀐 부분만 새로 읽어 캐시에 넣고 화면에 돌려준다 */\nfunction refreshPart_(part) {\n  const key = CK[part];\n  bumpVer_(key);\n  const v0 = verOf_(key);\n  const value = READERS[part](book_());\n  putCache_(key, value);\n  if (verOf_(key) !== v0) removeCache_(key); // 읽는 사이 다른 저장이 있었으면 캐시는 버린다\n  const out = {};\n  out[part] = forMe_(part, value, currentMember_(getContext().members));\n  return out;\n}\n\n/**\n * 접속자에게 보낼 만큼만 거른다 (캐시는 전체를 두고, 보낼 때마다 거른다)\n *  - 대상자·응대기록·대상자 증빙: 열람범위 안의 대상자만\n *  - 첨부: 메뉴 권한이 있는 구분만\n */\nfunction forMe_(part, value, me) {\n  if (part === 'people') return encodePeople_(value.filter(p => canSee_(me, p)));\n  if (part === 'logs' || part === 'files') {\n    const list = part === 'files' ? visibleFiles_(value, me) : value;\n    const seen = visibleEmpNos_(me);\n    if (!seen) return list;\n    if (part === 'logs') return list.filter(l => seen.has(String(l.empNo)));\n    return list.filter(f => f.area !== 'person' || seen.has(String(f.ref)));\n  }\n  return value;\n}\n\n\n/** 열람범위로 볼 수 있는 대상자인가 */\nfunction canSee_(me, p) {\n  if (me.isLeader || me.isAdmin || me.scope === SCOPE_ALL) return true;\n  if (!me.name) return false;\n  if (p.owner === me.name || p.owner2 === me.name) return true;\n  const list = me.scope.split(',');\n  // 담당자가 정해지지 않은 대상자는 누구나 본다 (맡을 사람을 찾을 수 있게)\n  return !p.owner || list.indexOf(p.owner) >= 0;\n}\n\n/** 범위가 제한된 사람이 볼 수 있는 사원번호(또는 행 id) 모음. 전체면 null */\nfunction visibleEmpNos_(me) {\n  if (me.isLeader || me.isAdmin || me.scope === SCOPE_ALL) return null;\n  const people = cached_(CK.people, () => readPeople_(book_()));\n  return new Set(people.filter(p => canSee_(me, p)).map(p => p.empNo || p.id));\n}\n\n/** 메뉴 권한이 없는 구분의 첨부는 보내지 않는다 (예: 서류 검토 권한이 없으면 대상자 증빙 제외) */\nfunction visibleFiles_(files, me) {\n  const menus = me.menus;\n  return files.filter(f => menus.indexOf(FILES.MENU[f.area] || 'files') >= 0);\n}\n\n/* ---------- 조회 ---------- */\n\n/* ---------- 자동 새로고침 ----------\n * 화면은 1~2분마다 apiPoll(내가 가진 버전)을 부른다. 그 사이 누가 저장해 버전이 바뀐 부분만 다시 보낸다.\n * 바뀐 게 없으면 캐시에서 버전 몇 개만 읽고 끝나므로 가볍다.\n */\nconst POLL_PARTS_ = ['people', 'logs', 'notices', 'events', 'files'];\n\nfunction partsFor_(me) {\n  const can = k => me.menus.indexOf(k) >= 0;\n  return {\n    people: can('review') || can('dash'),\n    logs: can('review'),\n    notices: can('notice') || can('dash'),\n    events: can('dash'),\n    files: can('files') || can('review'),\n  };\n}\n\n/** 버전은 자료를 읽기 전에 잰다 (읽는 사이 저장이 있으면 다음 번에 다시 받게) */\nfunction stampOf_(year) {\n  const keys = POLL_PARTS_.map(p => `v:${p}:${year}`);\n  let got = {};\n  try { got = CacheService.getDocumentCache().getAll(keys); } catch (e) { /* 캐시 없음 */ }\n  const out = { year: year };\n  POLL_PARTS_.forEach((p, i) => { out[p] = got[keys[i]] || ''; });\n  return out;\n}\n\nfunction apiPoll(stamp) {\n  const ctx = getContext();\n  const me = currentMember_(ctx.members);\n  const want = partsFor_(me);\n  const now = stampOf_(ctx.year);\n  const out = { stamp: now, year: ctx.year };\n  if (!stamp || stamp.year !== ctx.year) return out; // 다른 연도를 보고 있으면 화면이 알아서 다시 불러온다\n  POLL_PARTS_.forEach(part => {\n    if (!want[part] || stamp[part] === now[part]) return;\n    out[part] = forMe_(part, cached_(CK[part], () => READERS[part](ctx.ss)), me);\n  });\n  return out;\n}\n\n/** 화면 전체 데이터. 권한 없는 메뉴의 데이터는 아예 보내지 않는다 */\nfunction apiBootstrap() {\n  const ctx = getContext();\n  const ss = ctx.ss;\n  const me = currentMember_(ctx.members);\n  const can = k => me.menus.indexOf(k) >= 0;\n  const seesPeople = can('review') || can('dash');\n  const stamp = stampOf_(ctx.year);\n  return {\n    stamp: stamp,\n    team: String(ctx.cfg[CFG.TEAM] || '연말정산 검토'),\n    year: ctx.year,\n    baseYear: ctx.baseYear,\n    years: ctx.years,\n    closedYears: ctx.closed,\n    closed: ctx.closed.indexOf(ctx.year) >= 0,\n    eventKinds: EVENT_KINDS,\n    events: can('dash') ? cached_(CK.events, () => readEvents_(ss)) : [],\n    sheetUrl: me.isAdmin ? ss.getUrl() : '', // 원본 시트 단추는 관리자에게만\n    me: me,\n    staff: ctx.members.map(m => ({ name: m.name, role: m.role })),\n    cols: COLS.map(c => ({ k: c.k, l: c.l, t: c.t || '', g: c.g, who: c.who, re: c.re || '', loose: !!c.loose })),\n    logKinds: LOG_KINDS,\n    noticeCategories: NOTICE.CATEGORIES,\n    noticeLeaderOnly: NOTICE.LEADER_ONLY,\n    ruleCategories: RULES.CATEGORIES,\n    fileAreas: FILES.AREAS,\n    people: seesPeople ? forMe_('people', cached_(CK.people, () => readPeople_(ss)), me) : [],\n    logs: can('review') ? forMe_('logs', cached_(CK.logs, () => readLogs_(ss)), me) : [],\n    notices: can('notice') || can('dash') ? cached_(CK.notices, () => readNotices_(ss)) : [],\n    reads: getReads_(),\n    rules: can('rules') ? cached_(CK.rules, () => readRules_(ss)) : [],\n    files: can('files') || can('review') ? forMe_('files', cached_(CK.files, () => readFiles_(ss)), me) : [],\n  };\n}\n\n/** 보는 연도 바꾸기 (사람마다 따로 저장). 바꾼 연도의 화면 데이터를 돌려준다 */\nfunction apiSetYear(year) {\n  const ctx = getContext();\n  const y = String(year || '');\n  if (ctx.years.indexOf(y) \u003c 0) throw new Error(`${y}년 자료가 없습니다.`);\n  PropertiesService.getUserProperties().setProperty('VIEW_YEAR', y);\n  VIEW_MEMO_ = null;\n  return apiBootstrap();\n}\n\n/** 접속자 → 담당자 정보 */\nfunction currentMember_(members) {\n  const email = (Session.getActiv <script>
  const FILES = JSON.parse(document.getElementById('files').textContent);
  const KEY = 'ye-install-copied-v1';
  let copied = {};
  try { copied = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { copied = {}; }
  let current = 0;

  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const kb = n => n >= 1024 ? `${Math.round(n / 1024)}KB` : `${n}B`;

  function save() { try { localStorage.setItem(KEY, JSON.stringify(copied)); } catch (e) { /* 저장 불가 */ } }

  function toast(text) {
    const t = $('#toast');
    t.textContent = text;
    t.hidden = false;
    clearTimeout(toast.t);
    toast.t = setTimeout(() => { t.hidden = true; }, 3500);
  }

  function howTo(f) {
    if (f.kind === 'json') {
      return `<ol>
        <li>Apps Script 왼쪽 <b>⚙ 프로젝트 설정</b> → <b>"편집기에 appsscript.json 매니페스트 파일 표시"</b> 체크</li>
        <li>편집기로 돌아와 <code>appsscript.json</code>을 열고 <b>전체 선택(Ctrl+A) → 붙여넣기</b></li>
      </ol>`;
    }
    if (f.name === 'Code') {
      return `<ol>
        <li>스프레드시트에서 <b>확장 프로그램 → Apps Script</b></li>
        <li>처음부터 있는 <code>Code.gs</code>를 열고 <b>전체 선택(Ctrl+A) → 지우기</b></li>
        <li>복사한 내용 붙여넣기 → 💾 저장(Ctrl+S)</li>
      </ol>`;
    }
    const menu = f.kind === 'html' ? 'HTML' : '스크립트';
    const first = '';
    return `<ol>
      <li>Apps Script 왼쪽 <b>파일</b> 옆 <b>+</b> → <b>${menu}</b></li>
      <li>이름에 <code>${esc(f.name)}</code> 입력 (확장자 없이) → Enter</li>
      <li>안에 있던 기본 내용을 <b>전부 지우고</b> 붙여넣기 → 💾 저장(Ctrl+S)</li>
      ${first}
    </ol>`;
  }

  function render() {
    const groups = [['script', '스크립트'], ['html', 'HTML'], ['json', '설정']];
    $('#list').innerHTML = groups.map(([k, label]) => {
      const items = FILES.map((f, i) => ({ f, i })).filter(x => x.f.kind === k);
      if (!items.length) return '';
      return `<div class="group">${label}</div>` + items.map(({ f, i }) => `
        <button class="file ${copied[f.file] ? 'done' : ''}" aria-current="${i === current}" data-i="${i}">
          <span class="tick" aria-hidden="true">✓</span>
          <span class="nm">${esc(f.name)}<span class="ext">${esc(f.ext)}</span></span>
          <span class="sz">${kb(f.size)}</span>
        </button>`).join('');
    }).join('');

    const f = FILES[current];
    const tagClass = f.kind === 'script' ? '' : f.kind;
    const tagText = f.kind === 'script' ? '스크립트' : f.kind === 'html' ? 'HTML' : '설정 파일';
    $('#pane').innerHTML = `
      <div class="pane-head">
        <h2>${esc(f.file)}<span class="tag ${tagClass}">${tagText}</span></h2>
        <div class="actions">
          <button class="btn primary" id="copyBtn">${copied[f.file] ? '다시 복사' : '복사'}</button>
          <button class="btn" id="nextBtn" ${current === FILES.length - 1 ? 'disabled' : ''}>다음 파일 →</button>
        </div>
      </div>
      <div class="how">${howTo(f)}</div>
      <p class="note">${f.lines.toLocaleString()}줄 · ${kb(f.size)} · 아래 상자는 내용 확인용입니다. 복사 버튼이 안 되면 상자를 눌러 Ctrl+A → Ctrl+C 하세요.</p>
      <textarea id="code" readonly spellcheck="false" aria-label="${esc(f.file)} 코드">${esc(f.code)}</textarea>`;

    const n = FILES.filter(x => copied[x.file]).length;
    $('#count').textContent = `${n} / ${FILES.length} 복사`;
    $('#bar').style.width = `${n / FILES.length * 100}%`;
  }

  function markCopied(f) {
    copied[f.file] = true;
    save();
    render();
  }

  function copyCurrent() {
    const f = FILES[current];
    const ta = $('#code');
    const fallback = () => {
      ta.focus();

      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      if (ok) { markCopied(f); toast(`${f.file} 복사했습니다. Apps Script에 붙여넣으세요.`); }
      else toast('코드를 선택했습니다. Ctrl+C(맥은 ⌘+C)로 복사하세요.');
    };
    try {
      navigator.clipboard.writeText(f.code).then(() => {
        markCopied(f);
        toast(`${f.file} 복사했습니다. Apps Script에 붙여넣으세요.`);
      }, fallback);
    } catch (e) { fallback(); }
  }

  document.addEventListener('click', e => {
    const item = e.target.closest('.file');
    if (item) { current = Number(item.dataset.i); render(); window.scrollTo({ top: 0 }); return; }
    if (e.target.closest('#copyBtn')) { copyCurrent(); return; }
    if (e.target.closest('#nextBtn') && current < FILES.length - 1) { current += 1; render(); }
  });

  render();
</script>
