      <form class="form" id="imForm" novalidate>
        <div id="imFileBox">
          <div class="drop" id="imDrop" tabindex="0" role="button"><span class="desk-only">파일을 끌어다 놓거나 </span><u>눌러서 파일 선택</u> · .xlsx .xls .csv</div>
          <input type="file" id="imFile" accept=".xlsx,.xls,.xlsm,.csv,.txt" hidden>
          <div class="hint" id="imFileName" style="margin-top:6px"></div>
        </div>
        <textarea class="field-in" id="imText" style="min-height:200px" aria-label="붙여넣을 내용" placeholder="시트에서 제목 행부터 복사해 붙여넣으세요" hidden></textarea>
        <div class="hint" id="imHint"></div>
        <div id="imPreview"></div>
        <div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">취소</button><button type="submit" class="btn primary" id="imOk" disabled>가져오기</button></div>
      </form>`, true);

    const current = () => src === 'file' ? (fileResult || { err: '' }) : readRows(parseTSV($('#imText').value), '붙여넣은 내용이 없습니다.');
    const show = () => {
      const r = current();
      $('#imOk').disabled = !!r.err || !r.data;
      if (r.err !== undefined && !r.data) { $('#imHint').innerHTML = r.err ? `<span style="color:var(--warn-ink)">${esc(r.err)}</span>` : ''; $('#imPreview').innerHTML = ''; return; }
      const isNew = o => !o.empNo || !D.people.some(p => p.empNo === o.empNo);
      // 파일 안에서 같은 사원번호는 한 사람으로 센다 (아래쪽 줄이 위쪽을 갱신)
      const uniq = r.data.filter((o, i) => !o.empNo || r.data.findIndex(x => x.empNo === o.empNo) === i);
      const add = uniq.filter(isNew).length;
      $('#imHint').innerHTML = `인식된 열 ${r.cols}개 · 대상자 <b>${uniq.length}명</b> (새로 추가 ${add}명 · 갱신 ${uniq.length - add}명)`
        + (r.unknown.length ? `<br>무시되는 열: ${r.unknown.map(esc).join(', ')}` : '')
        + (r.dupInFile.length ? `<br><span style="color:var(--warn-ink)">파일 안에서 사원번호가 겹칩니다: ${r.dupInFile.map(esc).join(', ')} (아래쪽 줄 내용이 남습니다)</span>` : '');
      // 앞 5명 미리 보기
      const keys = ['no', 'dept', 'empNo', 'name', 'rank', 'owner', 'owner2'];
      $('#imPreview').innerHTML = `<div class="table-wrap"><table class="sheet-grid" style="min-width:0"><thead><tr>${keys.map(k => `<th>${esc(col(k).l)}</th>`).join('')}<th></th></tr></thead>
        <tbody>${r.data.slice(0, 5).map(o => `<tr style="cursor:default">${keys.map(k => `<td>${esc(o[k] || '')}</td>`).join('')}<td>${isNew(o) ? '<span class="chip info">추가</span>' : '<span class="chip plain">갱신</span>'}</td></tr>`).join('')}</tbody></table></div>
        ${r.data.length > 5 ? `<p class="hint" style="margin:6px 0 0">외 ${r.data.length - 5}명</p>` : ''}`;
    };
    const setSrc = v => {
      src = v;
      $('#imTabFile').setAttribute('aria-selected', String(v === 'file'));
      $('#imTabPaste').setAttribute('aria-selected', String(v === 'paste'));
      $('#imFileBox').hidden = v !== 'file';
      $('#imText').hidden = v !== 'paste';
      show();
    };
    const takeFile = file => {
      if (!file) return;
      fileResult = { err: '' };
      $('#imFileName').textContent = `${file.name} 읽는 중…`;
      show();
      readFileRows(file)
        .then(({ rows, sheet }) => { fileResult = readRows(rows, '파일에 내용이 없습니다.'); $('#imFileName').textContent = `${file.name}${sheet ? ` · 시트 「${sheet}」` : ''}`; })
        .catch(e => { fileResult = { err: e.message || String(e) }; $('#imFileName').textContent = file.name; })
        .then(show);
    };
    $('#imTabFile').onclick = () => setSrc('file');
    $('#imTabPaste').onclick = () => setSrc('paste');
    const drop = $('#imDrop'), input = $('#imFile');
    drop.onclick = () => input.click();
    drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } };
    drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = () => drop.classList.remove('over');
    drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); takeFile(e.dataTransfer.files[0]); };
    input.onchange = () => { takeFile(input.files[0]); input.value = ''; };
    $('#imText').oninput = show;
    $('#imForm').onsubmit = e => {
      e.preventDefault();
      const r = current();
      if (r.err || !r.data) return;
      // 같은 사원번호 줄은 하나로 합친다 (아래쪽 줄의 값이 이긴다)
      const merged = [], at = {};
      r.data.forEach(o => { if (o.empNo && at[o.empNo] !== undefined) Object.assign(merged[at[o.empNo]], o); else { if (o.empNo) at[o.empNo] = merged.length; merged.push(Object.assign({}, o)); } });
      $('#imOk').disabled = true;
      $('#imOk').textContent = `${merged.length}명 저장 중…`;
      call('apiImportPeople', merged).then(data => { applyData(data); closeModal(); reviewTab = 'all'; reviewStatus = 'all'; render(); toast(`${data.added}명 추가 · ${data.updated}명 갱신했습니다.`); })
        .catch(err => { $('#imOk').disabled = false; $('#imOk').textContent = '가져오기'; fail(err); });
    };
  }

        </button>
        ${open ? `<div class="post-body">
          ${n.start || n.end ? `<div class="hint">게시 기간 ${esc(n.start || '처음')} ~ ${esc(n.end || '계속')}${activeNotice(n) ? '' : ' · 게시 기간이 아닙니다'}</div>` : ''}
          <div class="post-text">${esc(n.body)}</div>
          ${filesView(n.files)}
          <div class="comments">
            ${n.comments.map(c => `<div class="cmt"><b>${esc(c.author)}<span>${esc(c.date)}</span></b><p>${esc(c.body)}</p></div>`).join('')}
            <form class="cmt-form" onsubmit="addNoticeComment(event, '${esc(n.id)}')">
              <input class="field-in" id="cmtIn" placeholder="${n.category === '질문' ? '답변 달기' : '댓글·질문 달기'}" aria-label="댓글">
              <button class="btn small primary">등록</button>
            </form>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <button class="btn small" onclick="markUnread('${esc(n.id)}')">안 읽음으로</button>
            <button class="btn small" onclick="copyNotice('${esc(n.id)}')">메신저용 복사</button>
            ${canEditN ? `<button class="btn small" onclick="openNoticeForm('${esc(n.id)}')">수정</button><button class="btn small danger" onclick="deleteNotice('${esc(n.id)}')">삭제</button>` : ''}
          </div>
        </div>` : ''}
      </article>`;
    }).join('') || `<div class="empty">${noticeFilter === 'unread' ? '안 읽은 글이 없습니다.' : '글이 없습니다.'}</div>`;
    return `
      <div class="head">
        <div><h1>공지사항</h1><p>공지·응대지침은 총괄이 올리고, 자료·질문은 누구나 올릴 수 있습니다. 긴급·고정 공지는 대시보드 맨 위에 보입니다.</p></div>
        <div class="head-actions"><button class="btn primary" onclick="openNoticeForm()">글쓰기</button></div>
      </div>
      <section class="panel">
        <div class="panel-head">
          <div class="filters">${cats.map(c => `<button aria-pressed="${noticeFilter === c}" onclick="noticeFilter='${c}';render()">${c === 'all' ? '전체' : c === 'unread' ? '안 읽음' : c} ${pick(c).length}</button>`).join('')}</div>
          <label style="display:flex;gap:6px;align-items:center;font-size:13px"><input type="checkbox" class="check" ${showOld ? 'checked' : ''} onchange="showOld=this.checked;render()"> 지난 공지 포함</label>
        </div>
        <div class="posts">${rows}</div>
      </section>`;
  };

  function toggleNotice(id) {
    openNotice = openNotice === id ? null : id;
    if (openNotice && D.reads.indexOf(id) < 0) {
      D.reads.push(id);
      call('apiMarkRead', id).then(applyData).catch(() => { /* 읽음 표시는 실패해도 넘어간다 */ });
    }
    render();
  }
  function markUnread(id) {
    D.reads = D.reads.filter(x => x !== id);
    openNotice = null;
    render();
    call('apiMarkUnread', id).then(applyData).catch(fail);
  }
  function copyNotice(id) {
    const n = D.notices.find(x => x.id === id);
    const text = `[${n.category}] ${n.title}\n\n${n.body}`;
    try { navigator.clipboard.writeText(text).then(() => toast('복사했습니다. 메신저·메일에 붙여넣으세요.'), () => toast('복사하지 못했습니다.')); }
    catch (e) { toast('복사하지 못했습니다.'); }
  }

  function openNoticeForm(id, draftData, errMsg) {
    const lead = isLead();
    const n = draftData || (id ? D.notices.find(x => x.id === id) : { category: lead ? '공지' : '질문', level: '일반', title: '', body: '', start: '', end: '', pinned: false, files: [] });
    const cats = D.noticeCategories.filter(c => lead || D.noticeLeaderOnly.indexOf(c) < 0 || c === n.category);
    $('#modal').classList.remove('wide');
    openModal(`
      <h3>${id ? '글 수정' : '글쓰기'}</h3>
      <p class="sub">${lead ? '공지·응대지침은 담당자 모두에게 안내됩니다.' : '자료나 질문을 올리면 다른 담당자·총괄이 댓글로 답합니다.'}</p>
      <form class="form" id="nForm" novalidate>
        <div class="two">
          <div class="fld"><label for="nCat">분류</label><select class="field-in" id="nCat">${cats.map(c => `<option ${c === n.category ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
          ${lead ? `<div class="fld"><label for="nLv">중요도</label><select class="field-in" id="nLv">${['일반', '중요', '긴급'].map(l => `<option ${l === n.level ? 'selected' : ''}>${l}</option>`).join('')}</select></div>` : '<div></div>'}
        </div>
        <div class="fld"><label for="nTitle">제목</label><input class="field-in" id="nTitle" value="${esc(n.title)}"></div>
        <div class="fld"><label for="nBody">내용</label><textarea class="field-in" id="nBody" style="min-height:160px">${esc(n.body)}</textarea></div>
        ${lead ? `<div class="two">
          <div class="fld"><label for="nStart">게시 시작 (비우면 바로)</label><input class="field-in" type="date" id="nStart" value="${esc(n.start)}"></div>
          <div class="fld"><label for="nEnd">게시 종료 (비우면 계속)</label><input class="field-in" type="date" id="nEnd" value="${esc(n.end)}"></div>
        </div>
        <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" class="check" id="nPin" ${n.pinned ? 'checked' : ''}> 맨 위에 고정 (대시보드에 배너로 표시)</label>` : ''}
        ${uploaderHtml('notice', '첨부 파일')}
        <div class="msg err" id="nErr" hidden></div>
        <div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">취소</button><button type="submit" class="btn primary" id="nOk">${id ? '저장' : '등록'}</button></div>
      </form>`);
    initUploader('notice', 'notice', n.files);
    $('#nForm').onsubmit = e => {
      e.preventDefault();
      const v = sel => $(sel) ? $(sel).value : '';
      const data = { id: id || '', category: $('#nCat').value, level: v('#nLv') || '일반', title: $('#nTitle').value.trim(), body: $('#nBody').value.trim(), start: v('#nStart'), end: v('#nEnd'), pinned: !!($('#nPin') && $('#nPin').checked), files: uploadedFiles('notice') };
      const err = msg => { $('#nErr').textContent = msg; $('#nErr').hidden = false; };
      if (!data.title || !data.body) return err('제목과 내용을 입력해 주세요.');
      if (data.start && data.end && data.start > data.end) return err('게시 종료일이 시작일보다 빠릅니다.');
      if (uploadsBusy('notice')) return err(BUSY_MSG);
      const old = D.notices.slice();
      const tmpId = id || 'tmp' + Date.now();
      const ex = D.notices.find(x => x.id === id);
      const shown = Object.assign({ id: tmpId, date: id ? ex.date : '방금', author: id ? ex.author : D.me.name, comments: id ? ex.comments : [], updated: '방금' }, data, { id: tmpId, level: lead ? data.level : '일반', pinned: lead && data.pinned });
      D.notices = id ? D.notices.map(x => x.id === id ? shown : x) : [shown].concat(D.notices);
      if (D.reads.indexOf(tmpId) < 0) D.reads.push(tmpId);
      closeModal(); openNotice = tmpId; noticeFilter = 'all'; page = 'notice'; render();
      saveInBackground('apiSaveNotice', [data], {
        ok: id ? '수정했습니다.' : '등록했습니다.',
        done: res => { if (openNotice === tmpId) openNotice = res.savedId; if (page === 'notice') render(); },
        undo: () => { D.notices = old; },
        retry: msg => openNoticeForm(id, data, `저장하지 못했습니다: ${msg}`),
      });
    };
    if (errMsg) { $('#nErr').textContent = errMsg; $('#nErr').hidden = false; }
  }

  function addNoticeComment(e, id) {
    e.preventDefault();
    const text = $('#cmtIn').value.trim();
    if (!text) return;
    const n = D.notices.find(x => x.id === id);
    const mine = { _tmp: true, date: '방금', author: D.me.name, body: text };
    n.comments.push(mine);
    render();
    saveInBackground('apiAddNoticeComment', [id, text], {
      done: () => { if (page === 'notice') render(); },
      undo: () => { n.comments.splice(n.comments.indexOf(mine), 1); },
    });
  }

  function deleteNotice(id) {
    openModal(`<h3>글을 삭제할까요?</h3><p class="sub">목록에서 사라집니다. 시트에는 기록이 남습니다.</p>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">취소</button><button class="btn primary" id="delOk">삭제</button></div>`);
    $('#delOk').onclick = () => {
      $('#delOk').disabled = true;
      call('apiDeleteNotice', id).then(data => { applyData(data); openNotice = null; closeModal(); render(); toast('삭제했습니다.'); }).catch(e => { closeModal(); fail(e); });
    };
  }

  /* ================= 연말정산 기준 ================= */
  function hl(text) {
    const t = esc(text);
    if (!ruleQuery) return t;
    const q = esc(ruleQuery).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return t.replace(new RegExp(q, 'gi'), m => `<mark>${m}</mark>`);
  }
  function filteredRules() {
    const q = ruleQuery.trim().toLowerCase();
    return D.rules
      .filter(r => ruleCat === 'all' || r.category === ruleCat)
      .filter(r => !q || (r.title + ' ' + r.body + ' ' + r.category).toLowerCase().includes(q))
      .sort((a, b) => D.ruleCategories.indexOf(a.category) - D.ruleCategories.indexOf(b.category) || a.title.localeCompare(b.title, 'ko'));
  }
  function ruleListHtml() {
    const list = filteredRules();
    return list.map(r => {
      const open = openRule === r.id || (ruleQuery && list.length <= 2);
      const first = r.body.split('\n').find(l => l.trim() && !/^\(.*\)$/.test(l.trim())) || '';
      return `<article class="rule">
        <button class="rule-head" onclick="toggleRule('${esc(r.id)}')" aria-expanded="${open}">
          <span class="rule-title">${hl(r.title)}${r.files && r.files.length ? '<span class="clip" title="첨부 파일">📎</span>' : ''}</span>
          <span class="rule-date">${ruleCat === 'all' ? `<span class="chip plain">${esc(r.category)}</span> ` : ''}${r.year ? `${esc(r.year)}년 귀속` : ''}</span>
          ${open ? '' : `<span class="rule-sum">${hl(first)}</span>`}
        </button>
        ${open ? `<div class="rule-body">
          <div class="rule-meta"><span><b>적용</b>${esc(r.year ? r.year + '년 귀속' : '-')}</span><span><b>담당</b>${esc(r.owner || '-')}</span><span><b>최종 개정</b>${esc(r.updated)} (${esc(r.editor)})</span></div>
          <div class="rule-text">${hl(r.body)}</div>
          ${r.files && r.files.length ? `<div class="sub-label">첨부 파일</div>${filesView(r.files)}` : ''}
          ${r.link ? `<a class="post-link" href="${esc(r.link)}" target="_blank" rel="noopener">📄 원문 보기</a>` : ''}
          ${r.history.length ? `<details class="hist"><summary>개정 이력 ${r.history.length}건</summary><ol>${r.history.map(h => `<li><span>${esc(h.date)} · ${esc(h.editor)}</span>${esc(h.note)}</li>`).join('')}</ol></details>` : ''}
          ${isLead() ? `<div style="display:flex;gap:6px"><button class="btn small" onclick="openRuleForm('${esc(r.id)}')">수정</button><button class="btn small danger" onclick="deleteRule('${esc(r.id)}')">삭제</button></div>` : ''}
        </div>` : ''}
      </article>`;
    }).join('') || `<div class="empty">${ruleQuery ? `"${esc(ruleQuery)}"에 해당하는 기준이 없습니다.` : '등록된 기준이 없습니다.'}</div>`;
  }

  VIEWS.rules = function () {
    const cats = ['all'].concat(D.ruleCategories);
    const cnt = c => c === 'all' ? D.rules.length : D.rules.filter(r => r.category === c).length;
    return `
      <div class="head">
        <div><h1>연말정산 기준</h1><p>공제 요건·제출서류·응대 기준을 한곳에서 확인하세요. 총괄이 고치면 개정 이력이 남습니다.</p></div>
        <div class="head-actions">${isLead() ? '<button class="btn primary" onclick="openRuleForm()">기준 등록</button>' : ''}</div>
      </div>
      <div class="rules-layout">
        <section class="panel" style="padding:10px">
          <div class="cats">${cats.filter(c => c === 'all' || cnt(c)).map(c => `<button aria-pressed="${ruleCat === c}" onclick="ruleCat='${esc(c)}';openRule=null;render()">${c === 'all' ? '전체' : esc(c)}<span>${cnt(c)}</span></button>`).join('')}</div>
        </section>
        <section class="panel">
          <input class="search" id="ruleSearch" type="search" placeholder="검색 (예: 월세, 의료비, 부양가족, 종전근무지)" value="${esc(ruleQuery)}" aria-label="기준 검색">
          <div id="ruleList">${ruleListHtml()}</div>
        </section>
      </div>`;
  };
  function toggleRule(id) { openRule = openRule === id ? null : id; $('#ruleList').innerHTML = ruleListHtml(); }

  function openRuleForm(id, draftData, errMsg) {
    const r = draftData || (id ? D.rules.find(x => x.id === id) : { category: ruleCat !== 'all' ? ruleCat : D.ruleCategories[0], title: '', body: '', year: D.year, owner: '', link: '', files: [] });
    $('#modal').classList.remove('wide');
    openModal(`
      <h3>${id ? '기준 수정' : '기준 등록'}</h3>
      <p class="sub">담당자 모두가 응대할 때 보는 기준입니다. 국세청 안내 원문이 있으면 링크나 파일로 함께 올려주세요.</p>
      <form class="form" id="rForm" novalidate>
        <div class="two">
          <div class="fld"><label for="rCat">분류</label><select class="field-in" id="rCat">${D.ruleCategories.map(c => `<option ${c === r.category ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
          <div class="fld"><label for="rYear">적용 귀속연도</label><input class="field-in" id="rYear" inputmode="numeric" value="${esc(r.year)}"></div>
        </div>
        <div class="fld"><label for="rTitle">제목</label><input class="field-in" id="rTitle" value="${esc(r.title)}"></div>
        <div class="fld"><label for="rBody">내용</label><textarea class="field-in" id="rBody" style="min-height:200px">${esc(r.body)}</textarea></div>
        <div class="two">
          <div class="fld"><label for="rOwner">담당</label><input class="field-in" id="rOwner" value="${esc(r.owner)}"></div>
          <div class="fld"><label for="rLink">원문 링크 (선택)</label><input class="field-in" id="rLink" value="${esc(r.link)}" placeholder="https://"></div>
        </div>
        ${uploaderHtml('rule', '첨부 파일 (국세청 안내 PDF 등)')}
        ${id ? '<div class="fld"><label for="rNote">개정 내용 (이력에 남습니다)</label><input class="field-in" id="rNote" placeholder="예) 월세 공제 한도 750만원 → 1,000만원"></div>' : ''}
        <div class="msg err" id="rErr" hidden></div>
        <div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">취소</button><button type="submit" class="btn primary" id="rOk">${id ? '저장' : '등록'}</button></div>
      </form>`);
    initUploader('rule', 'rules', r.files);
    $('#rForm').onsubmit = e => {
      e.preventDefault();
      const rule = { id: id || '', category: $('#rCat').value, year: $('#rYear').value.trim(), title: $('#rTitle').value.trim(), body: $('#rBody').value.trim(), owner: $('#rOwner').value.trim(), link: $('#rLink').value.trim(), changeNote: $('#rNote') ? $('#rNote').value.trim() : '', files: uploadedFiles('rule') };
      if (!rule.title || !rule.body) { $('#rErr').textContent = '제목과 내용을 입력해 주세요.'; $('#rErr').hidden = false; return; }
      if (uploadsBusy('rule')) { $('#rErr').textContent = BUSY_MSG; $('#rErr').hidden = false; return; }
      const old = D.rules.slice();
      const tmpId = id || 'tmp' + Date.now();
      const ex = D.rules.find(x => x.id === id);
      const shown = Object.assign({ history: [] }, ex || {}, rule, { id: tmpId, updated: todayKey(), editor: D.me.name });
      shown.history = [{ date: todayKey(), editor: D.me.name, note: rule.changeNote || (id ? '내용 수정' : '최초 등록') }].concat(ex ? ex.history : []);
      D.rules = id ? D.rules.map(x => x.id === id ? shown : x) : D.rules.concat(shown);
      closeModal(); openRule = tmpId; ruleCat = 'all'; ruleQuery = ''; page = 'rules'; render();
      saveInBackground('apiSaveRule', [rule], {
        ok: id ? '기준을 수정했습니다. 개정 이력에 기록됩니다.' : '기준을 등록했습니다.',
        done: res => { if (openRule === tmpId) openRule = res.savedId; if (page === 'rules') render(); },
        undo: () => { D.rules = old; },
        retry: msg => openRuleForm(id, rule, `저장하지 못했습니다: ${msg}`),
      });
    };
    if (errMsg) { $('#rErr').textContent = errMsg; $('#rErr').hidden = false; }
  }

  function deleteRule(id) {
    openModal(`<h3>이 기준을 삭제할까요?</h3><p class="sub">목록에서 사라지고, 시트와 개정 이력에는 기록이 남습니다.</p>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">취소</button><button class="btn primary" id="rdOk">삭제</button></div>`);
    $('#rdOk').onclick = () => {
      $('#rdOk').disabled = true;
      call('apiDeleteRule', id).then(data => { applyData(data); openRule = null; closeModal(); render(); toast('삭제했습니다.'); }).catch(e => { closeModal(); fail(e); });
    };
  }

  /* ================= 첨부파일 ================= */
  function filesFiltered() {
    const q = fileQuery.trim().toLowerCase();
    return D.files
      .filter(f => fileArea === 'all' || f.area === fileArea)
      .filter(f => !q || [f.name, f.refLabel, f.uploader, f.memo].join(' ').toLowerCase().includes(q));
  }
  function refCell(f) {
    if (f.area === 'person') {
      const p = D.people.find(x => (x.empNo || x.id) === f.ref);
      return p && can('review') ? `<button class="linkish" onclick="openPerson('${esc(p.id)}')">${esc(f.refLabel)}</button>` : esc(f.refLabel);
    }
    if (f.area === 'notice' && can('notice')) return `<button class="linkish" onclick="openNotice='${esc(f.ref)}';showOld=true;go('notice')">${esc(f.refLabel)}</button>`;
    if (f.area === 'rules' && can('rules')) return `<button class="linkish" onclick="openRule='${esc(f.ref)}';ruleCat='all';ruleQuery='';go('rules')">${esc(f.refLabel)}</button>`;
    return esc(f.memo || f.refLabel || '-');
  }
  function fileListHtml() {
    const list = filesFiltered();
    const rows = list.map(f => `
      <tr>
        <td data-label="파일" class="c-wide">${fileRow(f, { link: true })}</td>
        <td data-label="구분"><span class="chip ${f.area === 'person' ? 'info' : 'plain'}">${esc(D.fileAreas[f.area] || f.area)}</span></td>
        <td data-label="대상 · 메모">${refCell(f)}</td>
        <td data-label="올린 사람">${esc(f.uploader)}</td>
        <td data-label="올린 일시" class="nowrap">${esc(f.date.slice(2, 16))}</td>
        <td class="c-act" data-label="">${f.uploader === D.me.name || isLead() ? `<button class="btn small danger" onclick="deleteFile('${esc(f.id)}')">삭제</button>` : ''}</td>
      </tr>`).join('');
    return rows ? `<div class="table-wrap"><table class="t cards"><thead><tr><th>파일</th><th>구분</th><th>대상 · 메모</th><th>올린 사람</th><th>올린 일시</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
      : `<div class="empty">${fileQuery ? '검색 결과가 없습니다.' : '올린 파일이 없습니다.'}</div>`;
  }
  VIEWS.files = function () {
    const areas = ['all'].concat(Object.keys(D.fileAreas).filter(a => D.files.some(f => f.area === a) || a === 'etc'));
    const cnt = a => a === 'all' ? D.files.length : D.files.filter(f => f.area === a).length;
    return `
      <div class="head">
        <div><h1>첨부파일</h1><p>대상자 증빙, 공지·기준 첨부, 일반 자료를 한곳에서 찾아보세요. 파일은 구글 드라이브에서 열립니다.</p></div>
        <div class="head-actions">${D.me.name || D.me.isAdmin ? '<button class="btn primary" onclick="openEtcUpload()">자료 올리기</button>' : ''}</div>
      </div>
      <section class="panel">
        <div class="filters" style="margin-bottom:12px">${areas.map(a => `<button aria-pressed="${fileArea === a}" onclick="fileArea='${a}';render()">${a === 'all' ? '전체' : esc(D.fileAreas[a])} ${cnt(a)}</button>`).join('')}</div>
        <input class="search" id="fileSearch" type="search" placeholder="파일명·대상자·올린 사람 검색" value="${esc(fileQuery)}" aria-label="첨부파일 검색">
        <div id="fileList">${fileListHtml()}</div>
        <p style="color:var(--muted);font-size:12px;margin:10px 0 0">증빙 서류에는 개인정보가 들어 있습니다. 첨부 폴더는 담당자에게만 공유되며, 삭제한 파일은 드라이브 휴지통으로 이동합니다(30일 안에 복구 가능).</p>
      </section>`;
  };
  function openEtcUpload() {
    $('#modal').classList.remove('wide');
    openModal(`
      <h3>자료 올리기</h3>
      <p class="sub">서식, 안내문처럼 특정 대상자와 상관없는 자료를 올립니다. 대상자 증빙은 서류 검토에서 대상자를 눌러 올리세요.</p>
      <div class="form">
        <div class="fld"><label for="etcMemo">메모 (무슨 자료인지)</label><input class="field-in" id="etcMemo" placeholder="예) 2026 귀속 소득·세액공제신고서 양식"></div>
        ${uploaderHtml('etc', '파일 (올리는 즉시 저장됩니다)')}
        <div class="modal-actions"><button type="button" class="btn primary" onclick="closeModal();render()">완료</button></div>
      </div>`);
    initUploader('etc', 'etc', [], { memo: () => $('#etcMemo').value.trim() });
  }
  function deleteFile(id) {
    const f = D.files.find(x => x.id === id);
    openModal(`<h3>${esc(f.name)} 파일을 삭제할까요?</h3>
      <p class="sub">목록에서 빼고 드라이브 휴지통으로 옮깁니다. ${f.area === 'notice' || f.area === 'rules' ? '이 파일이 붙은 글에서도 열 수 없게 됩니다.' : ''}</p>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">취소</button><button class="btn primary" id="dfOk">삭제</button></div>`);
    $('#dfOk').onclick = () => {
      const old = D.files.slice();
      D.files = D.files.filter(x => x.id !== id);
      closeModal(); render();
      saveInBackground('apiDeleteFile', [id], { ok: '삭제했습니다.', undo: () => { D.files = old; } });
    };
  }

  /* ================= 권한 관리 (관리자 전용) ================= */
  let A = null;          // 서버에서 받은 관리 데이터
  let aDraft = null;     // 편집 중인 담당자 목록
  let aDirty = false;
  let menuDraft = null;
  let adminTab = 'members';
  let adminLoading = false;

  function loadAdmin(force) {
    if (adminLoading) return;
    adminLoading = true;
    call('apiAdminData', !!force)
      .then(d => { adminLoading = false; setAdmin(d); })
      .catch(e => { adminLoading = false; fail(e); });
  }
  function refreshAdmin() { A = null; render(); loadAdmin(true); }
  function setAdmin(data) {
    A = data;
    aDraft = A.members.map(m => Object.assign({}, m));
    menuDraft = JSON.parse(JSON.stringify(A.menuAccess));
    aDirty = false;
    if (page === 'admin') render();
  }

  const ACCESS = {
    sheet: { owner: ['ok', '소유자'], editor: ['ok', '편집'], viewer: ['pend', '보기만'], none: ['no', '없음'] },
    folder: { owner: ['ok', '소유자'], editor: ['ok', '편집'], viewer: ['pend', '보기만'], none: ['no', '없음'], 'n/a': ['plain', '설정 필요'] },
  };
  function accessChip(kind, v) {
    const [cls, label] = (ACCESS[kind][v] || ['plain', '–']);
    return `<span class="chip ${cls}">${cls === 'ok' ? '✓ ' : cls === 'no' ? '✕ ' : ''}${label}</span>`;
  }
  function needsAttention(name) {
    const st = A && A.status.people[name];
    if (!st) return true;
    return ['sheet', 'folder'].some(k => { const c = (ACCESS[k][st[k]] || ['plain'])[0]; return c === 'no' || c === 'pend'; });
  }

  VIEWS.admin = function () {
    if (!A) return '<div class="loading">권한 정보를 불러오는 중… (시트·첨부 폴더 공유 상태를 확인합니다)</div>';
    const tab = (k, label) => `<button role="tab" aria-selected="${adminTab === k}" onclick="adminTab='${k}';render()">${label}</button>`;
    const body = { members: adminMembers, scope: adminScope, menus: adminMenus, settings: adminSettings, guide: adminGuide }[adminTab]();
    return `<div class="subtabs" role="tablist">${tab('members', '담당자·권한')}${tab('scope', '열람 범위')}${tab('menus', '메뉴 권한')}${tab('settings', '설정')}${tab('guide', '접속 안내')}</div>${body}`;
  };

  function adminMembers() {
    const res = A.status.resources;
    const resLine = (label, x) => `<span>${x.ok ? '<span class="chip ok">✓</span>' : '<span class="chip pend">!</span>'} <b>${label}</b> ${esc(x.ok ? x.name : x.error)}</span>`;
    const issues = aDraft.filter(m => m.email && needsAttention(m.name)).length;
    const noEmail = aDraft.filter(m => m.name && !m.email).length;
    const sel = (i, v) => `<select class="field-in" style="padding:5px 6px;min-width:90px" onchange="aEdit(${i},'role',this.value)">${A.roles.map(r => `<option ${r === v ? 'selected' : ''}>${r}</option>`).join('')}</select>`;
    const rows = aDraft.map((m, i) => {
      const st = A.status.people[m.name];
      const saved = A.members.some(x => x.name === m.name && x.email === m.email);
      return `<tr>
        <td data-label="이름"><input class="field-in" style="padding:5px 8px;min-width:80px" value="${esc(m.name)}" oninput="aEdit(${i},'name',this.value)" aria-label="이름"></td>
        <td data-label="이메일" class="c-wide"><input class="field-in" style="padding:5px 8px;min-width:190px" value="${esc(m.email)}" placeholder="이메일" oninput="aEdit(${i},'email',this.value)" aria-label="이메일"></td>
        <td data-label="역할">${sel(i, m.role)}</td>
        <td data-label="관리자"><label style="display:flex;justify-content:center"><input type="checkbox" class="check" ${m.admin ? 'checked' : ''} onchange="aEdit(${i},'admin',this.checked)" aria-label="관리자"></label></td>
        <td data-label="열람 범위"><button class="linkish" onclick="adminTab='scope';render()">${isFull(m) ? '전체 (총괄·관리자)' : !m.scope || m.scope === SCOPE_ALL ? '전체' : scopeList(m).length ? `본인 + ${esc(scopeList(m).join(', '))}` : '본인 담당만'}</button></td>
        ${st && saved ? `<td data-label="스프레드시트">${accessChip('sheet', st.sheet)}</td><td data-label="첨부 폴더">${accessChip('folder', st.folder)}</td>`
          : `<td colspan="2" class="c-wide"><span style="color:var(--muted);font-size:12px">${m.email ? '저장 후 "권한 한 번에 적용"을 누르세요' : '이메일을 입력하세요'}</span></td>`}
        <td class="c-x"><button class="icon-btn" onclick="aRemove(${i})" aria-label="${esc(m.name)} 삭제">×</button></td>
      </tr>`;
    }).join('');
    return `
      <div class="head">
        <div><h1>담당자·권한</h1><p>담당자를 등록하고 "권한 한 번에 적용"을 누르면 시트·첨부 폴더 공유와 시트 보호를 자동으로 합니다.</p></div>
        <div class="head-actions">
          <button class="btn" onclick="refreshAdmin()">상태 새로고침</button>
          <button class="btn primary" onclick="applyAll()">권한 한 번에 적용</button>
        </div>
      </div>
      <section class="panel">
        <div style="display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px">${resLine('스프레드시트', res.sheet)}${resLine('첨부 폴더', res.folder)}</div>
        <p style="margin:10px 0 0;font-size:13px;color:${issues || noEmail ? 'var(--warn-ink)' : 'var(--ok-ink)'}">
          ${issues || noEmail ? `확인이 필요한 사람 ${issues}명${noEmail ? ` · 이메일 없는 사람 ${noEmail}명` : ''}. "권한 한 번에 적용"을 누르면 대부분 해결됩니다.` : '✓ 모든 담당자의 권한이 정상입니다.'}
        </p>
      </section>
      <section class="panel">
        <div class="table-wrap">
          <table class="t cards admin-cards">
            <thead><tr><th>이름</th><th>이메일</th><th>역할</th><th style="text-align:center">관리자</th><th>열람 범위</th><th>스프레드시트</th><th>첨부 폴더</th><th></th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <button class="btn small add" onclick="aAdd()">+ 담당자 추가</button>
        <p style="color:var(--muted);font-size:12.5px;margin:12px 0 0;line-height:1.7">
          · <b>응대담당</b>: [대상자] 시트 담당자 칸에 이름이 있는 사람의 1차 검토 입력<br>
          · <b>2차검토</b>: 2차검토 담당자 칸에 이름이 있는 사람의 2차 검토 입력<br>
          · <b>총괄</b>: 모든 대상자 입력·담당 배정, 공지·응대지침·기준 등록<br>
          · <b>관리자</b>: 이 권한 관리 메뉴 사용 (스프레드시트 소유자는 항상 관리자)<br>
          · 이름은 [대상자] 시트의 담당자 칸과 똑같이 적어야 내 담당으로 연결됩니다.
        </p>
      </section>
      <div class="save-bar" id="aBar" ${aDirty ? '' : 'hidden'}><div class="left">변경사항이 있습니다. 저장해야 반영됩니다.</div>
        <div style="display:flex;gap:8px"><button class="btn" onclick="setAdmin(A)">되돌리기</button><button class="btn primary" id="aSave" onclick="saveMembers()">변경사항 저장</button></div></div>`;
  }

  function aEdit(i, k, v) {
    aDraft[i][k] = v;
    aDirty = true;
    const bar = $('#aBar');
    if (bar) bar.hidden = false;
  }
  function aAdd() {
    aDraft.push({ order: aDraft.length + 1, name: '', email: '', role: A.roles[0], admin: false, scope: '전체' });
    aDirty = true;
    render();
    const inputs = document.querySelectorAll('#main tbody input[aria-label="이름"]');
    inputs[inputs.length - 1].focus();
  }
  function saveMembers(after) {
    const list = aDraft.filter(m => m.name.trim()).map((m, i) => Object.assign({}, m, { order: i + 1 }));
    const btn = $('#aSave');
    if (btn) { btn.disabled = true; btn.textContent = '저장 중…'; }
    return call('apiSaveMembers', list)
      .then(data => { setAdmin(data); load(); toast('담당자 목록을 저장했습니다.'); if (after) after(); })
      .catch(e => { if (btn) { btn.disabled = false; btn.textContent = '변경사항 저장'; } fail(e); });
  }
  function aRemove(i) {
    const m = aDraft[i];
    const saved = A.members.some(x => x.name === m.name);
    if (!saved) { aDraft.splice(i, 1); render(); return; }
    openModal(`<h3>${esc(m.name)}님을 담당자에서 뺄까요?</h3>
      <p class="sub">담당자 목록에서 지우고 저장합니다. [대상자] 시트의 담당자 칸과 응대기록은 그대로 남습니다.</p>
      ${m.email ? `<label style="display:flex;gap:8px;align-items:center;margin-bottom:14px"><input type="checkbox" class="check" id="rvk" checked> 스프레드시트·첨부 폴더 접근도 해제 (${esc(m.email)})</label>` : ''}
      <div class="modal-actions"><button class="btn" onclick="closeModal()">취소</button><button class="btn primary" id="rmOk">빼기</button></div>`);
    $('#rmOk').onclick = () => {
      const revoke = $('#rvk') && $('#rvk').checked;
      $('#rmOk').disabled = true;
      aDraft.splice(i, 1);
      saveMembers(() => {
        if (!revoke) { closeModal(); return; }
        call('apiRevokeAccess', m.email).then(res => { setAdmin(res.data); showLog(`${m.name}님 접근 해제`, res.log); }).catch(e => { closeModal(); fail(e); });
      });
    };
  }
  function applyAll() {
    const run = () => {
      openModal(`<h3>권한을 적용하는 중…</h3><p class="sub">시트·첨부 폴더 공유와 시트 보호를 처리하고 있습니다. 인원에 따라 10~30초 걸릴 수 있습니다.</p>`);
      call('apiApplyPermissions').then(res => { setAdmin(res.data); showLog('권한 적용 결과', res.log); }).catch(e => { closeModal(); fail(e); });
    };
    if (aDirty) saveMembers(run); else run();
  }
  function showLog(title, log) {
    openModal(`<h3>${esc(title)}</h3>
      <div class="list" style="margin:10px 0 16px">${log.map(l => `<div class="list-row" style="grid-template-columns:24px minmax(0,1fr)"><span>${l.ok ? '✓' : '⚠️'}</span><span class="meta" style="color:${l.ok ? 'var(--ink)' : 'var(--warn-ink)'}">${esc(l.text)}</span></div>`).join('')}</div>
      <div class="modal-actions"><button class="btn primary" onclick="closeModal()">확인</button></div>`);
  }

  /* ---------- 열람 범위: 담당자마다 어느 담당자의 대상자까지 볼지 ---------- */
  const SCOPE_ALL = '전체', UNASSIGNED = '(미배정)';
  const scopeList = m => (m.scope && m.scope !== SCOPE_ALL ? m.scope.split(',').filter(x => x && x !== '본인') : []);
  const isFull = m => m.role === '총괄' || m.admin;
  /** 서버의 canSee_와 같은 규칙으로 보이는 인원 수 (1차·2차 담당은 항상 포함) */
  function scopeCount(m) {
    const all = isFull(m) || !m.scope || m.scope === SCOPE_ALL, list = scopeList(m);
    return A.assign.filter(([o, o2]) => all || !o || o === m.name || o2 === m.name || list.includes(o)).length;
  }
  function adminScope() {
    // 열: 실제로 1차 담당이 있는 이름 + 응대담당 (총괄·2차검토만 하는 사람은 뺀다)
    // 담당자가 없는 대상자는 항상 모두에게 보이므로 열로 두지 않는다
    const cols = [...new Set(Object.keys(A.owners).filter(k => k !== UNASSIGNED).concat(aDraft.filter(m => m.name && m.role === '응대담당').map(m => m.name)))];
    const head = cols.map(c => `<th style="text-align:center;white-space:nowrap">${esc(c)}<br><span style="font-weight:400">${A.owners[c] || 0}명</span></th>`).join('');
    const rows = aDraft.map((m, i) => {
      if (!m.name) return '';
      if (isFull(m)) return `<tr><td class="strong">${esc(m.name)}<br><span style="color:var(--muted);font-size:12px">${esc(m.role)}${m.admin ? '·관리자' : ''}</span></td>
        <td colspan="${cols.length + 1}" style="color:var(--muted)">총괄·관리자는 항상 모든 대상자를 봅니다.</td><td class="num">${scopeCount(m)}명</td></tr>`;
      const all = !m.scope || m.scope === SCOPE_ALL, list = scopeList(m);
      return `<tr><td class="strong">${esc(m.name)}<br><span style="color:var(--muted);font-size:12px">${esc(m.role)}</span></td>
        <td style="text-align:center"><input type="checkbox" class="check" ${all ? 'checked' : ''} onchange="setScopeAll(${i}, this.checked)" aria-label="${esc(m.name)} 전체"></td>
        ${cols.map(c => c === m.name
          ? `<td style="text-align:center"><input type="checkbox" class="check" checked disabled title="본인 담당은 항상 보입니다" aria-label="본인 담당"></td>`
          : `<td style="text-align:center"><input type="checkbox" class="check" ${all || list.includes(c) ? 'checked' : ''} ${all ? 'disabled' : ''} onchange="toggleScope(${i}, '${esc(c)}', this.checked)" aria-label="${esc(m.name)}에게 ${esc(c)} 담당 보이기"></td>`).join('')}
        <td class="num"><b>${scopeCount(m)}명</b></td></tr>`;
    }).join('');
    return `
      <div class="head"><div><h1>열람 범위</h1><p>담당자마다 어느 담당자의 대상자까지 볼 수 있는지 정합니다. 체크하지 않은 대상자는 화면에 나오지 않고, 서버에서도 보내지 않습니다.</p></div></div>
      <section class="panel">
        <div class="table-wrap"><table class="t">
          <thead><tr><th>볼 사람 ＼ 담당자</th><th style="text-align:center">전체</th>${head}<th class="num">보이는 인원</th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>
        <p style="color:var(--muted);font-size:12.5px;margin:12px 0 0;line-height:1.7">
          · 본인이 1차 담당이거나 2차검토 담당인 대상자는 항상 보입니다.<br>
          · 아무 설정도 하지 않으면(전체) 모든 대상자가 보입니다.<br>
          · 담당자가 정해지지 않은 대상자(${A.owners[UNASSIGNED] || 0}명)는 누구에게나 보이고, 「내가 담당하기」로 맡을 수 있습니다.<br>
          · 응대기록과 대상자 증빙 첨부도 보이는 대상자 것만 나옵니다.<br>
          · 바꾼 뒤 아래 「변경사항 저장」을 누르세요. 담당자는 새로고침하면 반영됩니다.
        </p>
      </section>
      <div class="save-bar" id="aBar" ${aDirty ? '' : 'hidden'}><div class="left">변경사항이 있습니다. 저장해야 반영됩니다.</div>
        <div style="display:flex;gap:8px"><button class="btn" onclick="setAdmin(A)">되돌리기</button><button class="btn primary" id="aSave" onclick="saveMembers()">변경사항 저장</button></div></div>`;
  }
  function setScopeAll(i, on) {
    aDraft[i].scope = on ? SCOPE_ALL : '본인';
    aDirty = true; render();
  }
  function toggleScope(i, name, on) {
    const list = scopeList(aDraft[i]).filter(x => x !== name);
    if (on) list.push(name);
    aDraft[i].scope = ['본인'].concat(list).join(',');
    aDirty = true; render();
  }

  function adminMenus() {
    const rows = A.menus.map(m => `<tr><td class="strong">${esc(m.label)}</td>
      ${A.roles.map(r => `<td style="text-align:center"><input type="checkbox" class="check" ${menuDraft[r][m.key] !== false ? 'checked' : ''} onchange="menuDraft['${r}']['${m.key}']=this.checked;$('#mSave').disabled=false" aria-label="${r} ${esc(m.label)}"></td>`).join('')}
      <td style="text-align:center"><input type="checkbox" class="check" checked disabled aria-label="관리자 ${esc(m.label)}"></td></tr>`).join('');
    return `
      <div class="head"><div><h1>메뉴 권한</h1><p>역할마다 볼 수 있는 메뉴를 정합니다. 끈 메뉴는 화면에서 숨겨지고, 서버에서도 해당 기능과 데이터가 막힙니다.</p></div></div>
      <section class="panel">
        <div class="table-wrap"><table class="t" style="max-width:620px">
          <thead><tr><th>메뉴</th>${A.roles.map(r => `<th style="text-align:center">${r}</th>`).join('')}<th style="text-align:center">관리자</th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>
        <p style="color:var(--muted);font-size:13px;margin:12px 0">· 관리자는 항상 모든 메뉴와 [권한 관리] 메뉴를 봅니다.<br>· 서류 검토를 끄면 그 역할에게는 대상자 증빙 첨부도 보이지 않습니다.</p>
        <button class="btn primary" id="mSave" disabled onclick="saveMenus()">저장</button>
      </section>`;
  }
  function saveMenus() {
    $('#mSave').disabled = true;
    call('apiSaveMenuAccess', menuDraft).then(data => { A.menuAccess = data.menuAccess; menuDraft = JSON.parse(JSON.stringify(data.menuAccess)); load(); toast('메뉴 권한을 저장했습니다. 다른 담당자는 새로고침하면 반영됩니다.'); })
      .catch(e => { $('#mSave').disabled = false; fail(e); });
  }

  function adminSettings() {
    const st = A.settings, res = A.status.resources;
    const status = x => `<div class="hint" style="color:${x.ok ? 'var(--ok-ink)' : 'var(--warn-ink)'}">${x.ok ? `✓ 연결됨: ${esc(x.name)}` : esc(x.error)}</div>`;
    return `
      <div class="head"><div><h1>설정</h1><p>[설정] 시트를 직접 고치지 않아도 여기서 바꿀 수 있습니다.</p></div></div>
      <section class="panel" style="max-width:640px">
        <form class="form" id="sForm" novalidate>
          <div class="two">
            <div class="fld"><label for="sTeam">업무명 (화면 제목)</label><input class="field-in" id="sTeam" value="${esc(st.team)}"></div>
            <div class="fld"><label for="sYear">기본 연도 (지금 진행 중인 귀속연도)</label><select class="field-in" id="sYear">${st.years.map(y => `<option ${y === st.year ? 'selected' : ''}>${esc(y)}</option>`).join('')}</select></div>
          </div>
          <div class="fld"><label for="sFolder">첨부 폴더 (폴더 주소 또는 ID)</label><input class="field-in" id="sFolder" value="${esc(st.folderId)}" placeholder="https://drive.google.com/drive/folders/... 를 그대로 붙여넣어도 됩니다">${status(res.folder)}</div>
          <p class="hint">증빙 서류가 올라가는 폴더입니다. 새 폴더를 만들어 담당자에게만 공유하세요. 기본 연도는 처음 접속했을 때 보이는 연도입니다.</p>
          <div class="msg err" id="sErr" hidden></div>
          <div><button class="btn primary" id="sOk">저장</button></div>
        </form>
      </section>
      <section class="panel" style="max-width:640px">
        <div class="panel-head"><h2>연도 관리</h2><span>관리 중인 연도: ${st.years.map(esc).join(', ')}</span></div>
        <p class="hint" style="margin:0 0 12px">새 귀속연도를 시작하면 [대상자_연도]·[응대기록_연도]·[일정_연도] 시트를 새로 만듭니다. 지난 연도 자료는 그대로 남고, 왼쪽 위 연도 선택으로 언제든 볼 수 있습니다. 공지·기준·첨부도 연도별로 나뉘어 보입니다.</p>
        <form class="form" id="yForm" novalidate>
          <div class="fld"><label for="yYear">새 귀속연도</label><input class="field-in" id="yYear" inputmode="numeric" value="${Number(st.years[0]) + 1}" style="max-width:160px"></div>
          <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" class="check" id="yCarry" checked> ${esc(st.year)}년 대상자 명단 가져오기 (기본 정보·담당자만, 진행 체크·특이사항은 비움)</label>
          <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" class="check" id="yRules" checked> ${esc(st.year)}년 연말정산 기준 복사 (새 연도에서 고쳐 쓰기)</label>
          <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" class="check" id="yBase" checked> 새 연도를 기본 연도로 지정</label>
          <div class="msg err" id="yErr" hidden></div>
          <div><button class="btn primary" id="yOk">새 연도 시작</button></div>
        </form>
      </section>`;
  }
  document.addEventListener('submit', e => {
    if (e.target.id !== 'yForm') return;
    e.preventDefault();
    const y = $('#yYear').value.trim();
    const err = m => { $('#yErr').textContent = m; $('#yErr').hidden = false; };
    if (!/^\d{4}$/.test(y)) return err('연도는 2027처럼 네 자리로 입력해 주세요.');
    if (A.settings.years.includes(y)) return err(`${y}년은 이미 있습니다.`);
    $('#yOk').disabled = true; $('#yOk').textContent = `${y}년 만드는 중…`;
    call('apiStartYear', { year: y, from: A.settings.year, carry: $('#yCarry').checked, copyRules: $('#yRules').checked, makeBase: $('#yBase').checked })
      .then(res => { setAdmin(res.data); D = null; load(); toast(`${y}년 귀속을 시작했습니다.${res.carried ? ` 대상자 ${res.carried}명을 가져왔습니다.` : ''}${res.copied ? ` 기준 ${res.copied}건을 복사했습니다.` : ''}`); })
      .catch(e2 => { $('#yOk').disabled = false; $('#yOk').textContent = '새 연도 시작'; err(e2.message || String(e2)); });
  });
  document.addEventListener('submit', e => {
    if (e.target.id !== 'sForm') return;
    e.preventDefault();
    const s2 = { team: $('#sTeam').value, year: $('#sYear').value, folderId: $('#sFolder').value };
    $('#sOk').disabled = true;
    call('apiSaveSettings', s2).then(data => { setAdmin(data); load(); toast('설정을 저장했습니다.'); })
      .catch(err => { $('#sOk').disabled = false; $('#sErr').textContent = err.message || String(err); $('#sErr').hidden = false; });
  });

  function adminGuide() {
    const url = A.webAppUrl || '(아직 웹앱으로 배포되지 않았습니다)';
    const msg = `[${D.team} 안내]\n아래 주소로 접속해 주세요. (회사 구글 계정으로 로그인)\n${url}\n\n· 처음 접속하면 "권한 검토" 화면이 한 번 나옵니다. "허용"을 눌러주세요.\n· "Google에서 확인하지 않은 앱" 경고가 나오면 "고급 → 이동"을 누르면 됩니다.\n· 서류 검토 > 내 담당에서 맡은 대상자를 확인하고, 응대한 내용은 응대기록에 남겨주세요.`;
    return `
      <div class="head"><div><h1>접속 안내</h1><p>담당자에게 보낼 주소와 안내 문구입니다.</p></div></div>
      <section class="panel" style="max-width:720px;display:flex;flex-direction:column;gap:12px">
        <div class="fld"><label for="gUrl">웹앱 주소</label><div style="display:flex;gap:6px"><input class="field-in" id="gUrl" value="${esc(url)}" readonly><button class="btn" onclick="copyText('gUrl')">복사</button></div></div>
        <div class="fld"><label for="gMsg">안내 문구 (메신저·메일에 붙여넣기)</label><textarea class="field-in" id="gMsg" style="min-height:190px">${esc(msg)}</textarea></div>
        <div><button class="btn primary" onclick="copyText('gMsg')">안내 문구 복사</button></div>
      </section>`;
  }
  function copyText(id) {
    const el = $('#' + id);
    const done = () => toast('복사했습니다.');
    try {
      navigator.clipboard.writeText(el.value).then(done, () => { el.select(); toast('선택했습니다. Ctrl+C로 복사하세요.'); });
    } catch (e) { el.select(); toast('선택했습니다. Ctrl+C로 복사하세요.'); }
  }

  /* ================= 첨부 파일 올리기 ================= */
  const MAX_FILE = 10 * 1024 * 1024;
  const UP = {};
  function fileSize(n) { return n >= 1048576 ? `${(n / 1048576).toFixed(1)}MB` : `${Math.max(1, Math.round(n / 1024))}KB`; }
  function extOf(name) { const m = /\.([a-z0-9]+)$/i.exec(name || ''); return m ? m[1].toUpperCase().slice(0, 4) : 'FILE'; }
  function extClass(ext) {
    ext = ext.toLowerCase();
    if (ext === 'pdf') return 'pdf';
    if (['xls', 'xlsx', 'csv'].includes(ext)) return 'xls';
    if (['doc', 'docx', 'hwp', 'hwpx', 'txt'].includes(ext)) return 'doc';
    if (['ppt', 'pptx'].includes(ext)) return 'ppt';
    if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'heic'].includes(ext)) return 'img';
    return '';
  }
  function fileRow(f, opts) {
    opts = opts || {};
    const ext = extOf(f.name);
    const inner = `<span class="ext ${extClass(ext)}">${esc(ext)}</span>
      <span class="fn">${esc(f.name)}${opts.inline ? '' : `<span class="fs">${opts.msg ? esc(opts.msg) : fileSize(f.size || 0)}</span>`}</span>${opts.tail || ''}`;
    return opts.link
      ? `<a class="file" href="${esc(f.url)}" target="_blank" rel="noopener" title="${esc(f.name)} (${fileSize(f.size || 0)})">${inner}</a>`
      : `<div class="file ${opts.status || ''}">${inner}</div>`;
  }
  function filesView(files, inline) {
    return files && files.length ? `<div class="files ${inline ? 'inline' : ''}">${files.map(f => fileRow(f, { link: true, inline })).join('')}</div>` : '';
  }

  function uploaderHtml(key, label) {
    return `<div class="fld"><label for="drop-${key}">${label}</label>
      <div class="drop" id="drop-${key}" tabindex="0" role="button"><span class="desk-only">파일을 끌어다 놓거나 </span><u>눌러서 파일 선택</u> · 한 파일 10MB 이하</div>
      <input type="file" id="file-${key}" multiple hidden>
      <div class="files" id="up-${key}"></div></div>`;
  }
  /** extra: { ref, refLabel, memo(함수), onDone } — 대상자 증빙·일반 자료는 올리자마자 [첨부]에 기록된다 */
  function initUploader(key, area, existing, extra) {
    UP[key] = { area, extra: extra || {}, items: (existing || []).map(f => ({ status: 'done', f })) };
    const drop = $('#drop-' + key), input = $('#file-' + key);
    drop.onclick = () => input.click();
    drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } };
    drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = () => drop.classList.remove('over');
    drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); addFiles(key, e.dataTransfer.files); };
    input.onchange = () => { addFiles(key, input.files); input.value = ''; };
    drawUploader(key);
  }
  function addFiles(key, list) {
    const ex = UP[key].extra;
    Array.from(list).forEach(file => {
      const it = { status: 'up', f: { name: file.name, size: file.size } };
      UP[key].items.push(it);
      if (file.size > MAX_FILE) { it.status = 'err'; it.msg = '10MB를 넘어 올릴 수 없습니다'; return; }
      const reader = new FileReader();
      reader.onload = () => {
        call('apiUploadFile', { name: file.name, mimeType: file.type, data: String(reader.result).split(',')[1], area: UP[key].area, ref: ex.ref || '', refLabel: ex.refLabel || '', memo: typeof ex.memo === 'function' ? ex.memo() : '' })
          .then(res => { it.status = 'done'; it.f = res.file; applyData(res); if (ex.onDone) ex.onDone(); })
          .catch(e => { it.status = 'err'; it.msg = e.message || String(e); })
          .then(() => drawUploader(key));
      };
      reader.onerror = () => { it.status = 'err'; it.msg = '파일을 읽지 못했습니다'; drawUploader(key); };
      reader.readAsDataURL(file);
    });
    drawUploader(key);
  }
  function drawUploader(key) {
    const el = $('#up-' + key);
    if (!el) return;
    // 올리는 즉시 저장되는 곳(대상자 증빙·일반 자료)은 완료된 파일을 빼지 않는다
    const instant = UP[key].area === 'person' || UP[key].area === 'etc';
    el.innerHTML = UP[key].items.map((it, i) => fileRow(it.f, {
      status: it.status === 'done' ? '' : it.status,
      msg: it.status === 'err' ? it.msg : it.status === 'done' && instant ? '저장됨' : '',
      tail: instant && it.status === 'done' ? '<span class="chip ok">✓</span>' : `<button type="button" class="icon-btn" onclick="removeUpload('${key}', ${i})" aria-label="${esc(it.f.name)} 첨부 빼기">×</button>`,
    })).join('');
  }
  function removeUpload(key, i) { UP[key].items.splice(i, 1); drawUploader(key); }
  function uploadsBusy(key) { return !!UP[key] && UP[key].items.some(it => it.status === 'up'); }
  function uploadedFiles(key) { return UP[key] ? UP[key].items.filter(it => it.status === 'done').map(it => it.f) : []; }
  const BUSY_MSG = '파일을 올리는 중입니다. 업로드가 끝난 뒤 다시 눌러주세요.';

  document.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a.file[href^="#demo"]');
    if (a) { e.preventDefault(); toast('예시 화면이라 파일을 열 수 없습니다. 실제로는 구글 드라이브에서 열립니다.'); }
  });

  /* ================= 모달 ================= */
  function openModal(html, wide) {
    $('#modal').classList.toggle('wide', !!wide);
    $('#modal').innerHTML = html;
    $('#scrim').hidden = false;
    $('#modal').scrollTop = 0;
    const first = $('#modal').querySelector('select:not([disabled]), input:not([disabled]):not([type=checkbox]), textarea:not([disabled])');
    if (first && !wide) first.focus();
  }
  function closeModal() { $('#scrim').hidden = true; }
  $('#scrim').addEventListener('click', e => { if (e.target.id === 'scrim') closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#scrim').hidden) closeModal(); });

  /* ================= 기타 동작 ================= */
  function go(p) { page = p; closeModal(); render(); window.scrollTo(0, 0); }

  $('#nav').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) go(b.dataset.page);
  });

  // 예시 화면 전용: 보는 사람 전환
  function renderDemoBar() {
    const bar = $('#demoBar');
    if (!window.MockApi || !MockApi.users) return;
    bar.hidden = false;
    bar.innerHTML = `<b>예시 화면</b><span>모든 이름·사번·금액은 예시 데이터입니다.</span>
      <label>보는 사람 <select id="demoUser">${MockApi.users().map(u => `<option value="${esc(u.email)}" ${u.email === D.me.email ? 'selected' : ''}>${esc(u.name)} (${esc(u.role)})</option>`).join('')}</select></label>`;
    $('#demoUser').onchange = e => { MockApi.setUser(e.target.value); A = null; reviewTab = 'mine'; D = null; load(); };
  }

  load();
</script>

</body></html>
