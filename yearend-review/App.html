<title>연말정산 검토 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #eef1ef;
    --panel: #ffffff;
    --panel-2: #f6f8f7;
    --ink: #17201c;
    --ink-2: #44504a;
    --muted: #6b7771;
    --line: #d8dfdb;
    --line-strong: #6f7b75;
    --accent: #146b58;
    --accent-2: #0f5445;
    --accent-ink: #ffffff;
    --accent-soft: #dcefe8;
    --warn-bg: #fbe3df;
    --warn-ink: #9a2b1f;
    --pend-bg: #fdf0cf;
    --pend-ink: #7a5300;
    --ok-bg: #dff1e2;
    --ok-ink: #1d6a2b;
    --comment-bg: #fff7dc;
    --shadow: 0 12px 32px rgba(18, 38, 30, .16);
    --radius: 10px;
    --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #111513;
      --panel: #1a201d;
      --panel-2: #212824;
      --ink: #e3ebe7;
      --ink-2: #c1cbc6;
      --muted: #93a19a;
      --line: #313a36;
      --line-strong: #83918a;
      --accent: #52c3a4;
      --accent-2: #6fd4b8;
      --accent-ink: #0b1914;
      --accent-soft: #1b3a31;
      --warn-bg: #4b2420;
      --warn-ink: #ffb3a8;
      --pend-bg: #3d3217;
      --pend-ink: #f1cd7a;
      --ok-bg: #1d3a24;
      --ok-ink: #a2dcab;
      --comment-bg: #38321c;
      --shadow: 0 12px 32px rgba(0, 0, 0, .5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #111513;
    --panel: #1a201d;
    --panel-2: #212824;
    --ink: #e3ebe7;
    --ink-2: #c1cbc6;
    --muted: #93a19a;
    --line: #313a36;
    --line-strong: #83918a;
    --accent: #52c3a4;
    --accent-2: #6fd4b8;
    --accent-ink: #0b1914;
    --accent-soft: #1b3a31;
    --warn-bg: #4b2420;
    --warn-ink: #ffb3a8;
    --pend-bg: #3d3217;
    --pend-ink: #f1cd7a;
    --ok-bg: #1d3a24;
    --ok-ink: #a2dcab;
    --comment-bg: #38321c;
    --shadow: 0 12px 32px rgba(0, 0, 0, .5);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    padding-block: 16px 40px;
    padding-inline: 16px;
    font-variant-numeric: tabular-nums;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: var(--accent); }

  .demo-bar {
    max-width: 1320px; margin: 0 auto 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    background: var(--pend-bg); color: var(--pend-ink); border-radius: 8px; padding: 8px 12px; font-size: 13px;
  }
  .demo-bar select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }

  .app { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: 216px minmax(0, 1fr); gap: 16px; align-items: start; }

  /* 사이드바 */
  .side {
    position: sticky; top: calc(16px + env(safe-area-inset-top, 0px));
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 10px; display: flex; flex-direction: column; gap: 14px;
  }
  .brand { padding: 0 8px; display: flex; flex-direction: column; gap: 2px; }
  .brand b { font-size: 16px; letter-spacing: -.01em; }
  .brand span { color: var(--muted); font-size: 12px; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav button {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: none; border: 0; border-radius: 7px; padding: 9px 10px; cursor: pointer; text-align: left; color: var(--ink-2);
  }
  .nav button:hover { background: var(--panel-2); }
  .nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent-2); font-weight: 600; }
  .ni { display: inline-flex; align-items: center; gap: 9px; }
  .ico { font-style: normal; width: 18px; text-align: center; color: var(--muted); font-size: 13px; }
  .nav button[aria-current="page"] .ico { color: var(--accent-2); }

  /* 하위 탭 */
  .subtabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .subtabs button {
    background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 14px; cursor: pointer; color: var(--muted); white-space: nowrap; margin-bottom: -1px;
  }
  .subtabs button[aria-selected="true"] { color: var(--accent-2); border-bottom-color: var(--accent); font-weight: 600; }

  /* 게시판 */
  .posts { display: flex; flex-direction: column; }
  .post { border-top: 1px solid var(--line); }
  .post:first-child { border-top: 0; }
  .post-head {
    width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 11px 4px;
    background: none; border: 0; cursor: pointer; text-align: left;
  }
  .post-head:hover { background: var(--panel-2); }
  .post-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .post-title .pin { color: var(--accent); margin-right: 4px; }
  .post-title .cc { color: var(--accent); font-weight: 600; margin-left: 6px; font-size: 13px; }
  .post-meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .chip.cat-공지 { background: var(--accent); color: var(--accent-ink); }
  .chip.cat-자료 { background: var(--accent-soft); color: var(--accent-2); }
  .chip.cat-일반 { background: var(--panel-2); color: var(--muted); }
  .post-body { padding: 4px 4px 16px; display: flex; flex-direction: column; gap: 12px; }
  .post-text { white-space: pre-wrap; overflow-wrap: anywhere; max-width: 72ch; }
  .post-link { overflow-wrap: anywhere; }
  .comments { background: var(--panel-2); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .cmt { display: flex; flex-direction: column; gap: 1px; }
  .cmt b { font-size: 13px; }
  .cmt b span { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .cmt p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .cmt-form { display: flex; gap: 6px; }
  .cmt-form input { flex: 1; min-width: 0; }

  /* 회사 기준 */
  .rules-layout { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 16px; align-items: start; }
  .cats { display: flex; flex-direction: column; gap: 2px; }
  .cats button { display: flex; justify-content: space-between; gap: 8px; background: none; border: 0; border-radius: 7px; padding: 8px 10px; cursor: pointer; text-align: left; color: var(--ink-2); }
  .cats button:hover { background: var(--panel-2); }
  .cats button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-2); font-weight: 600; }
  .cats button span { color: var(--muted); font-size: 12px; }
  .search { width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 9px 12px; margin-bottom: 12px; }
  .rule { border-top: 1px solid var(--line); }
  .rule:first-child { border-top: 0; }
  .rule-head { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 4px; background: none; border: 0; cursor: pointer; text-align: left; }
  .rule-head:hover { background: var(--panel-2); }
  .rule-title { font-weight: 600; font-size: 15px; }
  .rule-sum { grid-column: 1 / -1; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rule-date { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .rule-body { padding: 0 4px 18px; display: flex; flex-direction: column; gap: 12px; }
  .rule-meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ink-2); background: var(--panel-2); border-radius: 8px; padding: 8px 12px; }
  .rule-meta b { color: var(--muted); font-weight: 500; margin-right: 6px; }
  .rule-text { white-space: pre-wrap; overflow-wrap: anywhere; max-width: 76ch; line-height: 1.7; }
  .hist { font-size: 13px; }
  .hist summary { cursor: pointer; color: var(--muted); }
  .hist ol { margin: 8px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
  .hist li span { color: var(--muted); margin-right: 8px; }
  mark { background: var(--pend-bg); color: inherit; border-radius: 2px; }

  /* 첨부 파일 */
  .drop {
    border: 1.5px dashed var(--line-strong); border-radius: 8px; padding: 14px 12px; text-align: center; color: var(--muted);
    cursor: pointer; font-size: 13px; background: var(--panel-2);
  }
  .drop:hover, .drop.over { border-color: var(--accent); color: var(--accent-2); background: var(--accent-soft); }
  .drop u { color: var(--accent-2); }
  .files { display: flex; flex-direction: column; gap: 6px; }
  .files:empty { display: none; }
  .files.inline { flex-direction: row; flex-wrap: wrap; margin-top: 6px; }
  .file {
    display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 10px; align-items: center; max-width: 520px;
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px 6px 6px; background: var(--panel); color: var(--ink); text-decoration: none;
  }
  a.file:hover { border-color: var(--accent); }
  .files.inline .file { grid-template-columns: auto minmax(0, 1fr); padding: 3px 8px 3px 3px; gap: 6px; font-size: 12px; max-width: 260px; }
  .ext { font-size: 10px; font-weight: 700; letter-spacing: .02em; text-align: center; border-radius: 5px; padding: 7px 0; background: var(--panel-2); color: var(--muted); }
  .files.inline .ext { padding: 2px 5px; font-size: 9.5px; }
  .ext.pdf { background: var(--warn-bg); color: var(--warn-ink); }
  .ext.xls { background: var(--ok-bg); color: var(--ok-ink); }
  .ext.doc { background: var(--accent-soft); color: var(--accent-2); }
  .ext.img, .ext.ppt { background: var(--pend-bg); color: var(--pend-ink); }
  .fn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .fs { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
  .file.up { opacity: .75; }
  .file.up .fs::after { content: " · 업로드 중…"; color: var(--accent-2); }
  .file.err { border-color: var(--warn-ink); }
  .file.err .fs { color: var(--warn-ink); }
  .clip { color: var(--muted); font-size: 13px; margin-left: 4px; }
  .sub-label { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; margin-bottom: -6px; }

  .count { font-size: 11px; font-weight: 700; min-width: 20px; text-align: center; padding: 1px 6px; border-radius: 99px; background: var(--warn-bg); color: var(--warn-ink); }
  .count.soft { background: var(--panel-2); color: var(--muted); }
  .me { border-top: 1px solid var(--line); padding: 12px 8px 0; display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
  .me span { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }

  /* 본문 */
  .main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; }
  .head h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; text-wrap: balance; }
  .head p { margin: 2px 0 0; color: var(--muted); }
  .head-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel);
    border-radius: 7px; padding: 7px 14px; cursor: pointer; text-decoration: none; color: var(--ink); white-space: nowrap;
  }
  .btn:hover { border-color: var(--line-strong); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn.small { padding: 4px 10px; font-size: 13px; }
  .btn.danger { color: var(--warn-ink); }
  .btn:disabled { opacity: .5; cursor: default; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .panel-head h2 { margin: 0; font-size: 15px; }
  .panel-head span { color: var(--muted); font-size: 12px; }

  /* 지표 */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
  .kpi .label { color: var(--muted); font-size: 12px; letter-spacing: .02em; }
  .kpi .value { font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
  .kpi .value small { font-size: 15px; font-weight: 500; color: var(--muted); }
  .kpi .sub { color: var(--ink-2); font-size: 13px; }
  .kpi.alert .value { color: var(--warn-ink); }
  .meter { height: 6px; border-radius: 99px; background: var(--panel-2); overflow: hidden; margin-top: 4px; }
  .meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

  .grid-2 { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; align-items: start; }

  /* 목록 */
  .list { display: flex; flex-direction: column; }
  .list-row { display: grid; grid-template-columns: 72px auto minmax(0, 1fr); gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
  .list-row:first-child { border-top: 0; }
  .list-row .who { font-weight: 600; }
  .list-row .meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
  .chip.ok { background: var(--ok-bg); color: var(--ok-ink); }
  .chip.no { background: var(--warn-bg); color: var(--warn-ink); }
  .chip.pend { background: var(--pend-bg); color: var(--pend-ink); }
  .chip.plain { background: var(--panel-2); color: var(--muted); }

  .due-row { display: grid; grid-template-columns: 76px 64px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); align-items: baseline; }
  .due-row:first-child { border-top: 0; }
  .due-row .d { font-weight: 600; }
  .due-row .n { color: var(--muted); }
  .empty { color: var(--muted); padding: 12px 0; }

  /* 표 */
  .table-wrap { overflow-x: auto; }
  table.t { border-collapse: collapse; width: 100%; }
  .t th, .t td { border-bottom: 1px solid var(--line); padding: 9px 10px; text-align: left; vertical-align: top; }
  .t th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; background: var(--panel-2); }
  .t td.num, .t th.num { text-align: right; white-space: nowrap; }
  .t td.nowrap { white-space: nowrap; }
  .t td.strong { font-weight: 700; }

  table.report { border-collapse: collapse; min-width: 980px; }
  .report th, .report td { border: 1px solid var(--line); padding: 7px 9px; vertical-align: middle; }
  .report th { background: var(--panel-2); text-align: center; font-weight: 600; white-space: nowrap; }
  .report td.c { text-align: center; white-space: nowrap; }
  .report tr.top td { border-top: 2px solid var(--line-strong); }
  .report td.nm { text-align: center; font-weight: 600; white-space: nowrap; }
  .report td.nm.pending { background: var(--warn-bg); color: var(--warn-ink); }
  .report td.cm { background: var(--comment-bg); min-width: 220px; white-space: pre-wrap; }
  .report td.cm.editable { cursor: pointer; }
  .report td.cm.editable:hover { outline: 1px dashed var(--line-strong); outline-offset: -3px; }
  .report td.cm textarea { width: 100%; min-height: 70px; border: 1px solid var(--line-strong); border-radius: 6px; padding: 6px; background: var(--panel); }
  .report-title { font-weight: 700; margin: 0 0 4px; }
  .report-note { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
  .cm-actions { display: flex; gap: 6px; margin-top: 6px; justify-content: flex-end; }

  /* 내 주간업무 */
  .edit-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .items { display: flex; flex-direction: column; gap: 8px; }
  .item { display: grid; grid-template-columns: minmax(0, 1fr) 138px auto auto; gap: 6px; align-items: center; }
  .field-in { width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 7px 9px; }
  .field-in:disabled { background: var(--panel-2); color: var(--muted); }
  .toggle { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 6px 9px; cursor: pointer; font-size: 13px; white-space: nowrap; }
  .toggle[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-2); border-color: var(--accent); font-weight: 600; }
  .icon-btn { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 4px 6px; border-radius: 6px; font-size: 16px; line-height: 1; }
  .icon-btn:hover { background: var(--panel-2); color: var(--warn-ink); }
  .add { margin-top: 10px; }
  .save-bar {
    position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 5;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 16px;
  }
  .save-bar .left { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; flex: 1 1 360px; }
  .save-bar label { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .save-bar .note-in { flex: 1 1 220px; }
  .check { width: 18px; height: 18px; accent-color: var(--accent); }
  .notice { background: var(--pend-bg); color: var(--pend-ink); border-radius: 8px; padding: 10px 12px; }

  /* 필터 */
  .filters { display: flex; flex-wrap: wrap; gap: 6px; }
  .filters button { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
  .filters button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }

  /* 모달 */
  .scrim { position: fixed; inset: 0; background: rgba(8, 16, 13, .5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal { background: var(--panel); width: 100%; max-width: 480px; max-height: 100%; overflow-y: auto; border-radius: 12px; box-shadow: var(--shadow); padding: 20px; }
  .modal h3 { margin: 0 0 4px; font-size: 17px; }
  .modal p.sub { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  .form { display: flex; flex-direction: column; gap: 12px; }
  .form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .fld { display: flex; flex-direction: column; gap: 4px; }
  .fld label { font-weight: 600; font-size: 13px; }
  .fld textarea { min-height: 80px; resize: vertical; }
  .hint { color: var(--muted); font-size: 12px; min-height: 18px; }
  .msg { border-radius: 7px; padding: 8px 10px; font-size: 13px; }
  .msg.err { background: var(--warn-bg); color: var(--warn-ink); }
  .msg.ok { background: var(--ok-bg); color: var(--ok-ink); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 70;
    background: var(--ink); color: var(--panel); border-radius: 8px; padding: 10px 16px; box-shadow: var(--shadow); max-width: calc(100% - 32px);
  }
  .loading { color: var(--muted); padding: 40px 0; text-align: center; }

  @media (max-width: 1080px) {
    .kpis { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    .grid-2 { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 860px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .side { position: static; padding: 10px; gap: 8px; }
    .nav { flex-direction: row; overflow-x: auto; }
    .nav button { white-space: nowrap; }
    .me { display: none; }
    .edit-cols { grid-template-columns: minmax(0, 1fr); }
    .rules-layout { grid-template-columns: minmax(0, 1fr); }
    .cats { flex-direction: row; overflow-x: auto; }
    .cats button { white-space: nowrap; }
  }
  @media (max-width: 520px) {
    .kpi .value { font-size: 24px; }
    .item { grid-template-columns: minmax(0, 1fr) auto auto; }
    .item .date-in { grid-column: 1 / 2; }

<script>
  /* ================= 서버 호출 ================= */
  function call(fn, ...args) {
    return new Promise((resolve, reject) => {
      if (window.google && google.script && google.script.run) {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
      } else if (window.MockApi) {
        setTimeout(() => {
          try { resolve(JSON.parse(JSON.stringify(window.MockApi[fn](...args)))); } catch (e) { reject(e); }
        }, (MockApi.delay && MockApi.delay[fn]) || 120);
      } else {
        reject(new Error('서버에 연결할 수 없습니다.'));
      }
    });
  }

  /* ================= 상태 ================= */
  let D = null;
  let page = 'dash';
  let reviewTab = 'mine';      // mine | all | logs
  let reviewStatus = 'all';
  let reviewOwner = '';
  let reviewQuery = '';
  let logQuery = '';
  let noticeFilter = 'all';
  let showOld = false;
  let openNotice = null;
  let ruleCat = 'all';
  let ruleQuery = '';
  let openRule = null;
  let fileArea = 'all';
  let fileQuery = '';

  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const now = () => (window.MockApi && MockApi.now) ? MockApi.now() : new Date();
  const pad2 = n => String(n).padStart(2, '0');
  const todayKey = () => { const d = now(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };

  function toast(text) {
    const t = $('#toast');
    t.textContent = text;
    t.hidden = false;
    clearTimeout(toast.t);
    toast.t = setTimeout(() => { t.hidden = true; }, 3200);
  }
  function fail(e) { toast(e && e.message ? e.message : String(e)); }

  /** 서버가 돌려준 조각(바뀐 부분만)을 화면 데이터에 합친다 */
  function applyData(data) {
    if (!data) return;
    if (data.personPatch) {
      const key = data.oldId || data.personPatch.id;
      let i = D.people.findIndex(p => p.id === key);
      if (i < 0) i = D.people.findIndex(p => p.id === data.personPatch.id); // 화면에서 사원번호를 먼저 바꾼 경우
      if (i >= 0) D.people[i] = data.personPatch; else D.people.push(data.personPatch);
    }
    if (data.logAdded) {
      // 화면에 먼저 넣어 둔 임시 기록을 서버 기록으로 바꾼다
      const i = D.logs.findIndex(l => l._tmp && l.empNo === data.logAdded.empNo && l.body === data.logAdded.body);
      if (i >= 0) D.logs[i] = data.logAdded; else D.logs.unshift(data.logAdded);
    }
    if (data.commentAdded) {
      const n = D.notices.find(x => x.id === data.commentAdded.id);
      if (n) {
        const i = n.comments.findIndex(c => c._tmp && c.body === data.commentAdded.comment.body);
        if (i >= 0) n.comments[i] = data.commentAdded.comment; else n.comments.push(data.commentAdded.comment);
      }
    }
    ['people', 'logs', 'notices', 'reads', 'rules', 'files', 'me'].forEach(k => { if (data[k]) D[k] = data[k]; });
  }

  /**
   * 빠른 저장: 화면에 먼저 반영하고(바로), 서버 저장은 뒤에서 한다.
   * 실패하면 undo()로 화면을 되돌리고 retry()로 작성하던 화면을 다시 띄운다.
   */
  let pending = 0;
  function saveInBackground(fn, args, opts) {
    pending++;
    showSaving();
    return call(fn, ...args)
      .then(data => { applyData(data); if (opts.done) opts.done(data); return data; })
      .catch(err => {
        if (opts.undo) opts.undo();
        render();
        if (opts.retry) opts.retry(err.message || String(err)); else fail(err);
      })
      .then(() => { pending--; showSaving(); if (!pending && opts.ok) toast(opts.ok); });
  }
  function showSaving() {
    const el = $('#saving');
    if (el) el.hidden = !pending;
  }
  window.addEventListener('beforeunload', e => { if (pending) { e.preventDefault(); e.returnValue = ''; } });

  function load() {
    return call('apiBootstrap').then(data => { D = data; render(); }).catch(fail);
  }

  /* ================= 공통 계산 ================= */
  const STATUS = {
    none: ['서류 미도착', 'plain'],
    review: ['1차 검토중', 'info'],
    supp: ['미비서류', 'no'],
    wait2: ['2차 검토 대기', 'pend'],
    done: ['검토완료', 'ok'],
  };
  /** 상태는 시트 체크 항목으로 자동 판정 (시트에 상태 열을 따로 두지 않는다) */
  function pStatus(p) {
    if (String(p.missing || '').trim()) return 'supp';
    if (!(p.arrived || p.manual || p.ehr)) return 'none';
    if (!p.verified) return 'review';
    if (!p.review2) return 'wait2';
    return 'done';
  }
  const statusChip = p => { const [l, c] = STATUS[pStatus(p)]; return `<span class="chip ${c}">${l}</span>`; };
  const isMine = p => !!D.me.name && (p.owner === D.me.name || p.owner2 === D.me.name);
  /** 내가 지금 손대야 하는 대상자: 1차 담당인데 아직 검증 전/미비서류, 또는 2차 담당인데 2차 대기 */
  const myTodo = p => (p.owner === D.me.name && ['none', 'review', 'supp'].includes(pStatus(p))) || (p.owner2 === D.me.name && pStatus(p) === 'wait2');
  const col = k => D.cols.find(c => c.k === k);
  const hasNote = p => ['note1', 'fix1', 'note2', 'fix2'].some(k => String(p[k] || '').trim());
  const isLead = () => D.me.isLeader || D.me.isAdmin;

  /** 서버의 canEdit_와 같은 규칙 (화면에서 막고, 서버에서도 다시 막는다) */
  function canEdit(p, c, draftOwner) {
    if (isLead()) return true;
    if (!D.me.name) return false;
    const takes = !p.owner && draftOwner === D.me.name;
    if (c.who === 'assign') return c.k === 'owner' && !p.owner;
    if (c.who === 'second') return p.owner2 === D.me.name;
    return p.owner === D.me.name || takes;
  }

  const activeNotice = n => { const t = todayKey(); return (!n.start || n.start <= t) && (!n.end || n.end >= t); };
  const isRead = n => D.reads.indexOf(n.id) >= 0;
  function daysAgo(s) { const d = new Date(String(s).slice(0, 10) + 'T00:00:00'); return (now() - d) / 864e5; }

  function can(k) { return !!(D && D.me.menus && D.me.menus.indexOf(k) >= 0); }

  /* ================= 렌더링 ================= */
  function render() {
    document.title = D.team;
    $('#brandTeam').textContent = D.team;
    $('#brandYear').textContent = `${D.year}년 귀속`;
    const role = (D.me.role || (D.me.isAdmin ? '' : '조회')) + (D.me.isAdmin ? (D.me.role ? ' · 관리자' : '관리자') : '');
    $('#mtop').innerHTML = `<div><b>${esc(D.team)}</b><span>${esc(D.year)}년 귀속 연말정산</span></div>
      <span class="avatar" title="${esc(D.me.email || '')}">${esc(D.me.name ? D.me.name.slice(-2) : '?')}</span>`;
    $('#meBox').innerHTML = D.me.name
      ? `<b>${esc(D.me.name)} · ${esc(role)}</b><span>${esc(D.me.email)}</span>`
      : `<b>등록되지 않은 사용자</b><span>${esc(D.me.email || '')}</span>`;

    const todo = D.me.name ? D.people.filter(myTodo).length : 0;
    $('#cReview').outerHTML = `<span id="cReview">${todo ? `<span class="count" title="내가 처리할 대상자">${todo}</span>` : ''}</span>`;
    const unread = D.notices.filter(n => activeNotice(n) && !isRead(n)).length;
    $('#cNotice').outerHTML = `<span id="cNotice">${unread ? `<span class="count soft" title="안 읽은 글">N ${unread}</span>` : ''}</span>`;
    const issues = A ? A.members.filter(m => m.email && needsAttention(m.name)).length : 0;
    $('#cAdmin').outerHTML = `<span id="cAdmin">${issues ? `<span class="count" title="권한 확인 필요">${issues}</span>` : ''}</span>`;

    const allowed = ['dash', 'review', 'notice', 'rules', 'files', 'admin'].filter(can);
    if (!can(page)) page = allowed[0] || 'none';
    document.querySelectorAll('#nav button').forEach(b => {
      b.hidden = !can(b.dataset.page);
      if (b.dataset.page === page) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });

    $('#main').innerHTML = PAGES[page]();
    if (page === 'admin' && !A) loadAdmin(false);
    renderDemoBar();
  }

  const PAGES = {
    none() {
      return `<div class="head"><div><h1>접근 권한이 없습니다</h1></div></div>
        <div class="notice">${D.me.name ? '볼 수 있는 메뉴가 없습니다.' : `${esc(D.me.email || '이 계정')}은(는) [담당자] 시트에 등록되어 있지 않습니다.`} 관리자에게 등록과 권한을 요청하세요.</div>`;
    },
    dash: () => VIEWS.dash(),
    review: () => VIEWS.review(),
    notice: () => VIEWS.notice(),
    rules: () => VIEWS.rules(),
    files: () => VIEWS.files(),
    admin: () => VIEWS.admin(),
  };
  const VIEWS = {};

  /* ================= 대시보드 ================= */
  function noticeBanners() {
    const top = D.notices.filter(n => activeNotice(n) && (n.pinned || n.level === '긴급'));
    if (!top.length) return '';
    return `<div class="banners">${top.map(n => `
      <button class="banner lv-${esc(n.level)}" onclick="openNotice='${esc(n.id)}';go('notice')">
        <span>${n.level === '긴급' ? '🚨' : n.level === '중요' ? '⚠️' : '📌'}</span>
        <span><b>${isRead(n) ? '' : '<span class="unread"></span>'}${esc(n.title)}</b><span class="txt">${esc(n.body)}</span></span>
      </button>`).join('')}</div>`;
  }

  VIEWS.dash = function () {
    const P = D.people;
    const cnt = k => P.filter(p => pStatus(p) === k).length;
    const done = cnt('done');
    const pct = P.length ? Math.round(done / P.length * 100) : 0;
    const leave = P.filter(p => p.leave).length;
    const mine = D.me.name ? P.filter(myTodo) : [];

    const kpis = can('review') || can('dash') ? `
      <div class="kpis">
        <div class="kpi click" onclick="reviewTab='all';reviewStatus='all';go('review')"><span class="label">검토 대상</span><span class="value">${P.length}<small>명</small></span><span class="sub">${leave ? `휴직 ${leave}명 포함` : '&nbsp;'}</span></div>
        ${D.me.name ? `<div class="kpi click ${mine.length ? 'alert' : ''}" onclick="reviewTab='mine';reviewStatus='all';go('review')"><span class="label">내가 처리할 대상자</span><span class="value">${mine.length}<small>명</small></span><span class="sub">1차 검토·미비서류·2차 대기</span></div>` : ''}
        <div class="kpi click ${cnt('supp') ? 'alert' : ''}" onclick="reviewTab='all';reviewStatus='supp';go('review')"><span class="label">미비서류</span><span class="value">${cnt('supp')}<small>명</small></span><span class="sub">보완 요청 필요</span></div>
        <div class="kpi click" onclick="reviewTab='all';reviewStatus='wait2';go('review')"><span class="label">2차 검토 대기</span><span class="value">${cnt('wait2')}<small>명</small></span><span class="sub">1차 검증 완료</span></div>
        <div class="kpi click" onclick="reviewTab='all';reviewStatus='done';go('review')"><span class="label">검토완료</span><span class="value">${pct}<small>%</small></span><span class="sub">${done} / ${P.length}명</span><div class="meter"><i style="width:${pct}%"></i></div></div>
      </div>` : '';

    // 담당자별 진행
    const owners = [...new Set(P.map(p => p.owner || '(미배정)'))].sort((a, b) => (a === '(미배정)') - (b === '(미배정)') || a.localeCompare(b, 'ko'));
    const progRows = owners.map(o => {
      const list = P.filter(p => (p.owner || '(미배정)') === o);
      const c = k => list.filter(p => pStatus(p) === k).length;
      const d = c('done'), pc = list.length ? Math.round(d / list.length * 100) : 0;
      return `<div class="prog-row"><b>${esc(o)}</b><span class="n">${list.length}</span><span class="n">${c('none')}</span><span class="n">${c('review')}</span><span class="n ${c('supp') ? 'warn' : ''}">${c('supp')}</span><span class="n">${c('wait2')}</span>
        <div class="meter" title="검토완료 ${d}명 (${pc}%)"><i style="width:${pc}%"></i></div></div>`;
    }).join('');

    const todoRows = mine.slice(0, 8).map(p => `
      <div class="list-row" style="cursor:pointer" onclick="openPerson('${esc(p.id)}')">
        <span class="who">${esc(p.name)}</span>${statusChip(p)}
        <span class="meta">${esc(p.dept)}${p.owner2 === D.me.name && pStatus(p) === 'wait2' ? ' · 2차 검토 차례' : ''}${p.missing ? ` · ⚠ ${esc(p.missing)}` : ''}</span>
      </div>`).join('') || '<div class="empty">지금 처리할 대상자가 없습니다.</div>';

    const recentNotices = D.notices.filter(activeNotice).slice(0, 5).map(n => `
      <div class="list-row" style="cursor:pointer;grid-template-columns:auto minmax(0,1fr) auto" onclick="openNotice='${esc(n.id)}';go('notice')">
        <span class="chip cat-${esc(n.category)}">${esc(n.category)}</span>
        <span class="who" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${isRead(n) ? '' : '<span class="unread"></span>'}${n.pinned ? '📌 ' : ''}${esc(n.title)}</span>
        <span class="meta">${esc(n.date.slice(5, 10))}</span>
      </div>`).join('') || '<div class="empty">게시 중인 공지가 없습니다.</div>';

    const recentLogs = D.logs.slice(0, 5).map(logRow).join('') || '<div class="empty">응대기록이 없습니다.</div>';

    return `
      <div class="head">
        <div><h1>${esc(D.year)}년 귀속 연말정산</h1><p>${esc(D.team)} · ${D.me.name ? `${esc(D.me.name)}님` : ''} 오늘 ${esc(todayKey())}</p></div>
      </div>
      ${can('notice') ? noticeBanners() : ''}
      ${kpis}
      <div class="grid-2">
        <section class="panel">
          <div class="panel-head"><h2>담당자별 진행</h2><span>대상 · 미도착 · 1차중 · 미비 · 2차대기 · 완료율</span></div>
          <div class="prog-row h"><span>담당자</span><span class="n">대상</span><span class="n">미도착</span><span class="n">1차중</span><span class="n">미비</span><span class="n">2차대기</span><span>완료율</span></div>
          ${progRows || '<div class="empty">대상자가 없습니다. [대상자] 시트에 붙여넣으세요.</div>'}
        </section>
        <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
          ${D.me.name && can('review') ? `<section class="panel"><div class="panel-head"><h2>내가 처리할 대상자</h2><span>${mine.length}명</span></div><div class="list">${todoRows}</div></section>` : ''}
          ${can('notice') ? `<section class="panel"><div class="panel-head"><h2>최근 공지</h2><button class="linkish" onclick="go('notice')">전체 보기</button></div><div class="list">${recentNotices}</div></section>` : ''}
        </div>
      </div>
      ${can('review') ? `<section class="panel"><div class="panel-head"><h2>최근 응대기록</h2><button class="linkish" onclick="reviewTab='logs';go('review')">전체 보기</button></div><div class="logs">${recentLogs}</div></section>` : ''}`;
  };

  function logRow(l, noName) {
    const p = D.people.find(x => x.empNo === l.empNo);
    return `<div class="log"><span class="d">${esc(l._tmp ? '방금' : l.date.slice(2, 16))}</span><span class="chip plain" style="justify-self:start">${esc(l.kind)}</span>
      <p>${noName ? '' : `${p ? `<button class="linkish" onclick="openPerson('${esc(p.id)}')"><b>${esc(l.name)}</b></button>` : `<b>${esc(l.name)}</b>`} · `}${esc(l.body)} <span class="who">— ${esc(l.author)}</span></p></div>`;
  }

  /* ================= 서류 검토 ================= */
  function reviewBase() {
    if (reviewTab === 'mine') return D.people.filter(isMine);
    return D.people.filter(p => !reviewOwner || p.owner === reviewOwner || p.owner2 === reviewOwner || (reviewOwner === '(미배정)' && !p.owner));
  }
  function reviewFiltered() {
    const q = reviewQuery.trim().toLowerCase();
    return reviewBase()
      .filter(p => reviewStatus === 'all' || pStatus(p) === reviewStatus)
      .filter(p => !q || [p.empNo, p.name, p.dept, p.phone, p.email, p.missing, p.note1, p.note2].join(' ').toLowerCase().includes(q))
      .sort((a, b) => String(a.no).localeCompare(String(b.no), 'ko', { numeric: true }) || String(a.empNo).localeCompare(String(b.empNo), 'ko', { numeric: true }));
  }
  const mini = (p, items) => `<span class="mini">${items.map(([k, l]) => `<span class="${p[k] ? 'on' : ''}" title="${esc(col(k).l)}">${l}</span>`).join('')}</span>`;

  function reviewListHtml() {
    const list = reviewFiltered();
    const logCount = {};
    D.logs.forEach(l => { logCount[l.empNo] = (logCount[l.empNo] || 0) + 1; });
    // 명단: 시트와 같은 기본 정보 10개 열을 한 줄씩 보여주고, 줄을 누르면 수정 화면이 뜬다
    const BASIC = ['no', 'dept', 'empNo', 'name', 'subgroup', 'payArea', 'rank', 'phone', 'email', 'leave'];
    const rows = list.map(p => `
      <tr onclick="openPerson('${esc(p.id)}')" title="눌러서 ${esc(p.name)}님 정보 수정">
        ${BASIC.map(k => `<td class="${k === 'name' ? 'nm' : ''}">${k === 'leave' ? (p.leave ? 'O' : '') : esc(p[k])}</td>`).join('')}
      </tr>`).join('');
    return rows
      ? `<div class="table-wrap"><table class="sheet-grid"><thead><tr>${BASIC.map(k => `<th>${esc(col(k).l)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
        <p class="hint" style="margin-top:8px">${list.length}명 · 이름을 누르면 기본 정보와 검토 내용을 수정하는 화면이 뜹니다.</p>`
      : `<div class="empty">${reviewTab === 'mine' ? (D.me.name ? '[대상자] 시트의 담당자·2차검토 담당자 칸에 내 이름이 있는 사람이 없습니다.' : '[담당자] 시트에 등록되어야 내 담당을 볼 수 있습니다.') : '조건에 맞는 대상자가 없습니다.'}</div>`;
  }

  function logsListHtml() {
    const q = logQuery.trim().toLowerCase();
    const list = D.logs.filter(l => !q || [l.name, l.empNo, l.author, l.kind, l.body].join(' ').toLowerCase().includes(q));
    return list.slice(0, 300).map(l => logRow(l)).join('') || '<div class="empty">응대기록이 없습니다.</div>';
  }

  VIEWS.review = function () {
    const tab = (k, label) => `<button role="tab" aria-selected="${reviewTab === k}" onclick="reviewTab='${k}';reviewStatus='all';render()">${label}</button>`;
    const head = `
      <div class="head">
        <div><h1>서류 검토</h1><p>대상자를 눌러 진행 체크·특이사항·수정사항·미비서류를 입력하세요. [대상자] 시트에 바로 저장됩니다.</p></div>
        <div class="head-actions">
          ${isLead() ? '<button class="btn" onclick="openImport()">시트 붙여넣기</button><button class="btn" onclick="openAddPerson()">+ 대상자</button>' : ''}
          <a class="btn" href="${esc(D.sheetUrl)}" target="_blank" rel="noopener">시트 열기</a>
        </div>
      </div>
      <div class="subtabs" role="tablist">${tab('mine', `내 담당 ${D.people.filter(isMine).length}`)}${tab('all', `전체 ${D.people.length}`)}${tab('logs', `응대기록 ${D.logs.length}`)}</div>`;

    if (reviewTab === 'logs') {
      return head + `<section class="panel">
        <input class="search" id="logSearch" type="search" placeholder="대상자·담당자·내용 검색" value="${esc(logQuery)}" aria-label="응대기록 검색">
        <div class="logs" id="logList">${logsListHtml()}</div>
        <p style="color:var(--muted);font-size:12px;margin:10px 0 0">응대기록은 대상자를 눌러 남깁니다. 누가 응대했든 모든 담당자가 같은 기록을 봅니다.</p>
      </section>`;
    }
    const base = reviewBase();
    const scopeNote = D.me.scope && D.me.scope !== '전체' && !isLead()
      ? `<p class="hint" style="margin:0 0 10px">열람 범위: ${D.me.scope.split(',').filter(x => x !== '본인').length ? `내 담당 + ${esc(D.me.scope.split(',').filter(x => x !== '본인').map(x => x === '(미배정)' ? '담당자 없는 대상자' : `${x} 담당`).join(', '))}` : '내 담당만'} (관리자가 정합니다)</p>` : '';
    const owners = [...new Set(D.people.flatMap(p => [p.owner, p.owner2]).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ko'));
    const chips = [['all', '전체']].concat(Object.keys(STATUS).map(k => [k, STATUS[k][0]]))
      .map(([k, l]) => `<button aria-pressed="${reviewStatus === k}" onclick="reviewStatus='${k}';render()">${l} ${k === 'all' ? base.length : base.filter(p => pStatus(p) === k).length}</button>`).join('');
    return head + `
      <section class="panel">
        ${scopeNote}
        <div class="search-row">
          <input class="search" id="reviewSearch" type="search" placeholder="사원번호·이름·부서·미비서류·특이사항 검색" value="${esc(reviewQuery)}" aria-label="대상자 검색">
          ${reviewTab === 'all' ? `<select class="field-in" onchange="reviewOwner=this.value;render()" aria-label="담당자"><option value="">전체 담당자</option>${owners.concat('(미배정)').map(o => `<option ${o === reviewOwner ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>` : ''}
        </div>
        <div class="filters" style="margin-bottom:12px">${chips}</div>
        <div id="reviewList">${reviewListHtml()}</div>
      </section>`;
  };

  document.addEventListener('input', e => {
    if (e.target.id === 'reviewSearch') { reviewQuery = e.target.value; $('#reviewList').innerHTML = reviewListHtml(); }
    if (e.target.id === 'logSearch') { logQuery = e.target.value; $('#logList').innerHTML = logsListHtml(); }
    if (e.target.id === 'ruleSearch') { ruleQuery = e.target.value; $('#ruleList').innerHTML = ruleListHtml(); }
    if (e.target.id === 'fileSearch') { fileQuery = e.target.value; $('#fileList').innerHTML = fileListHtml(); }
  });

  /* ---------- 대상자 상세 (입력) ---------- */
  let curPerson = null;
  let draftOwner = '';
  const GROUP_ORDER = ['진행', '1차 특이·수정사항', '주택자금 · 월세', '종전근무지', '2차 검토', '담당'];

  function fieldHtml(p, c) {
    const id = 'pf_' + c.k;
    const off = !canEdit(p, c, draftOwner);
    if (c.t === 'bool') return `<label class="${off ? 'off' : ''}"><input type="checkbox" class="check" id="${id}" ${p[c.k] ? 'checked' : ''} ${off ? 'disabled' : ''}> ${esc(c.l)}</label>`;
    if (c.t === 'long') return `<div class="fld"><label for="${id}">${esc(c.l)}</label><textarea class="field-in" id="${id}" ${off ? 'disabled' : ''} style="min-height:64px">${esc(p[c.k])}</textarea></div>`;
    if (c.who === 'assign') {
      const opts = [''].concat(D.staff.map(s => s.name));
      if (p[c.k] && opts.indexOf(p[c.k]) < 0) opts.push(p[c.k]);
      const v = c.k === 'owner' && draftOwner ? draftOwner : p[c.k];
      return `<div class="fld"><label for="${id}">${esc(c.l)}</label><select class="field-in" id="${id}" ${isLead() ? '' : 'disabled'}>${opts.map(o => `<option value="${esc(o)}" ${o === v ? 'selected' : ''}>${esc(o || '(없음)')}</option>`).join('')}</select></div>`;
    }
    return `<div class="fld"><label for="${id}">${esc(c.l)}</label><input class="field-in" id="${id}" value="${esc(p[c.k])}" ${off ? 'disabled' : ''}></div>`;
  }

  function groupHtml(p, g) {
    const cs = D.cols.filter(c => c.g === g);
    const bools = cs.filter(c => c.t === 'bool'), longs = cs.filter(c => c.t === 'long'), shorts = cs.filter(c => !c.t);
    const who = cs[0].who;
    const note = who === 'second' ? `2차: ${p.owner2 || '미지정'}` : who === 'first' ? `1차: ${p.owner || draftOwner || '미지정'}` : '';
    return `<div class="sec">${esc(g)}<span>${esc(note)}</span></div>
      ${shorts.length ? `<div class="three">${shorts.map(c => fieldHtml(p, c)).join('')}</div>` : ''}
      ${bools.length ? `<div class="bools">${bools.map(c => fieldHtml(p, c)).join('')}</div>` : ''}
      ${longs.map(c => fieldHtml(p, c)).join('')}`;
  }

  function personFiles(p) {
    return D.files.filter(f => f.area === 'person' && f.ref === (p.empNo || p.id));
  }

  function openPerson(id) {
    const p = D.people.find(x => x.id === id);
    if (!p) return toast('대상자를 찾을 수 없습니다. 새로고침해 주세요.');
    curPerson = p;
    draftOwner = '';
    drawPerson();
  }

  function drawPerson() {
    const p = curPerson;
    const editable = D.cols.some(c => canEdit(p, c, draftOwner) && c.who !== 'assign') || isLead();
    const canTake = !p.owner && D.me.name && !isLead() && !draftOwner;
    const groups = GROUP_ORDER.filter(g => D.cols.some(c => c.g === g));
    const logs = D.logs.filter(l => l.empNo === p.empNo);
    const files = personFiles(p);
    $('#modal').classList.add('wide');
    openModal(`
      <h3>${esc(p.name)} <span style="font-weight:400;color:var(--muted);font-size:14px">${esc(p.empNo)} · ${esc(p.dept)} ${esc(p.rank)}</span> ${statusChip(p)}</h3>
      <p class="sub">${p.phone ? `☎ ${esc(p.phone)} · ` : ''}${p.email ? `${esc(p.email)} · ` : ''}최종 수정 ${esc(p.updated || '-')}${p.editor ? ` (${esc(p.editor)})` : ''}</p>
      <form class="form" id="personForm" novalidate>
        ${canTake ? `<div class="notice take"><span>아직 1차 담당자가 없습니다. 맡으면 검토 내용을 입력할 수 있습니다.</span><button type="button" class="btn small primary" onclick="draftOwner=D.me.name;drawPerson()">내가 담당하기</button></div>` : ''}
        ${!editable && !canTake ? `<div class="notice">보기만 할 수 있습니다. 1차 담당자(${esc(p.owner || '미지정')})·2차 검토 담당자(${esc(p.owner2 || '미지정')})·총괄이 입력합니다. 응대기록은 누구나 남길 수 있습니다.</div>` : ''}
        ${groupHtml(p, '기본 정보')}
        ${groups.map(g => groupHtml(p, g)).join('')}

        <div class="sec">증빙 첨부<span>${files.length}개</span></div>

  function savePerson() {
    const p = curPerson;
    const patch = {};
    D.cols.forEach(c => {
      const el = $('#pf_' + c.k);
      if (!el || el.disabled) return;
      const v = c.t === 'bool' ? el.checked : el.value.trim();
      if (v !== p[c.k]) patch[c.k] = v;
    });
    if (draftOwner && !p.owner) patch.owner = draftOwner;
    if (!Object.keys(patch).length) { closeModal(); toast('바뀐 내용이 없습니다.'); return; }
    if (uploadsBusy('person')) { $('#pErr').textContent = BUSY_MSG; $('#pErr').hidden = false; return; }
    // 화면에 바로 반영
    const before = Object.assign({}, p);
    const idx = D.people.indexOf(p);
    Object.assign(p, patch);
    if (patch.empNo !== undefined) p.id = patch.empNo || before.id;
    closeModal();
    render();
    saveInBackground('apiSavePerson', [before.id, patch], {
      ok: `${before.name}님 검토 내용을 저장했습니다.`,
      undo: () => { if (idx >= 0) D.people[idx] = Object.assign(p, before); },
      // 실패하면 고치던 내용을 그대로 다시 띄운다
      retry: msg => {
        openPerson(before.id);
        Object.keys(patch).forEach(k => { const el = $('#pf_' + k); if (!el) return; if (el.type === 'checkbox') el.checked = !!patch[k]; else el.value = patch[k]; });
        if (patch.owner && !before.owner) { draftOwner = patch.owner; }
        $('#pErr').textContent = `저장하지 못했습니다: ${msg}`; $('#pErr').hidden = false;
      },
    });
  }

  /* ---------- 시트 붙여넣기 (총괄·관리자) ---------- */
  // 구글 시트 복사본(TSV) 파싱: 줄바꿈이 들어간 셀은 "..."로 감싸져 온다
  function parseTSV(text) {
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
      else if (ch === '"' && cell === '') q = true;
      else if (ch === '\t') { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += ch;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows.filter(r => r.some(c => c.trim()));
  }
  const normH = s => String(s).replace(/\s/g, '').toLowerCase();
  const matchCol = h => { const n = normH(h); return D.cols.find(c => normH(c.l) === n || (c.re && new RegExp(c.re).test(n))); };
  function readPaste() {
    const rows = parseTSV($('#imText').value);
    if (!rows.length) return { err: '붙여넣은 내용이 없습니다.' };
    const hdr = rows[0].map(matchCol), hasHdr = hdr.filter(Boolean).length >= 2;
    const map = hasHdr ? hdr : D.cols.slice(0, rows[0].length);
    const unknown = hasHdr ? rows[0].filter((h, i) => h.trim() && !hdr[i]) : [];
    if (!map.some(c => c && c.k === 'name')) return { err: '「성명」 열을 찾지 못했습니다. 제목 행까지 함께 복사해 주세요.' };
    const data = (hasHdr ? rows.slice(1) : rows).map(r => { const o = {}; map.forEach((c, i) => { if (c) o[c.k] = r[i] == null ? '' : r[i]; }); return o; }).filter(o => String(o.name || '').trim());
    return { data, cols: map.filter(Boolean).length, unknown, hasHdr };
  }
  function openImport() {
    openModal(`
      <h3>시트 붙여넣기</h3>

      · 열 이름으로 자동 매칭 (제목 행이 없으면 기존 시트 열 순서로 인식)<br>
      · 사원번호가 같으면 붙여넣은 칸만 갱신, 없으면 추가 · O, Y, ○, 완료 같은 표기는 체크로 인식</p>
      <form class="form" id="imForm" novalidate>
        <textarea class="field-in" id="imText" style="min-height:200px" aria-label="붙여넣을 내용"></textarea>
        <div class="hint" id="imHint"></div>

    $('#imText').oninput = () => {

        : `인식된 열 ${r.cols}개 · 대상자 ${r.data.length}명 · 새로 추가 ${r.data.filter(o => !o.empNo || !D.people.some(p => p.empNo === String(o.empNo).trim())).length}명${r.unknown.length ? ` · 무시되는 열: ${r.unknown.map(esc).join(', ')}` : ''}`;
    };
    $('#imForm').onsubmit = e => {
      e.preventDefault();

      if (r.err) { $('#imHint').innerHTML = `<span style="color:var(--warn-ink)">${esc(r.err)}</span>`; return; }

      call('apiImportPeople', r.data).then(data => { applyData(data); closeModal(); reviewTab = 'all'; render(); toast(`${data.added}명 추가 · ${data.updated}명 갱신했습니다.`); })
        .catch(err => { $('#imOk').disabled = false; fail(err); });
    };
  }

  VIEWS.notice = function () {

    const list = pick(noticeFilter);

        </div>

  };

  function toggleNotice(id) {
    openNotice = openNotice === id ? null : id;

    render();

    D.reads = D.reads.filter(x => x !== id);

  }

  function deleteNotice(id) {
    openModal(`<h3>글을 삭제할까요?</h3><p class="sub">목록에서 사라집니다. 시트에는 기록이 남습니다.</p>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">취소</button><button class="btn primary" id="delOk">삭제</button></div>`);
    $('#delOk').onclick = () => {
      $('#delOk').disabled = true;
      call('apiDeleteNotice', id).then(data => { applyData(data); openNotice = null; closeModal(); render(); toast('삭제했습니다.'); }).catch(e => { closeModal(); fail(e); });
    };
  }

  /* ================= 연말정산 기준 ================= */
  function hl(text) {
    const t = esc(text);
    if (!ruleQuery) return t;
    const q = esc(ruleQuery).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return t.replace(new RegExp(q, 'gi'), m => `<mark>${m}</mark>`);
  }
  function filteredRules() {
    const q = ruleQuery.trim().toLowerCase();
    return D.rules
      .filter(r => ruleCat === 'all' || r.category === ruleCat)
      .filter(r => !q || (r.title + ' ' + r.body + ' ' + r.category).toLowerCase().includes(q))
      .sort((a, b) => D.ruleCategories.indexOf(a.category) - D.ruleCategories.indexOf(b.category) || a.title.localeCompare(b.title, 'ko'));
  }
  function ruleListHtml() {
    const list = filteredRules();
    return list.map(r => {
      const open = openRule === r.id || (ruleQuery && list.length <= 2);
      const first = r.body.split('\n').find(l => l.trim() && !/^\(.*\)$/.test(l.trim())) || '';
      return `<article class="rule">
        <button class="rule-head" onclick="toggleRule('${esc(r.id)}')" aria-expanded="${open}">
          <span class="rule-title">${hl(r.title)}${r.files && r.files.length ? '<span class="clip" title="첨부 파일">📎</span>' : ''}</span>
          <span class="rule-date">${ruleCat === 'all' ? `<span class="chip plain">${esc(r.category)}</span> ` : ''}${r.year ? `${esc(r.year)}년 귀속` : ''}</span>
          ${open ? '' : `<span class="rule-sum">${hl(first)}</span>`}
        </button>
        ${open ? `<div class="rule-body">
          <div class="rule-meta"><span><b>적용</b>${esc(r.year ? r.year + '년 귀속' : '-')}</span><span><b>담당</b>${esc(r.owner || '-')}</span><span><b>최종 개정</b>${esc(r.updated)} (${esc(r.editor)})</span></div>
          <div class="rule-text">${hl(r.body)}</div>
          ${r.files && r.files.length ? `<div class="sub-label">첨부 파일</div>${filesView(r.files)}` : ''}
          ${r.link ? `<a class="post-link" href="${esc(r.link)}" target="_blank" rel="noopener">📄 원문 보기</a>` : ''}
          ${r.history.length ? `<details class="hist"><summary>개정 이력 ${r.history.length}건</summary><ol>${r.history.map(h => `<li><span>${esc(h.date)} · ${esc(h.editor)}</span>${esc(h.note)}</li>`).join('')}</ol></details>` : ''}
          ${isLead() ? `<div style="display:flex;gap:6px"><button class="btn small" onclick="openRuleForm('${esc(r.id)}')">수정</button><button class="btn small danger" onclick="deleteRule('${esc(r.id)}')">삭제</button></div>` : ''}
        </div>` : ''}
      </article>`;
    }).join('') || `<div class="empty">${ruleQuery ? `"${esc(ruleQuery)}"에 해당하는 기준이 없습니다.` : '등록된 기준이 없습니다.'}</div>`;
  }

  VIEWS.rules = function () {
    const cats = ['all'].concat(D.ruleCategories);
    const cnt = c => c === 'all' ? D.rules.length : D.rules.filter(r => r.category === c).length;
    return `
      <div class="head">
        <div><h1>연말정산 기준</h1><p>공제 요건·제출서류·응대 기준을 한곳에서 확인하세요. 총괄이 고치면 개정 이력이 남습니다.</p></div>
        <div class="head-actions">${isLead() ? '<button class="btn primary" onclick="openRuleForm()">기준 등록</button>' : ''}</div>
      </div>
      <div class="rules-layout">
        <section class="panel" style="padding:10px">
          <div class="cats">${cats.filter(c => c === 'all' || cnt(c)).map(c => `<button aria-pressed="${ruleCat === c}" onclick="ruleCat='${esc(c)}';openRule=null;render()">${c === 'all' ? '전체' : esc(c)}<span>${cnt(c)}</span></button>`).join('')}</div>
        </section>
        <section class="panel">
          <input class="search" id="ruleSearch" type="search" placeholder="검색 (예: 월세, 의료비, 부양가족, 종전근무지)" value="${esc(ruleQuery)}" aria-label="기준 검색">
          <div id="ruleList">${ruleListHtml()}</div>
        </section>
      </div>`;
  };
  function toggleRule(id) { openRule = openRule === id ? null : id; $('#ruleList').innerHTML = ruleListHtml(); }

  function openRuleForm(id, draftData, errMsg) {
    const r = draftData || (id ? D.rules.find(x => x.id === id) : { category: ruleCat !== 'all' ? ruleCat : D.ruleCategories[0], title: '', body: '', year: D.year, owner: '', link: '', files: [] });
    $('#modal').classList.remove('wide');
    openModal(`
      <h3>${id ? '기준 수정' : '기준 등록'}</h3>
      <p class="sub">담당자 모두가 응대할 때 보는 기준입니다. 국세청 안내 원문이 있으면 링크나 파일로 함께 올려주세요.</p>
      <form class="form" id="rForm" novalidate>
        <div class="two">
          <div class="fld"><label for="rCat">분류</label><select class="field-in" id="rCat">${D.ruleCategories.map(c => `<option ${c === r.category ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
          <div class="fld"><label for="rYear">적용 귀속연도</label><input class="field-in" id="rYear" inputmode="numeric" value="${esc(r.year)}"></div>
        </div>
        <div class="fld"><label for="rTitle">제목</label><input class="field-in" id="rTitle" value="${esc(r.title)}"></div>
        <div class="fld"><label for="rBody">내용</label><textarea class="field-in" id="rBody" style="min-height:200px">${esc(r.body)}</textarea></div>
        <div class="two">
          <div class="fld"><label for="rOwner">담당</label><input class="field-in" id="rOwner" value="${esc(r.owner)}"></div>
          <div class="fld"><label for="rLink">원문 링크 (선택)</label><input class="field-in" id="rLink" value="${esc(r.link)}" placeholder="https://"></div>
        </div>
        ${uploaderHtml('rule', '첨부 파일 (국세청 안내 PDF 등)')}
        ${id ? '<div class="fld"><label for="rNote">개정 내용 (이력에 남습니다)</label><input class="field-in" id="rNote" placeholder="예) 월세 공제 한도 750만원 → 1,000만원"></div>' : ''}
        <div class="msg err" id="rErr" hidden></div>
        <div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">취소</button><button type="submit" class="btn primary" id="rOk">${id ? '저장' : '등록'}</button></div>
      </form>`);
    initUploader('rule', 'rules', r.files);
    $('#rForm').onsubmit = e => {
      e.preventDefault();
      const rule = { id: id || '', category: $('#rCat').value, year: $('#rYear').value.trim(), title: $('#rTitle').value.trim(), body: $('#rBody').value.trim(), owner: $('#rOwner').value.trim(), link: $('#rLink').value.trim(), changeNote: $('#rNote') ? $('#rNote').value.trim() : '', files: uploadedFiles('rule') };
      if (!rule.title || !rule.body) { $('#rErr').textContent = '제목과 내용을 입력해 주세요.'; $('#rErr').hidden = false; return; }
      if (uploadsBusy('rule')) { $('#rErr').textContent = BUSY_MSG; $('#rErr').hidden = false; return; }
      const old = D.rules.slice();
      const tmpId = id || 'tmp' + Date.now();
      const ex = D.rules.find(x => x.id === id);
      const shown = Object.assign({ history: [] }, ex || {}, rule, { id: tmpId, updated: todayKey(), editor: D.me.name });
      shown.history = [{ date: todayKey(), editor: D.me.name, note: rule.changeNote || (id ? '내용 수정' : '최초 등록') }].concat(ex ? ex.history : []);
      D.rules = id ? D.rules.map(x => x.id === id ? shown : x) : D.rules.concat(shown);
      closeModal(); openRule = tmpId; ruleCat = 'all'; ruleQuery = ''; page = 'rules'; render();
      saveInBackground('apiSaveRule', [rule], {
        ok: id ? '기준을 수정했습니다. 개정 이력에 기록됩니다.' : '기준을 등록했습니다.',
        done: res => { if (openRule === tmpId) openRule = res.savedId; if (page === 'rules') render(); },
        undo: () => { D.rules = old; },
        retry: msg => openRuleForm(id, rule, `저장하지 못했습니다: ${msg}`),
      });
    };
    if (errMsg) { $('#rErr').textContent = errMsg; $('#rErr').hidden = false; }
  }

  function deleteRule(id) {
    openModal(`<h3>이 기준을 삭제할까요?</h3><p class="sub">목록에서 사라지고, 시트와 개정 이력에는 기록이 남습니다.</p>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">취소</button><button class="btn primary" id="rdOk">삭제</button></div>`);
    $('#rdOk').onclick = () => {
      $('#rdOk').disabled = true;
      call('apiDeleteRule', id).then(data => { applyData(data); openRule = null; closeModal(); render(); toast('삭제했습니다.'); }).catch(e => { closeModal(); fail(e); });
    };
  }

  /* ================= 첨부파일 ================= */
  function filesFiltered() {
    const q = fileQuery.trim().toLowerCase();
    return D.files
      .filter(f => fileArea === 'all' || f.area === fileArea)
      .filter(f => !q || [f.name, f.refLabel, f.uploader, f.memo].join(' ').toLowerCase().includes(q));
  }
  function refCell(f) {
    if (f.area === 'person') {
      const p = D.people.find(x => (x.empNo || x.id) === f.ref);
      return p && can('review') ? `<button class="linkish" onclick="openPerson('${esc(p.id)}')">${esc(f.refLabel)}</button>` : esc(f.refLabel);
    }
    if (f.area === 'notice' && can('notice')) return `<button class="linkish" onclick="openNotice='${esc(f.ref)}';showOld=true;go('notice')">${esc(f.refLabel)}</button>`;
    if (f.area === 'rules' && can('rules')) return `<button class="linkish" onclick="openRule='${esc(f.ref)}';ruleCat='all';ruleQuery='';go('rules')">${esc(f.refLabel)}</button>`;
    return esc(f.memo || f.refLabel || '-');
  }
  function fileListHtml() {
    const list = filesFiltered();
    const rows = list.map(f => `
      <tr>
        <td data-label="파일" class="c-wide">${fileRow(f, { link: true })}</td>
        <td data-label="구분"><span class="chip ${f.area === 'person' ? 'info' : 'plain'}">${esc(D.fileAreas[f.area] || f.area)}</span></td>
        <td data-label="대상 · 메모">${refCell(f)}</td>
        <td data-label="올린 사람">${esc(f.uploader)}</td>
        <td data-label="올린 일시" class="nowrap">${esc(f.date.slice(2, 16))}</td>
        <td class="c-act" data-label="">${f.uploader === D.me.name || isLead() ? `<button class="btn small danger" onclick="deleteFile('${esc(f.id)}')">삭제</button>` : ''}</td>
      </tr>`).join('');
    return rows ? `<div class="table-wrap"><table class="t cards"><thead><tr><th>파일</th><th>구분</th><th>대상 · 메모</th><th>올린 사람</th><th>올린 일시</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
      : `<div class="empty">${fileQuery ? '검색 결과가 없습니다.' : '올린 파일이 없습니다.'}</div>`;
  }
  VIEWS.files = function () {
    const areas = ['all'].concat(Object.keys(D.fileAreas).filter(a => D.files.some(f => f.area === a) || a === 'etc'));
    const cnt = a => a === 'all' ? D.files.length : D.files.filter(f => f.area === a).length;
    return `
      <div class="head">
        <div><h1>첨부파일</h1><p>대상자 증빙, 공지·기준 첨부, 일반 자료를 한곳에서 찾아보세요. 파일은 구글 드라이브에서 열립니다.</p></div>
        <div class="head-actions">${D.me.name || D.me.isAdmin ? '<button class="btn primary" onclick="openEtcUpload()">자료 올리기</button>' : ''}</div>
      </div>
      <section class="panel">
        <div class="filters" style="margin-bottom:12px">${areas.map(a => `<button aria-pressed="${fileArea === a}" onclick="fileArea='${a}';render()">${a === 'all' ? '전체' : esc(D.fileAreas[a])} ${cnt(a)}</button>`).join('')}</div>
        <input class="search" id="fileSearch" type="search" placeholder="파일명·대상자·올린 사람 검색" value="${esc(fileQuery)}" aria-label="첨부파일 검색">
        <div id="fileList">${fileListHtml()}</div>
        <p style="color:var(--muted);font-size:12px;margin:10px 0 0">증빙 서류에는 개인정보가 들어 있습니다. 첨부 폴더는 담당자에게만 공유되며, 삭제한 파일은 드라이브 휴지통으로 이동합니다(30일 안에 복구 가능).</p>
      </section>`;
  };
  function openEtcUpload() {
    $('#modal').classList.remove('wide');
    openModal(`
      <h3>자료 올리기</h3>
      <p class="sub">서식, 안내문처럼 특정 대상자와 상관없는 자료를 올립니다. 대상자 증빙은 서류 검토에서 대상자를 눌러 올리세요.</p>
      <div class="form">
        <div class="fld"><label for="etcMemo">메모 (무슨 자료인지)</label><input class="field-in" id="etcMemo" placeholder="예) 2026 귀속 소득·세액공제신고서 양식"></div>
        ${uploaderHtml('etc', '파일 (올리는 즉시 저장됩니다)')}
        <div class="modal-actions"><button type="button" class="btn primary" onclick="closeModal();render()">완료</button></div>
      </div>`);
    initUploader('etc', 'etc', [], { memo: () => $('#etcMemo').value.trim() });
  }
  function deleteFile(id) {
    const f = D.files.find(x => x.id === id);
    openModal(`<h3>${esc(f.name)} 파일을 삭제할까요?</h3>
      <p class="sub">목록에서 빼고 드라이브 휴지통으로 옮깁니다. ${f.area === 'notice' || f.area === 'rules' ? '이 파일이 붙은 글에서도 열 수 없게 됩니다.' : ''}</p>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">취소</button><button class="btn primary" id="dfOk">삭제</button></div>`);
    $('#dfOk').onclick = () => {
      const old = D.files.slice();
      D.files = D.files.filter(x => x.id !== id);
      closeModal(); render();
      saveInBackground('apiDeleteFile', [id], { ok: '삭제했습니다.', undo: () => { D.files = old; } });
    };
  }

  /* ================= 권한 관리 (관리자 전용) ================= */
  let A = null;          // 서버에서 받은 관리 데이터
  let aDraft = null;     // 편집 중인 담당자 목록
  let aDirty = false;
  let menuDraft = null;
  let adminTab = 'members';
  let adminLoading = false;

  function loadAdmin(force) {
    if (adminLoading) return;
    adminLoading = true;
    call('apiAdminData', !!force)
      .then(d => { adminLoading = false; setAdmin(d); })
      .catch(e => { adminLoading = false; fail(e); });
  }
  function refreshAdmin() { A = null; render(); loadAdmin(true); }
  function setAdmin(data) {
    A = data;
    aDraft = A.members.map(m => Object.assign({}, m));
    menuDraft = JSON.parse(JSON.stringify(A.menuAccess));
    aDirty = false;
    if (page === 'admin') render();
  }

  const ACCESS = {
    sheet: { owner: ['ok', '소유자'], editor: ['ok', '편집'], viewer: ['pend', '보기만'], none: ['no', '없음'] },
    folder: { owner: ['ok', '소유자'], editor: ['ok', '편집'], viewer: ['pend', '보기만'], none: ['no', '없음'], 'n/a': ['plain', '설정 필요'] },
  };
  function accessChip(kind, v) {
    const [cls, label] = (ACCESS[kind][v] || ['plain', '–']);
    return `<span class="chip ${cls}">${cls === 'ok' ? '✓ ' : cls === 'no' ? '✕ ' : ''}${label}</span>`;
  }
  function needsAttention(name) {
    const st = A && A.status.people[name];
    if (!st) return true;
    return ['sheet', 'folder'].some(k => { const c = (ACCESS[k][st[k]] || ['plain'])[0]; return c === 'no' || c === 'pend'; });
  }

  VIEWS.admin = function () {
    if (!A) return '<div class="loading">권한 정보를 불러오는 중… (시트·첨부 폴더 공유 상태를 확인합니다)</div>';
    const tab = (k, label) => `<button role="tab" aria-selected="${adminTab === k}" onclick="adminTab='${k}';render()">${label}</button>`;
    const body = { members: adminMembers, scope: adminScope, menus: adminMenus, settings: adminSettings, guide: adminGuide }[adminTab]();
    return `<div class="subtabs" role="tablist">${tab('members', '담당자·권한')}${tab('scope', '열람 범위')}${tab('menus', '메뉴 권한')}${tab('settings', '설정')}${tab('guide', '접속 안내')}</div>${body}`;
  };

  function adminMembers() {
    const res = A.status.resources;
    const resLine = (label, x) => `<span>${x.ok ? '<span class="chip ok">✓</span>' : '<span class="chip pend">!</span>'} <b>${label}</b> ${esc(x.ok ? x.name : x.error)}</span>`;
    const issues = aDraft.filter(m => m.email && needsAttention(m.name)).length;
    const noEmail = aDraft.filter(m => m.name && !m.email).length;
    const sel = (i, v) => `<select class="field-in" style="padding:5px 6px;min-width:90px" onchange="aEdit(${i},'role',this.value)">${A.roles.map(r => `<option ${r === v ? 'selected' : ''}>${r}</option>`).join('')}</select>`;
    const rows = aDraft.map((m, i) => {
      const st = A.status.people[m.name];
      const saved = A.members.some(x => x.name === m.name && x.email === m.email);
      return `<tr>
        <td data-label="이름"><input class="field-in" style="padding:5px 8px;min-width:80px" value="${esc(m.name)}" oninput="aEdit(${i},'name',this.value)" aria-label="이름"></td>
        <td data-label="이메일" class="c-wide"><input class="field-in" style="padding:5px 8px;min-width:190px" value="${esc(m.email)}" placeholder="이메일" oninput="aEdit(${i},'email',this.value)" aria-label="이메일"></td>
        <td data-label="역할">${sel(i, m.role)}</td>
        <td data-label="관리자"><label style="display:flex;justify-content:center"><input type="checkbox" class="check" ${m.admin ? 'checked' : ''} onchange="aEdit(${i},'admin',this.checked)" aria-label="관리자"></label></td>
        <td data-label="열람 범위"><button class="linkish" onclick="adminTab='scope';render()">${isFull(m) ? '전체 (총괄·관리자)' : !m.scope || m.scope === SCOPE_ALL ? '전체' : scopeList(m).length ? `본인 + ${esc(scopeList(m).join(', '))}` : '본인 담당만'}</button></td>
        ${st && saved ? `<td data-label="스프레드시트">${accessChip('sheet', st.sheet)}</td><td data-label="첨부 폴더">${accessChip('folder', st.folder)}</td>`
          : `<td colspan="2" class="c-wide"><span style="color:var(--muted);font-size:12px">${m.email ? '저장 후 "권한 한 번에 적용"을 누르세요' : '이메일을 입력하세요'}</span></td>`}
        <td class="c-x"><button class="icon-btn" onclick="aRemove(${i})" aria-label="${esc(m.name)} 삭제">×</button></td>
      </tr>`;
    }).join('');
    return `
      <div class="head">
        <div><h1>담당자·권한</h1><p>담당자를 등록하고 "권한 한 번에 적용"을 누르면 시트·첨부 폴더 공유와 시트 보호를 자동으로 합니다.</p></div>
        <div class="head-actions">
          <button class="btn" onclick="refreshAdmin()">상태 새로고침</button>
          <button class="btn primary" onclick="applyAll()">권한 한 번에 적용</button>
        </div>
      </div>
      <section class="panel">
        <div style="display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px">${resLine('스프레드시트', res.sheet)}${resLine('첨부 폴더', res.folder)}</div>
        <p style="margin:10px 0 0;font-size:13px;color:${issues || noEmail ? 'var(--warn-ink)' : 'var(--ok-ink)'}">

  }

  function aEdit(i, k, v) {

  function saveMembers(after) {
    const list = aDraft.filter(m => m.name.trim()).map((m, i) => Object.assign({}, m, { order: i + 1 }));
    const btn = $('#aSave');
    if (btn) { btn.disabled = true; btn.textContent = '저장 중…'; }
    return call('apiSaveMembers', list)
      .then(data => { setAdmin(data); load(); toast('담당자 목록을 저장했습니다.'); if (after) after(); })

  function aRemove(i) {

  /* ---------- 열람 범위: 담당자마다 어느 담당자의 대상자까지 볼지 ---------- */
  const SCOPE_ALL = '전체', UNASSIGNED = '(미배정)';
  const scopeList = m => (m.scope && m.scope !== SCOPE_ALL ? m.scope.split(',').filter(x => x && x !== '본인') : []);
  const isFull = m => m.role === '총괄' || m.admin;
  /** 서버의 canSee_와 같은 규칙으로 보이는 인원 수 (1차·2차 담당은 항상 포함) */
  function scopeCount(m) {
    const all = isFull(m) || !m.scope || m.scope === SCOPE_ALL, list = scopeList(m);
    return A.assign.filter(([o, o2]) => all || o === m.name || o2 === m.name || (o ? list.includes(o) : list.includes(UNASSIGNED))).length;
  }
  function adminScope() {
    // 열: 실제로 1차 담당이 있는 이름 + 응대담당 (총괄·2차검토만 하는 사람은 뺀다)
    const cols = [...new Set(Object.keys(A.owners).filter(k => k !== UNASSIGNED).concat(aDraft.filter(m => m.name && m.role === '응대담당').map(m => m.name)))].concat(UNASSIGNED);
    const head = cols.map(c => `<th style="text-align:center;white-space:nowrap">${esc(c)}<br><span style="font-weight:400">${A.owners[c] || 0}명</span></th>`).join('');
    const rows = aDraft.map((m, i) => {
      if (!m.name) return '';
      if (isFull(m)) return `<tr><td class="strong">${esc(m.name)}<br><span style="color:var(--muted);font-size:12px">${esc(m.role)}${m.admin ? '·관리자' : ''}</span></td>
        <td colspan="${cols.length + 1}" style="color:var(--muted)">총괄·관리자는 항상 모든 대상자를 봅니다.</td><td class="num">${scopeCount(m)}명</td></tr>`;
      const all = !m.scope || m.scope === SCOPE_ALL, list = scopeList(m);
      return `<tr><td class="strong">${esc(m.name)}<br><span style="color:var(--muted);font-size:12px">${esc(m.role)}</span></td>
        <td style="text-align:center"><input type="checkbox" class="check" ${all ? 'checked' : ''} onchange="setScopeAll(${i}, this.checked)" aria-label="${esc(m.name)} 전체"></td>
        ${cols.map(c => c === m.name
          ? `<td style="text-align:center"><input type="checkbox" class="check" checked disabled title="본인 담당은 항상 보입니다" aria-label="본인 담당"></td>`
          : `<td style="text-align:center"><input type="checkbox" class="check" ${all || list.includes(c) ? 'checked' : ''} ${all ? 'disabled' : ''} onchange="toggleScope(${i}, '${esc(c)}', this.checked)" aria-label="${esc(m.name)}에게 ${esc(c)} 담당 보이기"></td>`).join('')}
        <td class="num"><b>${scopeCount(m)}명</b></td></tr>`;
    }).join('');
    return `
      <div class="head"><div><h1>열람 범위</h1><p>담당자마다 어느 담당자의 대상자까지 볼 수 있는지 정합니다. 체크하지 않은 대상자는 화면에 나오지 않고, 서버에서도 보내지 않습니다.</p></div></div>
      <section class="panel">
        <div class="table-wrap"><table class="t">
          <thead><tr><th>볼 사람 ＼ 담당자</th><th style="text-align:center">전체</th>${head}<th class="num">보이는 인원</th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>
        <p style="color:var(--muted);font-size:12.5px;margin:12px 0 0;line-height:1.7">
          · 본인이 1차 담당이거나 2차검토 담당인 대상자는 항상 보입니다.<br>
          · <b>(미배정)</b>을 체크하면 담당자가 비어 있는 대상자를 보고 「내가 담당하기」로 맡을 수 있습니다.<br>
          · 응대기록과 대상자 증빙 첨부도 보이는 대상자 것만 나옵니다.<br>
          · 바꾼 뒤 아래 「변경사항 저장」을 누르세요. 담당자는 새로고침하면 반영됩니다.
        </p>
      </section>
      <div class="save-bar" id="aBar" ${aDirty ? '' : 'hidden'}><div class="left">변경사항이 있습니다. 저장해야 반영됩니다.</div>
        <div style="display:flex;gap:8px"><button class="btn" onclick="setAdmin(A)">되돌리기</button><button class="btn primary" id="aSave" onclick="saveMembers()">변경사항 저장</button></div></div>`;
  }
  function setScopeAll(i, on) {
    aDraft[i].scope = on ? SCOPE_ALL : '본인';
    aDirty = true; render();
  }
  function toggleScope(i, name, on) {
    const list = scopeList(aDraft[i]).filter(x => x !== name);
    if (on) list.push(name);
    aDraft[i].scope = ['본인'].concat(list).join(',');

      ${A.roles.map(r => `<td style="text-align:center"><input type="checkbox" class="check" ${menuDraft[r][m.key] !== false ? 'checked' : ''} onchange="menuDraft['${r}']['${m.key}']=this.checked;$('#mSave').disabled=false" aria-label="${r} ${esc(m.label)}"></td>`).join('')}

  function adminSettings() {

      <div class="head"><div><h1>설정</h1><p>[설정] 시트를 직접 고치지 않아도 여기서 바꿀 수 있습니다.</p></div></div>

  function adminGuide() {
    const url = A.webAppUrl || '(아직 웹앱으로 배포되지 않았습니다)';
    const msg = `[${D.team} 안내]\n아래 주소로 접속해 주세요. (회사 구글 계정으로 로그인)\n${url}\n\n· 처음 접속하면 "권한 검토" 화면이 한 번 나옵니다. "허용"을 눌러주세요.\n· "Google에서 확인하지 않은 앱" 경고가 나오면 "고급 → 이동"을 누르면 됩니다.\n· 서류 검토 > 내 담당에서 맡은 대상자를 확인하고, 응대한 내용은 응대기록에 남겨주세요.`;
    return `
      <div class="head"><div><h1>접속 안내</h1><p>담당자에게 보낼 주소와 안내 문구입니다.</p></div></div>
      <section class="panel" style="max-width:720px;display:flex;flex-direction:column;gap:12px">

        <div class="fld"><label for="gMsg">안내 문구 (메신저·메일에 붙여넣기)</label><textarea class="field-in" id="gMsg" style="min-height:190px">${esc(msg)}</textarea></div>

  function copyText(id) {
    const el = $('#' + id);
    const done = () => toast('복사했습니다.');
    try {
      navigator.clipboard.writeText(el.value).then(done, () => { el.select(); toast('선택했습니다. Ctrl+C로 복사하세요.'); });
    } catch (e) { el.select(); toast('선택했습니다. Ctrl+C로 복사하세요.'); }
  }

  /* ================= 첨부 파일 올리기 ================= */
  const MAX_FILE = 10 * 1024 * 1024;
  const UP = {};
  function fileSize(n) { return n >= 1048576 ? `${(n / 1048576).toFixed(1)}MB` : `${Math.max(1, Math.round(n / 1024))}KB`; }
  function extOf(name) { const m = /\.([a-z0-9]+)$/i.exec(name || ''); return m ? m[1].toUpperCase().slice(0, 4) : 'FILE'; }
  function extClass(ext) {
    ext = ext.toLowerCase();
    if (ext === 'pdf') return 'pdf';
    if (['xls', 'xlsx', 'csv'].includes(ext)) return 'xls';
    if (['doc', 'docx', 'hwp', 'hwpx', 'txt'].includes(ext)) return 'doc';
    if (['ppt', 'pptx'].includes(ext)) return 'ppt';
    if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'heic'].includes(ext)) return 'img';
    return '';
  }
  function fileRow(f, opts) {
    opts = opts || {};
    const ext = extOf(f.name);
    const inner = `<span class="ext ${extClass(ext)}">${esc(ext)}</span>
      <span class="fn">${esc(f.name)}${opts.inline ? '' : `<span class="fs">${opts.msg ? esc(opts.msg) : fileSize(f.size || 0)}</span>`}</span>${opts.tail || ''}`;
    return opts.link
      ? `<a class="file" href="${esc(f.url)}" target="_blank" rel="noopener" title="${esc(f.name)} (${fileSize(f.size || 0)})">${inner}</a>`
      : `<div class="file ${opts.status || ''}">${inner}</div>`;
  }
  function filesView(files, inline) {
    return files && files.length ? `<div class="files ${inline ? 'inline' : ''}">${files.map(f => fileRow(f, { link: true, inline })).join('')}</div>` : '';
  }

  function uploaderHtml(key, label) {
    return `<div class="fld"><label for="drop-${key}">${label}</label>
      <div class="drop" id="drop-${key}" tabindex="0" role="button"><span class="desk-only">파일을 끌어다 놓거나 </span><u>눌러서 파일 선택</u> · 한 파일 10MB 이하</div>
      <input type="file" id="file-${key}" multiple hidden>
      <div class="files" id="up-${key}"></div></div>`;
  }
  /** extra: { ref, refLabel, memo(함수), onDone } — 대상자 증빙·일반 자료는 올리자마자 [첨부]에 기록된다 */
  function initUploader(key, area, existing, extra) {
    UP[key] = { area, extra: extra || {}, items: (existing || []).map(f => ({ status: 'done', f })) };
    const drop = $('#drop-' + key), input = $('#file-' + key);
    drop.onclick = () => input.click();
    drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } };
    drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = () => drop.classList.remove('over');
    drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); addFiles(key, e.dataTransfer.files); };
    input.onchange = () => { addFiles(key, input.files); input.value = ''; };
    drawUploader(key);
  }
  function addFiles(key, list) {
    const ex = UP[key].extra;
    Array.from(list).forEach(file => {
      const it = { status: 'up', f: { name: file.name, size: file.size } };
      UP[key].items.push(it);
      if (file.size > MAX_FILE) { it.status = 'err'; it.msg = '10MB를 넘어 올릴 수 없습니다'; return; }
      const reader = new FileReader();
      reader.onload = () => {
        call('apiUploadFile', { name: file.name, mimeType: file.type, data: String(reader.result).split(',')[1], area: UP[key].area, ref: ex.ref || '', refLabel: ex.refLabel || '', memo: typeof ex.memo === 'function' ? ex.memo() : '' })
          .then(res => { it.status = 'done'; it.f = res.file; applyData(res); if (ex.onDone) ex.onDone(); })
          .catch(e => { it.status = 'err'; it.msg = e.message || String(e); })
          .then(() => drawUploader(key));
      };
      reader.onerror = () => { it.status = 'err'; it.msg = '파일을 읽지 못했습니다'; drawUploader(key); };
      reader.readAsDataURL(file);
    });
    drawUploader(key);
  }
  function drawUploader(key) {
    const el = $('#up-' + key);
    if (!el) return;
    // 올리는 즉시 저장되는 곳(대상자 증빙·일반 자료)은 완료된 파일을 빼지 않는다
    const instant = UP[key].area === 'person' || UP[key].area === 'etc';
    el.innerHTML = UP[key].items.map((it, i) => fileRow(it.f, {
      status: it.status === 'done' ? '' : it.status,
      msg: it.status === 'err' ? it.msg : it.status === 'done' && instant ? '저장됨' : '',
      tail: instant && it.status === 'done' ? '<span class="chip ok">✓</span>' : `<button type="button" class="icon-btn" onclick="removeUpload('${key}', ${i})" aria-label="${esc(it.f.name)} 첨부 빼기">×</button>`,
    })).join('');
  }
  function removeUpload(key, i) { UP[key].items.splice(i, 1); drawUploader(key); }
  function uploadsBusy(key) { return !!UP[key] && UP[key].items.some(it => it.status === 'up'); }
  function uploadedFiles(key) { return UP[key] ? UP[key].items.filter(it => it.status === 'done').map(it => it.f) : []; }
  const BUSY_MSG = '파일을 올리는 중입니다. 업로드가 끝난 뒤 다시 눌러주세요.';

  document.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a.file[href^="#demo"]');
    if (a) { e.preventDefault(); toast('예시 화면이라 파일을 열 수 없습니다. 실제로는 구글 드라이브에서 열립니다.'); }
  });

  /* ================= 모달 ================= */
  function openModal(html, wide) {
    $('#modal').classList.toggle('wide', !!wide);
    $('#modal').innerHTML = html;
    $('#scrim').hidden = false;
    $('#modal').scrollTop = 0;
    const first = $('#modal').querySelector('select:not([disabled]), input:not([disabled]):not([type=checkbox]), textarea:not([disabled])');
    if (first && !wide) first.focus();
  }
  function closeModal() { $('#scrim').hidden = true; }
  $('#scrim').addEventListener('click', e => { if (e.target.id === 'scrim') closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#scrim').hidden) closeModal(); });

  /* ================= 기타 동작 ================= */
  function go(p) { page = p; closeModal(); render(); window.scrollTo(0, 0); }

  $('#nav').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) go(b.dataset.page);
  });

  // 예시 화면 전용: 보는 사람 전환
  function renderDemoBar() {
    const bar = $('#demoBar');
    if (!window.MockApi || !MockApi.users) return;
    bar.hidden = false;
    bar.innerHTML = `<b>예시 화면</b><span>모든 이름·사번·금액은 예시 데이터입니다.</span>
      <label>보는 사람 <select id="demoUser">${MockApi.users().map(u => `<option value="${esc(u.email)}" ${u.email === D.me.email ? 'selected' : ''}>${esc(u.name)} (${esc(u.role)})</option>`).join('')}</select></label>`;
    $('#demoUser').onchange = e => { MockApi.setUser(e.target.value); A = null; reviewTab = 'mine'; load(); };
  }

  load();
</script>

</body></html>
